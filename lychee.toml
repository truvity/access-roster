# Link check for the built site (`just site-links`). In-site links and anchors are
# held by the build itself (starlight-links-validator); this is for every link,
# including the ones that leave the site.

cache = true
max_cache_age = "1d"
# max_retries repeats a request that failed on the network or timed out, the wait doubling
# from retry_wait_time. It does not repeat a 5xx (one request, measured with lychee 0.24.2):
# `just site-links` checks those links again and site/scripts/links-report.mjs decides: a 4xx and
# an internal link fail; a 5xx, a network error or a timeout that persists is a warning on a pull
# request (SLUIS_LINKS_MODE=lenient) and, on main, a failure except for a 5xx from github.com.
max_retries = 3
retry_wait_time = 5
# A server error is not a fact about the link, so it is not kept in the cache (max_cache_age
# is a day, and a cached 504 failed the next run without a request: "[504] ... (cached)").
cache_exclude_status = "500..=599"
timeout = 30
# A redirect loop must end in a few hops, not in ten hops of 30 s each, three times over.
max_redirects = 5
max_concurrency = 8
# 429 is a host asking for patience, not a dead link.
accept = ["200..=204", "429"]
user_agent = "Mozilla/5.0 (compatible; sluis-docs-link-check)"

exclude = [
  # The v1 documentation is built in by the Site workflow (site/scripts/build-v1.sh)
  # and held by its own strict build; a build of this site alone has no /v1/, so
  # links into it (the features page) cannot be checked here.
  '/v1(/|$)',
  # The site's own absolute URLs (canonical, sitemap, Open Graph) point at the
  # deployed copy, which does not have this build yet.
  '^https://sluis\.id/',
  # Files and pages that exist only once the governance files and the roadmap
  # project are merged or created; the site links to them by their final path.
  '^https://github\.com/truvity/sluis/(blob|tree|edit)/',
  '^https://github\.com/orgs/truvity/projects',
  # www.rfc-editor.org redirects /rfc/rfcNNNN to /info/rfcNNNN/ and that page to itself
  # (301 in a loop) or answers 502, as of 2026-11-01; with the timeout and the retries
  # that kept the link check busy for the whole job. The RFC links are references, not
  # something this site can fix; datatracker.ietf.org serves the same documents.
  '^https://www\.rfc-editor\.org/',
  # www.iso.org answers an automated client with 403 Forbidden (seen on the check of the pull
  # request that added the ISO/IEC 27017 catalogue entry); the page opens in a browser.
  '^https://www\.iso\.org/',
  # Needs a token or a session.
  '^https://(www\.)?linkedin\.com',
]
