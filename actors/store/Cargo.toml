[package]
name = "store"
description = "store@: the only holder of storage credentials; the generic store service, its rules, TTL and grant check (ADR 0005)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "store"
path = "src/lib.rs"

[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.22"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
rustix = { version = "1", features = ["process"] }
saphyr-parser = "=0.3.3"
serde_json = "1"
sluis-audit = { path = "../../kits/rust/sluis-audit" }
sluis-kit = { path = "../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../kits/rust/sluis-proto" }
sluis-registry = { path = "../../kits/rust/sluis-registry" }
sluis-version = { path = "../../kits/rust/sluis-version" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
sluis-kit = { path = "../../kits/rust/sluis-kit", features = ["test-identities"] }
tempfile = "3"
