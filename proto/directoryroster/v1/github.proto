syntax = "proto3";

package directoryroster.v1;

import "google/protobuf/timestamp.proto";

// GitHubService is the console's view of GitHub organisations: which the
// policy binds, and what the GitHub controller last reported for each.
//
// Read-only. The controller acts and the console shows: no call here
// writes to GitHub, and the one thing an operator does through the
// console for GitHub — connecting an organisation — gives the controller
// a credential rather than telling it what to do.
service GitHubService {
  // GetGitHubStatus returns every organisation the policy binds or the
  // controller reports on, each with its bound teams and the members the
  // controller derived for them. Viewer.
  rpc GetGitHubStatus(GetGitHubStatusRequest) returns (GetGitHubStatusResponse);

  // BeginGitHubConnect starts connecting an organisation the policy
  // binds: the App's manifest and where to post it, or — for an App
  // already created and not yet installed — where to install it. Sets the
  // flow's state cookie. Operator.
  //
  // An organisation already connected and installed is refused: connecting
  // it again would create a second App beside the first, and the one
  // left installed would be the one nobody holds a key for.
  rpc BeginGitHubConnect(BeginGitHubConnectRequest) returns (BeginGitHubConnectResponse);

  // DisconnectGitHubOrganisation uninstalls the App, then forgets the
  // organisation's record and credential. Operator.
  rpc DisconnectGitHubOrganisation(DisconnectGitHubOrganisationRequest) returns (DisconnectGitHubOrganisationResponse);

  // BeginGitHubLinkAppConnect starts creating the link App: the one App
  // people authorize, as themselves, to link their GitHub account to their
  // work addresses. Public, installed nowhere, and asking only to read the
  // person's own email addresses. Created under an organisation the
  // operator owns. Operator.
  rpc BeginGitHubLinkAppConnect(BeginGitHubLinkAppConnectRequest) returns (BeginGitHubLinkAppConnectResponse);

  // DisconnectGitHubLinkApp forgets the link App. Every link made with it
  // becomes unverifiable — nothing can check its tokens any more — which
  // removes nobody and adds nobody until each person links again.
  // Operator.
  rpc DisconnectGitHubLinkApp(DisconnectGitHubLinkAppRequest) returns (DisconnectGitHubLinkAppResponse);
}

message BeginGitHubLinkAppConnectRequest {
  // the organisation the App is created under.
  string owner = 1;
}

message BeginGitHubLinkAppConnectResponse {
  // where the browser POSTs the manifest.
  string url = 1;
  // the App's manifest, posted as the form field `manifest`.
  string manifest = 2;
}

message DisconnectGitHubLinkAppRequest {}

message DisconnectGitHubLinkAppResponse {
  // how many links became unverifiable.
  int32 invalidated = 1;
  // where the owner deletes the App itself, which the API cannot do.
  string app_settings_url = 2;
}

message BeginGitHubConnectRequest {
  // the organisation's login.
  string org = 1;
}

message BeginGitHubConnectResponse {
  // where the browser goes next.
  string url = 1;
  // when set, the browser POSTs it as the form field `manifest` to url:
  // GitHub creates an App only from a posted manifest. Empty means url is
  // an ordinary navigation — the App exists and is to be installed.
  string manifest = 2;
}

message DisconnectGitHubOrganisationRequest {
  string org = 1;
}

message DisconnectGitHubOrganisationResponse {
  // whether the installation was removed on GitHub. The record and the
  // credential are forgotten either way.
  bool uninstalled = 1;
  // why it could not be, when it could not.
  string detail = 2;
  // where the organisation's owner deletes the App itself, which the API
  // cannot do.
  string app_settings_url = 3;
}

message GetGitHubStatusRequest {}

message GetGitHubStatusResponse {
  repeated GitHubOrganisation organisations = 1;
  // false where this deployment keeps no report at all, because it keeps
  // no state in Kubernetes. Every organisation then reads as not
  // reported, and this is the reason rather than the controller.
  bool reports_available = 2;
  // false where connecting an organisation is not possible here, because
  // there is nowhere to keep what it leaves behind.
  bool connecting_available = 3;
  // false where people cannot link accounts here, for the same reason.
  bool linking_available = 4;
  // the connected link App; absent until an operator creates it.
  GitHubLinkApp link_app = 5;
  // the page a person opens to link their account. Share it.
  string link_url = 6;
  // every linked account, never with its tokens.
  repeated GitHubLink links = 7;
}

// GitHubLinkApp is the App people authorize to link their accounts.
message GitHubLinkApp {
  int64 app_id = 1;
  string app_slug = 2;
  // the organisation it was created under.
  string owner = 3;
  string html_url = 4;
  google.protobuf.Timestamp connected_at = 5;
  string connected_by = 6;
}

// GitHubLink is one GitHub account a person linked.
message GitHubLink {
  int64 account_id = 1;
  string login = 2;
  // the work addresses GitHub verifies for it, which the directory knew.
  repeated string emails = 3;
  // linked, lost or unverifiable.
  string state = 4;
  // why a link is lost or unverifiable.
  string reason = 5;
  google.protobuf.Timestamp linked_at = 6;
  google.protobuf.Timestamp checked_at = 7;
  google.protobuf.Timestamp changed_at = 8;
}

// GitHubOrganisation is one organisation: its bindings beside its report.
message GitHubOrganisation {
  // the organisation's login.
  string org = 1;
  // whether the policy binds it. A report for one it does not is the
  // controller's last word on an organisation removed from the policy.
  bool bound = 2;
  // whether the controller has reported on it at all.
  bool reported = 3;
  // why a report that exists could not be read. The rest of the report is
  // then empty, and the bindings are still shown.
  string report_error = 4;
  // whether the controller acts on it. A disabled organisation is still
  // derived, and its members' states say what would change.
  bool enabled = 5;
  GitHubTick tick = 6;
  // the internal groups bound to the organisation itself, and the
  // members the controller derived from them.
  repeated string member_groups = 7;
  repeated GitHubMember members = 8;
  repeated GitHubTeamStatus teams = 9;
  // members nobody linked to a work address: nobody can say who they
  // are, so they are listed and never touched.
  repeated GitHubAccount unlinked = 10;
  // how the controller acts in it. Absent until an operator connects it.
  GitHubConnection connection = 11;
}

// GitHubConnection is the App connecting an organisation left behind.
// Never the key.
message GitHubConnection {
  int64 app_id = 1;
  string app_slug = 2;
  // false between Create and Install: the owner made the App and has not
  // installed it, so nothing can act through it yet.
  bool installed = 3;
  string html_url = 4;
  google.protobuf.Timestamp connected_at = 5;
  string connected_by = 6;
}

// GitHubTick is how the controller's last pass over an organisation went.
message GitHubTick {
  google.protobuf.Timestamp at = 1;
  // in-sync, applied, dry-run, held, waiting or failed.
  string outcome = 2;
  string error = 3;
  // actions taken, or that would have been while disabled.
  int32 changes = 4;
  // actions not taken, each with its reason on the member.
  int32 held = 5;
  // rows waiting on somebody to link a GitHub account.
  int32 waiting = 6;
}

// GitHubTeamStatus is one team: its binding beside what was derived.
message GitHubTeamStatus {
  // the team's slug.
  string team = 1;
  // whether the policy binds it; false for a team only a stale report
  // still names.
  bool bound = 2;
  repeated string member_groups = 3;
  repeated string maintainer_groups = 4;
  repeated GitHubMember members = 5;
}

// GitHubMember is one person's membership as the controller derived it.
message GitHubMember {
  string email = 1;
  // empty for somebody not yet linked to a GitHub account.
  string login = 2;
  // member or maintainer.
  string role = 3;
  // not-linked, pending, invited, synced, leaving or held.
  string state = 4;
  // invite, add, set-role or remove; empty when synced.
  string action = 5;
  // why an action is held.
  string reason = 6;
}

// GitHubAccount is a login with a note.
message GitHubAccount {
  string login = 1;
  string reason = 2;
}
