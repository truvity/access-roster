syntax = "proto3";

package directoryroster.v1;

// SecretManagerService is the console's view of the secret stores this
// deployment declares: which namespaces they hold, which groups each
// namespace admits, and what those groups open.
//
// READ-ONLY, and not by omission. A store's desired state is written in
// the estate's own repository and applied by something that is not this
// service; a console that also wrote would make two custodians of one
// thing, which is the mistake the App catalogue spent a month undoing.
// So a row that shows drift links to where the fix is made and is never
// a button, and nothing here takes a write path at all.
//
// The reader is this service's own workload identity, admitted to the
// store through the same door a person uses, with a grant that opens the
// declared state and nothing else. It cannot read a secret's value, so
// no page built on this service can show one however it is later
// changed.
service SecretManagerService {
  // ListSecretManagers returns every declared store with its namespaces,
  // each carrying the counts that summarise it. Viewer.
  //
  // The counts come from the same comparison GetSecretManagerNamespace
  // makes, so a summary can never disagree with the page it summarises.
  rpc ListSecretManagers(ListSecretManagersRequest) returns (ListSecretManagersResponse);

  // GetSecretManagerNamespace returns one namespace: its groups with
  // what the store holds for each, the policies it carries, and the
  // doors that admit them. Viewer.
  rpc GetSecretManagerNamespace(GetSecretManagerNamespaceRequest) returns (GetSecretManagerNamespaceResponse);

  // ListSecretManagerReach returns what one person can reach: for every
  // group they hold that a store admits, the namespace and the paths
  // that group's policy opens, and whether it may write them. Viewer.
  //
  // Assembled from the policy the STORE holds rather than from the one
  // the estate declares, because the gap between the two is what
  // somebody looking at this page is trying to find.
  rpc ListSecretManagerReach(ListSecretManagerReachRequest) returns (ListSecretManagerReachResponse);
}

// GroupState is what one group is, once what the deployment declares is
// laid beside what the store holds.
//
// Four, not three: a reader that could not look must not be drawn as a
// store that holds nothing. An empty namespace and a namespace nobody
// may read are identical in every way except the status of the call, and
// telling somebody "absent" when the truth is "I may not look" sends
// them to a pipeline that is fine.
enum GroupState {
  GROUP_STATE_UNSPECIFIED = 0;
  // declared, present, and carrying a policy of its own name.
  GROUP_STATE_BOUND = 1;
  // declared and not in the store: the apply has not run, or it
  // refused. Not drift — the estate's answer is already right.
  GROUP_STATE_ABSENT = 2;
  // in the store and declared by nobody. The interesting one.
  GROUP_STATE_UNEXPECTED = 3;
  // the reader could not look. Never inferred from an empty answer.
  GROUP_STATE_UNREADABLE = 4;
}

// SecretManager is one declared store.
message SecretManager {
  // name is what the console calls it, and how a route names it.
  string name = 1;
  // address is where it answers. Shown so that a page about the wrong
  // installation is obvious rather than puzzling.
  string address = 2;
  // mount and role are the door this service and every person logs in
  // through.
  string mount = 3;
  string role = 4;
  repeated SecretManagerNamespace namespaces = 5;
}

// SecretManagerNamespace is one namespace of one store, summarised.
message SecretManagerNamespace {
  // name is the namespace as the store knows it.
  string name = 1;
  // environment is the roster environment it mirrors. Usually the same
  // string; separate because a store may name its namespaces
  // differently and the page should still say which environment it is
  // looking at.
  string environment = 2;
  // counts summarise the namespace's groups.
  GroupCounts counts = 3;
  // unreadable is set when the reader could not look at all — a login
  // that was refused, or a store that did not answer. The page then says
  // so instead of drawing an empty environment.
  bool unreadable = 4;
  // reason is what went wrong, when something did. Never a token,
  // never a value: the status and the path.
  string reason = 5;
}

// GroupCounts is a namespace's one-line summary: the sentence somebody
// opened the page to read, before anything is expanded.
message GroupCounts {
  int32 bound = 1;
  int32 absent = 2;
  int32 unexpected = 3;
  int32 unreadable = 4;
}

// SecretManagerGroup is one group as the page draws it.
message SecretManagerGroup {
  // name is the group's name, which is also the name of the policy it is
  // expected to carry: one name, three things — the internal group, the
  // policy and the identity group — is the whole convention.
  string name = 1;
  GroupState state = 2;
  // declared is whether this deployment's own policy names the group for
  // this namespace.
  bool declared = 3;
  // policies is what the store's identity group carries. Usually the
  // group's own name, and worth reading when it is not.
  repeated string policies = 4;
  // has_policy is whether a policy of the group's own name exists here.
  // A group bound to a policy that is not there grants nothing, and the
  // store reports neither half as an error.
  bool has_policy = 5;
  // members is how many entities the store has put in the group. Not
  // membership — that is the roster's answer, and this console has it —
  // but a group nobody has ever logged in as reads differently from one
  // with fifty.
  int32 members = 6;
  // doors are the auth mounts an alias binds this group at. A group
  // admitted at the CLI door and not at the web one reads to its holder
  // as a broken UI rather than as a policy.
  repeated string doors = 7;
  // rules are what the group's policy opens, when it could be read.
  repeated PolicyRule rules = 8;
}

// PolicyRule is one path of a policy and what it may do there.
message PolicyRule {
  // path as the DOCUMENT spells it — `kv/data/...`, not the path a `bao
  // kv` command prints. The difference between the two is the commonest
  // reason somebody plainly in the group is refused.
  string path = 1;
  repeated string capabilities = 2;
  // writes is whether these capabilities can change what is at the path.
  // Reading a team's credentials and being able to replace them are
  // different grants, and this is the one distinction the page draws
  // loudly.
  bool writes = 3;
}

message ListSecretManagersRequest {}
message ListSecretManagersResponse {
  repeated SecretManager managers = 1;
}

message GetSecretManagerNamespaceRequest {
  // manager names the store, namespace the namespace inside it.
  string manager = 1;
  string namespace = 2;
}
message GetSecretManagerNamespaceResponse {
  SecretManagerNamespace namespace = 1;
  repeated SecretManagerGroup groups = 2;
  // policies are every ACL policy the namespace holds, by name,
  // including the ones no group here carries.
  repeated string policies = 3;
  // doors are the namespace's auth mounts.
  repeated AuthMount doors = 4;
}

// AuthMount is one door of a namespace.
message AuthMount {
  string path = 1;
  string type = 2;
}

message ListSecretManagerReachRequest {
  // email names the person. Their groups are the roster's answer, and
  // the store's policies say what those groups open.
  string email = 1;
}
message ListSecretManagerReachResponse {
  repeated SecretManagerReach reach = 1;
}

// SecretManagerReach is one group of one namespace that a person holds,
// and what it opens there.
message SecretManagerReach {
  string manager = 1;
  string namespace = 2;
  string environment = 3;
  string group = 4;
  repeated PolicyRule rules = 5;
  // writes is whether any of those rules can change what it reaches.
  bool writes = 6;
  // unreadable is set when the group's policy could not be read, so that
  // the page says so rather than drawing a group that reaches nothing.
  bool unreadable = 7;
}
