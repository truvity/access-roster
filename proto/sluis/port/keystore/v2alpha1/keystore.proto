// The key-store port of key@ (drivers software, later yubikey-piv and aws-kms).
syntax = "proto3";

package sluis.port.keystore.v2alpha1;

import "google/protobuf/timestamp.proto";

// KeyStoreService holds the private keys; a key never leaves it.
service KeyStoreService {
  rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc Ensure(EnsureRequest) returns (EnsureResponse);                       // create the key of a purpose if absent; never export
  rpc Sign(KeyStoreSignRequest) returns (KeyStoreSignResponse);
  rpc PublicKey(KeyStorePublicKeyRequest) returns (KeyStorePublicKeyResponse);
  rpc Ecdh(EcdhRequest) returns (EcdhResponse);                             // the key-agreement key (purpose "wrapping"), as PIV slot 9d does

  // The PIN release between boards (0006 "Touch and PIN"). The PIN never leaves the card driver: the driver seals the
  // PIN it holds, and opens a released one with a one-time key of its own and gives it to its card. key@ makes the
  // checks and the store writes. A store that has no PIN (software) refuses them with "unlocked" or "no_pin".
  rpc Attest(AttestRequest) returns (AttestResponse);                                  // the attestation of the key of a purpose
  rpc VerifyAttestation(VerifyAttestationRequest) returns (VerifyAttestationResponse); // reads another card's attestation against the store's own anchors
  rpc BeginPinRelease(BeginPinReleaseRequest) returns (BeginPinReleaseResponse);       // a locked driver makes a one-time key for one request
  rpc SealPin(SealPinRequest) returns (SealPinResponse);                               // an unlocked driver seals the PIN it holds to a request
  rpc FinishPinRelease(FinishPinReleaseRequest) returns (FinishPinReleaseResponse);    // a locked driver opens a release and tries the PIN once
}

// CapabilitiesRequest asks what the store can do.
message CapabilitiesRequest {}

// CapabilitiesResponse says what the store can do.
message CapabilitiesResponse {
  string store = 1;                  // "software", "yubikey-piv" or "aws-kms"
  bool attests = 2;                  // true when the store can attest where a key lives
  repeated string algorithms = 3;    // the algorithms the store supports
}

// EnsureRequest creates the key of a purpose if it is absent.
message EnsureRequest {
  string purpose = 1;    // the purpose the key is for
  string algorithm = 2;  // "ES384", "ES256" (audit-log only) or "ECDH-P384"
}

// EnsureResponse carries the public key.
message EnsureResponse {
  bytes spki_der = 1;  // the public key, SubjectPublicKeyInfo in DER
  bool created = 2;    // true when this call made the key
  // When the key was made, whether or not this call made it: the store's own record (the key file's time for the
  // software driver). Absent when the store cannot say. A revocation names keys by their kid and never by their age
  // (ADR 0041), so key@ does not decide anything on it.
  google.protobuf.Timestamp created_at = 3;
}

// KeyStoreSignRequest signs a digest.
message KeyStoreSignRequest {
  string purpose = 1;    // the purpose whose key signs
  bytes digest = 2;      // the digest of the content key@ checked: SHA-384 for ES384, SHA-256 for ES256
  string algorithm = 3;  // "ES384" or "ES256"
}

// KeyStoreSignResponse carries the signature.
message KeyStoreSignResponse {
  bytes signature_der = 1;  // ASN.1 DER
}

// KeyStorePublicKeyRequest asks for the public key of a purpose.
message KeyStorePublicKeyRequest {
  string purpose = 1;  // the purpose
}

// KeyStorePublicKeyResponse carries the public key.
message KeyStorePublicKeyResponse {
  bytes spki_der = 1;  // the public key, SubjectPublicKeyInfo in DER
}

// EcdhRequest derives a shared secret with a peer.
message EcdhRequest {
  string purpose = 1;      // the purpose of the key-agreement key
  bytes peer_public = 2;   // SEC1 uncompressed P-384
}

// EcdhResponse carries the shared secret.
message EcdhResponse {
  bytes shared_secret = 1;  // the raw ECDH shared secret
}

// AttestRequest asks for the attestation of the key of a purpose.
message AttestRequest {
  string purpose = 1;  // the purpose
}

// AttestResponse carries the attestation, as the card makes it.
message AttestResponse {
  bytes attestation = 1;         // the certificate the card made for the slot's key, DER
  bytes attestation_signer = 2;  // the card's own attestation certificate that signed it, DER
}

// VerifyAttestationRequest carries the attestation of a key of another card, from the slot map.
message VerifyAttestationRequest {
  bytes attestation = 1;         // the slot certificate, DER
  bytes attestation_signer = 2;  // the card's attestation certificate, DER
}

// VerifyAttestationResponse is what a verified attestation says. A chain that does not reach the store's anchors, or a
// firmware below the floor, is refused and has no response.
message VerifyAttestationResponse {
  bytes spki_der = 1;       // the attested public key, SubjectPublicKeyInfo in DER
  string slot = 2;          // the slot, two lower-case hex digits
  string pin_policy = 3;    // "never", "once" or "always"
  string touch_policy = 4;  // "never", "always" or "cached"
  uint32 serial = 5;        // the serial of the card that made the key
}

// BeginPinReleaseRequest asks a locked driver for a one-time key.
message BeginPinReleaseRequest {}

// BeginPinReleaseResponse carries the public half of the one-time key. Its private half stays in the driver until
// FinishPinRelease, or the next BeginPinRelease, wipes it.
message BeginPinReleaseResponse {
  bytes ephemeral_public = 1;  // SEC1 uncompressed P-384
}

// SealPinRequest asks an unlocked driver to seal its PIN to a request that key@ has verified.
message SealPinRequest {
  bytes request_text = 1;  // the signed text of the PinReleaseRequest; the driver reads the ephemeral key from it
}

// SealPinResponse carries the sealed PIN: ECDH P-384 with the request's key, HKDF-SHA384 with the request text as info,
// AES-256-GCM with the request text as additional data.
message SealPinResponse {
  bytes releaser_public = 1;  // the releaser's ephemeral public key, SEC1 uncompressed P-384
  bytes sealed = 2;           // the nonce, then the ciphertext and tag
}

// FinishPinReleaseRequest gives a locked driver a release that key@ has verified.
message FinishPinReleaseRequest {
  bytes request_text = 1;     // the text of this driver's own request; its ephemeral key must be the driver's one-time key
  bytes releaser_public = 2;  // from the answer
  bytes sealed = 3;           // from the answer
}

// FinishPinReleaseResponse says that the card took the PIN.
message FinishPinReleaseResponse {}
