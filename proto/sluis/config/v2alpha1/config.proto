// The skeleton's config kinds: one message per kind, the payload schema. The rules are protovalidate options, and
// tools/gen/configschema makes the JSON Schema of each signed document from them (schema/<kind>/v1/, ADR 0004). A schema states
// the form of a value and is never stricter than the loaders: the patterns below are the ones both loaders (store@
// payload.rs, key@ plan.go and boundary.go) already hold, or looser, and the domains of the values that really reach them are
// in kits/conformance/config/domain-vectors.json. A string that is not required may be null in the file, as the loaders
// read it (proto3 JSON does too). Ids follow decision D-17:
// a singleton kind has one item with id "default", a keyed kind uses its name.
syntax = "proto3";

package sluis.config.v2alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// Boundary is the kind Boundary (bootstrap file and signed config); id "default".
message Boundary {
  string name = 1 [(buf.validate.field).required = true];         // the boundary's name
  string kind = 2 [(buf.validate.field).required = true];         // the boundary's kind
  string level = 3 [(buf.validate.field).required = true];        // the boundary's level
  // "development", "staging" or "production"
  string environment = 4 [(buf.validate.field).required = true, (buf.validate.field).string = {in: ["development", "staging", "production"]}];
  // the issuer URL of the boundary: http or https
  string issuer = 5 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^https?://."];
  uint32 uid_block = 6;                  // the index of the boundary's block of actor uids: the uid of an actor is 61000 + its ordinal + 1000 x the block (REQ-ISO-072)
  repeated string declared_kinds = 7 [(buf.validate.field).repeated.items.string.min_len = 1];    // the kinds the boundary declares
  // decision D-4: the one tenant of the skeleton until Tenant items exist; empty, or a store part
  string default_tenant = 8 [(buf.validate.field).string.pattern = "^$|^[a-z0-9._-]{1,128}$"];
}

// KeyPlan is the kind KeyPlan: which keys exist and where they live; id "default".
message KeyPlan {
  repeated KeyPurposePlan purposes = 1;      // one entry per purpose
  google.protobuf.Duration cache_ttl = 2 [(buf.validate.field).required = true];    // how long key@ may cache an unwrapped data key
  // The signed list of wrap recipients (0006 "Who may receive a wrap"): the RFC 7638 thumbprint of each node's
  // wrapping public key, base64url without padding, the recovery recipient's included. key@ wraps a data key to
  // these and to no one else.
  // 43 characters of base64url: the loader checks the canonical form of the last one.
  repeated string recipients = 3 [(buf.validate.field).repeated = {unique: true, items: {string: {pattern: "^[A-Za-z0-9_-]{43}$"}}}];
  // The slot map (0006 "The slot plan", decided 2026-11-04 as D20b): which card slot of each node holds which key, under
  // the publisher's signature with the rest of the KeyPlan. A peer's key@ verifies a PinReleaseRequest and a PinRelease
  // with the public key of the pin-release slot of the node that signed it, and only after its own card driver has
  // verified that slot's attestation (0006 "Touch and PIN").
  repeated NodeSlotMap slot_map = 4;
}

// NodeSlotMap is the slots of one node's card.
message NodeSlotMap {
  // the node, as its key@ names itself (--node); an address part of at most 64 characters, listed once
  string node = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[a-z0-9._-]{1,64}$"];
  repeated SlotKey slots = 2;    // one entry per slot, none twice
}

// SlotKey is the key of one card slot. In the YAML payload the byte fields are base64url without padding (RFC 4648,
// section 5).
message SlotKey {
  // the PIV slot, two lower-case hex digits: 9a, 9c, 9d, 82 to 95
  string slot = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^[0-9a-f]{2}$"];
  string purpose = 2 [(buf.validate.field).required = true];    // the purpose of keys.yaml the slot serves
  bytes public_key = 3 [(buf.validate.field).required = true];  // the slot's public key, SubjectPublicKeyInfo in DER
  bytes attestation = 4;            // the slot's attestation certificate, DER, made by the card; empty for a store that does not attest
  bytes attestation_signer = 5;     // the card's attestation certificate that signed it, DER; present exactly when attestation is
}

// KeyPurposePlan is the plan of one purpose.
message KeyPurposePlan {
  string purpose = 1 [(buf.validate.field).required = true];    // a purpose name from keys.yaml
  string algorithm = 2 [(buf.validate.field).required = true];  // the algorithm of the purpose's key
  string slot = 3;       // where the key lives in the key store
}

// TokenLifetime is the kind TokenLifetime; id "default".
message TokenLifetime {
  google.protobuf.Duration id_token = 1 [(buf.validate.field).required = true];                  // lifetime of an ID token
  google.protobuf.Duration access_token = 2 [(buf.validate.field).required = true];              // lifetime of an access token
  google.protobuf.Duration human_session_absolute = 3 [(buf.validate.field).required = true];    // the longest a person's session lasts
  google.protobuf.Duration refresh_idle = 4 [(buf.validate.field).required = true];              // how long a refresh token may sit unused
}

// InstallationClient is the kind InstallationClient; id is the client id.
message InstallationClient {
  string id = 1;                              // the client id: the id of the item, or left out
  // "public", "confidential" or "exchange"
  string kind = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {in: ["public", "confidential", "exchange"]}];
  // the allowed redirect URIs: https, or http on a loopback address
  repeated string redirects = 3 [(buf.validate.field).repeated.items.string.pattern = "^https?://."];
  // what the client requires of a sign-in: grant names, <scope>:<thing>:<role>, no wildcard
  repeated string requires = 4 [(buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9_-]{1,64}:[A-Za-z0-9_-]{1,64}:[A-Za-z0-9_-]{1,64}$"];
  google.protobuf.Duration ttl_cap = 5;       // the longest token lifetime the client may get
  string profile = 6;                         // the client's profile
  // the name of the client's secret in the secret source (0005 "Secret sources"); empty for a public client
  string secret = 7 [(buf.validate.field).string.pattern = "^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"];
  // the signing algorithm of the ID tokens of this audience; empty is ES384
  string signing_alg = 8 [(buf.validate.field).string.pattern = "^(ES384|RS256)?$"];
  // how a code is bound to the client that asked for it: empty or "required" for PKCE with S256, "nonce" for a confidential
  // client that checks the nonce of its ID token instead (RFC 9700 section 2.1.1; ADR 0021); only a confidential client
  string pkce = 9 [(buf.validate.field).string.pattern = "^(required|nonce)?$"];
}

// InstallationClientSecret is the kind InstallationClientSecret; id is the client id. Its value is what store@ answers
// to a get from a listed reader: the secret that IaC put in the secret source under the name that the client's
// InstallationClient declares. It is never signed, stored, logged or audited.
message InstallationClientSecret {
  string client = 1;   // the client id
  bytes secret = 2;    // the secret, exactly as the secret source holds it
}

// Upstream is the kind Upstream; id is the upstream's name. It names no tenant (kinds.yaml).
message Upstream {
  string name = 1;                 // the upstream's name: the id of the item, or left out
  // the kind of upstream: "oidc"
  string kind = 2 [(buf.validate.field).required = true, (buf.validate.field).string = {in: ["oidc"]}];
  // the upstream's issuer URL: http or https
  string issuer = 3 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^https?://."];
  string client_id = 4 [(buf.validate.field).required = true];       // sluis's client id at the upstream
  string subject_claim = 5 [(buf.validate.field).required = true];   // the claim that holds the subject
  string org_claim = 6;            // the claim that holds the organisation; may be empty
  repeated string scopes = 7 [(buf.validate.field).repeated.items.string.min_len = 1];      // the scopes to ask for
  // the name of sluis's client secret at the upstream in the secret source (0005 "Secret sources")
  string secret = 8 [(buf.validate.field).string.pattern = "^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"];
}

// UpstreamSecret is the kind UpstreamSecret; id is the upstream's name. Its value is what store@ answers to a get from
// its one reader, adapter-upstream-oidc: the secret that IaC put in the secret source under the name that the
// Upstream declares. It is never signed, stored, logged or audited, and the adapter keeps it for one call only.
message UpstreamSecret {
  string upstream = 1;  // the upstream's name
  bytes secret = 2;     // the secret, exactly as the secret source holds it
}

// GrantVocabulary is the kind GrantVocabulary; id "default".
message GrantVocabulary {
  bytes document = 1;  // the YAML text of policy.md "The grant vocabulary"; parsed by policy
}

// Policy is the kind Policy: one Cedar file; id is the policy file's id.
message Policy {
  string id = 1;      // the policy file's id
  string cedar = 2;   // the Cedar text
}

// ExchangeTrust is the kind ExchangeTrust; id "default".
message ExchangeTrust {
  repeated TrustedIssuer issuers = 1;  // the issuers whose tokens may be exchanged
}

// TrustedIssuer is one issuer trusted for token exchange.
message TrustedIssuer {
  // the issuer URL: http or https
  string issuer = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^https?://."];
  repeated string audiences = 2 [(buf.validate.field).repeated.items.string.min_len = 1];     // the audiences accepted from it
  string proof_kind = 3 [(buf.validate.field).required = true];             // how its tokens are proven
  // where its keys are: empty, or an http or https URL
  string jwks_uri = 4 [(buf.validate.field).string.pattern = "^$|^https?://."];
}

// AuditLog is the kind AuditLog; id "default".
message AuditLog {
  string project = 1 [(buf.validate.field).required = true];            // the audit project
  repeated LogDecl logs = 2 [(buf.validate.field).required = true, (buf.validate.field).repeated.min_items = 1];     // the logs of the project
  // the object-lock mode of the log's store: "none", "removable" or "compliance"
  string lock_mode = 3 [(buf.validate.field).required = true, (buf.validate.field).string = {in: ["none", "removable", "compliance"]}];
}

// LogDecl declares one log of the audit project.
message LogDecl {
  string kind = 1 [(buf.validate.field).required = true, (buf.validate.field).string = {in: ["audit", "usage"]}];     // "audit" or "usage"
  string id = 2 [(buf.validate.field).required = true];       // the log's id
  string origin = 3 [(buf.validate.field).required = true];   // the C2SP checkpoint origin line, per 0029 "Tiled log" (terms-allow: origin)
}

// AuditCatalogue is the kind AuditCatalogue; id "default". It is the action table of the newest release of the project,
// with the JSON Schema of each action's records, as one item, so the table and its schemas move together (0030, "The
// catalogue is the table with its schemas"). Within a major version the table only grows (REQ-AUDIT-119), so it holds for
// the records of every older release of the same major version; a record of a newer release is refused (REQ-AUDIT-146).
message AuditCatalogue {
  string release = 1 [(buf.validate.field).required = true]; // the release the catalogue was made for, a semantic version
  // the action names: metadata.event_code of every record the project may emit; two or more lower-case words joined by dots
  repeated string actions = 2 [(buf.validate.field).required = true, (buf.validate.field).repeated = {min_items: 1, items: {string: {pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"}}}];
  repeated AuditSchema schemas = 3; // the shared definitions, "defs.schema.json", and "<action>.schema.json" for each action
  uint32 policy = 4;                // the version of the schema policy the documents were made to (kits/go/audit/policy.go); a reader refuses a higher one
}

// AuditSchema is one JSON Schema 2020-12 document of an AuditCatalogue.
message AuditSchema {
  string name = 1;  // the file name, which the documents reference one another by
  string json = 2;  // the document, as JSON text
}

// ExportDestination is the kind ExportDestination: where exporter@ publishes (0009 "Destinations"); keyed by the
// destination's name. The destination's credential is not here: the platform provides it to exporter@.
message ExportDestination {
  string type = 1;                          // the driver: "directory" tonight
  string edge = 2;                          // "none", or the named edge in front of a bucket
  repeated ExportedDocument documents = 3;  // the documents published here
}

// ExportedDocument declares one published document. Its address is declared and never derived from the kind (0009
// "Publishing public material").
message ExportedDocument {
  string name = 1;                          // names the document inside the destination; the id of its ExportReport
  string kind = 2;                          // the exportable kind it is built from: SigningRing tonight
  string address = 3;                       // the object's address at the destination
  string content_type = 4;                  // the Content-Type it is served with
  google.protobuf.Duration max_age = 5;     // the max-age of its Cache-Control
  string public_address = 6;                // the URL a verifier fetches it from; empty when there is none
}

// FrontHost is the kind FrontHost (0017 "Passkeys", 0035 "Passkeys and the relying-party ID"): the relying party of the
// passkey ceremonies and the web origins that may complete them. Keyed by the client it is for or `default`; session reads
// `default`. No document means passkeys are off.
message FrontHost {
  string rp_id = 1;                // the relying-party ID: a host name, the registrable parent of every origin below
  string rp_name = 2;              // the name an authenticator shows
  repeated string origins = 3;     // the web origins, scheme://host[:port], that an assertion or a registration may come from; nothing else is accepted (REQ-AUTHN-050, REQ-ISO-034)
}

// SignInMethods is the kind SignInMethods (0017 "The passkey class"); id "default".
message SignInMethods {
  string passkey_acr = 1;                          // the acr that a passkey sign-in states in the token and that acr_values asks for
  google.protobuf.Duration upstream_recheck = 2;   // the longest a passkey sign-in may go without a sign-in at the upstream; absent means the built-in 14 days
}
