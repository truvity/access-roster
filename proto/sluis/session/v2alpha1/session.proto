// The session service: typed OAuth requests (decision D-10); entry's closed lists come from these fields.
syntax = "proto3";

package sluis.session.v2alpha1;

import "google/protobuf/timestamp.proto";
import "sluis/type/v2alpha1/type.proto";

// SessionService serves the sign-in endpoints that entry routes to it.
service SessionService {
  rpc Authorize(AuthorizeRequest) returns (sluis.type.v2alpha1.HttpReply);
  rpc Callback(CallbackRequest) returns (sluis.type.v2alpha1.HttpReply);
  rpc Token(TokenRequest) returns (sluis.type.v2alpha1.HttpReply);
  rpc UserInfo(UserInfoRequest) returns (sluis.type.v2alpha1.HttpReply);
  rpc Revoke(RevokeRequest) returns (sluis.type.v2alpha1.HttpReply);
}

// AuthorizeRequest is the authorization request (RFC 6749 section 4.1.1, RFC 7636, OpenID Connect Core).
message AuthorizeRequest {
  string response_type = 1;          // "code"
  string client_id = 2;              // the client
  string redirect_uri = 3;           // where to send the answer
  string scope = 4;                  // space-separated scopes
  string state = 5;                  // the client's opaque state
  string nonce = 6;                  // the OpenID Connect nonce
  string code_challenge = 7;         // RFC 7636
  string code_challenge_method = 8;  // "S256"
  string response_mode = 9;          // the response mode, if sent
  string prompt = 10;                // the OpenID Connect prompt, if sent
  string max_age = 11;               // the OpenID Connect max_age, if sent
  string acr_values = 12;            // the OpenID Connect acr_values, if sent
  string request = 13;               // the OpenID Connect request object, if sent; session answers request_not_supported
  string request_uri = 14;           // the OpenID Connect request_uri, if sent; session answers request_uri_not_supported
  string registration = 15;          // the OpenID Connect registration, if sent; session answers registration_not_supported
  string id_token_hint = 16;         // the OpenID Connect id_token_hint, if sent: an ID token this issuer made, whose subject the sign-in must be of
}

// CallbackRequest is the answer of the upstream to the sign-in redirect.
message CallbackRequest {
  string code = 1;               // the upstream's authorization code
  string state = 2;              // the state sluis sent
  string error = 3;              // the upstream's error code, if any
  string error_description = 4;  // the upstream's error text, if any
  string iss = 5;                // RFC 9207 issuer identification, if sent
  string cookie = 6;             // the value of the sluis sign-in cookie, if sent
}

// TokenRequest is the token request (RFC 6749 section 4.1.3 and 6).
message TokenRequest {
  string grant_type = 1;       // "authorization_code" or "refresh_token"
  string code = 2;             // the authorization code
  string redirect_uri = 3;     // the redirect_uri of the authorization request
  string code_verifier = 4;    // RFC 7636
  string client_id = 5;        // the client
  string refresh_token = 6;    // the refresh token
  string scope = 7;            // the requested scope, if narrowing
  string client_secret = 8;    // client_secret_post
  string authorization = 9;    // the HTTP Authorization header, for client_secret_basic
}

// UserInfoRequest is the UserInfo request (OpenID Connect Core section 5.3.1). The access token is a bearer token in the
// Authorization header (RFC 6750 section 2.1); it is never in the query, and entry does not take it from a body.
message UserInfoRequest {
  string authorization = 1;  // the HTTP Authorization header, "Bearer <access token>"
}

// RevokeRequest is the token revocation request (RFC 7009 section 2.1). The client authenticates as at the token endpoint.
message RevokeRequest {
  string token = 1;             // the token to revoke
  string token_type_hint = 2;   // "access_token" or "refresh_token", if sent; session reads the token's own shape and ignores it
  string client_id = 3;         // the client
  string client_secret = 4;     // client_secret_post
  string authorization = 5;     // the HTTP Authorization header, for client_secret_basic
}

// PendingSignIn is the kind PendingSignIn (0025 "The upstream contract"): what session keeps between the authorize
// request and the upstream's callback. It never leaves session unsealed: it travels in the sign-in cookie, sealed at
// key@ under the boundary's cookie key, because no grant can exist for a tenant before a person is decided (the
// PR's "Decisions for the maintainer").
message PendingSignIn {
  string client_id = 1;                          // the client that asked
  string redirect_uri = 2;                       // the client's redirect_uri, checked against its declaration
  string scope = 3;                              // the scopes the client asked for, as session granted them
  string state = 4;                              // the client's state, returned to it
  string nonce = 5;                              // the client's nonce, for its ID token
  string code_challenge = 6;                     // the client's PKCE challenge (S256)
  string tenant = 7;                             // the tenant of the client
  string upstream = 8;                           // the name of the Upstream signed in at
  string upstream_state = 9;                     // the state sent to the upstream; the callback must bring it back
  string upstream_nonce = 10;                    // the nonce sent to the upstream
  string upstream_verifier = 11;                 // the PKCE verifier of the upstream request
  google.protobuf.Timestamp created_at = 12;     // when the request was made
  google.protobuf.Timestamp expires_at = 13;     // when the pending sign-in ends
  optional int64 max_age = 14;                   // the client's max_age in seconds, if sent; the callback refuses an older auth_time
  string prompt = 15;                            // "none" or "login" if the client asked for it; "none" lets the upstream's login_required reach the client, and "login" makes the callback refuse an authentication from before the request
  string hint_subject = 16;                      // the sub of the client's id_token_hint, if sent; the callback refuses a sign-in of another subject
  string response_mode = 17;                     // "form_post" if the client asked for it; empty is the query. The callback answers the client in this mode
  string acr_values = 18;                        // the client's acr_values, validated and kept as sent (space-separated); the callback refuses an authentication whose acr is none of them with unmet_authentication_requirements
}

// Person is the kind Person (0019 "The records"): the id is the subject.
message Person {
  string subject = 1;                         // the opaque subject, 128 random bits, base32
  google.protobuf.Timestamp created_at = 2;   // when sluis first saw the person
  bytes user_handle = 3;                      // the WebAuthn user handle: 32 random bytes from the operating system's generator, set at the person's first passkey and never derived from anything (REQ-SUBJ-029, REQ-SUBJ-030); empty until then
}

// UpstreamLink is the kind UpstreamLink (0019 "The records"): the id is a keyed hash of the issuer and the claim
// value. The claim name is not in the id: a changed claim is refused by the UpstreamPin, never linked again.
message UpstreamLink {
  string subject = 1;        // the subject of the person
  string issuer = 2;         // the upstream's issuer
  string subject_claim = 3;  // the name of the claim that held the subject
}

// UpstreamPin is the kind UpstreamPin (0019 "Linking an upstream account"): the subject claim first used for an
// issuer. The id is a keyed hash of the issuer. A sign-in whose configured claim differs is refused.
message UpstreamPin {
  string issuer = 1;         // the upstream's issuer
  string subject_claim = 2;  // the name of the claim pinned by the issuer's first link
}

// SignInFacts are the facts about a person that policy needs to decide again: an AuthCode holds them sealed with the
// cookie key, which is enough for a code that lives for minutes, and a SessionChain holds them sealed with the
// tenant's chain key, which a tenant's exit deletes (0006, "Data keys"). Neither kind may hold the account value in
// the clear, because it is personal.
message SignInFacts {
  repeated string accounts = 1;  // "<upstream>/<subject claim value>" for each linked account
}

// AuthCode is the kind AuthCode (0018): the id is the hash of the code the client holds, so the item can be compared
// and never read back into a code.
message AuthCode {
  string client_id = 1;                          // the client the code was issued to
  string redirect_uri = 2;                       // the redirect_uri of the authorize request
  string scope = 3;                              // the scopes granted
  string nonce = 4;                              // the client's nonce
  string code_challenge = 5;                     // the client's PKCE challenge (S256)
  string subject = 6;                            // the person's subject
  google.protobuf.Timestamp authenticated_at = 7; // when sluis accepted the sign-in
  google.protobuf.Timestamp auth_time = 8;       // when the person authenticated at the upstream, if it said
  optional string acr = 9;                       // the upstream's acr, if it said one
  repeated string amr = 10;                      // the upstream's amr
  bool amr_present = 11;                         // true when the upstream said anything about amr
  bytes sealed_facts = 12;                       // SignInFacts, sealed with the cookie key
  bool spent = 13;                               // true once the code was redeemed
  string session_id = 14;                        // the chain the redemption made; a replay ends it
}

// SessionChain is the kind SessionChain (0018 "Session chains"): a human session, from the sign-in that began it to
// its last refresh. Its id is the session id (sid) that the refresh token names. It holds hashes of the refresh
// tokens, never a token: a presented token is compared, not read back.
message SessionChain {
  string subject = 1;                              // the person's subject
  string client_id = 2;                            // the client the chain belongs to
  string class = 3;                                // "human"; fixed when the chain is made, never changed (0018 "The classes")
  string scope = 4;                                // the scopes granted, which a refresh may narrow and never widen
  bytes refresh_hash = 5;                          // SHA-384 of the current refresh token's secret
  repeated bytes spent_hashes = 6;                 // SHA-384 of the secrets already rotated away (the spent markers)
  google.protobuf.Timestamp started_at = 7;        // the moment sluis accepted the sign-in; the absolute limit counts from here
  google.protobuf.Timestamp ends_at = 8;           // started_at plus the absolute limit, as it was when the chain began
  google.protobuf.Timestamp refreshed_at = 9;      // the last refresh; the idle limit counts from here
  google.protobuf.Timestamp auth_time = 10;        // when the person authenticated at the upstream; a refresh never changes it
  optional string acr = 11;                        // the upstream's acr, if it said one
  repeated string amr = 12;                        // the upstream's amr
  bool amr_present = 13;                           // true when the upstream said anything about amr
  bytes sealed_facts = 14;                         // SignInFacts, sealed with the tenant's chain key: session opens it at a refresh, exchange opens it for a token exchange
  // Field 15 was a second copy of the facts under a boundary chain key; there is one copy now (0006, "Data keys").
  reserved 15;
  reserved "sealed_chain_facts";
}

// StaffPasskey is the kind StaffPasskey (0017 "Passkeys", "The passkey class"): a person's passkey on the shared sign-in
// domain. The id is a keyed hash of the credential id. The item is sealed under the tenant's credential key, which session
// opens before it knows whose the credential is (0006, "Data keys"), so everything a sign-in needs to verify an assertion
// and to decide is here.
message StaffPasskey {
  string subject = 1;                              // the person's subject
  bytes credential_id = 2;                         // the credential id, as the authenticator made it (not a secret)
  bytes public_key = 3;                            // the credential public key, COSE
  bytes user_handle = 4;                           // the person's WebAuthn user handle, a copy of Person.user_handle
  uint32 sign_count = 5;                           // the signature counter of the last assertion
  string class = 6;                                // "hardware" or "synced" (0017); "hardware-attested" only when the attestation verifier exists
  bytes aaguid = 7;                                // the authenticator model
  bytes attestation_object = 8;                    // the raw attestation object of the registration, for the verifier that classifies it later (REQ-AUTHN-080)
  string attestation_format = 9;                   // the statement format the authenticator sent: "none", "packed", "tpm", ...
  string attestation_type = 10;                    // the attestation type the library derived from it
  string attestation_outcome = 11;                 // what sluis checked: "not-verified" (the statement was parsed and its own signature checked, its chain was not taken to a pinned root)
  bool backup_eligible = 12;                       // BE at registration, fixed for the life of the credential
  bool backup_state = 13;                          // BS at the last assertion
  repeated string transports = 14;                 // the transports the client reported
  string account = 15;                             // "<upstream>/<subject claim value>" of the sign-in the passkey was registered after: what policy decides a passkey sign-in on
  google.protobuf.Timestamp created_at = 16;       // when it was registered
  google.protobuf.Timestamp last_used_at = 17;     // the last assertion
  google.protobuf.Timestamp upstream_checked_at = 18;  // the last sign-in at the upstream of this person that sluis saw; a passkey sign-in is refused past SignInMethods.upstream_recheck
}

// WebAuthnChallenge is the kind WebAuthnChallenge (0017 "Passkeys"): the marker that a ceremony's challenge was used. The
// id is the hash of the challenge, and the item is created when the response arrives, before it is verified, so a
// challenge works once; a second create is a replay.
message WebAuthnChallenge {
  string ceremony = 1;  // "register" or "assert"
}

// PasskeyCeremony is what session keeps between the two steps of a passkey ceremony. It never leaves session unsealed: it
// travels in the sign-in cookie, sealed at key@ under the boundary's cookie key.
message PasskeyCeremony {
  string ceremony = 1;                       // "register" or "assert"
  bytes session_data = 2;                    // the library's SessionData, JSON: the challenge, the relying-party ID, the user verification requirement, the expiry
  string subject = 3;                        // register: the person the credential is for
  string account = 4;                        // register: the account of the fresh sign-in, kept in the credential
  bytes user_handle = 5;                     // register: the person's WebAuthn user handle
  google.protobuf.Timestamp expires_at = 6;  // when the ceremony ends
}
