# EXCH: Token exchange
schema: 1
area: EXCH
requirements:
  - id: REQ-EXCH-001
    area: EXCH
    statement: "Token exchange MUST be denied unless a configured exchange grant matches the requesting client, the subject token and the requested audience."
    rationale: "Deny by default prevents confused-deputy chains."
    level: MUST
    source: v1-parity
    status: partial
    gap: partly-built
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Full}
      - {id: ST-14, section: "4", depth: Partial}
    issues: [782, 785]
    verification:
      - {kind: test-vectors, ref: "own exchange vectors"}
      - {kind: integration-test, ref: "default-deny test"}
  - id: REQ-EXCH-002
    area: EXCH
    statement: "The token exchange endpoint MUST refuse a request that carries an actor_token with invalid_request."
    rationale: "Ignoring a parameter implies delegation semantics that sluis does not provide."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Partial}
    issues: [782]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "actor_token negative test"}
  - id: REQ-EXCH-008
    area: EXCH
    split_from: REQ-EXCH-002
    statement: "The token exchange endpoint MUST refuse a requested_token_type other than an access token with invalid_request."
    rationale: "Ignoring a parameter implies delegation semantics that sluis does not provide."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Partial}
    issues: [782]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "requested_token_type negative test"}
  - id: REQ-EXCH-003
    area: EXCH
    statement: "A refusal by unknown audience, by limit or by missing grant MUST be answered identically with invalid_target."
    rationale: "A uniform answer hides which audiences exist."
    level: MUST
    source: v1-parity
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2.2", depth: Full}
      - {id: ST-08, section: "2", depth: Partial}
    issues: [782, 785]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "uniform-refusal test"}
  - id: REQ-EXCH-009
    area: EXCH
    split_from: REQ-EXCH-003
    statement: "The reason for an exchange refusal MUST be recorded in the audit log."
    rationale: "The operator still needs the real reason."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2.2", depth: Full}
      - {id: ST-08, section: "2", depth: Partial}
    issues: [782, 785]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "refusal audit-record test"}
  - id: REQ-EXCH-004
    area: EXCH
    statement: "The output of an exchange MUST be narrower than or equal to the subject token in audience, scope and lifetime."
    rationale: "An exchange must never widen authority."
    level: MUST
    source: v1-parity
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2", depth: Full}
    issues: [782, 785]
    verification:
      - {kind: integration-test, ref: "narrowing property test"}
  - id: REQ-EXCH-010
    area: EXCH
    split_from: REQ-EXCH-004
    statement: "The output of an exchange MUST NOT include a refresh token."
    rationale: "A refresh token would extend the lifetime beyond the subject token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2", depth: Full}
    issues: [782, 785]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "no-refresh-token test"}
  - id: REQ-EXCH-005
    area: EXCH
    statement: "An exchange MUST be refused when the session that produced the subject token has ended."
    rationale: "Logout must cut every derived token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Full}
      - {id: ST-30, section: "1", depth: Partial}
    issues: [782, 793]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "post-logout exchange test"}
  - id: REQ-EXCH-006
    area: EXCH
    statement: "An exchange MUST be refused when the subject token was issued by a different installation, unless both installations belong to one operator and each declares trust in the other."
    rationale: "Cross-installation exchange breaks the trust boundary except under the trust that one operator declares on both sides (ADR 0008)."
    level: MUST
    source: v1-parity
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Full}
    issues: [782]
    verification:
      - {kind: integration-test, ref: "cross-installation negative test: another operator, and one operator with trust declared on one side only"}
      - {kind: integration-test, ref: "an exchange between two installations of one operator that both declare the trust is accepted"}
  - id: REQ-EXCH-007
    area: EXCH
    statement: "A client that exchanges tokens MUST be confidential, except a public client of the native profile that exchanges a token issued to itself (decision of 2026-11-04, ADR 0022)."
    rationale: "A public client cannot keep a secret, so it holds no exchange authority beyond its own token (ADR 0022)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Full}
      - {id: ST-01, section: "2.3", depth: Full}
    issues: [785]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "a public client that exchanges the token of another client, a browser client's token, or a token with a secret is refused; a native public client exchanges its own token"}
  - id: REQ-EXCH-011
    area: EXCH
    split_from: REQ-EXCH-007
    statement: "A client that exchanges tokens MUST authenticate, except a public client of the native profile that exchanges a token issued to itself (decision of 2026-11-04, ADR 0022)."
    rationale: "A public client cannot keep a secret, so it holds no exchange authority beyond its own token (ADR 0022)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-07, section: "2.1", depth: Full}
      - {id: ST-01, section: "2.3", depth: Full}
    issues: [785]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "a confidential client without credentials, and a public client that names another client than the token's, are refused with invalid_client"}
  - id: REQ-EXCH-012
    area: EXCH
    statement: "The token exchange endpoint MUST refuse an exchange when the directory person of the subject is disabled."
    rationale: "A known disable takes effect at once, and the bounded window for last-known groups applies only while the directory is unreachable, where sluis cannot learn of a disable."
    level: MUST
    source: v1-parity
    status: partial
    gap: no-proving-test
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-07, section: "2.2.2", depth: Partial}
    issues: [782]
    verification:
      - {kind: integration-test, ref: "disabled person exchange test"}
  - id: REQ-EXCH-013
    area: EXCH
    statement: "A credential minter MUST refuse a request for a target that is not a declared MinterTarget or that lies outside MinterBounds, with the reason NOT_FOUND."
    rationale: "A minter serves only the targets that a tenant declared within the bounds an operator reviewed (ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1011]
    verification:
      - {kind: integration-test, ref: "a mint for an undeclared target and for a target outside MinterBounds"}
  - id: REQ-EXCH-014
    area: EXCH
    statement: "A credential minter MUST refuse a target that grants administration of tokens, billing, account settings, memberships or identity providers at its vendor."
    rationale: "The minting credential is the sharpest edge of an integration, so the floor is in code (ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1011]
    verification:
      - {kind: test-vectors, ref: "targets on the refusal list"}
  - id: REQ-EXCH-015
    area: EXCH
    statement: "A credential minter MUST NOT return a credential that outlasts the least of the lifetime of its grant, the policy cap and the vendor's maximum."
    rationale: "A minted credential is never longer-lived than what authorised it (ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1011]
    verification:
      - {kind: integration-test, ref: "a mint request for a longer lifetime than each limit in turn"}

  # ---- credential minters and adapters (decision 0025)
  - id: REQ-EXCH-016
    area: EXCH
    statement: "A credential minter MUST NOT record the credential it returns."
    rationale: "What sluis never stores cannot be taken from it, and a minted credential is short-lived (ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "after a mint, a scan of the store finds no credential value; the logs, the audit log, spans and metric attributes hold no credential, account id, token id, name or URL"}
  - id: REQ-EXCH-017
    area: EXCH
    statement: "store@ MUST refuse a write of a MinterTarget that lies outside MinterBounds."
    rationale: "MinterBounds says which target types and maximum lifetimes an installation allows (ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [store]
    standards: []
    issues: [1214]
    verification:
      - {kind: integration-test, ref: "a MinterTarget one step outside each bound in turn is refused on write"}
  - id: REQ-EXCH-018
    area: EXCH
    statement: "exchange MUST authenticate the client of a token exchange request by the HTTP Basic authorization or the client_secret of the request when the client is confidential."
    rationale: "A confidential client's token must not be exchanged by a caller that does not hold its secret (ADR 0022)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [exchange]
    standards: [{id: ST-07, section: "2.1", depth: Partial}]
    issues: [782]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "a confidential client exchanges with Basic and with client_secret; without either it is refused with invalid_client"}
  - id: REQ-EXCH-019
    area: EXCH
    statement: "exchange MUST refuse a token exchange request whose client authentication fails with invalid_client."
    rationale: "A wrong secret and an unknown client must look the same (ADR 0022)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [exchange]
    standards: [{id: ST-01, section: "5.2", depth: Partial}]
    issues: [782]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "a wrong secret, an unknown client and a client with no secret give the same answer and the same calls to store@; a retired secret joins when rotation exists (#790)"}
  - id: REQ-EXCH-020
    area: EXCH
    statement: "Until private_key_jwt client authentication is supported, exchange MUST accept as a subject token only a token issued to a public client of the native profile, and lifting this needs a marker guard against re-exchange first."
    rationale: "Exchange cannot yet check how every client authenticates (ADR 0022), and cannot tell its own tokens from sign-in tokens because the claim set is fixed (ADR 0020), so lifting the rule needs a marker guard first."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [exchange]
    standards: []
    issues: [782]
    tests: [actors/exchange/internal/exchanged/exchange_test.go]
    verification:
      - {kind: integration-test, ref: "a token issued to a browser client, to a confidential client and to a fapi2 client is refused as a subject; a native client's is accepted"}
      - {kind: integration-test, ref: "a token that exchange issued to a confidential client for itself is refused as a subject, by the client's kind"}
  - id: REQ-EXCH-021
    area: EXCH
    statement: "exchange SHOULD authenticate the client of a token exchange request by private_key_jwt."
    rationale: "Asymmetric client authentication removes shared secrets and lifts the restriction on subjects (ADR 0022)."
    level: SHOULD
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    actors: [exchange]
    standards: [{id: ST-07, section: "2.1", depth: Partial}]
    issues: [912]
    verification:
      - {kind: integration-test, ref: "a client authenticates the exchange with a signed assertion"}
      - {kind: conformance-suite, ref: "the FAPI 2.0 plan includes a token exchange"}
  - id: REQ-EXCH-022
    area: EXCH
    statement: "A credential minter MUST count the caps on live tokens per caller and per target and on mints per caller per hour from sluis's own record of what it minted, without listing the tokens at the vendor."
    rationale: "Listing every token of an account on each mint made a mint cost several seconds, and the count that sluis needs is its own to keep (ADR 0025)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a fake vendor that counts list calls sees none during a mint; the record's caps refuse the next mint above them with RATE_LIMITED; mints in flight count against the caps"}
  - id: REQ-EXCH-023
    area: EXCH
    statement: "A credential minter MUST refuse a mint with the reason UNAVAILABLE when it cannot read its record of what it minted."
    rationale: "A cap that cannot be counted must not be treated as unreached (principle 4, ADR 0025)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "with the record unreadable the mint fails with UNAVAILABLE and no token is created at the vendor"}
  - id: REQ-EXCH-024
    area: EXCH
    statement: "A credential minter MUST compare its record of what it minted with the vendor's list at a fixed interval and correct the record where the two differ."
    rationale: "A crash between creating a token and recording it leaves a live token that no cap counts (ADR 0025)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "a fake vendor holds a token that the record lacks; the next pass records it; an entry for a token that the vendor no longer holds is forgotten after the vendor confirms it is gone"}
  - id: REQ-EXCH-025
    area: EXCH
    statement: "A credential minter SHOULD count each correction of its record in a metric labelled by the kind of correction."
    rationale: "The number of corrections is the measure of how far the record drifts from the vendor (ADR 0016)."
    level: SHOULD
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "after the reconcile pass of the previous row the drift counter holds one for the missing token and one for the forgotten entry"}
  - id: REQ-EXCH-026
    area: EXCH
    statement: "The record of a credential minter's mints MUST hold only the token's identifier, a digest of the caller, the target and the expiry of each mint."
    rationale: "The record is the one place that holds a token identifier, so it must hold nothing that opens the credential or names the account, and the caps are counted from it (ADR 0025)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: integration-test, ref: "every field of a mint's record is one of token id, caller digest, target and expiry; a scan finds no credential value, account id, token name or URL in it"}
