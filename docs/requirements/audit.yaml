# AUDIT: Audit log
schema: 1
area: AUDIT
requirements:
  - id: REQ-AUDIT-001
    area: AUDIT
    statement: "Every successful sign-in, mint, grant, exchange and administrative change MUST produce an audit record."
    rationale: "An action without a record cannot be reviewed."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [833, 1120]
    verification:
      - {kind: integration-test, ref: "record-per-action test over the action table"}
  - id: REQ-AUDIT-021
    area: AUDIT
    split_from: REQ-AUDIT-001
    statement: "Every denial or refusal MUST produce an audit record that carries its reason code."
    rationale: "An action without a record cannot be reviewed."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [833, 1120]
    verification:
      - {kind: integration-test, ref: "refusal record test over the action table"}
  - id: REQ-AUDIT-002
    area: AUDIT
    statement: "Every audit record MUST validate against the schema generated from its action table entry."
    rationale: "A closed action table keeps records interpretable."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "JSON-Schema-Test-Suite"}
  - id: REQ-AUDIT-022
    area: AUDIT
    split_from: REQ-AUDIT-002
    statement: "The emitter MUST refuse an unknown action."
    rationale: "A closed action table keeps records interpretable."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "unknown-action test"}
  - id: REQ-AUDIT-003
    area: AUDIT
    statement: "Audit records, logs and traces MUST NOT contain e-mail addresses, names, secrets or tokens."
    rationale: "The trail must not become a personal-data store."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-98, section: "OTLP", depth: Partial}
    issues: [840]
    verification:
      - {kind: integration-test, ref: "scan of records and logs for personal data and secrets"}
  - id: REQ-AUDIT-023
    area: AUDIT
    split_from: REQ-AUDIT-003
    statement: "An external actor MUST be recorded under a keyed pseudonym."
    rationale: "The trail must not become a personal-data store."
    level: MUST
    source: security-review
    status: planned
    runtimes: all
    standards:
      - {id: ST-98, section: "OTLP", depth: Partial}
    issues: [840]
    verification:
      - {kind: integration-test, ref: "pseudonym test"}
  - id: REQ-AUDIT-004
    area: AUDIT
    statement: "The hash of an audit record MUST be computed over its canonical JSON form."
    rationale: "A canonical form makes hashes reproducible."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Full}
    issues: [1121]
    verification:
      - {kind: test-vectors, ref: "RFC 8785 test data"}
  - id: REQ-AUDIT-005
    area: AUDIT
    statement: "Audit records of a period MUST be organised in a Merkle tree following the RFC 6962 hash rules."
    rationale: "Proofs let anyone verify the log without trusting the operator."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-77, section: "2.1", depth: Full}
    issues: [1121, 838]
    verification:
      - {kind: test-vectors, ref: "RFC 6962 examples"}
      - {kind: test-vectors, ref: "shared Merkle vector file"}
  - id: REQ-AUDIT-024
    area: AUDIT
    split_from: REQ-AUDIT-005
    statement: "Inclusion and consistency proofs MUST verify offline."
    rationale: "Proofs let anyone verify the log without trusting the operator."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-77, section: "2.1", depth: Full}
    issues: [1121, 838]
    verification:
      - {kind: test-vectors, ref: "RFC 6962 examples"}
      - {kind: integration-test, ref: "offline verification test"}
  - id: REQ-AUDIT-006
    area: AUDIT
    statement: "Each sealed period MUST be signed over its root through key@."
    rationale: "Every audit signature is made by the one holder of the log key."
    level: MUST
    source: v1-parity
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
    issues: [838]
    superseded_by: [REQ-AUDIT-040]
    verification:
      - {kind: test-vectors, ref: "seal vectors"}
  - id: REQ-AUDIT-025
    area: AUDIT
    split_from: REQ-AUDIT-006
    statement: "A sealed period MUST be immutable after sealing."
    rationale: "A sealed period is the unit of evidence."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "immutability test"}
  - id: REQ-AUDIT-026
    area: AUDIT
    split_from: REQ-AUDIT-006
    statement: "A sealed period MUST be verifiable offline using only the public key set and the sealed data."
    rationale: "A sealed period is the unit of evidence."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "offline seal verification test"}
  - id: REQ-AUDIT-007
    area: AUDIT
    statement: "There MUST be exactly one writer per log."
    rationale: "Two writers fork the chain."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-77, section: "2.1", depth: Partial}
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "two-writer negative test"}
  - id: REQ-AUDIT-027
    area: AUDIT
    split_from: REQ-AUDIT-007
    statement: "An installation with more than one node or with elastic nodes MUST guarantee one writer per log by a create-if-absent fence on the log store."
    rationale: "The fence of each log is its blob and not a lease, so a second writer cannot fork the log (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-77, section: "2.1", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [837]
    verification:
      - {kind: test-vectors, ref: "port suite blob create-if-absent fence"}
  - id: REQ-AUDIT-008
    area: AUDIT
    statement: "The log store MUST be a blob store with an explicit lock mode of none, removable or compliance."
    rationale: "The lock mode defines what tamper-evidence the log gives."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [1121, 837]
    verification:
      - {kind: test-vectors, ref: "port suite blob"}
  - id: REQ-AUDIT-028
    area: AUDIT
    split_from: REQ-AUDIT-008
    statement: "`sluis config check` MUST report the lock mode of the configured blob driver."
    rationale: "The lock mode defines what tamper-evidence the log gives."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [1121, 837]
    verification:
      - {kind: integration-test, ref: "config-check lock-mode report test"}
  - id: REQ-AUDIT-009
    area: AUDIT
    statement: "A cluster MUST keep one log per node."
    rationale: "Peers narrow the window in which one node can rewrite its log."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-73, section: "1", depth: Partial}
      - {id: ST-74, section: "1", depth: Partial}
      - {id: ST-76, section: "1", depth: Partial}
    issues: [955]
    verification:
      - {kind: integration-test, ref: "per-node log test"}
  - id: REQ-AUDIT-029
    area: AUDIT
    split_from: REQ-AUDIT-009
    statement: "Where peer witnesses are configured, the other nodes of a cluster MUST be the peer witnesses that co-sign a node's checkpoints, two of three."
    rationale: "Peers narrow the window in which one node can rewrite its log."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-73, section: "1", depth: Partial}
      - {id: ST-74, section: "1", depth: Partial}
      - {id: ST-76, section: "1", depth: Partial}
    issues: [955]
    verification:
      - {kind: integration-test, ref: "co-signing and failure tests"}
  - id: REQ-AUDIT-010
    area: AUDIT
    statement: "Where no witness is configured, `sluis config check` MUST warn."
    rationale: "Witnesses are optional but the risk must be visible."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "config-check warning test"}
  - id: REQ-AUDIT-030
    area: AUDIT
    split_from: REQ-AUDIT-010
    statement: "The documentation MUST state that, with no witness, a compromised writer can obtain a rewritten checkpoint."
    rationale: "Witnesses are optional but the risk must be visible."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
    issues: [838]
    manual_reason: "A statement in the documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-AUDIT-011
    area: AUDIT
    statement: "sluis MAY adopt a published transparency-log checkpoint and witness protocol so that independent parties can witness a log."
    rationale: "Interoperable witnesses strengthen the log."
    level: MAY
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-71, section: "1", depth: Full}
      - {id: ST-72, section: "1", depth: Full}
      - {id: ST-73, section: "1", depth: Full}
      - {id: ST-74, section: "1", depth: Full}
    issues: [955]
    verification:
      - {kind: test-vectors, ref: "spec vectors"}
      - {kind: integration-test, ref: "witness protocol test"}
  - id: REQ-AUDIT-031
    area: AUDIT
    split_from: REQ-AUDIT-011
    statement: "sluis MAY anchor sealed periods externally with a time-stamp authority."
    rationale: "An external anchor bounds the time of a seal."
    level: MAY
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-79, section: "3161", depth: Full}
    issues: [1027]
    verification:
      - {kind: integration-test, ref: "time-stamp anchor test"}
  - id: REQ-AUDIT-012
    area: AUDIT
    statement: "The audit emitter MUST be a library inside each application."
    rationale: "The application must not depend on writer availability."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802, 1120]
    manual_reason: "The rule constrains the architecture of the applications that embed the emitter."
    verification:
      - {kind: manual, ref: "architecture review"}
  - id: REQ-AUDIT-032
    area: AUDIT
    split_from: REQ-AUDIT-012
    statement: "The audit emitter MUST be decoupled from the writer by a transport."
    rationale: "The application must not depend on writer availability."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [802, 1120]
    verification:
      - {kind: test-vectors, ref: "port suite transport"}
  - id: REQ-AUDIT-013
    area: AUDIT
    statement: "In direct transport mode, when the writer is unavailable, the emitter MUST fall back to a local spool."
    rationale: "Direct mode needs durability."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    verification:
      - {kind: integration-test, ref: "writer-down fallback test"}
  - id: REQ-AUDIT-033
    area: AUDIT
    split_from: REQ-AUDIT-013
    statement: "The emitter MUST NOT drop records or buffer them only in memory when the writer is unavailable."
    rationale: "Direct mode needs durability."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    verification:
      - {kind: integration-test, ref: "writer-down no-loss test"}
  - id: REQ-AUDIT-014
    area: AUDIT
    statement: "Delivery from the emitter to the writer MUST be at least once."
    rationale: "Networks duplicate; the log must not."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [802, 1120, 1121]
    verification:
      - {kind: test-vectors, ref: "port suite transport"}
  - id: REQ-AUDIT-034
    area: AUDIT
    split_from: REQ-AUDIT-014
    statement: "The writer MUST deduplicate records by record identifier."
    rationale: "Networks duplicate; the log must not."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802, 1121]
    verification:
      - {kind: integration-test, ref: "duplicate delivery test"}
  - id: REQ-AUDIT-015
    area: AUDIT
    statement: "Credential and administrative changes SHOULD use blocking delivery so that the change fails when its record cannot be written."
    rationale: "A change without a record must not happen."
    level: SHOULD
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1120, 802]
    verification:
      - {kind: integration-test, ref: "blocked-write test"}
  - id: REQ-AUDIT-016
    area: AUDIT
    statement: "The search index MUST be rebuildable from the log alone."
    rationale: "The index is a cache, never the record."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1122]
    verification:
      - {kind: integration-test, ref: "reindex test"}
  - id: REQ-AUDIT-035
    area: AUDIT
    split_from: REQ-AUDIT-016
    statement: "A reader MUST be able to merge several node logs by time."
    rationale: "The index is a cache, never the record."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [839]
    verification:
      - {kind: test-vectors, ref: "port suite index"}
  - id: REQ-AUDIT-017
    area: AUDIT
    statement: "A clock-synchronisation check MUST run."
    rationale: "Seal times depend on the clock."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-80, section: "5905", depth: Full}
    issues: [838, 867]
    verification:
      - {kind: integration-test, ref: "clock check test"}
  - id: REQ-AUDIT-036
    area: AUDIT
    split_from: REQ-AUDIT-017
    statement: "A seal MUST record the observed clock offset."
    rationale: "Seal times depend on the clock."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-80, section: "5905", depth: Full}
    issues: [838, 867]
    verification:
      - {kind: integration-test, ref: "seal offset test"}
  - id: REQ-AUDIT-018
    area: AUDIT
    statement: "A subject erasure request MUST be satisfied by destroying a per-subject key."
    rationale: "Erasure and an immutable log need crypto-shredding."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Partial}
    issues: [840]
    superseded_by: [REQ-AUDIT-057]
    verification:
      - {kind: integration-test, ref: "erasure test"}
  - id: REQ-AUDIT-019
    area: AUDIT
    statement: "Audit records MUST carry enough data to roll state forward after a restore for the kinds that need it."
    rationale: "Roll-forward applies the audit facts since the archive by the merge rule of each kind (ADR 0010)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [841]
    verification:
      - {kind: integration-test, ref: "roll-forward restore test"}
  - id: REQ-AUDIT-037
    area: AUDIT
    split_from: REQ-AUDIT-019
    statement: "Audit records MUST NOT carry secrets."
    rationale: "A secret in an immutable log can never be removed."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "secret scan of records"}
  - id: REQ-AUDIT-020
    area: AUDIT
    statement: "Records MUST be routed to a tenant at write time."
    rationale: "Controllers must not read each other's records."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [840]
    verification:
      - {kind: integration-test, ref: "tenant routing test"}
  - id: REQ-AUDIT-038
    area: AUDIT
    split_from: REQ-AUDIT-020
    statement: "The operator's own view of a tenant's records MUST contain only the class, the outcome and rotating pseudonyms."
    rationale: "Controllers must not read each other's records."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [840]
    verification:
      - {kind: integration-test, ref: "tenant isolation test"}
  - id: REQ-AUDIT-039
    area: AUDIT
    statement: "A witness MUST be optional in every installation."
    rationale: "Witnesses add dependencies that some installations cannot meet."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
    issues: [838, 955]
    verification:
      - {kind: integration-test, ref: "no-witness installation test"}
  - id: REQ-AUDIT-040
    area: AUDIT
    statement: "The audit writer MUST obtain checkpoint signatures from key@."
    rationale: "Only key@ touches the log key (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards:
      - {id: ST-49, section: "7515", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "checkpoint signing test"}
  - id: REQ-AUDIT-041
    area: AUDIT
    statement: "The rules of key@ MUST let only the writer instance that owns a log key use it."
    rationale: "A log key used by another actor could sign a checkpoint that the writer never made (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [key]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [838, 951]
    verification:
      - {kind: integration-test, ref: "key access denial test"}
  - id: REQ-AUDIT-042
    area: AUDIT
    statement: "sluis MUST NOT run a separate notary actor for audit checkpoints."
    rationale: "The notary is folded into the rules of key@, which signs every checkpoint (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "actor inventory test"}
  - id: REQ-AUDIT-043
    area: AUDIT
    statement: "`sluis config check` MUST refuse direct audit transport on a runtime that has no local disk."
    rationale: "Direct mode falls back to a local spool and so needs a disk."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    verification:
      - {kind: integration-test, ref: "config-check refusal test"}
  - id: REQ-AUDIT-044
    area: AUDIT
    statement: "The default audit transport driver MUST be spool on bare-metal, SQS on serverless and NATS JetStream on kubernetes."
    rationale: "Each default is proved by the reference installation of its runtime, and direct has no default."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    verification:
      - {kind: integration-test, ref: "default driver test"}
  - id: REQ-AUDIT-045
    area: AUDIT
    statement: "Each node of a cluster MUST have its own audit writer, spool and log key."
    rationale: "One log per node means one writer per log."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-77, section: "2.1", depth: Partial}
    issues: [837, 838]
    verification:
      - {kind: integration-test, ref: "per-node writer test"}
  - id: REQ-AUDIT-046
    area: AUDIT
    statement: "A free-text field in an audit record MUST be bounded in length."
    rationale: "An immutable log must not hold unbounded typed text."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "free-text bound test"}
  - id: REQ-AUDIT-047
    area: AUDIT
    statement: "The writer MUST seal a batch when it holds 256 records or when its first record is 5 seconds old, whichever comes first, and never seal an empty batch."
    rationale: "A short bound keeps the index and the witnesses within seconds while an idle log signs nothing."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-75, section: "1", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "seal bound test"}
  - id: REQ-AUDIT-048
    area: AUDIT
    statement: "Each sealed batch MUST end with a seal entry, inside the tree, that records its record count, the writer instance and the observed clock offset."
    rationale: "The offset inside the tree is cosigned by the witnesses with everything else."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-75, section: "1", depth: Partial}
      - {id: ST-80, section: "5905", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "seal entry test"}
  - id: REQ-AUDIT-049
    area: AUDIT
    statement: "The writer MUST ask every configured witness to cosign each new checkpoint, at most once per witness every 5 seconds, and ask again for the latest checkpoint every 5 minutes while the log is idle."
    rationale: "The unwitnessed window stays about one seal, and a reader can prove freshness to within 5 minutes."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
      - {id: ST-73, section: "1", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "witness cadence test"}
  - id: REQ-AUDIT-050
    area: AUDIT
    statement: "Every checkpoint of an audit log MUST also be written once, create-if-absent, under its tree size below the log's prefix."
    rationale: "The checkpoint history must survive on a store with no versioning."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-72, section: "1", depth: Partial}
      - {id: ST-75, section: "1", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [1121]
    verification:
      - {kind: test-vectors, ref: "port suite blob create-if-absent fence"}
      - {kind: integration-test, ref: "checkpoint history test"}
  - id: REQ-AUDIT-051
    area: AUDIT
    statement: "An audit record identifier MUST be a UUIDv7 set by the emitter."
    rationale: "A standard, time-ordered id lets the writer bound how long it remembers ids."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-02, section: "5.7", depth: Partial}
    issues: [802, 1120]
    verification:
      - {kind: integration-test, ref: "record id format test"}
  - id: REQ-AUDIT-052
    area: AUDIT
    statement: "The writer MUST remember record identifiers for duplicate removal for 14 days."
    rationale: "The window must outlast the longest queue retention of a supported transport."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "late redelivery test"}
  - id: REQ-AUDIT-053
    area: AUDIT
    statement: "The writer MUST quarantine and report a record older than its duplicate-removal window instead of writing it."
    rationale: "A record outside the window could be a duplicate that the writer can no longer recognise."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "quarantine test"}
  - id: REQ-AUDIT-054
    area: AUDIT
    statement: "A blocking emit MUST return only once the record is durable in the transport: accepted by the queue, acknowledged by the writer, or fsync'd to the local spool."
    rationale: "A change must not happen when its record could still be lost, and must not wait for a seal."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [802]
    verification:
      - {kind: integration-test, ref: "blocking emit durability test"}
  - id: REQ-AUDIT-055
    area: AUDIT
    statement: "Each audit log entry MUST be a clear envelope plus the record sealed by key@ under its tenant's evidence key."
    rationale: "The envelope lets a reader route without opening, and the evidence key outlives the personal data (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards:
      - {id: ST-61, section: "5", depth: Partial}
    issues: [840]
    verification:
      - {kind: integration-test, ref: "an entry opens under the tenant's evidence key and under no other key"}
  - id: REQ-AUDIT-056
    area: AUDIT
    statement: "The leaf hash of an audit log MUST cover the whole entry, ciphertext included."
    rationale: "A log must still verify after its records stop opening (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-77, section: "2.1", depth: Partial}
    issues: [838, 840]
    verification:
      - {kind: integration-test, ref: "verify after shred test"}
  - id: REQ-AUDIT-057
    area: AUDIT
    statement: "A person's erasure request MUST be met by deleting the mapping from that person's pseudonym to the person, which is kept outside the log."
    rationale: "Records carry pseudonyms only, so deleting the mapping removes the link to the person without a key per subject."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards: []
    issues: [840]
    verification:
      - {kind: integration-test, ref: "erasure by pseudonym mapping test"}
  - id: REQ-AUDIT-058
    area: AUDIT
    statement: "In a production boundary `sluis config check` MUST refuse an audit log store whose lock mode is not compliance unless a peer or external witness is configured."
    rationale: "A production log without a lock and without a witness must not start by accident."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
    issues: [837]
    verification:
      - {kind: integration-test, ref: "config-check production lock-mode refusal test"}
  - id: REQ-AUDIT-059
    area: AUDIT
    statement: "Outside production `sluis config check` MUST warn about an audit log store that has neither a compliance lock nor a witness."
    rationale: "Development and staging may run unprotected logs, but the risk must be visible."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "config-check lock-mode warning test"}
  - id: REQ-AUDIT-060
    area: AUDIT
    statement: "Every audit log in a production boundary MUST declare its retention period, with no built-in default."
    rationale: "A period locked in compliance mode cannot be shortened, so it must be chosen consciously."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "config-check retention test"}
  - id: REQ-AUDIT-061
    area: AUDIT
    statement: "The declared retention MUST be enforced as per-object retention on a compliance store, as the bucket lock rule on R2, and as a lifecycle rule or an expiry sweeper on a store with no lock."
    rationale: "Each backend has its own means, and the declared period must mean the same on all of them."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [837]
    verification:
      - {kind: test-vectors, ref: "port suite blob retention"}
      - {kind: integration-test, ref: "retention per backend test"}
  - id: REQ-AUDIT-062
    area: AUDIT
    statement: "An audit log expiry sweeper MUST hold a delete right on expired log objects only."
    rationale: "The sweeper is the one credential that may delete from the log."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "sweeper delete-right denial test"}
  - id: REQ-AUDIT-063
    area: AUDIT
    statement: "sluis MUST NOT place or lift legal holds on the audit log, and each hold placed with the store's own means is recorded as an audit record under the person's name."
    rationale: "Holds stay with cloud IAM and a break-glass role, and the log still shows who held what."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "hold record test"}
  - id: REQ-AUDIT-064
    area: AUDIT
    statement: "Before key@ deletes a tenant's evidence wrap, the deletion MUST check for a standing legal hold on the logs that hold the tenant's entries."
    rationale: "A legal hold on the logs must stop the end of the tenant's evidence while it stands (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [key]
    standards: []
    issues: [973, 837]
    verification:
      - {kind: integration-test, ref: "a tenant whose evidence retention has ended with a standing hold on a log: the evidence wrap is not deleted"}
  - id: REQ-AUDIT-065
    area: AUDIT
    statement: "On the boards a scheduled job of the audit installation, not the writer, MUST copy new audit log objects to the off-site R2 copy at least every hour, create-if-absent."
    rationale: "The writer stays away from R2, at the cost of up to an hour of log with no off-site copy."
    level: MUST
    source: design-decision
    status: withdrawn
    superseded_by: [REQ-AUDIT-103]
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-75, section: "1", depth: Partial}
    verification:
      - {kind: integration-test, ref: "off-site copy test"}
  - id: REQ-AUDIT-066
    area: AUDIT
    statement: "A reader MUST NOT claim an order between records of different node logs that are closer in time than those logs' recorded clock offsets."
    rationale: "Within one log the order is exact; across logs it is only as good as the clocks."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-80, section: "5905", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "merge order test"}
  - id: REQ-AUDIT-067
    area: AUDIT
    statement: "The search index MUST keep full text only over the fields that the action table marks searchable."
    rationale: "Full text over everything would index personal fields."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [839]
    verification:
      - {kind: test-vectors, ref: "port suite index"}
      - {kind: integration-test, ref: "searchable fields test"}
  - id: REQ-AUDIT-068
    area: AUDIT
    statement: "A tenant's exit MUST purge the tenant's rows from the search index and exclude them from every later rebuild."
    rationale: "A purged index must not bring a tenant's rows back at the next rebuild (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [indexer]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "exit a tenant, then rebuild: no row of the tenant is in the index"}
  - id: REQ-AUDIT-069
    area: AUDIT
    statement: "A `postgres` search index MUST enforce row-level security on its project, log kind and tenant columns."
    rationale: "The index database is a second place where one tenant's rows could be read as another's (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless", "kubernetes"]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "index row-level security test"}
  - id: REQ-AUDIT-070
    area: AUDIT
    statement: "Full-text search MUST match words without stemming, folding diacritics, with the same matches on every index driver."
    rationale: "One conformance suite needs the same answer from every driver."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [839]
    verification:
      - {kind: test-vectors, ref: "port suite index full text"}
  - id: REQ-AUDIT-071
    area: AUDIT
    statement: "An index rebuild MUST build a new generation beside the serving one and switch the reader to it atomically."
    rationale: "Search stays up during a rebuild, and a failed rebuild leaves the old index serving."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "rebuild switch test"}
  - id: REQ-AUDIT-072
    area: AUDIT
    statement: "The reader MUST return a record with an inclusion proof against a cosigned checkpoint."
    rationale: "A record can then be proven to an outsider."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-77, section: "2.1.1", depth: Partial}
      - {id: ST-73, section: "1", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "get with proof test"}
  - id: REQ-AUDIT-073
    area: AUDIT
    statement: "The reader MUST ask `policy` for a grant on every call, naming the projects, log kinds and tenants, and apply it as a mandatory filter of the query."
    rationale: "Least privilege per tenant is enforced in one policy language (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [reader]
    standards:
      - {id: NC-12, section: "1", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "reader grant filter test"}
  - id: REQ-AUDIT-074
    area: AUDIT
    statement: "Every read of the audit log through the reader MUST itself be audited with the rule that granted it."
    rationale: "Reads of the trail must be accountable."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "read audit test"}
  - id: REQ-AUDIT-075
    area: AUDIT
    statement: "The default search index MUST be `postgres` on Aurora on the lambda installation and `postgres` on CloudNativePG on the kubernetes installation."
    rationale: "Search works out of the box on every tested installation."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless", "kubernetes"]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "default index test"}
  - id: REQ-AUDIT-076
    area: AUDIT
    statement: "Serverless functions MUST reach a `postgres` index through RDS Proxy with IAM authentication and one database role per actor kind."
    rationale: "Short-lived functions must not exhaust connections, and each actor kind keeps its own role."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless"]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "RDS Proxy IAM role test"}
  - id: REQ-AUDIT-077
    area: AUDIT
    statement: "An audit installation MUST run its own `entry` on its own host, also when the audit pieces are combined with sluis."
    rationale: "The audit front is the same shape on every installation."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [985]
    verification:
      - {kind: integration-test, ref: "audit front topology test"}
  - id: REQ-AUDIT-078
    area: AUDIT
    statement: "The audit console's browser session MUST be held by the audit installation's own `session` actor as an HttpOnly cookie, with no token in the browser."
    rationale: "The audit console must work on its own without tokens in the browser."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-05, section: "cookie prefixes", depth: Partial}
    issues: [985]
    verification:
      - {kind: integration-test, ref: "audit session cookie test"}
  - id: REQ-AUDIT-079
    area: AUDIT
    statement: "A write from the audit console MUST go through the audit installation's `console` actor to the actor that owns its kind, never through the reader."
    rationale: "The reader stays read-only, and each owner validates its own writes (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [985]
    verification:
      - {kind: integration-test, ref: "audit console write routing test"}
  - id: REQ-AUDIT-080
    area: AUDIT
    statement: "The audit console MUST be a static bundle of its own, built on the release train, that works with no sluis installation beside it."
    rationale: "A smaller bundle allows a tighter content security policy and proves the console stands alone."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [985]
    verification:
      - {kind: integration-test, ref: "stand-alone audit console test"}
  - id: REQ-AUDIT-081
    area: AUDIT
    statement: "A console of another installation MUST reach the audit front with an exchanged token whose `aud` is the audit client id, whose lifetime is at most 5 minutes and which is bound to the console's X.509-SVID by mutual TLS."
    rationale: "The person's identity reaches the reader, and a copied token is useless."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-07, section: "2", depth: Partial}
      - {id: ST-19, section: "3", depth: Partial}
    issues: [985]
    verification:
      - {kind: integration-test, ref: "cross-console token test"}
  - id: REQ-AUDIT-082
    area: AUDIT
    statement: "The audit front MUST accept only tokens of an issuer of its own boundary or, in audit alone, of the product's issuer that config declares as the trusted token source."
    rationale: "A token for one environment's log must not open another's."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [985]
    verification:
      - {kind: integration-test, ref: "audit front issuer test"}
  - id: REQ-AUDIT-083
    area: AUDIT
    statement: "The audit console MUST show the health of each project's logs: the age of the latest checkpoint, the witness cosignatures and the index lag."
    rationale: "Integrity problems must be visible to the people who read the log, not only in metrics."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [985]
    verification:
      - {kind: integration-test, ref: "log health view test"}
  - id: REQ-AUDIT-084
    area: AUDIT
    statement: "`sluis audit verify` and `sluis audit read` MUST work from the bucket alone with read-only cloud credentials and no `entry`, reader or sign-in."
    rationale: "Auditors and incident responders are never locked out by the front or the issuer."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [838, 985]
    verification:
      - {kind: integration-test, ref: "bucket-only verify and read test"}
  - id: REQ-AUDIT-085
    area: AUDIT
    statement: "The audit front's host MUST be a sibling of its boundary's sluis host, never a child of it or a path on it."
    rationale: "A sibling inherits no cookie scope, and one origin per host holds (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-59, section: "5.1.4.1", depth: Partial}
    issues: [985]
    verification:
      - {kind: integration-test, ref: "audit host web origin test"}
  - id: REQ-AUDIT-086
    area: AUDIT
    statement: "Every audit record MUST be an OCSF 1.x event of core classes, with the profile of the sluis extension and no `unmapped` object."
    rationale: "A core class is read by any OCSF-aware tool, and the extension types what OCSF lacks."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-114, section: "base event and core classes", depth: Full}
    issues: [841]
    superseded_by: [REQ-AUDIT-111, REQ-AUDIT-112]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-087
    area: AUDIT
    statement: "The writer MUST store the canonical bytes of an audit record exactly as the emitter produced them."
    rationale: "Any re-encoding would change the hash and could change the record."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Partial}
      - {id: ST-114, section: "base event", depth: Partial}
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "emit-to-read byte equality test"}
  - id: REQ-AUDIT-088
    area: AUDIT
    statement: "Each sluis release MUST pin one OCSF version and name it in the `metadata.version` of every audit record it writes."
    rationale: "A record of any age is read and validated by the version it names."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "metadata", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "pinned OCSF version test"}
  - id: REQ-AUDIT-089
    area: AUDIT
    statement: "The build MUST fail when the action table or a field of `unmapped.sluis` uses an OCSF class, attribute or enum value that the pinned OCSF version marks deprecated."
    rationale: "OCSF deprecates often, and an upgrade must be a deliberate, checked change."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "deprecation", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "deprecated OCSF item check in CI"}
  - id: REQ-AUDIT-090
    area: AUDIT
    statement: "An audit record MUST name its actor in `actor.user.uid` as `<actor>@<boundary>`, with the actor's kind in `actor.user.type_id`."
    rationale: "One actor name serves every layer, and every principal has one home in the record."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "actor", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-091
    area: AUDIT
    statement: "A stored audit record MUST hold enum ids only, with no enum captions, observables or enrichments."
    rationale: "Derived data stays out of the hashed evidence and is added on export."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "base event", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "lean record test"}
  - id: REQ-AUDIT-092
    area: AUDIT
    statement: "The audit export MUST be NDJSON of OCSF events that carry the log's boundary in `metadata.log_name`."
    rationale: "A record taken out of its log must still say which boundary it belongs to."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "metadata", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "export format test"}
  - id: REQ-AUDIT-093
    area: AUDIT
    statement: "The writer MUST write the usage part of a message to a usage log that has its own prefix, checkpoints and retention, apart from the audit log, in its project's bucket."
    rationale: "Usage is read by finance without the audit log, so it needs its own prefix, checkpoints and retention (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards:
      - {id: ST-75, section: "1", depth: Partial}
    issues: [837, 915]
    verification:
      - {kind: integration-test, ref: "two log kinds test"}
  - id: REQ-AUDIT-094
    area: AUDIT
    statement: "The writer MUST register the sealed batches of the audit log and of the usage log, the removed duplicate ids and its transport cursor in one conditional write of its state in the project's bucket."
    rationale: "A crash leaves all of it or none of it, and the writer's state never lives in the store (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards:
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [1121, 837]
    verification:
      - {kind: integration-test, ref: "crash between seals test"}
  - id: REQ-AUDIT-095
    area: AUDIT
    statement: "A usage event MUST be a CloudEvents 1.0 event in the structured JSON format, in RFC 8785 canonical form."
    rationale: "A usage-event standard serves metering and billing readers without a security schema."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2 JSON event format", depth: Full}
      - {id: ST-78, section: "8785", depth: Partial}
    issues: [841, 915]
    verification:
      - {kind: integration-test, ref: "usage event format test"}
  - id: REQ-AUDIT-096
    area: AUDIT
    statement: "The writer MUST ask every configured witness to cosign the checkpoints of the usage log as it does for the audit log."
    rationale: "Balance effects and meters need the same tamper evidence as security records."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-74, section: "1", depth: Partial}
    issues: [838]
    verification:
      - {kind: integration-test, ref: "usage log cosignature test"}
  - id: REQ-AUDIT-097
    area: AUDIT
    statement: "A usage log entry MUST be encrypted with HPKE to its company's usage data key."
    rationale: "Evidence must outlive the shred of the company's personal data, so it has a key of its own (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-61, section: "5", depth: Partial}
    issues: [837]
    superseded_by: [REQ-AUDIT-150]
    verification:
      - {kind: integration-test, ref: "usage entry encryption test"}
  - id: REQ-AUDIT-098
    area: AUDIT
    statement: "The indexer MUST NOT follow or index the usage log."
    rationale: "Nobody searches usage, and the indexer then needs no key for it."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "indexer log kind test"}
  - id: REQ-AUDIT-099
    area: AUDIT
    statement: "An audit emitter in Go or Rust MUST validate each record against the schema generated from its action table entry before it emits the record."
    rationale: "An ill-formed record is refused where it is made, before a blocking emit waits on it; the writer still validates and stays authoritative."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "emitter refuses an ill-formed record test"}
  - id: REQ-AUDIT-100
    area: AUDIT
    statement: "The build MUST fail when an example record of the action table fails the OCSF toolkit's validation against the pinned OCSF version."
    rationale: "The toolkit checks OCSF's cross-field rules, which the generated JSON Schema does not, and it is pre-1.0, so it gates CI rather than the writer."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "validation", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "OCSF toolkit check of the action table examples in CI"}
  - id: REQ-AUDIT-101
    area: AUDIT
    split_from: REQ-AUDIT-100
    statement: "The build MUST fail when the Go, Rust and TypeScript validators of the audit record schema disagree on any test vector."
    rationale: "One schema is enforced in three languages, and a disagreement means one of them accepts what another refuses."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [1120, 841]
    verification:
      - {kind: test-vectors, ref: "action table vectors through every language's validator"}
  - id: REQ-AUDIT-102
    area: AUDIT
    statement: "An audit record MUST declare every OCSF profile whose attributes it uses in `metadata.profiles`, among them `sluis/audit`."
    rationale: "OCSF validators refuse profile attributes that the record does not declare."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-114, section: "profiles", depth: Partial}
    issues: [841]
    superseded_by: [REQ-AUDIT-120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-103
    area: AUDIT
    statement: "Every blob driver MUST refuse to overwrite an existing object on a create-if-absent write."
    rationale: "The blob store is the write-once fence of the audit log, so a second writer cannot overwrite or fork it."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-103, section: "blob port", depth: Full}
    issues: [1121, 837, 851]
    verification:
      - {kind: conformance-suite, ref: "port conformance suite, blob create-if-absent"}
  - id: REQ-AUDIT-104
    area: AUDIT
    statement: "An audit record MUST name the sluis extension, with its name, uid and version, in `metadata.extensions`."
    rationale: "A reader needs the extension version to compile the right schema for a record of any age."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-114, section: "extensions", depth: Partial}
    issues: [841]
    superseded_by: [REQ-AUDIT-116]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-105
    area: AUDIT
    statement: "The build MUST fail when a change to the sluis extension removes or retypes a field without a new major version of the extension."
    rationale: "Records are never rewritten, so a field of the extension has to keep its meaning for every record that carries it."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [841]
    superseded_by: [REQ-AUDIT-119]
    verification:
      - {kind: integration-test, ref: "extension compatibility check in CI"}
  - id: REQ-AUDIT-106
    area: AUDIT
    statement: "The writer MUST refuse an audit record whose bytes differ from the RFC 8785 canonical form of the same record."
    rationale: "A record that is not canonical would hash differently in another implementation."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Full}
    issues: [1121]
    verification:
      - {kind: test-vectors, ref: "RFC 8785 test data and non-canonical records"}
  - id: REQ-AUDIT-107
    area: AUDIT
    statement: "An audit record MUST NOT carry a floating-point number or an integer outside the range of plus or minus 2^53 minus 1."
    rationale: "RFC 8785 writes numbers as IEEE 754 doubles, and a larger integer would not survive it."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-78, section: "8785", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table vectors with numbers at and beyond the bound"}
  - id: REQ-AUDIT-108
    area: AUDIT
    statement: "The emitter MUST build the audit record and the usage events of an action from one call, with one message id."
    rationale: "One call cannot emit a usage event without its audit record or the audit record twice."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [841, 915]
    verification:
      - {kind: integration-test, ref: "single-call emit test"}
  - id: REQ-AUDIT-109
    area: AUDIT
    statement: "The writer MUST refuse a message whose usage part carries a meter that its action table entry does not declare."
    rationale: "The action table says what an action may meter, so a writer can check usage without parsing the security record."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837, 915]
    verification:
      - {kind: integration-test, ref: "undeclared meter refusal test"}
  - id: REQ-AUDIT-110
    area: AUDIT
    statement: "The `id` of a usage event MUST be the `metadata.uid` of the audit record of its message, a slash, and the position of the event in the message."
    rationale: "The usage event deduplicates by source and id like the message, and joins to its audit record by the prefix."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-100, section: "1.0.2 id", depth: Partial}
    issues: [841, 915]
    verification:
      - {kind: integration-test, ref: "usage event id test"}
  - id: REQ-AUDIT-111
    area: AUDIT
    statement: "Every audit record MUST be an OCSF event of a core class of the pinned OCSF version."
    rationale: "A core class is read by any OCSF-aware tool, and sluis defines no class of its own."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "base event and core classes", depth: Full}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-112
    area: AUDIT
    statement: "A sluis field that the pinned OCSF version has no attribute for MUST be in the `unmapped.sluis` object and in no other part of `unmapped`."
    rationale: "One namespaced object keeps sluis facts together and apart from other sources, and the record needs no OCSF extension."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "unmapped", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-113
    area: AUDIT
    statement: "The writer MUST refuse an audit record whose `unmapped.sluis` object does not validate against the schema in its project's AuditCatalogue."
    rationale: "OCSF cannot type the object, so sluis's own schema must, and the writer stays authoritative (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1121, 1120]
    verification:
      - {kind: test-vectors, ref: "unmapped.sluis negative vectors through the writer"}
  - id: REQ-AUDIT-114
    area: AUDIT
    statement: "The build MUST generate the JSON Schema of the audit records, `unmapped.sluis` included, from the action table in code."
    rationale: "One source keeps the table, the schema and the generated types from drifting apart (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "generated schema equals the committed schema check in CI"}
  - id: REQ-AUDIT-115
    area: AUDIT
    statement: "The audit log MUST NOT hold a catalogue document or a schema entry."
    rationale: "The release identifies the action table, so a log needs no copy of it and no versioned document beside the records."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1121, 1120]
    verification:
      - {kind: integration-test, ref: "log content test: no catalogue object and no schema entry"}
  - id: REQ-AUDIT-116
    area: AUDIT
    statement: "An audit record MUST name the product that wrote it and its release in `metadata.product.name` and `metadata.product.version`."
    rationale: "The release and `metadata.event_code` identify the action table entry in force, so a record needs no catalogue field."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "metadata", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-117
    area: AUDIT
    statement: "An audit record MUST carry the boundary of its log in `metadata.log_name`."
    rationale: "A record taken out of its log must still say which boundary it belongs to."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "metadata", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-118
    area: AUDIT
    statement: "The writer MUST refuse an audit record whose `metadata.log_name` differs from the boundary of the log."
    rationale: "A record written to the wrong boundary's log would be misattributed for as long as the log is kept."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "metadata", depth: Partial}
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "boundary mismatch refusal test"}
  - id: REQ-AUDIT-119
    area: AUDIT
    statement: "The build MUST fail when a change to the schema of `unmapped.sluis` removes or retypes a field without a new major version of sluis."
    rationale: "Records are never rewritten, so a field has to keep its meaning for every record that carries it."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "unmapped.sluis compatibility check against the previous release in CI"}
  - id: REQ-AUDIT-120
    area: AUDIT
    statement: "An audit record MUST declare every OCSF profile whose attributes it uses in `metadata.profiles`."
    rationale: "OCSF validators refuse profile attributes that the record does not declare."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "profiles", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-121
    area: AUDIT
    statement: "An export of an audit log MUST be recorded as an Event Log Activity event with activity 3, Export."
    rationale: "OCSF has an Export activity for the event log, which fits better than an API Activity with activity 99."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "Event Log Activity", depth: Partial}
    issues: [839, 841]
    verification:
      - {kind: integration-test, ref: "audit export record test"}
  - id: REQ-AUDIT-122
    area: AUDIT
    statement: "A step-up of a session MUST be recorded as an Authentication Logon event with `is_mfa` true, the `session.uid` of the session and the `activity_name` \"Step-Up\"."
    rationale: "Authentication has no step-up activity, and the same session identifier joins the step-up to the sign-in it raises."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "authentication", depth: Partial}
    issues: [841]
    verification:
      - {kind: integration-test, ref: "step-up record test"}
  - id: REQ-AUDIT-123
    area: AUDIT
    statement: "An issued certificate MUST be recorded in `unmapped.sluis.certificate` and not in the `certificate` object of the event."
    rationale: "In OCSF 1.9.0 the `certificate` object of Authentication is a certificate that was presented, not one that was issued."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "certificate", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "certificate issue record test"}
  - id: REQ-AUDIT-124
    area: AUDIT
    statement: "An audit record MUST NOT use the `delegation` object or declare the `ai_operation` profile."
    rationale: "`delegation` exists only for AI operations and carries identifiers only, so the actor chain of an exchange is `actor`, `user` and `unmapped.sluis.actor_chain`."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-114, section: "delegation", depth: Partial}
    issues: [1120]
    verification:
      - {kind: test-vectors, ref: "action table example records through the OCSF schema validator"}
  - id: REQ-AUDIT-125
    area: AUDIT
    statement: "One log key per writer instance MUST sign the checkpoints of its project's audit log and usage log."
    rationale: "Both logs of a writer have one audience and one lifetime, so a second key would add a policy and a slot for nothing (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [914, 915]
    verification:
      - {kind: integration-test, ref: "the checkpoints of both log kinds of one writer verify against one public key, and those of two writers against two"}
  - id: REQ-AUDIT-126
    area: AUDIT
    statement: "Each signed batch head MUST name the log it belongs to, the audit log or the usage log."
    rationale: "With one log key, the name inside the signed head keeps a head of one log from being passed off as a head of the other."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-75, section: "1", depth: Partial}
    issues: [914, 915]
    verification:
      - {kind: test-vectors, ref: "a checkpoint of the usage log presented as a checkpoint of the audit log; refused"}
  - id: REQ-AUDIT-127
    area: AUDIT
    statement: "A pseudonym MUST be computed by key@ with Mac, HMAC-SHA384, under the tenant's pseudonym data key of its epoch."
    rationale: "A keyed function cannot be reversed from a list of subjects without the key (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [key]
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "pseudonym test vectors"}
  - id: REQ-AUDIT-128
    area: AUDIT
    statement: "An emitter MUST replace a subject with its pseudonym before the record leaves the emitting process."
    rationale: "No transport, spool or writer then holds a raw subject (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "spool and transport scan for raw subjects"}
  - id: REQ-AUDIT-129
    area: AUDIT
    statement: "The pseudonym key of a tenant MUST start a new epoch at the start of every UTC month."
    rationale: "Pseudonyms rotate so the operator's view links a person within a month only (REQ-AUDIT-038, ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "epoch change test with a moved clock"}
  - id: REQ-AUDIT-130
    area: AUDIT
    statement: "The reader MUST refuse to reverse a pseudonym for anyone without the tenant's reversal permission."
    rationale: "Only the tenant's own audit role may link a pseudonym to a subject (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "reversal by the installation operator; refused"}
  - id: REQ-AUDIT-131
    area: AUDIT
    statement: "Every reversal of a pseudonym MUST produce an audit record under the asking person's name."
    rationale: "A reversal is a use of personal data that must be visible (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: NC-06, section: "HMAC", depth: Partial}
    issues: [839]
    verification:
      - {kind: integration-test, ref: "reversal audit record test"}
  - id: REQ-AUDIT-132
    area: AUDIT
    statement: "A usage event MUST NOT carry a field that holds personal data."
    rationale: "Usage facts outlive the tenant's personal data, so they must hold none (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837, 915]
    verification:
      - {kind: test-vectors, ref: "a usage part with a pseudonym, a subject or free text is refused by the writer"}
  - id: REQ-AUDIT-133
    area: AUDIT
    statement: "A company's usage data key MUST be a different key from its audit data key."
    rationale: "Keys with different lifetimes are not shared (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [837]
    superseded_by: [REQ-AUDIT-150]
    verification:
      - {kind: integration-test, ref: "the audit key does not decrypt a usage entry, and the usage key does not decrypt an audit entry"}
  - id: REQ-AUDIT-134
    area: AUDIT
    statement: "Shredding a company's audit data key MUST NOT delete its usage data key."
    rationale: "Exit ends the personal data and keeps the evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [837, 973]
    superseded_by: [REQ-KEYS-036, REQ-KEYS-037, REQ-AUDIT-150]
    verification:
      - {kind: integration-test, ref: "after a shred the usage entries of the company are still readable by quota"}
  - id: REQ-AUDIT-135
    area: AUDIT
    statement: "A company's usage data key MUST be kept until the declared retention of the usage log ends for that company's entries."
    rationale: "A bill can be disputed until the billing retention ends (ADR 0029)."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [837, 1016]
    superseded_by: [REQ-KEYS-037]
    verification:
      - {kind: integration-test, ref: "a deletion of a usage key before its retention ends is refused"}
  - id: REQ-AUDIT-136
    area: AUDIT
    statement: "sluis config check MUST refuse, in a production boundary, a log retention below the floor of the compliance profile that the project declares in AuditLog, naming the profile."
    rationale: "A profile is a floor that the installation must not go below (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [840]
    verification:
      - {kind: test-vectors, ref: "installations with a retention below each profile floor"}
  - id: REQ-AUDIT-137
    area: AUDIT
    statement: "sluis config check MUST refuse, in a production boundary, a lock mode below the floor of the compliance profile that the project declares in AuditLog unless the witness that the profile allows in its place is declared."
    rationale: "A profile that demands an immutable log must not run on a removable one unwitnessed (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [840]
    verification:
      - {kind: test-vectors, ref: "installations with a lock below each profile floor"}
  - id: REQ-AUDIT-138
    area: AUDIT
    statement: "A transition of an audit object to a colder storage class MUST NOT change the object's lock or retention."
    rationale: "A tier saves cost and must never shorten evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [851, 837]
    verification:
      - {kind: conformance-suite, ref: "blob suite: a transitioned locked object keeps its lock"}
  - id: REQ-AUDIT-139
    area: AUDIT
    statement: "The checkpoints, the partial tiles and the hash tiles above level 0 of an audit log MUST stay in the hot storage class."
    rationale: "A proof and the newest entries must never wait for a retrieval (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "the rendered lifecycle rule names only entry bundles and level-0 tiles"}
  - id: REQ-AUDIT-140
    area: AUDIT
    statement: "The audit reader MUST answer a read of an object in a cold storage class with a pending state, not by holding the request until the retrieval ends."
    rationale: "A request must not hang for hours on an archive (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "a read of a cold object"}

  # ---- projects, evidence keys and access (decisions 0028 and 0029)
  - id: REQ-AUDIT-141
    area: AUDIT
    statement: "A project's writer MUST write only its own project's bucket and sign only with its own log key."
    rationale: "A flaw in one project's writer then cannot write or sign for another (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "the writer of project A attempts a put to project B's bucket and a sign with project B's log key; both refused"}
  - id: REQ-AUDIT-142
    area: AUDIT
    statement: "An audit piece MUST NOT write the billing prefix of a project's bucket."
    rationale: "The billing log is the product's and sluis neither builds nor reads it (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837, 915]
    verification:
      - {kind: integration-test, ref: "the credentials of every audit piece hold no write action on the billing prefix"}
  - id: REQ-AUDIT-143
    area: AUDIT
    statement: "Every credential that reaches a project's bucket MUST be scoped to that bucket and, for a person's direct read, to the prefixes of the log kinds that person was granted."
    rationale: "The blob store's own access control is the second of two independent checks on audit access (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837, 985]
    verification:
      - {kind: integration-test, ref: "a person granted usage reads usage/ and is refused audit/ and billing/ by the bucket policy"}
  - id: REQ-AUDIT-144
    area: AUDIT
    statement: "The reader MUST serve a call only under a grant that covers the call's project, log kind and tenant."
    rationale: "Cedar decides every call on project, log kind and tenant, and the grant is a mandatory filter of the query (ADR 0028, ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [reader]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "a search under a grant for tenant A returns no record of tenant B; a call naming another project is refused"}
  - id: REQ-AUDIT-145
    area: AUDIT
    statement: "The search index MUST be partitioned by project and log kind."
    rationale: "A partition is a boundary the index itself enforces, apart from the grant (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [indexer]
    standards: []
    issues: [839]
    verification:
      - {kind: integration-test, ref: "a query in one partition never returns a row of another"}
  - id: REQ-AUDIT-146
    area: AUDIT
    statement: "The writer MUST refuse a record whose release has no published AuditCatalogue."
    rationale: "The release identifies the action table, so a log needs no copy of it, and a record of an unknown release cannot be validated (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1121, 1120]
    verification:
      - {kind: integration-test, ref: "a record from a release whose catalogue is not published is quarantined"}
  - id: REQ-AUDIT-147
    area: AUDIT
    statement: "The build MUST publish the AuditCatalogue document of a release, together with its schemas, before that release emits."
    rationale: "A product release then needs no writer upgrade (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "a release pipeline run publishes the catalogue document and the writer validates the first record of the release"}
  - id: REQ-AUDIT-148
    area: AUDIT
    statement: "The writer MUST refuse a record whose metadata.product.name its project does not declare."
    rationale: "A project's log must hold only the records of the product that the AuditLog declares for it (ADR 0030)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1121]
    verification:
      - {kind: integration-test, ref: "a record naming a product the project does not declare is refused"}
  - id: REQ-AUDIT-149
    area: AUDIT
    statement: "The audit pieces MUST read AuditLog, AuditWitnesses and AuditCatalogue through the data port as config kinds that store@ loads and verifies."
    rationale: "Under the foundation audit already depends on store@, so a loader of its own buys no independence (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "an audit piece starts with a changed AuditLog and receives it from store@ on the snapshot swap"}
  - id: REQ-AUDIT-150
    area: AUDIT
    statement: "The writer MUST have key@ seal every audit and usage entry under the tenant's evidence key and never under its data key."
    rationale: "Evidence never shares a key with personal data and outlives it, so an exit deletes everything personal and keeps the evidence (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [837]
    verification:
      - {kind: integration-test, ref: "the data key of the tenant does not open an entry; the evidence key does"}
      - {kind: integration-test, ref: "after the tenant's exit the entries still open under the evidence key until the evidence retention ends"}
  - id: REQ-AUDIT-159
    area: AUDIT
    statement: "The writer MUST ask `policy` for a grant for each batch of one tenant's records before key@ seals the batch."
    rationale: "No caller brings a grant to the writer, so it asks for its own and key@ checks it like any other (ADR 0029, ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "a batch sealed without a grant, or with a grant for another tenant, is refused at key@"}
  - id: REQ-AUDIT-160
    area: AUDIT
    statement: "The indexer MUST open a record at key@ only under a grant that it asks `policy` for on each pass."
    rationale: "The indexer runs with no caller, so its pass carries its own grant, and it may open and never seal (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [indexer]
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "an indexer pass with an expired grant, or with none, opens nothing; a Seal by the indexer is refused"}
  - id: REQ-AUDIT-151
    area: AUDIT
    statement: "The key@ rules MUST let the writer Seal under the evidence key and give it no Open."
    rationale: "A writer that cannot decrypt what it wrote holds nothing to leak (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [key]
    standards: []
    issues: [837]
    verification:
      - {kind: test-vectors, ref: "the generated key rules matrix: writer has seal on evidence and no open"}
      - {kind: integration-test, ref: "the writer asks key@ to Open an entry; refused"}
  - id: REQ-AUDIT-152
    area: AUDIT
    statement: "A record that concerns no tenant MUST be sealed under the evidence key of the operator's own tenant."
    rationale: "Every sealed entry has a tenant key, and the operator's company is a tenant (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "a machine-plane record is sealed under the operator tenant's evidence key"}
  - id: REQ-AUDIT-153
    area: AUDIT
    statement: "A reader that opens an entry MUST check that the clear envelope agrees with the record."
    rationale: "A writer that lies in the envelope is then caught by the first reader that opens the record (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [reader]
    standards: []
    issues: [1218]
    verification:
      - {kind: test-vectors, ref: "entries whose envelope differs from the record in one field each are reported"}
  - id: REQ-AUDIT-154
    area: AUDIT
    statement: "In audit alone a record for a tenant the boundary does not know MUST be held in the transport and raise an alarm."
    rationale: "A mistyped tenant id must never create a tenant (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [writer]
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "a record for an unpushed tenant stays in the queue and an alarm is raised; after the push it is written"}
  - id: REQ-AUDIT-155
    area: AUDIT
    statement: "In audit alone the reader MUST verify a search token against the issuer that config declares as the trusted token source."
    rationale: "Policy decides from the token's claims, so the token's source must be one the operator chose (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [reader]
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "a token from an undeclared issuer is refused; one from the declared issuer yields a grant"}
  - id: REQ-AUDIT-156
    area: AUDIT
    statement: "In audit alone the push of a tenant by a product MUST be idempotent by request id."
    rationale: "A product retries a push until it succeeds, and a repeat must change nothing (ADR 0028)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1218]
    verification:
      - {kind: integration-test, ref: "the same push twice creates one tenant and one set of data keys"}

  # ---- the time of a usage fact (decision 0040)
  - id: REQ-AUDIT-157
    area: AUDIT
    statement: "A usage fact MUST count at its time of use when that time is not earlier than the recorded time by more than 72 hours and not later by more than 5 minutes, and otherwise at its recorded time."
    rationale: "A wrong clock, or a replay of old events, cannot place usage in a span it was not used in (ADR 0040)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [841, 915]
    verification:
      - {kind: test-vectors, ref: "time rule vectors at 72 hours back, 5 minutes forward and one second beyond each"}
  - id: REQ-AUDIT-158
    area: AUDIT
    statement: "A reader MUST mark a fact that it counts at its recorded time as time_adjusted."
    rationale: "A fact moved by the rule shows as moved (ADR 0040)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [841, 915]
    verification:
      - {kind: integration-test, ref: "a fact outside the bounds is counted at its recorded time and flagged"}
