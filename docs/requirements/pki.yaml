  - id: REQ-PKI-050
    area: PKI
    statement: "The key install command MUST refuse an answer whose trust sequence is higher than the sequence of the root list it holds."
    rationale: "A list older than the answer may lack the root that signed it, so the chain could not be checked against current anchors."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [1066]
