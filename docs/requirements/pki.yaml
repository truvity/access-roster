  - id: REQ-PKI-051
    area: PKI
    statement: "The key request command MUST write one back-signature for every active primary of the root list it holds in an OpenPGP subkey request, and name those primaries in the proof."
    rationale: "Either root card can then bind the subkey with no second request."
    level: MUST
    source: design-decision
