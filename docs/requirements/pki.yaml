  - id: REQ-PKI-049
    area: PKI
    statement: "A published certificate revocation list MUST carry a nextUpdate no later than seven days after its thisUpdate."
    rationale: "A relying party that misses a day of fetches keeps a valid list (ADR 0042)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
