# SSH: SSH certificates
schema: 1
area: SSH
requirements:
  - id: REQ-SSH-001
    area: SSH
    statement: "sluis MUST issue SSH user certificates that are short-lived."
    rationale: "Short-lived certificates remove authorised_keys sprawl."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    issues: [925]
    verification:
      - {kind: test-vectors, ref: "OpenSSH regress tests"}
      - {kind: integration-test, ref: "lifetime test"}
  - id: REQ-SSH-005
    area: SSH
    split_from: REQ-SSH-001
    statement: "An SSH user certificate MUST carry the permitted principals."
    rationale: "Principals bind the certificate to accounts."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    issues: [925]
    verification:
      - {kind: integration-test, ref: "sshd acceptance test"}
  - id: REQ-SSH-006
    area: SSH
    split_from: REQ-SSH-001
    statement: "An SSH user certificate MUST have restricted critical options."
    rationale: "Unrestricted options widen what a certificate allows."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    issues: [925]
    verification:
      - {kind: integration-test, ref: "critical-options test"}
  - id: REQ-SSH-002
    area: SSH
    statement: "sluis MUST issue SSH host certificates."
    rationale: "Host certificates remove trust-on-first-use."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    issues: [925]
    verification:
      - {kind: integration-test, ref: "sshd acceptance test"}
  - id: REQ-SSH-007
    area: SSH
    split_from: REQ-SSH-002
    statement: "Documented host setup MUST use an authorised-principals file so that principals map to accounts."
    rationale: "Host certificates remove trust-on-first-use."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: no-attestation
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-65, section: "1", depth: Full}
    issues: [925, 971]
    manual_reason: "A statement in the documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-SSH-003
    area: SSH
    statement: "sluis MUST publish an SSH key revocation list in the OpenSSH binary format."
    rationale: "Hosts need a revocation source."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-66, section: "1", depth: Full}
    issues: [925, 971]
    verification:
      - {kind: integration-test, ref: "ssh-keygen -Qf check"}
  - id: REQ-SSH-004
    area: SSH
    statement: "An operator MAY run an OpenPubkey-style SSH sign-in next to sluis, but sluis does not provide one."
    rationale: "v1 offered this mode; v2 uses sluis's own SSH CA only, so it is not carried over."
    level: MAY
    source: v1-parity
    status: out-of-scope
    runtimes: all
    standards:
      - {id: NC-07, section: "OpenPubkey", depth: Full}
      - {id: ST-28, section: "2", depth: Partial}
    issues: [825]
    verification:
      - {kind: integration-test, ref: "opkssh integration test"}
  - id: REQ-SSH-008
    area: SSH
    statement: "A host MUST refuse a list of SSH CA keys that is not signed by a root it trusts."
    rationale: "An SSH CA key is an anchor with no chain, and the signed list is its provenance."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal", "kubernetes"]
    standards: []
    issues: [1072]
    verification:
      - {kind: test-vectors, ref: "T-23: a list of SSH CA keys signed by an unknown key, and one with a lower sequence; both refused"}
  - id: REQ-SSH-009
    area: SSH
    statement: "sluis-host MUST refresh the signed list of SSH CA keys at an interval that the documentation states."
    rationale: "A key revocation list cannot name certificates nobody knows exist, so the replacement of the CA key is the only remedy and it must reach hosts in a known time (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1369]
    runtimes: ["bare-metal", "kubernetes"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a moved clock: the list is fetched at the stated interval"}
  - id: REQ-SSH-010
    area: SSH
    statement: "sluis-host MUST raise an alert when its copy of the list of SSH CA keys is older than twice the refresh interval."
    rationale: "A host that cannot reach the list does not learn of a replaced CA key (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1369]
    runtimes: ["bare-metal", "kubernetes"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a moved clock: the alert fires at twice the interval"}
