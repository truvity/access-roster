# POLICY: Policy
schema: 1
area: POLICY
requirements:
  - id: REQ-POLICY-001
    area: POLICY
    statement: "sluis MUST validate the policy document against its schema at load."
    rationale: "A misread policy is an authorization bug."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [786, 846]
    verification:
      - {kind: test-vectors, ref: "JSON-Schema-Test-Suite"}
  - id: REQ-POLICY-005
    area: POLICY
    split_from: REQ-POLICY-001
    statement: "sluis MUST refuse to start on a policy violation, with an error that names the offending path."
    rationale: "A misread policy is an authorization bug."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: ST-96, section: "2020-12", depth: Full}
    issues: [786, 846]
    verification:
      - {kind: integration-test, ref: "load-refusal tests"}
  - id: REQ-POLICY-002
    area: POLICY
    statement: "A request MUST be denied unless a policy grant explicitly allows it."
    rationale: "Deny by default is the base of least privilege."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [786, 787]
    verification:
      - {kind: integration-test, ref: "policy tests (allow, deny)"}
  - id: REQ-POLICY-006
    area: POLICY
    split_from: REQ-POLICY-002
    statement: "Grant names MUST follow the declared vocabulary, with wildcards matching only where the vocabulary allows."
    rationale: "Deny by default is the base of least privilege."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [786, 787]
    verification:
      - {kind: integration-test, ref: "policy tests (wildcard)"}
      - {kind: test-vectors, ref: "policy corpus"}
  - id: REQ-POLICY-003
    area: POLICY
    statement: "The policy engine MUST evaluate a policy language with a published grammar and a corpus of conformance cases."
    rationale: "A decision engine that fails open is a bypass."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Full}
    issues: [892, 852]
    verification:
      - {kind: test-vectors, ref: "policy-language corpus"}
  - id: REQ-POLICY-007
    area: POLICY
    split_from: REQ-POLICY-003
    statement: "The policy engine MUST fail closed when it cannot evaluate."
    rationale: "A decision engine that fails open is a bypass."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Full}
    issues: [892, 852]
    verification:
      - {kind: integration-test, ref: "fail-closed test"}
  - id: REQ-POLICY-004
    area: POLICY
    statement: "A change to policy that weakens a recorded assurance rule, adds an exchange grant or widens a sector MUST require an approval attestation from a second person."
    rationale: "Risky changes need two people."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-49, section: "7", depth: Partial}
    issues: [1052]
    verification:
      - {kind: integration-test, ref: "attestation tests"}
      - {kind: manual, ref: "process review"}
  - id: REQ-POLICY-008
    area: POLICY
    statement: "A policy snapshot that fails validation on reload MUST be refused while the policy in force stays."
    rationale: "A bad policy must never replace a good one."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Partial}
    issues: [977, 892]
    verification:
      - {kind: integration-test, ref: "policy reload refusal test"}
  - id: REQ-POLICY-009
    area: POLICY
    statement: "A template-linked policy MUST be refused unless the declared delegation policy allows that link."
    rationale: "Links made on the console stay within reviewed bounds."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards:
      - {id: NC-12, section: "Cedar", depth: Partial}
    issues: [892]
    verification:
      - {kind: integration-test, ref: "delegation bound test"}
  - id: REQ-POLICY-010
    area: POLICY
    statement: "The loader MUST refuse a grant name that the installation's vocabulary does not declare."
    rationale: "A typo then stops the load instead of granting nothing or the wrong thing (ADR 0020)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [892]
    verification:
      - {kind: integration-test, ref: "a policy file, a client requires and a binding each naming an undeclared grant are refused with the path"}
  - id: REQ-POLICY-011
    area: POLICY
    statement: "A wildcard in a group binding MUST NOT expand into a sensitive scope."
    rationale: "A sensitive scope is named in full or not granted."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [892]
    verification:
      - {kind: integration-test, ref: "a wildcard over scopes does not reach a scope marked sensitive"}
  - id: REQ-POLICY-012
    area: POLICY
    statement: "The loader MUST refuse a wildcard outside the scope or thing position of a group binding, and a wildcard that expands to nothing."
    rationale: "A wildcard in requires, a claim, a lifetime or the role position would grant or admit by pattern."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [892]
    verification:
      - {kind: integration-test, ref: "each misplaced wildcard and an empty expansion are refused"}
  - id: REQ-POLICY-013
    area: POLICY
    statement: "An installation MUST declare a GrantVocabulary config document."
    rationale: "Without one a name nobody declared would load, and a typo would grant nothing or the wrong thing (ADR 0020)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [892]
    verification:
      - {kind: integration-test, ref: "a config set without a vocabulary is refused by sluis config check"}

  # ---- sealed grants and policy layers (decisions 0007 and 0020)
  - id: REQ-POLICY-015
    area: POLICY
    statement: "key@ MUST seal a grant only for the policy actor."
    rationale: "Only policy decides, so only its decisions may be sealed as grants (ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "any other actor asks key@ to seal a grant; refused"}
  - id: REQ-POLICY-016
    area: POLICY
    statement: "An actor that carries out a one-shot irreversible action MUST write the hash of its grant as a SpentGrant by a conditional create."
    rationale: "A grant is reusable for about a minute, and a one-shot action must run once (ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "two uses of one grant for a mint or a signature: the second finds the marker and is refused"}
  - id: REQ-POLICY-017
    area: POLICY
    statement: "The effective policy of a regulated customer's boundary MUST combine the publisher's Policy and the RegulatedPartyPolicy by union with forbid wins."
    rationale: "Neither party can change the policy alone, and a forbid of either holds (ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards: []
    features: ["design"]
    verification:
      - {kind: test-vectors, ref: "combine vectors: a forbid in the RegulatedPartyPolicy overrides a permit in the Policy, and the reverse"}
  - id: REQ-POLICY-018
    area: POLICY
    statement: "A link of a predefined policy that grants beyond config MUST be written to the temp kind PredefinedPolicyLinkTemporary, which expires within 24 hours."
    rationale: "Linking break-glass is a loosening, and a run-time loosening carries an expiry (ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a break-glass link is written as a temp item that expires in 1 hour by default and is refused at 25 hours"}
  - id: REQ-POLICY-019
    area: POLICY
    statement: "`policy` MUST recompile its effective policy set when the set changes."
    rationale: "A tightening takes effect at once (ADR 0007)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    actors: [policy]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a PredefinedPolicyLink is written; the next decision uses the recompiled set"}
