# A11Y: Accessibility
schema: 1
area: A11Y
requirements:
  - id: REQ-A11Y-001
    area: A11Y
    statement: "Hosted pages MUST meet WCAG 2.1 level AA."
    rationale: "Accessibility is a legal and ethical baseline."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1 AA", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "automated accessibility checks"}
      - {kind: manual, ref: "manual audit"}
  - id: REQ-A11Y-002
    area: A11Y
    statement: "A sign-in path that does not need a smartphone MUST exist, such as a roaming security key."
    rationale: "Not everyone has a phone."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
      - {id: NC-04, section: "WCAG 2.1 AA", depth: Partial}
    manual_reason: "Availability of a non-smartphone path is established by a walkthrough by people."
    issues: [885]
    verification:
      - {kind: manual, ref: "path walkthrough"}
  - id: REQ-A11Y-003
    area: A11Y
    statement: "The operator console MUST meet WCAG 2.1 level AA, checked by automated tests in CI for every screen."
    rationale: "REQ-A11Y-001 names the hosted pages; the console is the larger surface (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1 AA", depth: Full}
    issues: [796, 831]
    verification:
      - {kind: integration-test, ref: "axe checks and keyboard and focus scenarios in every browser scenario, at 390 and 1440 pixels"}
      - {kind: manual, ref: "manual audit of the console"}
