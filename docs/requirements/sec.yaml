# SEC: Security hardening
schema: 1
area: SEC
requirements:
  - id: REQ-SEC-001
    area: SEC
    statement: "A library that verifies tokens MUST pin the expected algorithm."
    rationale: "These are the failures of real token verifiers."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-52, section: "7", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    issues: [830, 869]
    verification:
      - {kind: test-vectors, ref: "JWT BCP negative vectors"}
  - id: REQ-SEC-012
    area: SEC
    split_from: REQ-SEC-001
    statement: "A library that verifies tokens MUST reject alg none and algorithm confusion."
    rationale: "These are the failures of real token verifiers."
    level: MUST
    source: standard
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-52, section: "7", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    issues: [830, 869]
    verification:
      - {kind: test-vectors, ref: "JWT BCP negative vectors"}
  - id: REQ-SEC-013
    area: SEC
    split_from: REQ-SEC-001
    statement: "A library that verifies tokens MUST verify typ, iss and aud."
    rationale: "These are the failures of real token verifiers."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-56, section: "3", depth: Full}
      - {id: ST-52, section: "7", depth: Full}
      - {id: ST-49, section: "5", depth: Full}
    issues: [830, 869]
    verification:
      - {kind: test-vectors, ref: "JWT BCP negative vectors"}
      - {kind: test-vectors, ref: "RFC 7520 cookbook"}
  - id: REQ-SEC-002
    area: SEC
    statement: "sluis MUST pass a review against every recommendation of the OAuth security best current practice before a release."
    rationale: "A checklist pass closes the gap between intent and behaviour."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "2-4", depth: Full}
    issues: [775, 777, 782]
    gap: attestation-missing
    manual_reason: "A checklist review is the requirement; the tests it maps to are listed in the next requirement."
    verification:
      - {kind: manual, ref: "checklist review"}
  - id: REQ-SEC-014
    area: SEC
    split_from: REQ-SEC-002
    statement: "Each recommendation of the OAuth security best current practice MUST map to a test."
    rationale: "A checklist pass closes the gap between intent and behaviour."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-14, section: "2-4", depth: Full}
    issues: [775, 777, 782]
    verification:
      - {kind: integration-test, ref: "one test per recommendation"}
  - id: REQ-SEC-003
    area: SEC
    statement: "A state-changing endpoint MUST check that a present Origin header is in the endpoint's exact allow-list."
    rationale: "Same-site sibling origins are not trusted."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-05, section: "Fetch Metadata", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "web origin matrix"}
  - id: REQ-SEC-015
    area: SEC
    split_from: REQ-SEC-003
    statement: "A state-changing endpoint MUST refuse Sec-Fetch-Site other than same-origin."
    rationale: "Same-site sibling origins are not trusted."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-05, section: "Fetch Metadata", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "Sec-Fetch-Site matrix"}
  - id: REQ-SEC-016
    area: SEC
    split_from: REQ-SEC-003
    statement: "A state-changing endpoint MUST require a CSRF token when neither header is present."
    rationale: "Same-site sibling origins are not trusted."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-05, section: "Fetch Metadata", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "CSRF token test"}
  - id: REQ-SEC-004
    area: SEC
    statement: "Every page MUST be sent with a restrictive content security policy, HSTS with includeSubDomains, no-referrer, nosniff and frame-ancestors none."
    rationale: "Browser headers are the second line of defence."
    level: MUST
    source: v1-parity
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: NC-05, section: "CSP/HSTS", depth: Full}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "header test per page kind"}
  - id: REQ-SEC-005
    area: SEC
    statement: "The endpoint that lists a caller's grants MUST list only clients and presets that the caller's groups admit."
    rationale: "A grant list is an information disclosure."
    level: MUST
    source: security-review
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [774]
    verification:
      - {kind: integration-test, ref: "grant-visibility test"}
  - id: REQ-SEC-006
    area: SEC
    statement: "Authentication, token and recovery endpoints MUST be rate-limited per account, factor and source, with a progressive delay."
    rationale: "Throttling stops guessing; global lock-out is a denial of service."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "rate-limit test"}
  - id: REQ-SEC-017
    area: SEC
    split_from: REQ-SEC-006
    statement: "Authentication, token and recovery endpoints MUST NOT apply a global lock-out."
    rationale: "A global lock-out is a denial of service."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "no-global-lockout test"}
  - id: REQ-SEC-007
    area: SEC
    statement: "Fuzz targets MUST exist for authorization and token parameter parsing, token and signature parsing, WebAuthn response handling and policy loading."
    rationale: "Parsers fail on unexpected inputs."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-49, section: "7515", depth: Partial}
    issues: [796, 958]
    verification:
      - {kind: integration-test, ref: "fuzz corpus in CI"}
  - id: REQ-SEC-008
    area: SEC
    statement: "Cryptographic primitives and protocol parsers MUST come from approved, maintained libraries."
    rationale: "Home-made crypto is the main risk."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [1039]
    verification:
      - {kind: manual, ref: "dependency lint"}
      - {kind: integration-test, ref: "vulnerability scan"}
  - id: REQ-SEC-018
    area: SEC
    split_from: REQ-SEC-008
    statement: "sluis MUST NOT implement its own cryptographic primitives or protocol parsers."
    rationale: "Home-made crypto is the main risk."
    level: MUST
    source: standard
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [1039]
    verification:
      - {kind: manual, ref: "dependency lint"}
      - {kind: integration-test, ref: "TestCheckpointsVerifyWithTheTransparencyDevVerifier: audit-log checkpoints open with the transparency-dev reference; fuzz targets in cli/sluis and writerd"}
      - {kind: test-vectors, ref: "RFC 8785 corpus of the RFC's author, identical bytes in Go and Rust"}
  - id: REQ-SEC-009
    area: SEC
    statement: "A threat model and its negative tests MUST exist before code is merged for the authentication, federation, exchange and administration surfaces."
    rationale: "Independent tests find different bugs."
    level: MUST
    source: security-review
    status: partial
    milestone: first-version
    gap: attestation-missing
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [1040]
    manual_reason: "The rule governs the review process and is evidenced by review records."
    verification:
      - {kind: manual, ref: "review evidence"}
  - id: REQ-SEC-019
    area: SEC
    split_from: REQ-SEC-009
    statement: "The negative tests of a surface MUST be written by someone other than the code's author."
    rationale: "Independent tests find different bugs."
    level: MUST
    source: security-review
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [1040]
    manual_reason: "The rule governs who writes tests and is evidenced by review records."
    verification:
      - {kind: manual, ref: "review evidence"}
  - id: REQ-SEC-010
    area: SEC
    statement: "An administrative surface MUST NOT be reachable on the public listener."
    rationale: "Operator doors do not belong on the internet."
    level: MUST
    source: security-review
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [958, 960]
    verification:
      - {kind: integration-test, ref: "404 on public listener"}
  - id: REQ-SEC-011
    area: SEC
    statement: "Tokens of one installation MUST NOT be accepted by another installation's token endpoint, introspection or exchange, except in an exchange with an issuer that the installation lists in its ExchangeTrust (REQ-EXCH-006)."
    rationale: "Cross-installation replay breaks isolation, and a declared trust of one operator is the one way across (ADR 0008)."
    level: MUST
    source: standard
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-52, section: "7", depth: Full}
      - {id: ST-56, section: "3", depth: Full}
    issues: [962]
    verification:
      - {kind: integration-test, ref: "cross-installation negative cases: exchange refuses an issuer that is not in ExchangeTrust, the token endpoint refuses a refresh token it never issued, and /introspect is an unrouted path"}
  - id: REQ-SEC-020
    area: SEC
    statement: "sluis MUST bound the sign-in starts of each connection with a token bucket kept in its state."
    rationale: "One tenant's burst must cost that tenant (ADR 0036)."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "burst test on two connections"}
  - id: REQ-SEC-021
    area: SEC
    statement: "sluis MUST bound the token requests of each client with a token bucket kept in its state."
    rationale: "One client's loop must not use another's capacity."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "burst test on two clients"}
  - id: REQ-SEC-022
    area: SEC
    statement: "sluis MUST bound the pending sign-in records of one source address."
    rationale: "One source must not fill the state with unfinished sign-ins."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [916]
    superseded_by: [REQ-SESS-047]
    verification:
      - {kind: integration-test, ref: "pending cap per source test"}
  - id: REQ-SEC-023
    area: SEC
    statement: "A pending sign-in record MUST expire within 10 minutes."
    rationale: "Unfinished sign-ins must not accumulate."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards: []
    issues: [916]
    superseded_by: [REQ-SESS-049]
    verification:
      - {kind: integration-test, ref: "expiry test with a moved clock"}
  - id: REQ-SEC-024
    area: SEC
    statement: "A request refused by a limit MUST receive status 429 with a Retry-After header."
    rationale: "A client needs to know when to retry."
    level: MUST
    source: design-decision
    status: partial
    milestone: ciam-upstream
    gap: partly-built
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "limit refusal response test"}
  - id: REQ-SEC-025
    area: SEC
    statement: "sluis config check MUST warn when an internet-facing production installation declares no edge."
    rationale: "Volumetric protection is the edge's, and an installation without one is exposed."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "config check warning test"}
  - id: REQ-SEC-026
    area: SEC
    statement: "An open circuit breaker of a connection MUST refuse its new sign-ins with UNAVAILABLE without calling the upstream."
    rationale: "A failing upstream must not hold the adapter's workers."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards: []
    issues: [916]
    verification:
      - {kind: integration-test, ref: "breaker test with a failing upstream"}

  # ---- rate windows (decision 0036)
  - id: REQ-SEC-027
    area: SEC
    statement: "The entry actor MUST key a rate window on a keyed hash of the source address made at key@ with the mac purpose."
    rationale: "A window keyed on a plain address would be personal data in a temp kind (ADR 0036)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [entry]
    standards: []
    issues: [1215]
    verification:
      - {kind: integration-test, ref: "a RateWindow id is a Mac output; the source address is not in the item"}
  - id: REQ-SEC-028
    area: SEC
    statement: "A tenant MUST NOT raise a rate limit above the RateBound that config declares."
    rationale: "A tenant may lower the rate limits of its own clients and never raise them past the bound (ADR 0036)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1207]
    verification:
      - {kind: integration-test, ref: "a TenantClient write that raises each rate in turn is refused"}
  - id: REQ-SEC-029
    area: SEC
    statement: "A DNS CAA record that carries the operator's account URI MUST restrict certificate issuance for every issuer host."
    rationale: "Issuance by an unintended authority is the main impersonation path."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-13, section: "8657", depth: Full}
    issues: [1063]
    verification:
      - {kind: integration-test, ref: "CAA record check"}
  - id: REQ-SEC-030
    area: SEC
    statement: "Certificate Transparency logs MUST be monitored for certificates of every issuer host."
    rationale: "Monitoring finds certificates that the operator did not request."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-13, section: "8657", depth: Partial}
    issues: [1063]
    verification:
      - {kind: integration-test, ref: "CT monitor test"}
  - id: REQ-SEC-031
    area: SEC
    statement: "A certificate for an issuer host that the operator did not request MUST be treated as an incident."
    rationale: "It signals an impersonation attempt."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: NC-13, section: "8657", depth: Partial}
    issues: [1063]
    verification:
      - {kind: integration-test, ref: "CT monitor incident test"}
  - id: REQ-SEC-032
    area: SEC
    statement: "key@ MUST raise an alert when the grant for a customer-account tenant is lost."
    rationale: "A revoked grant stops a tenant, so an operator has to know at once and must not work around it (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "revoke a grant: an alert fires within the alert interval"}
  - id: REQ-SEC-033
    area: SEC
    statement: "key@ MUST write an audit record when the grant for a customer-account tenant is lost."
    rationale: "The customer's kill switch is an audit fact (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "revoke a grant: one audit record names the tenant and the time"}
  - id: REQ-SEC-034
    area: SEC
    statement: "A key revocation MUST write an audit record that names the keys, the reason and the operator."
    rationale: "A revocation is the most urgent event for a key, and it must be on record, with the node that took it and the uid that delivered it; a fact whose emit is lost is not sent again yet (ADR 0041)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    issues: [1362]
    runtimes: all
    actors: [key]
    standards: []
    verification:
      - {kind: integration-test, ref: "revoke a key: one audit record names the key, the reason and the operator, the publisher key that signed the declaration"}
  - id: REQ-SEC-035
    area: SEC
    statement: "An alarm MUST be raised when the key service records a signature or an unwrap by a principal other than key@, or more signatures for a key than the audit log records."
    rationale: "The use of a stolen key outside key@ is otherwise invisible (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1370]
    runtimes: [serverless, kubernetes]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a key service log fixture with a call by another principal, and one with extra signatures: both raise the alarm"}
  - id: REQ-SEC-036
    area: SEC
    statement: "A key revocation MUST raise an alert that names the keys, the reason and the operator."
    rationale: "The people who answer a compromise must see it at once (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a key: an alert within the alert interval names the key, the reason and the operator"}
  - id: REQ-SEC-037
    area: SEC
    statement: "A development boundary MUST refuse an http issuer, upstream issuer or key-set URL whose host is not the loopback IP literal 127.0.0.1 or [::1]."
    rationale: "Plain HTTP is a development difference, and only the loopback literals keep it on the host (ADR 0011)."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-04, section: "8.3", depth: Partial}
    tests: [actors/store/tests/config.rs, actors/adapter-upstream-oidc/internal/oidc/egress_test.go, actors/exchange/internal/exchanged/unit_test.go]
    verification:
      - {kind: integration-test, ref: "a development set with an http URL off loopback (a name, localhost, another address) is refused at load, and the adapter's and exchange's fetch checks refuse it"}
