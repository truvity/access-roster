# UX: Pages and user experience
schema: 1
area: UX
requirements:
  - id: REQ-UX-001
    area: UX
    statement: "A refusal shown to a user MUST show only a generic message and a request identifier."
    rationale: "Detailed reasons help an attacker."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "page-text assertion"}
  - id: REQ-UX-006
    area: UX
    split_from: REQ-UX-001
    statement: "The reason for a refusal MUST be written to the audit record only."
    rationale: "Detailed reasons help an attacker."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "an error from an actor leaves the reason in the audit record of the refusal and no trace of it in the response body"}
  - id: REQ-UX-002
    area: UX
    statement: "Every page MUST be rendered from a template with message catalogues."
    rationale: "Sign-in pages are user interface."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [779, 796]
    verification:
      - {kind: integration-test, ref: "catalogue coverage test"}
  - id: REQ-UX-007
    area: UX
    split_from: REQ-UX-002
    statement: "The supported locales MUST be configurable."
    rationale: "Sign-in pages are user interface."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [779, 796]
    verification:
      - {kind: integration-test, ref: "locale selection tests"}
  - id: REQ-UX-003
    area: UX
    statement: "A client MUST name a theme from the declared set."
    rationale: "Branding without free-form injection."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [927]
    superseded_by: [REQ-UX-015, REQ-UX-016]
    verification:
      - {kind: integration-test, ref: "theme declaration test"}
  - id: REQ-UX-008
    area: UX
    split_from: REQ-UX-003
    statement: "An unknown theme MUST be refused at load."
    rationale: "Branding without free-form injection."
    level: MUST
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [927]
    superseded_by: [REQ-UX-015]
    verification:
      - {kind: integration-test, ref: "theme load test"}
  - id: REQ-UX-004
    area: UX
    statement: "Credential and consent pages MUST name the requesting client and the account controller."
    rationale: "Users must see who asks."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [794]
    verification:
      - {kind: integration-test, ref: "page text test"}
  - id: REQ-UX-005
    area: UX
    statement: "Hosted pages MUST carry stable machine-readable hooks for test drivers: page kind, field names and action markers."
    rationale: "Tests need stable selectors."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: NC-04, section: "WCAG 2.1", depth: Partial}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "hook contract test"}
  - id: REQ-UX-009
    area: UX
    statement: "A console request that changes anything MUST be refused for a person who holds the viewer role only."
    rationale: "The viewer role reads and cannot write (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 832]
    verification:
      - {kind: integration-test, ref: "every write endpoint called by a viewer"}
  - id: REQ-UX-010
    area: UX
    statement: "Every console page that shows a configured value MUST show its storage class and profile and, for a layered kind, its provenance."
    rationale: "An operator must see why a field cannot be changed and where it comes from (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "each page's data carries class, profile and provenance"}
  - id: REQ-UX-011
    area: UX
    statement: "A console role MUST be a grant of the declared vocabulary that the console has no action to assign."
    rationale: "Authority is declared only (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "an attempt to bind a console role from the console"}
  - id: REQ-UX-012
    area: UX
    statement: "The locale of a page MUST be chosen from ui_locales, then the product default, then Accept-Language, then English."
    rationale: "The request carries the best signal of a person's language (ADR 0035)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [927]
    verification:
      - {kind: integration-test, ref: "locale order test"}
  - id: REQ-UX-013
    area: UX
    statement: "A Branding document and a TenantBranding write MUST be refused when their colours fall below the WCAG AA contrast ratio."
    rationale: "Hosted pages must meet WCAG 2.1 AA whatever the theme."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: NC-04, depth: Partial}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "contrast check on a failing and a passing theme, at load and at write"}
  - id: REQ-UX-014
    area: UX
    statement: "sluis MUST NOT serve a stylesheet, script or template that comes from a client or a tenant."
    rationale: "A tenant could otherwise rebuild a page into a phishing page on a sluis web origin."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [927]
    verification:
      - {kind: integration-test, ref: "theme with markup or a stylesheet is refused"}
  - id: REQ-UX-015
    area: UX
    statement: "A brand asset MUST be served only from an asset host that the Branding bound allows."
    rationale: "Branding without free-form injection (ADR 0035)."
    level: MUST
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards: []
    issues: [927]
    verification:
      - {kind: integration-test, ref: "a TenantBranding write with an unknown asset host is refused; a Branding document with one fails the load"}
  - id: REQ-UX-016
    area: UX
    statement: "A tenant client MUST name only a FrontHost entry that its client template allows."
    rationale: "The login domain per client is a reviewed config kind (ADR 0035)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [927]
    verification:
      - {kind: integration-test, ref: "a tenant client that names a host outside the allowed FrontHost entries is refused; a client that names none is served on the entry named default"}
  - id: REQ-UX-017
    area: UX
    statement: "TenantBranding MUST be written by exchange only."
    rationale: "exchange owns what a tenant has configured, and the console routes the write (ADR 0035)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [927]
    verification:
      - {kind: integration-test, ref: "a write of TenantBranding by any other actor is refused"}
  - id: REQ-UX-018
    area: UX
    statement: "A console read that computes or enumerates what another person may do or hold MUST be refused to a viewer."
    rationale: "v1 Explain was open to every viewer for five weeks before it was restricted (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 960]
    verification:
      - {kind: integration-test, ref: "every R2 method called by a viewer is refused"}
  - id: REQ-UX-022
    area: UX
    statement: "A console read that computes or enumerates what another person may do or hold MUST be audited under the operator's name with the subject."
    rationale: "An operator's look-up of another person's access must itself be on the trail (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 960]
    verification:
      - {kind: integration-test, ref: "every R2 method called by an operator leaves an audit record that names the operator and the subject"}
  - id: REQ-UX-019
    area: UX
    statement: "A console request for a record outside the caller's scope MUST be answered exactly as a request for a record that does not exist, before any check of role."
    rationale: "A different answer discloses that the record exists (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 960]
    verification:
      - {kind: integration-test, ref: "every method called for an out-of-scope id and for a missing id returns the same body, for a viewer and an operator"}
  - id: REQ-UX-020
    area: UX
    statement: "A destructive console write MUST take a prepare call that returns a signed confirmation naming the exact set and the count, and a commit call that presents it."
    rationale: "A single call cannot show the operator what it will change, and adding the step later changes every client (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [832, 960]
    verification:
      - {kind: integration-test, ref: "a commit without a confirmation, with a replayed one and with one for a changed set is refused"}
      - {kind: integration-test, ref: "a build check fails a call of a method marked destructive that has no confirmation step"}
  - id: REQ-UX-021
    area: UX
    statement: "A commit of a destructive console write that loosens, or that policy marks for step-up, MUST be refused with a step-up challenge unless the person authenticated within the age that policy sets."
    rationale: "A stolen operator session must not end sessions or rotate credentials with one click (ADR 0027, ADR 0017)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [832, 960]
    verification:
      - {kind: integration-test, ref: "a commit with a stale authentication is refused with insufficient_user_authentication and succeeds after a fresh sign-in"}
  - id: REQ-UX-023
    area: UX
    statement: "A console page MUST show the source and the as-of time of every value it shows from a cached or remote fact."
    rationale: "A value without its age reads as current and hides a stale directory or a stopped pass (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "each screen scenario with a stale fixture shows the source and the as-of time"}
  - id: REQ-UX-024
    area: UX
    statement: "A console page MUST NOT show a failed read as an empty list."
    rationale: "An empty list that hides a failure sends the operator to the wrong fix (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "a component test per list with a read that fails shows the failed state and not the empty one"}
  - id: REQ-UX-025
    area: UX
    statement: "A console page MUST NOT show an expected waiting state as a failure."
    rationale: "An alarm for an ordinary state trains operators to ignore alarms (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "a fixture of a connection made a moment ago shows the waiting state and not the failed one"}
  - id: REQ-UX-026
    area: UX
    statement: "The console MUST NOT ask for, accept or store a vendor credential pasted by an operator."
    rationale: "A connect action starts a vendor flow that the adapter completes (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [832]
    verification:
      - {kind: integration-test, ref: "no console method takes a vendor token or key field, and every connect scenario completes through the vendor flow"}
  - id: REQ-UX-027
    area: UX
    statement: "A secret that a console write creates MUST be returned only in the response of that write, with Cache-Control no-store."
    rationale: "A show-once secret that leaves the response of its write can be read again (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [832]
    verification:
      - {kind: integration-test, ref: "a later read of the same item returns a reference only, and the response of the write carries no-store"}
  - id: REQ-UX-035
    area: UX
    statement: "The console MUST NOT store, log or write to an audit record the value of a secret that a write creates."
    rationale: "A show-once secret kept anywhere else can be read again (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [832]
    verification:
      - {kind: integration-test, ref: "after a show-once scenario the browser storage, the URLs, the console logs and the audit record hold no secret"}
  - id: REQ-UX-028
    area: UX
    statement: "The console MUST be served from a host of its own, at the root of that host."
    rationale: "A path under another host brought v1 five mount-path defects in two days (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 960, 1624]
    verification:
      - {kind: integration-test, ref: "the bundle loads at the root of the console host and is not served by the issuer host"}
  - id: REQ-UX-029
    area: UX
    statement: "The console bundle MUST reach the API only by a relative URL under one fixed prefix."
    rationale: "A bundle that knows its mount path or its issuer breaks when either moves (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 1624]
    verification:
      - {kind: integration-test, ref: "a bundle lint fails on an absolute URL, and a scripted flow fails on a request that goes to another host"}
  - id: REQ-UX-030
    area: UX
    statement: "The console API MUST answer a call from a bundle built for another API version with an instruction to refresh, which the bundle shows."
    rationale: "The bundle and the API are two artifacts of one release and can be apart for a while (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "a bundle of the previous release called against the new API shows the refresh prompt"}
  - id: REQ-UX-031
    area: UX
    statement: "A console route that is renamed MUST keep a redirect from the old address that a test covers."
    rationale: "Bookmarks are a contract; v1 restructured its navigation about ten times in two months (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "a router test requests each old address and expects the redirect to the new one"}
  - id: REQ-UX-032
    area: UX
    statement: "A console list SHOULD keep its filters in the URL."
    rationale: "A filtered view that can be bookmarked and shared is the view an operator returns to (ADR 0027)."
    level: SHOULD
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831]
    verification:
      - {kind: integration-test, ref: "a list scenario reloads the page from its URL and finds the same filter"}
  - id: REQ-UX-033
    area: UX
    statement: "The console actor MUST NOT serve HTML."
    rationale: "The bundle is static and the sign-in and refusal pages belong to session, so the console has no markup to inject into (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [960]
    verification:
      - {kind: integration-test, ref: "every route of the console actor answers Connect, an error or not found, and never a page of HTML"}
  - id: REQ-UX-034
    area: UX
    statement: "The console explain call MUST accept a target, a resource and an action, as well as a subject."
    rationale: "The access explorer that follows parity needs no new call (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 960]
    verification:
      - {kind: integration-test, ref: "an explain call with a target names the policies that decided that target"}
