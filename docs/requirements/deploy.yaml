# DEPLOY: Deployment and packaging
schema: 1
area: DEPLOY
requirements:
  - id: REQ-DEPLOY-001
    area: DEPLOY
    statement: "sluis MUST run in three runtimes: bare-metal, serverless and kubernetes."
    rationale: "One model, three runtimes."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [842, 843]
    verification:
      - {kind: integration-test, ref: "test installations per runtime"}
  - id: REQ-DEPLOY-008
    area: DEPLOY
    split_from: REQ-DEPLOY-001
    statement: "Each installation MUST be validated against the capabilities of its runtime."
    rationale: "One model, three runtimes."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [842, 843]
    verification:
      - {kind: integration-test, ref: "runtime capability validation test"}
  - id: REQ-DEPLOY-002
    area: DEPLOY
    statement: "Release packaging for bare-metal MUST be deb, rpm and tarball."
    rationale: "Native packaging per platform."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
    issues: [875, 876]
    verification:
      - {kind: integration-test, ref: "package install tests"}
  - id: REQ-DEPLOY-009
    area: DEPLOY
    split_from: REQ-DEPLOY-002
    statement: "Release packaging for serverless MUST be a zip per actor."
    rationale: "Native packaging per platform."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
    issues: [875, 876]
    verification:
      - {kind: integration-test, ref: "package install tests"}
  - id: REQ-DEPLOY-010
    area: DEPLOY
    split_from: REQ-DEPLOY-002
    statement: "Release packaging for kubernetes MUST be an OCI image and a Helm chart."
    rationale: "Native packaging per platform."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
    issues: [875, 876]
    verification:
      - {kind: integration-test, ref: "package install tests"}
  - id: REQ-DEPLOY-003
    area: DEPLOY
    statement: "Actors on one host MUST communicate over Unix sockets with peer credential checks."
    rationale: "Only the edge is exposed."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [862]
    verification:
      - {kind: integration-test, ref: "socket test"}
  - id: REQ-DEPLOY-011
    area: DEPLOY
    split_from: REQ-DEPLOY-003
    statement: "On bare-metal the public API MUST listen on a Unix socket only, with no TCP address bound by entry."
    rationale: "Only the edge connector reaches entry, and entry runs with no network (ADR 0003)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [862]
    verification:
      - {kind: integration-test, ref: "bind test"}
  - id: REQ-DEPLOY-004
    area: DEPLOY
    statement: "The only TCP traffic between nodes MUST be the consensus protocol over mutual TLS."
    rationale: "A small network surface."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [847, 952]
    verification:
      - {kind: integration-test, ref: "network scan"}
      - {kind: integration-test, ref: "mTLS test"}
  - id: REQ-DEPLOY-005
    area: DEPLOY
    statement: "Service units MUST run with a hardened sandbox."
    rationale: "Least privilege on the host."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [866]
    verification:
      - {kind: integration-test, ref: "systemd-analyze baseline check"}
  - id: REQ-DEPLOY-012
    area: DEPLOY
    split_from: REQ-DEPLOY-005
    statement: "Service units MUST run without root privileges."
    rationale: "Least privilege on the host."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [866]
    verification:
      - {kind: integration-test, ref: "process-owner test"}
  - id: REQ-DEPLOY-006
    area: DEPLOY
    statement: "Container images and charts MUST be referenced by digest."
    rationale: "Tags are mutable."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
      - {id: ST-84, section: "cosign", depth: Partial}
    issues: [876]
    verification:
      - {kind: integration-test, ref: "digest-pin lint"}
  - id: REQ-DEPLOY-007
    area: DEPLOY
    statement: "Tested installations MUST be exactly the declared set: local, boards, lambda and kubernetes."
    rationale: "Honesty about test coverage."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-104, section: "1", depth: Full}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "test matrix"}
  - id: REQ-DEPLOY-013
    area: DEPLOY
    split_from: REQ-DEPLOY-007
    statement: "Any other installation combination MUST be documented as untested."
    rationale: "Honesty about test coverage."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards:
      - {id: ST-104, section: "1", depth: Full}
    issues: [877]
    manual_reason: "A statement in the documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-DEPLOY-014
    area: DEPLOY
    statement: "sluis MUST render IAM policies, the function and schedule map, units and chart values as plain files that need no sluis library to apply."
    rationale: "The rendered artifacts are the contract, so any tool can apply them (ADR 0015)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [846]
    verification:
      - {kind: integration-test, ref: "the rendered files of the example bootstrap files apply with the cloud tool alone"}
  - id: REQ-DEPLOY-015
    area: DEPLOY
    statement: "The Pulumi library MUST live in a Go module of its own and consume the rendered artifacts only."
    rationale: "The product must not depend on one infrastructure-as-code tool (ADR 0015)."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards: []
    issues: [845]
    verification:
      - {kind: integration-test, ref: "the main module builds with the library module removed, and the library imports no internal package"}

  # ---- Kubernetes: pods, cells and the chart (decisions 0003 and 0011)
  - id: REQ-DEPLOY-016
    area: DEPLOY
    statement: "On Kubernetes every namespace of sluis MUST run at the restricted Pod Security level."
    rationale: "A pod that the cluster already restricts has fewer rights to lose (ADR 0011, Kubernetes)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the namespace enforces the restricted level, and every pod of every preset is admitted under it"}
  - id: REQ-DEPLOY-017
    area: DEPLOY
    statement: "On Kubernetes the pods of a cell MUST be co-scheduled on one node by pod affinity."
    rationale: "A call inside a cell then stays on the node (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the pods of a cell carry a pod affinity to each other; on kind they land on one node"}
  - id: REQ-DEPLOY-018
    area: DEPLOY
    statement: "On Kubernetes the cells MUST be spread across nodes and zones."
    rationale: "One node or zone down then takes one cell and not the installation (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: a spread constraint or anti-affinity between cells; on a multi-node kind cluster two cells land on two nodes"}
  - id: REQ-DEPLOY-019
    area: DEPLOY
    statement: "On Kubernetes the Service of an actor MUST use trafficDistribution PreferClose."
    rationale: "A call then stays in its cell when a replica there is ready (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: every actor Service sets trafficDistribution PreferClose"}
      - {kind: integration-test, ref: "with a ready replica in the caller's cell and one in another, calls go to the local one"}
  - id: REQ-DEPLOY-020
    area: DEPLOY
    statement: "On Kubernetes a PodDisruptionBudget MUST keep a cell's replicas up during a drain."
    rationale: "A drain must not take an actor's last ready replica (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: every actor has a PodDisruptionBudget"}
      - {kind: integration-test, ref: "a node drain on kind keeps at least one ready replica of each actor"}
  - id: REQ-DEPLOY-021
    area: DEPLOY
    statement: "A rolling update on Kubernetes MUST NOT remove a replica before its replacement is ready."
    rationale: "Sign-in then stays up through a release (ADR 0003, Cells; ADR 0015)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "a rolling upgrade on kind with a request loop: no request fails"}
  - id: REQ-DEPLOY-022
    area: DEPLOY
    statement: "The chart MUST ship the requests and limits of every container as values measured under load."
    rationale: "A guessed limit either evicts a pod or wastes the node (ADR 0003, Cells; ADR 0037)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876, 878]
    verification:
      - {kind: integration-test, ref: "chart corpus: every container sets requests and limits, and each value names the measurement it came from"}
  - id: REQ-DEPLOY-023
    area: DEPLOY
    statement: "The chart MUST render no Role, RoleBinding, ClusterRole or ClusterRoleBinding, except those that exporter@ needs on the direct path."
    rationale: "sluis writes no Kubernetes object other than an exported Secret, so it needs no access to the API (ADR 0011, Kubernetes; ADR 0009, Destinations)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the render of every preset holds no RBAC object, and with the direct path the Role names only the exported Secrets"}
