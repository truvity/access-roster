# DEPLOY: Deployment and packaging
schema: 1
area: DEPLOY
requirements:
  - id: REQ-DEPLOY-001
    area: DEPLOY
    statement: "sluis MUST run in three runtimes: bare-metal, serverless and kubernetes."
    rationale: "One model, three runtimes."
    level: MUST
    source: v1-parity
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [842, 843]
    verification:
      - {kind: integration-test, ref: "test installations per runtime"}
  - id: REQ-DEPLOY-008
    area: DEPLOY
    split_from: REQ-DEPLOY-001
    statement: "Each installation MUST be validated against the capabilities of its runtime."
    rationale: "One model, three runtimes."
    level: MUST
    source: v1-parity
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-96, section: "2020-12", depth: Partial}
    issues: [842, 843]
    verification:
      - {kind: integration-test, ref: "runtime capability validation test"}
  - id: REQ-DEPLOY-002
    area: DEPLOY
    statement: "Release packaging for bare-metal MUST be deb, rpm and tarball."
    rationale: "Native packaging per platform; the packages join the first working version on 2026-11-08, attached to the GitHub release, and the apt and dnf site stays in v1 parity."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: ["bare-metal"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
    issues: [875, 876]
    verification:
      - {kind: integration-test, ref: "tools/release/packages builds a .deb and an .rpm of every package for amd64 and arm64 and reads them back (just check-packages). Not yet attached to the release or installed by a test"}
      - {kind: integration-test, ref: "package install tests"}
  - id: REQ-DEPLOY-009
    area: DEPLOY
    split_from: REQ-DEPLOY-002
    statement: "Release packaging for serverless MUST be a zip per actor."
    rationale: "Native packaging per platform."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["serverless"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
    issues: [875, 876]
    verification:
      - {kind: integration-test, ref: "package install tests"}
  - id: REQ-DEPLOY-010
    area: DEPLOY
    split_from: REQ-DEPLOY-002
    statement: "Release packaging for kubernetes MUST be an OCI image and a Helm chart."
    rationale: "Native packaging per platform."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
    issues: [875, 876]
    verification:
      - {kind: integration-test, ref: "package install tests"}
  - id: REQ-DEPLOY-003
    area: DEPLOY
    statement: "Actors on one host MUST communicate over Unix sockets with peer credential checks."
    rationale: "Only the edge is exposed."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [862]
    verification:
      - {kind: integration-test, ref: "socket test"}
  - id: REQ-DEPLOY-011
    area: DEPLOY
    split_from: REQ-DEPLOY-003
    statement: "On bare-metal the public API MUST listen on a Unix socket only, with no TCP address bound by entry."
    rationale: "Only the edge connector reaches entry, and entry runs with no network (ADR 0003)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [862]
    verification:
      - {kind: integration-test, ref: "bind test"}
  - id: REQ-DEPLOY-004
    area: DEPLOY
    statement: "The only TCP traffic between nodes MUST be the consensus protocol over mutual TLS."
    rationale: "A small network surface; moved to v1 parity on 2026-11-07 as a known limit of the test installation, which runs rqlite with no TLS behind a firewall, to be revisited before any real PIN (REQ-DEPLOY-047)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-81, section: "8446", depth: Full}
    issues: [847, 952]
    verification:
      - {kind: integration-test, ref: "network scan"}
      - {kind: integration-test, ref: "mTLS test"}
  - id: REQ-DEPLOY-005
    area: DEPLOY
    statement: "Service units MUST run with a hardened sandbox."
    rationale: "Least privilege on the host."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: no-proving-test
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [866]
    verification:
      - {kind: integration-test, ref: "systemd-analyze baseline check"}
  - id: REQ-DEPLOY-012
    area: DEPLOY
    split_from: REQ-DEPLOY-005
    statement: "Service units MUST run without root privileges."
    rationale: "Least privilege on the host."
    level: MUST
    source: design-decision
    status: done
    milestone: v1-parity
    runtimes: ["bare-metal"]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [866]
    verification:
      - {kind: integration-test, ref: "process-owner test"}
  - id: REQ-DEPLOY-006
    area: DEPLOY
    statement: "Container images and charts MUST be referenced by digest."
    rationale: "Tags are mutable."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: ["kubernetes"]
    standards:
      - {id: NC-09, section: "OCI", depth: Full}
      - {id: ST-84, section: "cosign", depth: Partial}
    issues: [876]
    verification:
      - {kind: integration-test, ref: "digest-pin lint"}
  - id: REQ-DEPLOY-007
    area: DEPLOY
    statement: "Tested installations MUST be exactly the declared set: local, boards, lambda and kubernetes."
    rationale: "Honesty about test coverage."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-104, section: "1", depth: Full}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "test matrix"}
  - id: REQ-DEPLOY-013
    area: DEPLOY
    split_from: REQ-DEPLOY-007
    statement: "Any other installation combination MUST be documented as untested."
    rationale: "Honesty about test coverage."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: attestation-missing
    runtimes: all
    standards:
      - {id: ST-104, section: "1", depth: Full}
    issues: [877]
    manual_reason: "A statement in the documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-DEPLOY-014
    area: DEPLOY
    statement: "sluis MUST render IAM policies, the function and schedule map, units and chart values as plain files that need no sluis library to apply."
    rationale: "The rendered artifacts are the contract, so any tool can apply them (ADR 0015)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    standards: []
    issues: [846]
    verification:
      - {kind: integration-test, ref: "the rendered files of the example bootstrap files apply with the cloud tool alone"}
  - id: REQ-DEPLOY-015
    area: DEPLOY
    statement: "The Pulumi library MUST live in a Go module of its own and consume the rendered artifacts only."
    rationale: "The product must not depend on one infrastructure-as-code tool (ADR 0015)."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [845]
    verification:
      - {kind: integration-test, ref: "the main module builds with the library module removed, and the library imports no internal package"}

  # ---- Kubernetes: pods, cells and the chart (decisions 0003 and 0011)
  - id: REQ-DEPLOY-016
    area: DEPLOY
    statement: "On Kubernetes every namespace of sluis MUST run at the restricted Pod Security level."
    rationale: "A pod that the cluster already restricts has fewer rights to lose (ADR 0011, Kubernetes)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the namespace enforces the restricted level, and every pod of every preset is admitted under it"}
  - id: REQ-DEPLOY-017
    area: DEPLOY
    statement: "On Kubernetes the pods of a cell MUST be co-scheduled on one node by pod affinity."
    rationale: "A call inside a cell then stays on the node (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the pods of a cell carry a pod affinity to each other; on kind they land on one node"}
  - id: REQ-DEPLOY-018
    area: DEPLOY
    statement: "On Kubernetes the cells MUST be spread across nodes and zones."
    rationale: "One node or zone down then takes one cell and not the installation (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: a spread constraint or anti-affinity between cells; on a multi-node kind cluster two cells land on two nodes"}
  - id: REQ-DEPLOY-019
    area: DEPLOY
    statement: "On Kubernetes the Service of an actor MUST use trafficDistribution PreferClose."
    rationale: "A call then stays in its cell when a replica there is ready (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: every actor Service sets trafficDistribution PreferClose"}
  - id: REQ-DEPLOY-020
    area: DEPLOY
    statement: "On Kubernetes a PodDisruptionBudget MUST keep a cell's replicas up during a drain."
    rationale: "A drain must not take an actor's last ready replica (ADR 0003, Cells)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: every actor has a PodDisruptionBudget"}
      - {kind: integration-test, ref: "a node drain on kind keeps at least one ready replica of each actor"}
  - id: REQ-DEPLOY-021
    area: DEPLOY
    statement: "A rolling update on Kubernetes MUST NOT remove a replica before its replacement is ready."
    rationale: "Sign-in then stays up through a release (ADR 0003, Cells; ADR 0015)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "a rolling upgrade on kind with a request loop: no request fails"}
  - id: REQ-DEPLOY-022
    area: DEPLOY
    statement: "The chart MUST ship the requests and limits of every container as values measured under load."
    rationale: "A guessed limit either evicts a pod or wastes the node (ADR 0003, Cells; ADR 0037)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876, 878]
    verification:
      - {kind: integration-test, ref: "chart corpus: every container sets requests and limits, and each value names the measurement it came from"}
  - id: REQ-DEPLOY-023
    area: DEPLOY
    statement: "The chart MUST render no Role, RoleBinding, ClusterRole or ClusterRoleBinding, except those that exporter@ needs on the direct path."
    rationale: "Each unit has no RBAC objects (ADR 0003, Units); the one object sluis writes is exporter@'s Secret on the direct path (ADR 0009, Destinations)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the render of every preset holds no RBAC object, and with the direct path the Role names only the exported Secrets"}
  - id: REQ-DEPLOY-024
    area: DEPLOY
    statement: "sluis config check MUST refuse a production Kubernetes installation whose store engine is not dynamodb or whose key@ driver is not aws-kms."
    rationale: "Kubernetes in 2.0 means Kubernetes on AWS (EKS) with DynamoDB, AWS KMS and S3; a cluster without AWS is not in 2.0 (ADR 0011, Kubernetes; ADR 0005, Engines)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards: []
    issues: [876]
    verification:
      - {kind: integration-test, ref: "config check: a production Kubernetes bootstrap file with rqlite or postgres as the engine, or with a key driver other than aws-kms, is refused"}
  - id: REQ-DEPLOY-025
    area: DEPLOY
    statement: "On Kubernetes a holder's cloud credential MUST come from a projected service-account token mounted only into its driver container and exchanged by web identity through the cluster's IAM OIDC provider."
    rationale: "EKS Pod Identity credentials reach every container of the pod, so the holder's own process would hold the cloud credential (ADR 0011, Kubernetes)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["kubernetes"]
    standards:
      - {id: ST-46, section: "AssumeRoleWithWebIdentity", depth: Full}
    issues: [876]
    verification:
      - {kind: integration-test, ref: "chart corpus: the token volume is mounted into driver containers only, and no pod uses EKS Pod Identity"}
  - id: REQ-DEPLOY-026
    area: DEPLOY
    statement: "The boards deploy MUST refuse a card deploy, before it writes a file and naming the packages of the board's family, when the board lacks the card service, its CCID driver or, where pcscd asks polkit, polkit."
    rationale: "The deploy installs no package, so a board without them is stopped with the names to put in its image, not left half deployed (docs/runtimes/bare-metal.md, Supported operating systems)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "deploy/boards/prereq-test.sh against fakes of dpkg and rpm, and deploy/boards/os-container-test.sh on Ubuntu 26.04 and Rocky 10 with the packages missing"}
  - id: REQ-DEPLOY-027
    area: DEPLOY
    statement: "The generated units of a board MUST load their credentials with LoadCredentialEncrypted= and never with LoadCredential=."
    rationale: "A credential file is then encrypted at rest under the board's own host key (docs/runtimes/bare-metal.md, Credentials are encrypted on the board)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "tools/gen/units: no generated unit holds a plain LoadCredential= line, and the credential lines name the encrypted file"}
  - id: REQ-DEPLOY-028
    area: DEPLOY
    statement: "The boards deploy MUST encrypt each credential on the board under the board's own host key at every deploy."
    rationale: "A reflash makes a new host key, and a credential encrypted under the old one no longer opens, so the next deploy has to make it again."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "prereq-test.sh: a blob named for its unit, mode 0400, none left on failure; os-container-test.sh: after the host key is replaced the old file fails and the next deploy's opens"}
  - id: REQ-DEPLOY-029
    area: DEPLOY
    statement: "The boards deploy MUST refuse to write a credential on a board whose systemd is older than 252 or that has no systemd-creds, naming the version and the floor."
    rationale: "The units read LoadCredentialEncrypted=, which an older systemd does not know, so the credential would never arrive."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "prereq-test.sh: systemd 249, an unreadable version and a missing systemd-creds are refused; 252 and 259 are accepted"}
  - id: REQ-DEPLOY-030
    area: DEPLOY
    statement: "The socket of the card service MUST belong to the card driver's group after every start of pcscd."
    rationale: "A pcscd that runs as its own user has its runtime directory, the socket included, handed to that user by systemd at its first start, which would shut the card driver out (MEASURED 2026-11-04 on Ubuntu 26.04)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "os-container-test.sh on Ubuntu 26.04 and Rocky 10: the socket is root:group after pcscd ran, and the card driver and root reach it while others do not"}
  - id: REQ-DEPLOY-031
    area: DEPLOY
    statement: "The boards deploy MUST deploy the card variant on Ubuntu 26.04 LTS and on Rocky Linux 10.x, with systemd 252 or later, and start its units."
    rationale: "Those are the operating systems of the boards, and the deploy used to be written for Ubuntu 22.04 (docs/runtimes/bare-metal.md, Supported operating systems)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "os-container-test.sh in a systemd container of each distribution; SELinux enforcing is os-vm-test.sh, which CI has never run (a schedule runs from the default branch only) and is run by hand; no card"}
      - {kind: integration-test, ref: "prereq-test.sh, recipients-test.sh: a unit that restarts or is not active within 60 s fails the deploy with its journal; a locked card board ends 'locked' with exit 0; an unreadable lock is failed"}
  - id: REQ-DEPLOY-032
    area: DEPLOY
    statement: "The card driver MUST NOT ask for a glibc symbol newer than GLIBC_2.34."
    rationale: "The card driver is the one cgo executable, and the oldest supported system, Amazon Linux 2023, has glibc 2.34 (docs/runtimes/bare-metal.md, The cgo card driver and glibc)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "tools/gen/units: the native job runs a test that fails above GLIBC_2.34 for every executable of deploy/boards/native.list"}
  - id: REQ-DEPLOY-038
    area: DEPLOY
    statement: "Every distribution form of sluis that is built MUST declare the runtime dependencies that the runtime dependency matrix lists for it."
    rationale: "A package, an image or a layer that omits a dependency installs and then fails on the host (an image without the card service's library, a board without tar), so one matrix is the list they are all checked against (docs/distribution/dependencies.md)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    issues: [860]
    milestone: first-version
    runtimes: all
    standards: []
    verification:
      - {kind: integration-test, ref: "tools/gen/units: the card packages, the systemd and glibc floors and the rqlite version of the deploy are the ones the matrix names; later forms are checked when built"}
  - id: REQ-DEPLOY-033
    area: DEPLOY
    statement: "On every supported host operating system family, sluis MUST run with the mandatory access control that the distribution enables by default (SELinux enforcing with the targeted policy on the RHEL family, AppArmor enabled on the Debian and Ubuntu family) and cause no denial in install, start, unlock, normal operation or uninstall."
    rationale: "The default policy does not confine sluis (its units run as unconfined_service_t under SELinux and unconfined under AppArmor), so this record guarantees that sluis works under the default policy and not that the policy protects it; the protection is the systemd hardening of REQ-ISO-094, REQ-ISO-095 and REQ-ISO-104 (docs/runtimes/bare-metal.md, SELinux and the firewall)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    features: [design]
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "prereq-test.sh: avc_check and avc_auditd_ok against fakes (an enforced denial in unconfined_service_t, pcscd_t or our comm fails; no auditd fails)"}
      - {kind: integration-test, ref: "boards.sh deploy and smoke run avc_check on a real board; os-vm-test.sh (Rocky 10 enforcing under KVM, by hand until the nightly fires) checks the labels and no AVC since boot"}
      - {kind: integration-test, ref: "planned: the same check for AppArmor in the Ubuntu run of the boards deploy (an apparmor=DENIED record since boot fails it), which os-container-test.sh cannot see"}
  - id: REQ-DEPLOY-034
    area: DEPLOY
    statement: "The boards deploy MUST refuse an rqlite package, cached or downloaded, whose sha256 differs from the digest pinned in the repository."
    rationale: "Upstream publishes no checksum file and no signature for its packages, so the pin in the repository is the only trust in what a board's package manager installs as root (docs/runtimes/bare-metal.md, rqlite on the boards)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "boards-test.sh: another digest is refused (download, cache), a missing pin before any download (curl never called); prereq-test.sh: the board checks the pin again before the install"}
  - id: REQ-DEPLOY-035
    area: DEPLOY
    statement: "The boards unlock command MUST NOT put the PIN of the card in an argument of any command, in the environment or in its output."
    rationale: "A process list shows arguments to every user of the board and of the workstation, and a log keeps output, so the PIN must cross only inside the ssh session (docs/reference/cli.md, sluis node unlock)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "boards-test.sh (fake ssh, pty): PIN byte-exact on stdin only, in no argv, env or output, also under xtrace; -T first; -t and StrictHostKeyChecking=no refused. Not run: real sudo, sshd, CLI"}
  - id: REQ-DEPLOY-036
    area: DEPLOY
    statement: "The boards scripts and the smoke program MUST pass the options of SLUIS_BOARD_SSH_OPTIONS to every ssh they run."
    rationale: "A reinstalled board has a new host key, and a run must trust it through its own known-hosts file without editing the operator's (docs/runtimes/bare-metal.md, Deploy and prove on three boards)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "boards-test.sh: the options are on the ssh command line of boards.sh, after the defaults, and no script calls ssh but through board_ssh; the smoke program reads the same variable"}
  - id: REQ-DEPLOY-037
    area: DEPLOY
    statement: "The boards deploy MUST refuse a board that has no tar before it sends anything to it."
    rationale: "The stage reaches the board as a tar stream, and the Rocky 10 image of the boards is built without tar, so the failure would otherwise be an opaque ssh error half way through a deploy."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "boards-test.sh: a fake board without tar is refused with the install command, nothing is sent to it, and an unreachable board is not reported as a missing tar"}
  - id: REQ-DEPLOY-043
    area: DEPLOY
    statement: "The boards deploy MUST NOT report a card board as ok unless its card driver says that it holds the PIN."
    rationale: "A locked board keeps key@ and most units running, so the units cannot tell it from an unlocked one, and a board reported ok that cannot sign sends the operator to look in the wrong place (docs/runtimes/bare-metal.md, The end of a deploy)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "prereq-test.sh: unlocked is ok; locked is locked (exit 10) only if every unsettled unit waits for key@; a unit fault, an unreadable lock, no CLI are failed; boards-test.sh: lock per board"}
      - {kind: integration-test, ref: "cli/sluis node_test.go: sluis node status says locked or unlocked from the driver, sends no PIN, refuses another node, and fails when the driver is out of reach"}
  - id: REQ-DEPLOY-044
    area: DEPLOY
    statement: "The generated unit of an actor MUST NOT have a start limit."
    rationale: "An actor that waits for a locked card driver exits and restarts until the PIN is given, which may take longer than any count of starts, and a unit that systemd has given up on is not started again by the unlock (docs/runtimes/bare-metal.md, The end of a deploy)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "tools/gen/units: every actor unit has StartLimitIntervalSec=0 and Restart=on-failure with RestartSec=2s, and the committed units equal the generator's output"}
  - id: REQ-DEPLOY-045
    area: DEPLOY
    statement: "`sluis node status` MUST print the PIN attempts the card has left on a line before its lock line, as \"unknown while unlocked\" when the driver cannot read the counter and with a plain warning when one attempt is left, and leave its lock line last and unchanged."
    rationale: "Agents had to send the raw RPC to read the counter, and the scripts of the deploy read the last line of the command, so the counter goes before it; reading the counter is a VERIFY with no PIN and never burns an attempt."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    tests:
      - cli/sluis/node_test.go
    verification:
      - {kind: integration-test, ref: "cli/sluis node_test.go: counter line for 3, 2, 1, 0 and unreadable, lock line last and exact, no -1 (TestNodeStatusSaysThePINCounter); boards-test.sh, prereq-test.sh: counter line ignored"}
      - {kind: manual, ref: "on three boards: the counter line, unknown while unlocked, then the lock line; the board lock, state and boards-status stay correct. Run 2026-11-07"}
  - id: REQ-DEPLOY-046
    area: DEPLOY
    statement: "On a boards installation, the rqlite Raft port of a board MUST answer only the loopback interface, the boards of the installation and the one administration host that the operator names, and its client port only the loopback interface and that administration host."
    rationale: "rqlite has no TLS or authentication in the test installation, so whoever reaches its ports reads and writes the store; with no administration host named it gets nothing, and if the rules cannot load at boot the board fails open, a stance the owner accepted on 2026-11-07 for the test installation, to revisit before any real PIN (docs/runtimes/bare-metal.md, The rqlite firewall; ADR 0003)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "boards-test.sh: the rules pass nft -c and, in a network namespace, admit the boards, admin host and loopback and drop a stranger. prereq-test.sh: timer first, nothing kept before the confirm"}
      - {kind: manual, ref: "boards-firewall-check on three boards (Ubuntu 26.04.1 x2, Rocky 10.2): stranger times out, peers and admin host answer; -reboot-check on two: rules before rqlited. 2026-11-07"}
  - id: REQ-DEPLOY-042
    area: DEPLOY
    statement: "The .rpm SHOULD ship an SELinux policy module and the .deb an AppArmor profile that confine each actor to its own sockets and state and let only key@ reach the card service and the card device."
    rationale: "Under the default policy a compromised actor is held by the uids, the socket modes and the systemd sandbox alone, so a type or a profile per actor is a second lock on the one path that reaches the card (REQ-DEPLOY-033, docs/runtimes/bare-metal.md, SELinux and the firewall)."
    level: SHOULD
    source: design-decision
    status: planned
    features: [design]
    milestone: v1-parity
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "a denial test on SELinux enforcing in a Rocky 10 virtual machine: a process in another actor's type that connects to the card service's socket is refused and logged, and key@ reaches it"}
      - {kind: integration-test, ref: "the same denial test with the AppArmor profile enforced on Ubuntu 26.04: another actor's profile is refused the card service's socket, and key@'s reaches it"}
  - id: REQ-DEPLOY-039
    area: DEPLOY
    statement: "A boards installation MUST let an operator rebuild one member from a fresh operating system without touching the other members' keys."
    rationale: "A board that is reinstalled loses its SSH host keys, its machine-id and its local rqlite data, and the other two boards must keep serving while it comes back (docs/runtimes/rebuild-a-board.md)."
    level: MUST
    source: design-decision
    status: partial
    gap: no-proving-test
    features: ["design"]
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "board-flow test: reinstall one of three boards and follow the runbook; the board is unlocked and the other two boards' recipients, keys and state are unchanged. Not written; run once by hand"}
      - {kind: manual, ref: "on three boards, one reinstalled with its card kept, by docs/runtimes/rebuild-a-board.md; run once, 2026-11-07. Not run: a replaced card, or the software key driver"}
  - id: REQ-DEPLOY-040
    area: DEPLOY
    statement: "A rebuilt member MUST rejoin the rqlite cluster under its previous Raft address, so that the cluster has three voters again."
    rationale: "The node id of an rqlite node is its Raft address, so a member that returns under another address is a new node and leaves the stale one in the membership (docs/runtimes/bare-metal.md, rqlite on the boards)."
    level: MUST
    source: design-decision
    status: partial
    gap: no-proving-test
    features: ["design"]
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "board-flow test: remove the stale node, reinstall, run boards-rqlite; every node reports 3 nodes, 3 voters, one leader. Not written; run once by hand, no recipe removes a node"}
      - {kind: manual, ref: "on three boards, the stale node removed by hand and the rebuilt board rejoined at its Raft address; every node reported 3 voters, equal indices. Run once, 2026-11-07"}
  - id: REQ-DEPLOY-041
    area: DEPLOY
    statement: "After a rebuild the signed KeyPlan MUST list the rebuilt member's current recipient and no earlier recipient of that member."
    rationale: "A peer releases the PIN and wraps a data key only for a recipient that the signed KeyPlan lists (REQ-KEYS-093), so a rebuilt member is trusted through the KeyPlan and the card, not through its SSH host keys (docs/runtimes/rebuild-a-board.md)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    features: ["design"]
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    verification:
      - {kind: integration-test, ref: "board-flow test: rebuild with a changed recipient, re-enrol, re-sign; the KeyPlan lists the new one only, an old key's request is refused. Not run: the card was kept; no command exists for the refusal"}
      - {kind: manual, ref: "on three boards, a reinstalled board with its card kept: 3 recipients listed, the board's unchanged. Run once, 2026-11-07. Not run: a replaced card; the refusal of an old recipient"}
  - id: REQ-DEPLOY-047
    area: DEPLOY
    statement: "Before a real PIN or real data is placed on a board, an operator MUST close or accept in writing each of these: the firewall unit failing open at boot, the audit log on the local disk with R2 as the end state, rqlite with no TLS or authentication, and the real-time clock losing its time on power loss."
    rationale: "A gate, not a build item: the boards are a test installation, and the maintainer's written close or acceptance of each limit is its only evidence; known limits: strangers can write audit records through the token and revoke endpoints (REQ-SEC-021 not built), a refusal can be planted under another tenant's name, a non-tenant name gets a pseudonym key, and ca keeps permissions it does not use."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    issues: [1584]
    manual_reason: "A written close or acceptance of each item and each known limit by the maintainer is checked by reading it."
    verification:
      - {kind: manual, ref: "the maintainer's attestation that each of the four items, and each known limit named in the rationale, is closed or accepted"}
  - id: REQ-DEPLOY-049
    area: DEPLOY
    statement: "A maintainer script of a package MUST NOT start a unit, enable a unit, delete state or delete a user."
    rationale: "An instance appears when a bootstrap file exists and `sluis node apply` enables the target, and a package that deletes /etc/sluis, /var/lib/sluis-state or an account would lose data that the uid still owns (decision D7 of 2026-11-08)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    issues: [1223]
    verification:
      - {kind: integration-test, ref: "tools/release/packages reads the maintainer scripts of the built packages and refuses start, enable, userdel and the removal of the state (a text check: a tripwire, not a proof)"}
      - {kind: integration-test, ref: "lifecycle test of the install tier: after install, upgrade, removal and reinstall no package enabled or started a unit, and the state and the users are still there. Not written"}
