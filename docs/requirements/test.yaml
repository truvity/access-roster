# TEST: Conformance and test strategy
schema: 1
area: TEST
requirements:
  - id: REQ-TEST-001
    area: TEST
    statement: "sluis MUST pass the OpenID conformance plans for configuration, basic, RP-initiated logout and back-channel logout before an endpoint is enabled in the production profile."
    rationale: "Official suites define correct behaviour."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-104, section: "1", depth: Full}
      - {id: ST-41, section: "1", depth: Partial}
    issues: [850]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: conformance-suite, ref: "OIDF RP-Initiated Logout OP"}
      - {kind: conformance-suite, ref: "OIDF BCL OP"}
  - id: REQ-TEST-002
    area: TEST
    statement: "sluis SHOULD pass the OpenID conformance plans for the relying-party role for every upstream connector kind."
    rationale: "Upstream login is relying-party code."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-104, section: "1", depth: Full}
      - {id: ST-28, section: "3", depth: Full}
    issues: [850]
    verification:
      - {kind: conformance-suite, ref: "OIDF RP plans"}
  - id: REQ-TEST-003
    area: TEST
    statement: "sluis MAY pass the FAPI 2.0 security profile and message signing plans for profiles that claim them."
    rationale: "Certification of the high-assurance profile."
    level: MAY
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-37, section: "1", depth: Full}
      - {id: ST-38, section: "1", depth: Full}
    issues: [929]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP"}
      - {kind: conformance-suite, ref: "FAPI2-MS"}
  - id: REQ-TEST-004
    area: TEST
    statement: "Every driver of a port MUST pass the same behavioural suite of that port."
    rationale: "Drivers must be interchangeable."
    level: MUST
    source: v1-parity
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-103, section: "1", depth: Full}
    issues: [851]
    verification:
      - {kind: conformance-suite, ref: "port suite"}
  - id: REQ-TEST-005
    area: TEST
    statement: "A release gate MUST run an automated negative test for every refused input."
    rationale: "Refusals are requirements."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [850]
    verification:
      - {kind: integration-test, ref: "negative test registry"}
  - id: REQ-TEST-008
    area: TEST
    split_from: REQ-TEST-005
    statement: "A negative test MUST NOT be relaxed to pass."
    rationale: "Refusals are requirements."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "4", depth: Partial}
    issues: [850]
    manual_reason: "The rule governs how tests are changed and is evidenced by review of the change history."
    verification:
      - {kind: manual, ref: "test-change review"}
  - id: REQ-TEST-006
    area: TEST
    statement: "Shared test vectors MUST be used by all language kits, including Wycheproof-style edge cases for signatures."
    rationale: "One source of truth across languages."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-106, section: "1", depth: Full}
      - {id: ST-103, section: "1", depth: Full}
    issues: [861, 869]
    verification:
      - {kind: test-vectors, ref: "Wycheproof"}
      - {kind: test-vectors, ref: "kit vectors"}
  - id: REQ-TEST-007
    area: TEST
    statement: "Inspection reads, seeding, a software authenticator and a test clock MUST be absent from released binaries."
    rationale: "End-to-end tests need controllable fixtures, and a released binary must not carry them."
    level: MUST
    source: stakeholder-ciam
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-59, section: "1", depth: Partial}
    issues: [877]
    verification:
      - {kind: integration-test, ref: "released-binary symbol test"}
  - id: REQ-TEST-009
    area: TEST
    statement: "The port conformance suite MUST test create-if-absent under concurrent writers for every blob driver."
    rationale: "A fence that holds for one writer can still let two concurrent writers both succeed, as a blob store without conditional writes does."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-103, section: "blob port", depth: Full}
    issues: [851]
    verification:
      - {kind: conformance-suite, ref: "port conformance suite, concurrent create-if-absent per blob driver"}
  - id: REQ-TEST-010
    area: TEST
    statement: "The identity provider of the local installation MUST send an ID token with an amr that contains mfa to a person who passed its one-time-password step, however long after the sign-in the token is minted."
    rationale: "Keycloak adds amr only within the second of the authentication unless each execution sets default.reference.maxAge, so a test that mints later would fail at random."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: [bare-metal]
    standards: []
    issues: [877]
    verification:
      - {kind: integration-test, ref: "an ID token minted more than a second after the one-time-password step carries amr with pwd, otp and mfa"}
  - id: REQ-TEST-011
    area: TEST
    statement: "The customer installation on Kubernetes (EKS) MUST run the full conformance set, the OpenID Connect plans, the FAPI 2.0 plans and the customer-identity plans, in addition to the local installation on pull requests and the lambda installation nightly."
    rationale: "The customer installation is the one that serves end users and claims the high-assurance profile, so the claim is proved on the installation that carries it (ADR 0011, Kubernetes; ADR 0038)."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: ["kubernetes"]
    standards:
      - {id: ST-37, section: "1", depth: Full}
      - {id: ST-104, section: "1", depth: Full}
    issues: [850, 929, 931]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP, Basic OP and the logout plans against the EKS customer installation"}
      - {kind: conformance-suite, ref: "FAPI2-SP against the EKS customer installation"}
  - id: REQ-TEST-012
    area: TEST
    statement: "The fake vendor server of a provisioner conformance suite SHOULD name the vendor release and the date whose behaviour it models."
    rationale: "A fake that is not tied to a release keeps passing after the vendor changes (ADR 0026)."
    level: SHOULD
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["parity"]
    verification:
      - {kind: manual, ref: "each fake vendor server carries the vendor release and the date it was read, in a header comment that the suite prints"}
  - id: REQ-TEST-013
    area: TEST
    statement: "Each console screen MUST have a browser test against the local installation that covers the ok, empty, forbidden, unavailable, stale and waiting states, run as a required check of every pull request."
    rationale: "Nearly every v1 console defect was found by a person looking at the live page (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 1100]
    verification:
      - {kind: integration-test, ref: "a CI job that runs the scenarios of every screen and is a required check"}
  - id: REQ-TEST-014
    area: TEST
    statement: "The local installation MUST offer a documented fixture set of people, groups, tenants and states that only a test-only kind set loads and that no production image contains."
    rationale: "Fixtures replace the v1 demonstration mode (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 849]
    verification:
      - {kind: integration-test, ref: "the fixture set loads into the local installation, and a check fails when a production image holds the test-only kind set"}
  - id: REQ-TEST-015
    area: TEST
    statement: "CI MUST fail when a scripted console flow raises a content security policy violation."
    rationale: "A policy that breaks a flow was found by hand twice in v1 (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [796, 831]
    verification:
      - {kind: integration-test, ref: "a violation listener in every browser scenario fails the job"}
  - id: REQ-TEST-016
    area: TEST
    statement: "CI MUST call every method of the operator API as each role and scope and compare each answer with the one that the method's annotations declare."
    rationale: "A generated matrix finds the read that a viewer must not have before a person does (ADR 0027)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [831, 960]
    verification:
      - {kind: integration-test, ref: "the matrix runs against the local installation, and a method with no annotation fails it"}
