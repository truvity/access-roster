  # ---- break-glass recovery (decision 0017)
  - id: REQ-AUTHN-074
    area: AUTHN
    statement: "The break-glass credentials MUST be the config kind BreakGlassPasskey, so that recovery works when the store is damaged."
    rationale: "Recovery must not depend on the thing it recovers (ADR 0017)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1178]
