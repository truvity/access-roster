# AUTHN: Authentication and authorization endpoint
schema: 1
area: AUTHN
requirements:
  - id: REQ-AUTHN-001
    area: AUTHN
    statement: "The authorization endpoint MUST serve only the authorization code response type."
    rationale: "A single flow keeps the attack surface small and matches current security guidance."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "3.1.1", depth: Partial}
      - {id: ST-14, section: "2.1.2", depth: Full}
      - {id: ST-28, section: "3.1", depth: Partial}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-025
    area: AUTHN
    split_from: REQ-AUTHN-001
    statement: "The authorization endpoint MUST answer implicit and hybrid response types with unsupported_response_type."
    rationale: "A refused flow must be reported with a code that a client can act on."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "3.1.1", depth: Partial}
      - {id: ST-14, section: "2.1.2", depth: Full}
      - {id: ST-28, section: "3.1", depth: Partial}
    issues: [775]
    tests: [actors/session/internal/sessiond/authorize_test.go]
    verification:
      - {kind: integration-test, ref: "negative test for each refused response type (implicit, hybrid, none): unsupported_response_type, no code, token or cookie"}
  - id: REQ-AUTHN-002
    area: AUTHN
    statement: "sluis MUST require PKCE with the S256 method on every authorization code request."
    rationale: "PKCE with a strong method defeats code interception and injection."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-03, section: "4.2-4.3", depth: Full}
      - {id: ST-14, section: "2.1.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP (PKCE variant)"}
  - id: REQ-AUTHN-026
    area: AUTHN
    split_from: REQ-AUTHN-002
    statement: "sluis MUST refuse the plain method and a missing code challenge on an authorization code request."
    rationale: "A downgrade to plain or to no challenge reopens code interception."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-03, section: "4.2-4.3", depth: Full}
      - {id: ST-14, section: "2.1.1", depth: Full}
    issues: [775]
    verification:
      - {kind: integration-test, ref: "negative tests for plain and missing challenge"}
  - id: REQ-AUTHN-003
    area: AUTHN
    statement: "A client redirect URI MUST be compared by exact string match, with only the port excluded from the comparison for a loopback IP-literal URI registered by a native client."
    rationale: "Exact matching blocks open-redirect and code-leak attacks."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "2.1", depth: Full}
      - {id: ST-04, section: "7.3", depth: Full}
    issues: [775]
    verification:
      - {kind: integration-test, ref: "redirect matrix (exact, prefix, case, userinfo, fragment, port)"}
  - id: REQ-AUTHN-004
    area: AUTHN
    statement: "A policy that registers a non-loopback http redirect URI MUST be refused at load, for every client type and every installation profile."
    rationale: "Cleartext redirects expose authorization codes to the network."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-14, section: "2.1", depth: Full}
      - {id: ST-04, section: "8.3", depth: Full}
    issues: [775, 786]
    tests: [actors/store/tests/config.rs, actors/session/internal/sessiond/authorize_test.go]
    verification:
      - {kind: integration-test, ref: "policy-load negative test"}
  - id: REQ-AUTHN-005
    area: AUTHN
    statement: "Every authorization response that carries a code or an error MUST include the iss parameter."
    rationale: "The issuer parameter defends against mix-up attacks."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-10, section: "2", depth: Full}
      - {id: ST-29, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774, 775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: integration-test, ref: "response check"}
  - id: REQ-AUTHN-027
    area: AUTHN
    split_from: REQ-AUTHN-005
    statement: "Every authorization response MUST return state unchanged when the request carried one."
    rationale: "The client matches a response to its request by state."
    level: MUST
    source: v1-parity
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "4.1.2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774, 775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-028
    area: AUTHN
    split_from: REQ-AUTHN-005
    statement: "Discovery MUST advertise authorization_response_iss_parameter_supported."
    rationale: "A relying party learns from discovery that it can require the parameter."
    level: MUST
    source: v1-parity
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-10, section: "3", depth: Full}
      - {id: ST-29, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774, 775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-AUTHN-006
    area: AUTHN
    statement: "Discovery documents MUST list exactly the endpoints, grant types, algorithms and parameters that the installation serves."
    rationale: "A relying party configures itself from discovery, so any untruth misleads it."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-05, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: test-vectors, ref: "own golden (actors/entry/tests/testdata/discovery.json): no request_uri, iss on every redirect, pairwise subjects; entry, session and signer tests read it"}
  - id: REQ-AUTHN-029
    area: AUTHN
    split_from: REQ-AUTHN-006
    statement: "Discovery documents MUST be served at both the OpenID and the OAuth well-known locations, including the path-inserted URL."
    rationale: "Clients look in either location depending on their library."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-05, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: integration-test, ref: "both-location fetch test"}
  - id: REQ-AUTHN-030
    area: AUTHN
    split_from: REQ-AUTHN-006
    statement: "The issuer in a discovery document MUST equal the iss value byte for byte."
    rationale: "A mismatch breaks issuer validation in every relying party."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-29, section: "4", depth: Full}
      - {id: ST-05, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774]
    verification:
      - {kind: conformance-suite, ref: "OIDF Config OP"}
      - {kind: integration-test, ref: "byte-equality test"}
  - id: REQ-AUTHN-007
    area: AUTHN
    statement: "The authorization endpoint MUST honour prompt=none and prompt=login."
    rationale: "Silent checks must never show UI and must report why interaction is needed."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-031
    area: AUTHN
    split_from: REQ-AUTHN-007
    statement: "The authorization endpoint MUST answer prompt=none without rendering a page."
    rationale: "A silent check that shows UI breaks embedded clients."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [775]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "no-render test for prompt=none"}
  - id: REQ-AUTHN-032
    area: AUTHN
    split_from: REQ-AUTHN-007
    statement: "The authorization endpoint MUST refuse prompt=none combined with another value."
    rationale: "The combination has no defined meaning."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
    issues: [775]
    verification:
      - {kind: integration-test, ref: "prompt combination matrix"}
  - id: REQ-AUTHN-008
    area: AUTHN
    statement: "The authorization endpoint MUST force a new authentication when max_age is exceeded."
    rationale: "Relying parties use auth_time to decide freshness."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [775, 776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "max_age test"}
  - id: REQ-AUTHN-033
    area: AUTHN
    split_from: REQ-AUTHN-008
    statement: "The auth_time claim in issued tokens MUST be the time of the most recent user authentication event."
    rationale: "Relying parties use auth_time to decide freshness."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Full}
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [775, 776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "federated auth_time test"}
  - id: REQ-AUTHN-009
    area: AUTHN
    statement: "When acr_values are sent, sluis MUST either satisfy one of them or fail with unmet_authentication_requirements."
    rationale: "A silent downgrade tells a relying party the user was strongly authenticated when they were not."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: ST-24, section: "3", depth: Partial}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "acr matrix (known, unknown, restricted, cool-down)"}
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-AUTHN-034
    area: AUTHN
    split_from: REQ-AUTHN-009
    statement: "sluis MUST NOT silently downgrade a requested authentication level."
    rationale: "A silent downgrade tells a relying party the user was strongly authenticated when they were not."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "3.1.2.1", depth: Partial}
      - {id: ST-24, section: "3", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "downgrade negative test"}
  - id: REQ-AUTHN-010
    area: AUTHN
    statement: "An authentication from an upstream identity provider MUST NOT raise the assurance level above the ceiling configured for that connection."
    rationale: "Upstream claims are not evidence sluis has verified."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Partial}
      - {id: NC-01, section: "8176", depth: Partial}
    issues: [916]
    verification:
      - {kind: integration-test, ref: "federated acr ceiling test"}
  - id: REQ-AUTHN-011
    area: AUTHN
    statement: "The authorization endpoint MUST accept the claims request parameter and ignore it."
    rationale: "Discovery says claims_parameter_supported is false, so a client may send claims and no claim, acr or amr of a token may depend on it (owner decision 2026-11-07)."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.5", depth: Partial}
      - {id: ST-23, section: "2", depth: Partial}
    issues: [885]
    verification:
      - {kind: integration-test, ref: "a request with a claims object reaches session as the request without it, by GET and by POST"}
  - id: REQ-AUTHN-035
    area: AUTHN
    split_from: REQ-AUTHN-011
    statement: "A claim, acr or amr of a token MUST NOT depend on the claims request parameter."
    rationale: "A narrow claims surface avoids undefined disclosure behaviour."
    level: MUST
    source: stakeholder-ciam
    status: partial
    gap: no-proving-test
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-28, section: "5.5", depth: Partial}
      - {id: ST-23, section: "2", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "the person smoke signs in with an essential name claim and the ID token and the userinfo answer carry what a request without it carries"}
  - id: REQ-AUTHN-012
    area: AUTHN
    statement: "A protocol endpoint MUST act on only the parameters on its closed list in a request made to sluis; the authorization endpoint ignores every other name and audits only the number of names it ignored, and every other endpoint refuses it."
    rationale: "A client must not believe a requirement was honoured when it was not, yet the authorization endpoint ignores what it does not recognise (RFC 6749 section 3.1) and records no name, because the caller chooses the names; a response from an upstream is not a request made to sluis (ADR 0025)."
    level: MUST
    source: security-review
    status: done
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "2", depth: Partial}
      - {id: ST-01, section: "3.1", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "closed-list acceptance test: extra=foobar, claims and a hint are ignored at the authorization endpoint, and the audit record holds their count and no name"}
  - id: REQ-AUTHN-036
    area: AUTHN
    split_from: REQ-AUTHN-012
    statement: "Each protocol endpoint MUST refuse with invalid_request a parameter of a request made to sluis that is not on its closed list, except that the authorization endpoint ignores it and refuses only resource, audience, authorization_details and dpop_jkt."
    rationale: "Refusing instead of ignoring prevents a client from believing a requirement was honoured, and the authorization endpoint refuses the parameters that narrow or bind what is issued, resource and audience (the audience of a token, REQ-ISO-029), authorization_details (its permissions) and dpop_jkt (the key it is bound to), because ignoring one would issue something other than what was asked."
    level: MUST
    source: security-review
    status: partial
    gap: no-proving-test
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "2", depth: Partial}
      - {id: ST-01, section: "3.1", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "one negative test per refused input: resource, audience, authorization_details and dpop_jkt at the authorization endpoint, and a name off the list at each other endpoint"}
      - {kind: integration-test, ref: "test that no refused row is accepted silently"}
  - id: REQ-AUTHN-037
    area: AUTHN
    split_from: REQ-AUTHN-012
    statement: "Each protocol endpoint MUST refuse a repeated parameter, a bad escape, a control character and a size over the limit in a request made to sluis, in a name that it ignores too."
    rationale: "A repeat is read differently by different parsers, and a name that is ignored still comes from outside; refusing instead of ignoring prevents a client from believing a requirement was honoured."
    level: MUST
    source: security-review
    status: done
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-14, section: "2", depth: Partial}
      - {id: ST-01, section: "3.1", depth: Partial}
    issues: [796]
    verification:
      - {kind: integration-test, ref: "repeated-parameter test, with an ignored name repeated, badly escaped, with a control character and over the size limit"}
  - id: REQ-AUTHN-013
    area: AUTHN
    statement: "sluis SHOULD serve pushed authorization requests with a single-use request_uri."
    rationale: "Pushing parameters on the back channel protects integrity and confidentiality of the request."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP"}
      - {kind: integration-test, ref: "reuse test"}
  - id: REQ-AUTHN-038
    area: AUTHN
    split_from: REQ-AUTHN-013
    statement: "A request_uri SHOULD be bound to the client that pushed it."
    rationale: "A foreign client must not redeem another client's request."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "foreign-client test"}
  - id: REQ-AUTHN-039
    area: AUTHN
    split_from: REQ-AUTHN-013
    statement: "A request_uri SHOULD expire within 60 seconds."
    rationale: "A short lifetime limits replay."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "expiry test"}
  - id: REQ-AUTHN-040
    area: AUTHN
    split_from: REQ-AUTHN-013
    statement: "For a client that requires PAR, the authorization endpoint SHOULD accept only a pushed request_uri."
    rationale: "A client that requires PAR must not fall back to an unprotected request."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-16, section: "2", depth: Full}
      - {id: ST-37, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP"}
      - {kind: integration-test, ref: "PAR-required client test"}
  - id: REQ-AUTHN-014
    area: AUTHN
    statement: "sluis MAY accept signed request objects (JAR) passed inside a pushed authorization request for clients of a message-signing profile."
    rationale: "Message signing needs non-repudiable requests."
    level: MAY
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-17, section: "6", depth: Full}
      - {id: ST-38, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-MS"}
  - id: REQ-AUTHN-015
    area: AUTHN
    statement: "sluis MUST NOT serve the resource owner password credentials grant."
    rationale: "Each is deprecated or enlarges the attack surface."
    level: MUST
    source: design-decision
    status: done
    milestone: v1-parity
    runtimes: all
    standards:
