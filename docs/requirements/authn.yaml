  - id: REQ-AUTHN-016
    area: AUTHN
    statement: "The authorization endpoint MUST serve the query response mode only."
    rationale: "Query-only keeps responses simple and avoids form-post browser quirks."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
