    issues: [850]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-043
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve the session-management iframe."
    rationale: "The iframe depends on third-party cookies."
    level: MUST
    source: design-decision
    status: partial
    gap: no-proving-test
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-33, section: "1", depth: Full}
    issues: [850]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-044
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve third-party-initiated login."
    rationale: "Third-party-initiated login is a login CSRF vector, and no app launcher needs it yet (ADR 0017)."
    level: MUST
    source: design-decision
    status: partial
    gap: no-proving-test
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-35, section: "4", depth: Full}
    issues: [850]
    verification:
      - {kind: integration-test, ref: "404 test"}
  - id: REQ-AUTHN-045
    area: AUTHN
    split_from: REQ-AUTHN-015
    statement: "sluis MUST NOT serve client-initiated backchannel authentication."
    rationale: "The flow is not needed for sign-in."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-36, section: "1", depth: Full}
    issues: [850]
    superseded_by: [REQ-AUTHN-063, REQ-AUTHN-064, REQ-AUTHN-065]
    verification:
