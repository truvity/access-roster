  - id: REQ-AUTHN-076
    area: AUTHN
    statement: "The break-glass enrolment tools MUST only show the JSON to commit and store nothing."
    rationale: "The credential is config, so only a reviewed commit adds it (ADR 0017)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1178]
    verification:
