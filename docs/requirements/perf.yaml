# PERF: Scale and performance
schema: 1
area: PERF
requirements:
  - id: REQ-PERF-001
    area: PERF
    statement: "Changes to the sign-in, code and refresh paths MUST update the recorded read and write budgets and state the reason."
    rationale: "Budgets prevent silent cost growth."
    level: MUST
    source: v1-parity
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "budget regression tests"}
  - id: REQ-PERF-002
    area: PERF
    statement: "Mass revocation of sessions MUST be paginated, asynchronous and idempotent."
    rationale: "A large revocation must not exceed a time budget."
    level: MUST
    source: stakeholder-ciam
    status: planned
    runtimes: all
    standards:
      - {id: ST-97, section: "1", depth: Partial}
    issues: [1062]
    verification:
      - {kind: integration-test, ref: "100000-session revocation test"}
  - id: REQ-PERF-003
    area: PERF
    statement: "The documentation of an installation MUST state its measured token-signing rate with the date, the versions and the key service quota in force."
    rationale: "A capacity figure rots and depends on a quota."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [878]
    manual_reason: "A statement in published documentation is checked by reading it."
    verification:
      - {kind: manual, ref: "documentation review"}
  - id: REQ-PERF-004
    area: PERF
    statement: "The capacity result of an installation MUST name the first bottleneck and what the test setup over- and under-counts."
    rationale: "A figure without its limit and its bias cannot be used."
    level: MUST
    source: design-decision
    status: planned
    runtimes: all
    standards: []
    issues: [878]
    manual_reason: "A result is checked by reading it against the shape of a result."
    verification:
      - {kind: manual, ref: "result review"}

  # ---- spikes that gate capacity claims (decision 0037)
  - id: REQ-PERF-005
    area: PERF
    statement: "On Lambda, store@ and key@ MUST run as functions of their own, with no in-process store exception for any work actor."
    rationale: "The latency spike measured the invoke hops within the sign-in budget, so every request keeps both independent checks (ADR 0003, ADR 0037)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless"]
    standards: []
    issues: [1179]
    verification:
      - {kind: integration-test, ref: "the serverless installation's function list: store@ and key@ are separate functions and no work actor links the store"}
  - id: REQ-PERF-007
    area: PERF
    split_from: REQ-PERF-005
    statement: "A sign-in on the serverless installation MUST complete within 500 ms at p99 with at least 1024 MB of memory for each function on the sign-in path."
    rationale: "The budget is the measured result of the latency spike, and a smaller function slows the cryptography on the path (ADR 0037)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["serverless"]
    standards: []
    issues: [1179]
    verification:
      - {kind: integration-test, ref: "load test of the sign-in path on Lambda with 1024 MB functions: p99 under 500 ms, dated"}
  - id: REQ-PERF-006
    area: PERF
    statement: "The memory per unit on a 2 GB board with ca and ssh-ca separate, and the directory re-sync cost, MUST be measured before the board capacity is promised."
    rationale: "A capacity number enters a record only after a dated measurement (ADR 0037)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    standards: []
    issues: [1180]
    verification:
      - {kind: integration-test, ref: "the dated result in ADR 0037, Board capacity: memory per unit and re-sync cost"}
