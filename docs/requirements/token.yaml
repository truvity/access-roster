    area: TOKEN
    statement: "The relying-party documentation MUST state the verifier contract: honour the max-age of the key set, and fetch it again when a token names an unfamiliar kid (OpenID Connect Core section 10.1.1)."
    rationale: "The lead time of a new key assumes a verifier that follows HTTP caching and the discovery rule, so the page must say what sluis relies on (ADR 0006)."
