  - id: REQ-TOKEN-043
    area: TOKEN
    statement: "signer MUST sign the ID token of an audience whose signing_alg is RS256 with RS256, and every other token with ES384, by the audience's declaration alone."
    rationale: "The audience decides and the caller cannot, so a compromised session or exchange cannot pick a weaker or a different key, and the bearer check of session, which takes ES384 access tokens alone, never meets an RS256 one (ADR 0006)."
    level: MUST
    source: design-decision
