# TOKEN: Tokens and token endpoint
schema: 1
area: TOKEN
requirements:
  - id: REQ-TOKEN-001
    area: TOKEN
    statement: "An access token issued as a JWT MUST carry the media type at+jwt in its header."
    rationale: "A typed access token cannot be confused with an ID token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.1", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-49, section: "4", depth: Full}
    issues: [776]
    verification:
      - {kind: test-vectors, ref: "own at+jwt claim vectors"}
  - id: REQ-TOKEN-017
    area: TOKEN
    split_from: REQ-TOKEN-001
    statement: "An access token issued as a JWT MUST carry a kid in its header."
    rationale: "Verifiers select the key by kid."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have: signer's cross-check with go-jose (a token signed through key@, verified against the
    # published key set, which finds the key by the kid of the header). No outside JOSE vector set is in the repository.
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.1", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-49, section: "4", depth: Full}
    issues: [776]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "signer signs an access token through key@ and go-jose verifies it against the published key set, selecting the key by the kid of the header (actors/signer/tests/sign.rs)"}
  - id: REQ-TOKEN-018
    area: TOKEN
    split_from: REQ-TOKEN-001
    statement: "An access token issued as a JWT MUST carry the claims iss, sub, aud, exp, iat and jti."
    rationale: "A typed access token cannot be confused with an ID token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.1", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-49, section: "4", depth: Full}
    issues: [776]
    verification:
      - {kind: test-vectors, ref: "own at+jwt claim vectors"}
  - id: REQ-TOKEN-002
    area: TOKEN
    statement: "sluis MUST sign tokens with the algorithm configured for the audience."
    rationale: "Verifiers need a stable key set and a default that every driver supports."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have (signer's go-jose cross-check and claims-vectors.json hold ES384, the one algorithm there is).
    # partial: no algorithm is configurable for an audience yet (REQ-TOKEN-019 is the default; a choice per audience is #788, v1 parity), and
    # the OIDF Config OP plan has not run.
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
      - {id: ST-106, section: "test plan", depth: Full}
    issues: [774, 788, 800]
    verification:
      - {kind: test-vectors, ref: "tests/testdata/token/claims-vectors.json (the algorithm ES384 and the header types), and signer's go-jose cross-check of a signed token"}
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-TOKEN-019
    area: TOKEN
    split_from: REQ-TOKEN-002
    statement: "Token signing MUST default to ES384 when no algorithm is configured for the audience."
    rationale: "One curve that every driver supports keeps the default simple."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have: the header key@ signs is alg ES384 (the signing input it saw), and go-jose verifies the token
    # against the published key set. No Wycheproof vectors are in the repository.
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
      - {id: ST-106, section: "test plan", depth: Full}
    issues: [774, 788, 800]
    tests: [actors/signer/tests/sign.rs]
    verification:
      - {kind: integration-test, ref: "signer, with no algorithm configured, has key@ sign a header whose alg is ES384, and go-jose verifies the token against the published key set (actors/signer/tests/sign.rs)"}
  - id: REQ-TOKEN-020
    area: TOKEN
    split_from: REQ-TOKEN-002
    statement: "sluis MUST publish every pre-published, active and retiring key in the key set with a kid."
    rationale: "Verifiers need a stable key set and a default that every driver supports."
    level: MUST
    source: v1-parity
    # Reworded 2026-11-07 to the proof we have: tests/testdata/key/keyset-vectors.json (known answers made with openssl) and the state test
    # in entry's discovery.rs. No RFC 7517 appendix vectors are in the repository.
    # partial: the OIDF Config OP plan has not run.
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [774, 788, 800]
    verification:
      - {kind: test-vectors, ref: "tests/testdata/key/keyset-vectors.json: the key set lists a pre-published, an active and a retiring key, each with a kid, and no other state; entry and signer both hold their key set to it"}
      - {kind: conformance-suite, ref: "OIDF Config OP"}
  - id: REQ-TOKEN-003
    area: TOKEN
    statement: "An access token MUST name exactly one audience."
    rationale: "A single-audience token cannot be replayed at another resource."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-52, section: "4.1.3", depth: Full}
      - {id: ST-56, section: "3.3", depth: Full}
    issues: [776, 791]
    verification:
      - {kind: integration-test, ref: "property test over all grants"}
  - id: REQ-TOKEN-004
    area: TOKEN
    statement: "A resource indicator MUST NOT appear in the audience of an ID token."
    rationale: "The ID token audience is the client; leaking the resource confuses verifiers."
    level: MUST
    source: security-review
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-08, section: "2", depth: Full}
    issues: [776, 791]
    verification:
      - {kind: integration-test, ref: "negative test: the ID token audience is the client alone, and a resource indicator on the sign-in or on the code and refresh grants is refused before session sees it"}
  - id: REQ-TOKEN-005
    area: TOKEN
    statement: "sluis MUST issue an access token for a specific resource only when the request names it with the resource parameter."
    rationale: "Audience restriction depends on the client naming the target."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-08, section: "2", depth: Full}
    issues: [791]
    verification:
      - {kind: integration-test, ref: "resource matrix across code and refresh grants, with the audience of the ID token checked in each cell (REQ-TOKEN-004)"}
  - id: REQ-TOKEN-021
    area: TOKEN
    split_from: REQ-TOKEN-005
    statement: "A request for an unknown or unlisted resource MUST fail with invalid_target."
    rationale: "Audience restriction depends on the client naming the target."
    level: MUST
    source: v1-parity
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-08, section: "2", depth: Full}
    issues: [791]
    verification:
      - {kind: integration-test, ref: "invalid_target negative test"}
  - id: REQ-TOKEN-006
    area: TOKEN
    statement: "Personal data such as names and e-mail addresses MUST be released only when the granted scopes request it."
    rationale: "Minimal disclosure limits the impact of a leaked token."
    level: MUST
    source: v1-parity
    # Gate: UserInfo releases only `sub` until the person's state (hold, suspension) is read before any other claim is released, and the
    # scope that a refresh narrowed to is enforced; today it reads the chain's own scope and not the person (ADR 0018).
    # Owner decision 2026-11-07: to v1 parity, with this gate kept. The first working version releases `sub` only.
    status: partial
    gap: partly-built
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-28, section: "5.4", depth: Full}
      - {id: ST-56, section: "3.2", depth: Partial}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "claim-release matrix, and UserInfo reads the hold and the suspension and the narrowed scope before it releases a claim beyond sub"}
  - id: REQ-TOKEN-022
    area: TOKEN
    split_from: REQ-TOKEN-006
    statement: "Personal data MUST NOT appear in access tokens issued for another resource."
    rationale: "Minimal disclosure limits the impact of a leaked token."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.4", depth: Full}
      - {id: ST-56, section: "3.2", depth: Partial}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "cross-resource token scan"}
  - id: REQ-TOKEN-007
    area: TOKEN
    statement: "A deployment MAY configure access tokens for people to omit client_id and carry azp instead."
    rationale: "Some integrators separate person tokens from machine tokens by claim presence."
    level: MAY
    source: stakeholder-ciam
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-13, section: "2.2", depth: Partial}
      - {id: ST-52, section: "4", depth: Full}
    issues: [776]
    superseded_by: [REQ-TOKEN-023]
    verification:
      - {kind: integration-test, ref: "configured-variant test"}
  - id: REQ-TOKEN-023
    area: TOKEN
    split_from: REQ-TOKEN-007
    statement: "The default access token format MUST conform to the JWT access token profile."
    rationale: "A default that follows the profile keeps ordinary verifiers working."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-13, section: "2.2", depth: Partial}
      - {id: ST-52, section: "4", depth: Full}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "default-profile conformance test"}
  - id: REQ-TOKEN-008
    area: TOKEN
    statement: "The userinfo endpoint MUST return only claims granted by scope for a token whose session is still live."
    rationale: "A token must not outlive the sign-in it came from."
    level: MUST
    source: v1-parity
    # Owner decision 2026-11-07: REQ-TOKEN-006 is v1 parity, so the first working version releases the sub and nothing else, which is
    # never more than a scope grants. The verification is that answer; the claims the scopes profile and email grant, and the OIDF
    # userinfo modules that need them, come with REQ-TOKEN-006.
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.3", depth: Full}
      - {id: ST-02, section: "3", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [778, 793]
    tests: [actors/session/internal/sessiond/userinfo_test.go, actors/entry/tests/edge.rs]
    verification:
      - {kind: integration-test, ref: "UserInfo answers the sub of the live session's ID token and no other claim, whatever the scope"}
  - id: REQ-TOKEN-024
    area: TOKEN
    split_from: REQ-TOKEN-008
    statement: "The userinfo endpoint MUST answer 401 for a token whose session ended."
    rationale: "A token must not outlive the sign-in it came from."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "5.3", depth: Full}
      - {id: ST-02, section: "3", depth: Full}
    issues: [778, 793]
    tests: [actors/session/internal/sessiond/userinfo_test.go]
    verification:
      - {kind: integration-test, ref: "post-logout test"}
  - id: REQ-TOKEN-009
    area: TOKEN
    statement: "The revocation endpoint MUST accept a token together with a client authentication."
    rationale: "A uniform answer does not reveal token existence."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-11, section: "2", depth: Full}
    issues: [778]
    tests: [actors/session/internal/sessiond/revoke_test.go, actors/entry/tests/edge.rs]
    verification:
      - {kind: integration-test, ref: "revocation request test"}
  - id: REQ-TOKEN-025
    area: TOKEN
    split_from: REQ-TOKEN-009
    statement: "The revocation endpoint MUST end exactly the grant that a refresh token belongs to."
    rationale: "Revoking one grant must not end the others."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-11, section: "2", depth: Full}
    issues: [778]
    tests: [actors/session/internal/sessiond/revoke_test.go]
    verification:
      - {kind: integration-test, ref: "grant-scope revocation test"}
  - id: REQ-TOKEN-026
    area: TOKEN
    split_from: REQ-TOKEN-009
    statement: "The revocation endpoint MUST answer 200 for an unknown refresh token or a refresh token of another client, and 400 unsupported_token_type for a token shaped like a JWT."
    rationale: "A uniform answer does not reveal token existence, and a token shaped like a JWT is answered by its shape alone, so a genuine access token is not told it was revoked (recall is REQ-SESS-055)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-11, section: "2", depth: Full}
    issues: [778]
    tests: [actors/session/internal/sessiond/revoke_test.go]
    verification:
      - {kind: integration-test, ref: "uniform-answer test"}
  - id: REQ-TOKEN-010
    area: TOKEN
    statement: "Token endpoint responses MUST be JSON."
    rationale: "Tokens must never be cached."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "5.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-TOKEN-027
    area: TOKEN
    split_from: REQ-TOKEN-010
    statement: "Token endpoint responses MUST carry Cache-Control no-store."
    rationale: "Tokens must never be cached."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "5.1", depth: Full}
    issues: [776]
    verification:
      - {kind: integration-test, ref: "header test"}
  - id: REQ-TOKEN-028
    area: TOKEN
    split_from: REQ-TOKEN-010
    statement: "A token endpoint error MUST be reported as an error code with status 400, or 401 for invalid_client."
    rationale: "Clients branch on the status and the code."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-01, section: "5.1", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
      - {kind: integration-test, ref: "error status test"}
  - id: REQ-TOKEN-011
    area: TOKEN
    statement: "sluis SHOULD bind access tokens to a client-held key with DPoP for clients of a sender-constrained profile."
    rationale: "Sender-constrained tokens cannot be replayed by a thief."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-18, section: "7", depth: Full}
      - {id: ST-58, section: "3", depth: Full}
    issues: [912]
    verification:
      - {kind: conformance-suite, ref: "FAPI2-SP (DPoP variant)"}
      - {kind: integration-test, ref: "proof-replay tests"}
  - id: REQ-TOKEN-029
    area: TOKEN
    split_from: REQ-TOKEN-011
    statement: "A DPoP-bound access token SHOULD carry a cnf claim."
    rationale: "The cnf claim lets a resource server check the binding."
    level: SHOULD
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-18, section: "7", depth: Full}
      - {id: ST-58, section: "3", depth: Full}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "cnf claim test"}
  - id: REQ-TOKEN-012
    area: TOKEN
    statement: "A DPoP proof sent by a client of a profile that does not use DPoP MUST be refused with invalid_request."
    rationale: "Silently issuing a bearer token to a client that asked for binding is a downgrade."
    level: MUST
    source: stakeholder-ciam
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-18, section: "5", depth: Partial}
    issues: [912]
    verification:
      - {kind: integration-test, ref: "negative test"}
  - id: REQ-TOKEN-013
    area: TOKEN
    statement: "An ID token MUST carry iss, sub, aud equal to the client, exp and iat."
    rationale: "The ID token is the proof of sign-in the client verifies."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-TOKEN-030
    area: TOKEN
    split_from: REQ-TOKEN-013
    statement: "An ID token MUST carry nonce when the request supplied one."
    rationale: "The nonce binds the token to the request."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-TOKEN-031
    area: TOKEN
    split_from: REQ-TOKEN-013
    statement: "An ID token MUST carry auth_time when it was requested."
    rationale: "The ID token is the proof of sign-in the client verifies."
    level: MUST
    source: v1-parity
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
      - {id: ST-52, section: "4", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [776]
    verification:
      - {kind: conformance-suite, ref: "OIDF Basic OP"}
  - id: REQ-TOKEN-014
    area: TOKEN
    statement: "sluis MAY serve token introspection to explicitly permitted confidential clients, reporting active=false once the session has ended."
    rationale: "Resource servers sometimes need liveness."
    level: MAY
    source: stakeholder-ciam
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: ST-12, section: "2", depth: Full}
    issues: [927]
    verification:
      - {kind: integration-test, ref: "introspection tests"}
  - id: REQ-TOKEN-015
    area: TOKEN
    statement: "sluis MAY issue pairwise subject identifiers per sector, derived from the sluis subject with a keyed hash of one non-rotating key per tenant, so that two sectors cannot correlate a person."
    rationale: "Pairwise subjects prevent cross-service tracking, while single sign-on follows the sluis session and does not depend on the subject."
    level: MAY
    source: stakeholder-ciam
    status: partial
    gap: partly-built
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "8.1", depth: Partial}
      - {id: NC-06, section: "2104", depth: Full}
      - {id: ST-104, section: "test plan", depth: Full}
    issues: [1024]
    verification:
      - {kind: test-vectors, ref: "own subject vectors"}
      - {kind: conformance-suite, ref: "OIDF Basic OP with pairwise subject"}
  - id: REQ-TOKEN-016
    area: TOKEN
    statement: "A subject identifier MUST be an opaque string."
    rationale: "Reversible subjects leak the underlying identifier."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "subject opacity test"}
  - id: REQ-TOKEN-032
    area: TOKEN
    split_from: REQ-TOKEN-016
    statement: "A subject identifier MUST NOT be derived with a reversible cipher."
    rationale: "Reversible subjects leak the underlying identifier."
    level: MUST
    source: stakeholder-ciam
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-28, section: "2", depth: Full}
    issues: [1081]
    verification:
      - {kind: integration-test, ref: "subject derivation review test"}
  - id: REQ-TOKEN-033
    area: TOKEN
    statement: "An access token and an ID token MUST carry in groups only the held grants whose scope and thing appear among the pairs of the audience's requires."
    rationale: "A relying party must not read a grant meant for another system (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "hold grants on two things: the token for the first audience carries only that thing's grants"}
  - id: REQ-TOKEN-034
    area: TOKEN
    statement: "sluis MUST NOT issue a claim that is not in the declared claim set of its token type."
    rationale: "A fixed set lets the claims be tested as a whole and keeps configuration from widening a token (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "a configuration that names another claim is refused at load; no token carries one"}
  - id: REQ-TOKEN-035
    area: TOKEN
    statement: "A token MUST omit acr, amr and auth_time when the upstream sent none."
    rationale: "An absent value means unknown, and a default would claim an assurance that was never shown."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776, 1106]
    verification:
      - {kind: integration-test, ref: "sign in through an upstream that sends none of them: the tokens carry none"}
  - id: REQ-TOKEN-036
    area: TOKEN
    statement: "The access and ID tokens of a person MUST default to a lifetime of 1 hour."
    rationale: "The default is v1's, so relying parties tuned to it keep working (ADR 0020)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [776]
    verification:
      - {kind: integration-test, ref: "issue a token with no setting: exp minus iat is 3600 seconds"}
  - id: REQ-TOKEN-037
    area: TOKEN
    statement: "A token's exp MUST be no later than the earliest of the issuer's token_ttl, the client's ttl_cap, the end of its session and the end of the exchanged proof."
    rationale: "A token must never outlive what it came from (ADR 0020)."
    level: MUST
    source: design-decision
