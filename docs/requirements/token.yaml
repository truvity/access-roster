    statement: "signer MUST refuse an ID token for an RS256 audience when no RS256 key is active, and sign it with no other key."
    rationale: "A relying party that asked for RS256 would meet an alg it did not expect, so the answer is a refusal with a closed reason, never a downgrade (ADR 0006)."
