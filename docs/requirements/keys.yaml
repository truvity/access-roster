# KEYS: Keys and signing
schema: 1
area: KEYS
requirements:
  - id: REQ-KEYS-001
    area: KEYS
    statement: "Every private-key operation MUST go through key@."
    rationale: "One holder is where the rules, the audit and the content checks sit."
    level: MUST
    source: v1-parity
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [key]
    standards:
      - {id: ST-89, section: "6", depth: Full}
      - {id: ST-88, section: "1", depth: Full}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [800]
    verification:
      - {kind: integration-test, ref: "actor registry check: no actor other than key@ holds a PIN or a KMS permission"}
      - {kind: integration-test, ref: "business code that imports a key-management SDK fails the import lint"}
  - id: REQ-KEYS-013
    area: KEYS
    split_from: REQ-KEYS-001
    statement: "Business code MUST NOT import a key-management SDK."
    rationale: "One port makes drivers swappable and auditable."
    level: MUST
    source: v1-parity
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-89, section: "6", depth: Full}
      - {id: ST-88, section: "1", depth: Full}
    issues: [800]
    manual_reason: "The rule constrains the source tree; a reviewer confirms that the import lint covers every package."
    verification:
      - {kind: manual, ref: "import lint"}
  - id: REQ-KEYS-002
    area: KEYS
    statement: "A private signing key held by a hardware or managed key driver MUST be non-extractable."
    rationale: "A key that cannot leave the device cannot be stolen from disk."
    level: MUST
    source: v1-parity
    status: partial
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Full}
      - {id: ST-89, section: "6", depth: Full}
    issues: [800]
    verification:
      - {kind: manual, ref: "driver attestation review"}
      - {kind: integration-test, ref: "export negative test"}
  - id: REQ-KEYS-003
    area: KEYS
    statement: "sluis MUST support signing with PS256, ES256 and EdDSA for profiles that require the FAPI 2.0 algorithm set."
    rationale: "FAPI 2.0 forbids ES384; the default keeps one curve everywhere else."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-55, section: "RFC 8037", depth: Partial}
      - {id: ST-37, section: "5.4", depth: Full}
      - {id: ST-106, section: "test plan", depth: Full}
    issues: [912, 800]
    verification:
      - {kind: test-vectors, ref: "Wycheproof ECDSA, RSA PSS and EdDSA"}
      - {kind: conformance-suite, ref: "FAPI2-SP"}
  - id: REQ-KEYS-014
    area: KEYS
    split_from: REQ-KEYS-003
    statement: "sluis MUST NOT select PS256, ES256 or EdDSA unless a profile or an audience requires it."
    rationale: "ES384 stays the default everywhere else, so one curve serves the rest."
    level: MUST
    source: design-decision
    status: partial
    milestone: ciam-upstream
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
    issues: [912, 800]
    verification:
      - {kind: integration-test, ref: "default-algorithm test"}
  - id: REQ-KEYS-004
    area: KEYS
    statement: "Each key driver MUST declare which signature algorithms it supports."
    rationale: "PS256 on a hardware token is slow and EdDSA needs recent firmware."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: ["bare-metal", "serverless", "kubernetes"]
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-88, section: "1", depth: Partial}
    issues: [800]
    verification:
      - {kind: integration-test, ref: "driver declaration test"}
  - id: REQ-KEYS-015
    area: KEYS
    split_from: REQ-KEYS-004
    statement: "`sluis config check` MUST refuse a policy that pins an algorithm the configured driver cannot sign."
    rationale: "PS256 on a hardware token is slow and EdDSA needs recent firmware."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: ["bare-metal", "serverless", "kubernetes"]
    standards:
      - {id: ST-51, section: "3", depth: Partial}
      - {id: ST-88, section: "1", depth: Partial}
    issues: [800, 864, 1419]
    verification:
      - {kind: integration-test, ref: "config-check matrix per driver"}
  - id: REQ-KEYS-005
    area: KEYS
    statement: "RSA keys MUST be used only for a named audience or algorithm that requires them, and with a key separate from the default."
    rationale: "Interoperating clouds and libraries require RS256 and PS256."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-51, section: "3.3", depth: Partial}
    issues: [788]
    verification:
      - {kind: integration-test, ref: "per-audience key separation test"}
  - id: REQ-KEYS-006
    area: KEYS
    statement: "sluis MUST publish its public keys as a key set whose entries each carry kid, kty, alg and use."
    rationale: "Key rotation depends on timely discovery."
    level: MUST
    source: v1-parity
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    standards:
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
    issues: [774]
    verification:
      - {kind: test-vectors, ref: "RFC 7517 appendix"}
  - id: REQ-KEYS-016
    area: KEYS
    split_from: REQ-KEYS-006
    statement: "sluis MUST serve the published key set with `Cache-Control: public, max-age=300`."
    rationale: "Rotation depends on timely discovery, and the lead time of a new key is derived from this figure (ADR 0006)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-50, section: "5", depth: Full}
      - {id: ST-53, section: "3", depth: Full}
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a GET of the key set answers with Cache-Control public, max-age=300, from the server and through the edge"}
  - id: REQ-KEYS-084
    area: KEYS
    split_from: REQ-KEYS-006
    statement: "The edge cache in front of the published key set MUST NOT keep it for longer than its max-age of 300 seconds."
    rationale: "The edge time to live is a part of the lead time of a new token-signing key, so it is bounded by the same figure (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the edge configuration of a test installation is read: the time to live of the key set is at most 300 seconds, and a key removed at the server is gone from the edge within it"}
  - id: REQ-KEYS-007
    area: KEYS
    statement: "Key rotation MUST overlap for at least the token lifetime plus allowed clock skew, except a revocation for compromise under REQ-KEYS-087."
    rationale: "A new key must be verifiable before it signs, and a compromised key must not wait for an overlap that exists for a healthy one (ADR 0041)."
    level: MUST
    source: v1-parity
    status: done
    milestone: first-version
    runtimes: all
    standards:
      - {id: ST-50, section: "5", depth: Full}
    issues: [800]
    verification:
      - {kind: integration-test, ref: "rotation test"}
  - id: REQ-KEYS-008
    area: KEYS
    statement: "The software driver of key@ MUST refuse to start when the boundary's environment is production."
    rationale: "A development configuration loaded on the wrong board must not make a software key a production authority key."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [867]
    verification:
      - {kind: integration-test, ref: "the software driver is started with a production boundary and refuses; started in staging it warns"}
  - id: REQ-KEYS-009
    area: KEYS
    statement: "Keys with different purposes MUST be separate keys."
    rationale: "Cross-protocol key reuse is avoidable."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    standards:
      - {id: ST-62, section: "5280", depth: Partial}
      - {id: ST-65, section: "1", depth: Partial}
    issues: [800]
    manual_reason: "The rule constrains key configuration; a reviewer checks the key-purpose table for each release."
    verification:
      - {kind: manual, ref: "key-purpose table review"}
  - id: REQ-KEYS-017
    area: KEYS
    split_from: REQ-KEYS-009
    statement: "A key MUST NOT be shared between protocols, in particular between certificate signing and SSH certificate signing."
    rationale: "Cross-protocol key reuse is avoidable."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: all
    standards:
      - {id: ST-62, section: "5280", depth: Partial}
      - {id: ST-65, section: "1", depth: Partial}
    issues: [800]
    manual_reason: "The rule constrains key configuration; a reviewer checks the key-purpose table for each release."
    verification:
      - {kind: manual, ref: "key-purpose table review"}
  - id: REQ-KEYS-010
    area: KEYS
    statement: "sluis MUST provide a build that uses a FIPS 140-3 validated cryptographic module."
    rationale: "Regulated users need a validated module."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Full}
    issues: [868]
    superseded_by: ["REQ-KEYS-024", "REQ-KEYS-025"]
    verification:
      - {kind: integration-test, ref: "FIPS build smoke test"}
      - {kind: manual, ref: "module-version check"}
  - id: REQ-KEYS-018
    area: KEYS
    split_from: REQ-KEYS-010
    statement: "sluis MUST NOT claim FIPS 140-3 validation for itself or for a build that does not use a validated module."
    rationale: "A false claim of validation would mislead regulated users."
    level: MUST
    source: design-decision
    status: partial
    milestone: backlog
    gap: attestation-missing
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Full}
    issues: [868]
    manual_reason: "A claim in the documentation and the release notes is checked by reading them."
    verification:
      - {kind: manual, ref: "documentation and release-note review"}
  - id: REQ-KEYS-024
    area: KEYS
    statement: "Every algorithm that sluis uses to sign, seal, hash or derive keys MUST be a FIPS 140-3 approved algorithm, apart from the named exceptions and the formats that fix their own algorithm."
    rationale: "Staying within the approved set lets a FIPS build variant be added later without changing a format or a stored value."
    level: MUST
    source: design-decision
    status: partial
    milestone: backlog
    gap: no-proving-test
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Partial}
      - {id: ST-89, section: "6", depth: Partial}
    issues: [868]
    verification:
      - {kind: integration-test, ref: "algorithm allow-list test over the signing, sealing and derivation code paths"}
      - {kind: manual, ref: "algorithm inventory review per release"}
  - id: REQ-KEYS-025
    area: KEYS
    statement: "sluis MAY offer a FIPS build variant that uses a FIPS 140-3 validated cryptographic module, added when a customer needs it."
    rationale: "No installation that v2.0 targets needs a certificate, and the certified build would weigh on every build."
    level: MAY
    source: design-decision
    status: out-of-scope
    milestone: backlog
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [868]
    verification:
      - {kind: manual, ref: "release matrix review"}
  - id: REQ-KEYS-011
    area: KEYS
    statement: "An alarm MUST be raised when a value is opened with a retired data key generation, which is a generation whose values have all been re-sealed, so that opens during a re-seal and opens of a compromised evidence generation raise none."
    rationale: "An old generation that still opens something is a sign of a missed re-seal or a stolen key."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [800, 836]
    verification:
      - {kind: integration-test, ref: "alert-rule test: no alarm for opens during the re-seal job of REQ-KEYS-096 or of a compromised evidence generation; the first open after the job raises it"}
  - id: REQ-KEYS-019
    area: KEYS
    split_from: REQ-KEYS-011
    statement: "An alarm MUST be raised on use of a signing key by an unexpected actor."
    rationale: "Key misuse is silent without alarms."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [key]
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [836, 951]
    verification:
      - {kind: integration-test, ref: "alert-rule test (actor)"}
  - id: REQ-KEYS-020
    area: KEYS
    split_from: REQ-KEYS-011
    statement: "An alarm MUST be raised on a new key identifier in a pinned upstream key set."
    rationale: "Key misuse is silent without alarms."
    level: MUST
    source: security-review
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-88, section: "1", depth: Partial}
    issues: [836]
    verification:
      - {kind: integration-test, ref: "alert-rule test (upstream key set)"}
  - id: REQ-KEYS-012
    area: KEYS
    statement: "sluis SHOULD be able to sign with post-quantum algorithms (ML-DSA) once the key drivers support them, selected by policy."
    rationale: "NIST plans deprecation of classical signatures after 2030."
    level: SHOULD
    source: design-decision
    status: planned
    milestone: backlog
    runtimes: all
    standards:
      - {id: ST-57, section: "9964", depth: Full}
      - {id: ST-91, section: "204", depth: Full}
      - {id: ST-93, section: "1", depth: Partial}
    issues: [1029]
    verification:
      - {kind: test-vectors, ref: "NIST ACVP vectors"}
  - id: REQ-KEYS-021
    area: KEYS
    statement: "The keys port MUST provide wrap and unwrap operations for data keys."
    rationale: "Backup data keys are wrapped through the port so that no driver-specific code touches them."
    level: MUST
    source: design-decision
    status: withdrawn
    runtimes: all
    standards:
      - {id: ST-89, section: "6", depth: Partial}
      - {id: NC-10, section: "PIV", depth: Partial}
      - {id: ST-103, section: "test plan", depth: Full}
    issues: [800, 834]
    superseded_by: [REQ-KEYS-032, REQ-KEYS-033]
    verification:
      - {kind: test-vectors, ref: "port suite keys (wrap and unwrap round trip)"}
  - id: REQ-KEYS-022
    area: KEYS
    statement: "The hardware-token PIV driver MUST refuse EdDSA signing on a device whose firmware does not support it."
    rationale: "PIV EdDSA needs a recent device firmware."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    runtimes: ["bare-metal", "kubernetes"]
    standards:
      - {id: NC-10, section: "PIV", depth: Partial}
      - {id: ST-55, section: "RFC 8037", depth: Partial}
    issues: [800]
    verification:
      - {kind: integration-test, ref: "old-firmware refusal test"}
  - id: REQ-KEYS-023
    area: KEYS
    statement: "`sluis config check` SHOULD warn when a pinned algorithm is slow on the configured hardware driver."
    rationale: "PS256 on a hardware token takes about two seconds per signature."
    level: SHOULD
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards:
      - {id: ST-51, section: "3", depth: Partial}
    issues: [788]
    verification:
      - {kind: integration-test, ref: "config-check warning test"}
  - id: REQ-KEYS-026
    area: KEYS
    statement: "A key held by a hardware or managed key driver MUST be generated inside the store that holds it."
    rationale: "A key that existed outside its store cannot be attested and may have been copied."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: integration-test, ref: "on a test card an imported key is refused and a generated key attests; a managed key is created by the store"}
  - id: REQ-KEYS-027
    area: KEYS
    statement: "The workload-issuer key of sluis-node MUST be a key of its own that no other actor uses."
    rationale: "Its callers and its blast radius differ from the token-signing key's, and signing keys are never shared (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    standards: []
    issues: [914, 870]
    verification:
      - {kind: integration-test, ref: "the key@ rules name sluis-node for the workload-issuer purpose and signer for the token-signing purpose, with different slots"}

  # ---- key@: seal, open, sign and mac (decision 0006)
  - id: REQ-KEYS-028
    area: KEYS
    statement: "key@ MUST be the only actor that holds a card PIN or a KMS permission on a key of the boundary other than the backup archive key."
    rationale: "Every authority key, wrapping key and data key is then reachable through one holder whose rules say who may ask for what (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: integration-test, ref: "actor registry check: key@ is the only actor whose holds list names a PIN or a KMS permission"}
      - {kind: integration-test, ref: "on Lambda only the role of the key@ function can call KMS on the boundary's symmetric and signing keys"}
  - id: REQ-KEYS-029
    area: KEYS
    statement: "key@ MUST refuse a Seal, Open, Sign or Mac whose caller has no rule for the purpose and the operation."
    rationale: "The rules are generated from the actor registry, so a compromised actor cannot ask for a purpose it was not given (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [800, 951]
    verification:
      - {kind: test-vectors, ref: "the generated key rules matrix: every actor, purpose and operation not listed is refused"}
      - {kind: integration-test, ref: "an actor asks for another actor's purpose; refused and audited"}
  - id: REQ-KEYS-067
    area: KEYS
    statement: "key@ MUST let a product's emitter ask only for Mac under the tenant's `pseudonym` key."
    rationale: "A product is not a sluis actor, and its one key operation is the pseudonym of a subject before a record leaves its process (ADR 0029)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1120]
    verification:
      - {kind: integration-test, ref: "the emitter's platform identity: Mac under pseudonym accepted; Mac under another purpose, Seal and Open refused"}
  - id: REQ-KEYS-030
    area: KEYS
    statement: "key@ MUST refuse a Seal or an Open of a tenant's data or evidence key whose grant does not name the tenant of the address or the operation, or has expired."
    rationale: "The grant check is the second of two independent checks between an actor and a tenant's sealed value (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: integration-test, ref: "Seal and Open with no grant, with an expired grant, with a grant for another tenant and for another operation; each refused"}
      - {kind: integration-test, ref: "the store's rule switched off: the grant check alone still refuses"}
  - id: REQ-KEYS-031
    area: KEYS
    statement: "key@ MUST record every refusal as an audit fact."
    rationale: "A pattern of refusals is the first sign of a compromised actor (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [key]
    standards: []
    issues: [1210]
    verification:
      - {kind: integration-test, ref: "a refused Open produces an audit fact that names the caller, the purpose and the reason and no value"}
  - id: REQ-KEYS-032
    area: KEYS
    statement: "key@ MUST keep a data key only wrapped and open it only in its own memory."
    rationale: "A data key stored or sent in the clear would give its holder every value sealed under it (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: integration-test, ref: "a scan of the store, the logs and the audit log for the bytes of a data key finds none"}
      - {kind: integration-test, ref: "no API of key@ returns a data key"}
  - id: REQ-KEYS-033
    area: KEYS
    statement: "key@ MUST seal a value with AES-256-GCM under the data key of the address's boundary, tenant and purpose, with the full address as authenticated data."
    rationale: "A value copied to another row, kind, tenant or boundary then no longer opens, so a flaw that lets an actor write somewhere does not let it read what it moved (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: test-vectors, ref: "Wycheproof AES-GCM vectors"}
      - {kind: integration-test, ref: "a ciphertext moved to another key of the same kind, copied to the same address in another boundary or to another tenant fails to open"}
  - id: REQ-KEYS-034
    area: KEYS
    statement: "The nonce of an AES-256-GCM seal MUST come from the cryptographic library and never from the caller."
    rationale: "A caller-chosen nonce repeats and breaks the confidentiality and integrity of every value under that key (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1210]
    verification:
      - {kind: integration-test, ref: "the seal API takes no nonce; two seals of one value under one key differ"}
  - id: REQ-KEYS-035
    area: KEYS
    statement: "Each tenant MUST have exactly five data keys, data, pseudonym, pairwise, evidence and chain."
    rationale: "Purposes never share a key, so a tenant's exit can delete personal data and keep evidence (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "a new tenant gets exactly five DataKeyWrap purposes; a new boundary gets the four of its own: grant, cookie, mac and data"}
  - id: REQ-KEYS-036
    area: KEYS
    statement: "A tenant's exit MUST delete its data, pseudonym, pairwise and chain wraps at once, every generation and every recipient."
    rationale: "The wrap is the only route to the key, so every value sealed for the tenant stops opening (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: ciam-upstream
    gap: partly-built
    runtimes: all
    actors: [key]
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "after the exit every value sealed for the tenant fails to open, the facts of its session chains among them, and key@ has dropped its cached entries"}
  - id: REQ-KEYS-037
    area: KEYS
    statement: "key@ MUST delete the evidence wrap of an exited tenant when its evidence retention ends and not before."
    rationale: "Evidence outlives personal data, so a bill or a dispute can be answered after the exit (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [key]
    standards: []
    issues: [1015]
    verification:
      - {kind: integration-test, ref: "a delete of the evidence wrap before the retention ends is refused; after it, the wrap is deleted"}
  - id: REQ-KEYS-038
    area: KEYS
    statement: "key@ MUST cache an opened data key only with a time to live per entry."
    rationale: "A cached key opens without a card or KMS call, and its time to live is the erasure delay on Lambda (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1210]
    verification:
      - {kind: integration-test, ref: "a cached entry is gone after its time to live and the next open calls the card or KMS"}
  - id: REQ-KEYS-039
    area: KEYS
    statement: "`sluis config check` MUST refuse a cache time to live in the KeyPlan that is longer than the built-in maximum."
    rationale: "A plan may shorten a limit and never lengthen it past the maximum in code (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    standards: []
    issues: [1210]
    verification:
      - {kind: test-vectors, ref: "KeyPlan vectors: a time to live at the maximum is accepted and one second over is refused"}
  - id: REQ-KEYS-040
    area: KEYS
    statement: "On boards key@ MUST drop a cached data key when its DataKeyWrap is deleted."
    rationale: "Without the drop a deleted tenant's data would open until the entry expired (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [1210]
    verification:
      - {kind: integration-test, ref: "delete the wrap of a tenant while its key is cached; the next open is refused"}
  - id: REQ-KEYS-041
    area: KEYS
    statement: "On serverless the data of a deleted tenant MUST stop opening within the cache time to live after its wraps are deleted."
    rationale: "Nothing is pushed to a warm function, so the time to live is the longest time a deleted tenant's data can still be opened (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: ["serverless"]
    actors: [key]
    standards: []
    issues: [1210]
    verification:
      - {kind: integration-test, ref: "delete a tenant's wraps; a warm key@ function opens its data no later than the time to live afterwards"}
  - id: REQ-KEYS-042
    area: KEYS
    statement: "Mac MUST be HMAC-SHA384 over a data key, with the label that the caller names bound into the input by key@."
    rationale: "Two uses then never give the same keyed hash for the same input, and the key never leaves key@ (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    tests: [actors/key/internal/keyd/mac_vectors_test.go, actors/key/internal/keyd/sign_test.go]
    verification:
      - {kind: test-vectors, ref: "Mac vectors: one input under two labels gives two values; the label is bound by key@"}
  - id: REQ-KEYS-043
    area: KEYS
    statement: "key@ MUST NOT make a new generation of the mac data key in place."
    rationale: "Link ids, upstream session ids and pairwise subjects are made under it, so a new key would change them all (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [1210]
    verification:
      - {kind: integration-test, ref: "the rotation job skips the mac purpose; a replacement is a migration that makes the values again"}
  - id: REQ-KEYS-044
    area: KEYS
    statement: "key@ MUST listen on Unix sockets only, one per caller, each in a directory that only its caller can open."
    rationale: "A socket that another uid can open is a path around the rules (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [866, 914]
    tests: [tests/deny/deny_test.go]
    verification:
      - {kind: test-vectors, ref: "a process under another uid opens ca@prod's key@ socket; refused by the directory permissions"}
  - id: REQ-KEYS-045
    area: KEYS
    statement: "key@ MUST refuse a connection whose peer uid is not the uid its socket was made for."
    rationale: "The permission check and the peer check are two walls around the same socket (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: external-suite-not-run
    milestone: first-version
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: test-vectors, ref: "directory permissions off, the socket left world-writable: uid B connects to uid A's socket; refused by the peer-uid check"}
  - id: REQ-KEYS-046
    area: KEYS
    statement: "The slot plan MUST give every purpose and algorithm a card slot of its own."
    rationale: "A slot shared by two purposes would share a key between them (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "registry check: the default slot plan has no collision; a plan with two purposes on one slot fails"}
  - id: REQ-KEYS-047
    area: KEYS
    statement: "`sluis config check` MUST refuse an enabled key purpose that has no key or slot."
    rationale: "A purpose without a key would fall back to something weaker at the first request (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    runtimes: all
    standards: []
    issues: [914, 864]
    verification:
      - {kind: test-vectors, ref: "KeyPlan vectors: an enabled purpose with no slot on a board and with no key on AWS"}
  - id: REQ-KEYS-048
    area: KEYS
    statement: "A key purpose outside the baseline MUST get a key and a slot only when an installation enables it."
    rationale: "A purpose that is not enabled costs no key, no slot and no review (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "an installation without the release-signing purpose has no such key or slot; enabling it adds exactly one"}
  - id: REQ-KEYS-049
    area: KEYS
    statement: "The KMS baseline of a boundary on AWS with one trust domain and one log MUST be one symmetric key, four P-384 keys and one P-256 key, with each purpose enabled on use adding a key of its own."
    rationale: "Data keys are not KMS keys, so a new tenant adds none and the baseline stays small and countable (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: partly-built
    runtimes: ["serverless", "kubernetes"]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "registry check: the AWS baseline of 1 + 4 + 1 holds for the generated installation"}
  - id: REQ-KEYS-050
    area: KEYS
    statement: "The key policy of the symmetric KMS key of a boundary MUST name the role of key@ alone."
    rationale: "Every other actor reaches a key through key@, whose rules say who may ask for which purpose (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["serverless", "kubernetes"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: test-vectors, ref: "generated key policies for the symmetric key: every Allow statement names the key@ role"}
      - {kind: integration-test, ref: "the role of any other actor calls KMS; refused"}
  - id: REQ-KEYS-051
    area: KEYS
    statement: "key@ MUST call GenerateDataKey under the boundary's symmetric key with the encryption context of boundary, tenant and purpose, and store only the wrapped copy."
    rationale: "The context binds a wrap to its tenant and purpose in the key service itself (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: ["serverless", "kubernetes"]
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: integration-test, ref: "a wrapped data key unwrapped with another tenant in the context; refused"}
  - id: REQ-KEYS-052
    area: KEYS
    statement: "On boards key@ MUST wrap each data key for the key-agreement key of each board's card and for the recovery recipient."
    rationale: "Any board opens it with its own card, and the loss of all cards does not lose the data (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "a data key has one wrap per board and one for the recovery recipient; each opens it"}
  - id: REQ-KEYS-053
    area: KEYS
    statement: "A board wrap MUST use ECDH on P-384, HKDF-SHA384 and AES key wrap, bound to the wrap's own address."
    rationale: "A wrap that is not bound to its address could be moved to another row or tenant (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: test-vectors, ref: "wrap vectors: a wrap copied to another address fails to unwrap"}
  - id: REQ-KEYS-054
    area: KEYS
    statement: "key@ MUST write all wraps of a new data key as conditional creates in one atomic write."
    rationale: "When two key@ instances make a key at once, one wins and the other discards its key and reads the winner's (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "two key@ instances create the same data key at once; one set of wraps exists and both seal with the winner's key"}
  - id: REQ-KEYS-055
    area: KEYS
    statement: "Adding a card or a board MUST rewrap each data key for its public key."
    rationale: "A rewrap needs the recipient's public key only and touches no sealed value (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "add a board: every data key gains a wrap for it and no sealed value changes"}
  - id: REQ-KEYS-056
    area: KEYS
    statement: "The private half of the recovery recipient MUST NOT exist inside sluis."
    rationale: "Using it is a ceremony, so no actor, not even key@, can open a wrap made for it (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "key@ is asked to open a wrap made for the recovery recipient; it has no key to do so"}
  - id: REQ-KEYS-057
    area: KEYS
    statement: "key@ MUST make a new generation of a data key before the count of seals under it reaches the limit for random nonces."
    rationale: "A busy kind would otherwise exhaust the AES-GCM nonce space of one key (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "a counter set near the limit produces a new generation, and older generations still open what they sealed"}
  - id: REQ-KEYS-058
    area: KEYS
    statement: "key@ MUST NOT retry a wrong card PIN."
    rationale: "The card blocks after three attempts and then needs the PUK (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "a card that answers wrong PIN is tried once; a second attempt is made only on an operator's new PIN"}
  - id: REQ-KEYS-059
    area: KEYS
    statement: "A locked key@ that gets its PIN from an unlocked peer MUST receive it only as a PinRelease sealed to a one-time key of its own request."
    rationale: "The PIN then crosses only the Raft port inside the store's replication and adds no listener (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "reboot one board with its peers up: it unlocks through PinRelease with no new listener"}
      - {kind: test-vectors, ref: "a PinRelease opened with another request's key fails"}
  - id: REQ-KEYS-060
    area: KEYS
    statement: "A log key MUST rotate only on compromise."
    rationale: "A log is one continuous history, and its signatures must verify for the life of the log (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: v1-parity
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "the rotation job skips the audit-log and issuance-log purposes; a compromise replaces one by a key-change record that REQ-AUDIT-163 verifies"}
  - id: REQ-KEYS-061
    area: KEYS
    statement: "An authority key MUST be used to sign only inside its key store."
    rationale: "A key that leaves its store can no longer be stopped by it (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [800]
    verification:
      - {kind: integration-test, ref: "no call returns authority key material; a card or KMS signs each digest itself"}
  - id: REQ-KEYS-062
    area: KEYS
    statement: "sluis-node MUST sign its workload tokens through key@ with the workload-issuer purpose and hold no key credential."
    rationale: "key@ has exclusive access to the card, so nothing else signs on a board (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: ["bare-metal"]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "sluis-node holds no card or KMS credential and its signature is made by key@ in the workload-issuer slot"}
  - id: REQ-KEYS-063
    area: KEYS
    statement: "The issuance log of ca MUST be signed with the issuance-log key purpose, a P-384 key enabled on use in every boundary that runs ca."
    rationale: "The issuance log is a third log kind of the audit writer and has its own audience and lifetime (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "a boundary with ca has an issuance-log key; one without ca has none"}
  - id: REQ-KEYS-064
    area: KEYS
    statement: "The release-signing key MUST exist in the release boundary only."
    rationale: "A release-signing key in any other boundary would widen who could sign a release (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [890]
    verification:
      - {kind: integration-test, ref: "registry check: the release-signing purpose is enabled in one boundary only"}
  - id: REQ-KEYS-065
    area: KEYS
    statement: "The witness MUST sign its cosignatures through key@ with a witness key per format."
    rationale: "A witness key authorises nothing else and serves no other purpose, and the format fixes its algorithm (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "the witness holds no key credential; its cosignature verifies against the witness key of its format"}
  - id: REQ-KEYS-066
    area: KEYS
    statement: "The published key set MUST be exported by exporter@ from the SigningRing kind that signer writes."
    rationale: "The key set is public material that stays readable while the issuer's compute is down, so it leaves through the one holder of destinations (ADR 0017)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a rotation writes a new SigningRing; the exported key set carries the new key and the old one for the overlap"}

  # ---- where a tenant's keys live, and the pairwise key (decision 0006)
  - id: REQ-KEYS-074
    area: KEYS
    statement: "A tenant's key location MUST be operator-held unless its Tenant item declares customer account."
    rationale: "The location is chosen per tenant by a declaration and defaults to the installation's own KMS keys (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    actors: [key]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "a Tenant with no declaration is operator-held; a Tenant that declares customer account carries the account's key ids"}
  - id: REQ-KEYS-068
    area: KEYS
    statement: "key@ MUST use a customer-account KMS key only through a key policy or grant that covers Encrypt, Decrypt, GenerateDataKey, Sign and GetPublicKey and no other operation."
    rationale: "The customer's grant is the narrowest that key@ needs (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    actors: [key]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "a call for any other KMS operation on a customer-account key is refused by the key policy"}
  - id: REQ-KEYS-069
    area: KEYS
    statement: "sluis MUST NOT hold a long-lived credential for a customer account."
    rationale: "A credential that sluis holds is a secret that the customer cannot withdraw by one act (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "registry check: no secret source or kind holds a credential for a customer account; key@ reaches the account by its role"}
  - id: REQ-KEYS-070
    area: KEYS
    statement: "Moving a tenant into a customer account MUST re-wrap its data, pseudonym, pairwise, evidence and chain keys under the customer's KMS key during the move ceremony."
    rationale: "The move changes where the wraps are made and nothing an app sees (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    actors: [key]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "after the move every DataKeyWrap of the tenant names the customer's key and every value still opens"}
  - id: REQ-KEYS-071
    area: KEYS
    statement: "When the grant for a customer account is revoked or disabled, key@ MUST stop that tenant's seals, opens and signs with UNAVAILABLE and leave every other tenant unaffected."
    rationale: "Revocation is the customer's kill switch and fails closed for that tenant only (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: [serverless, kubernetes]
    actors: [key]
    standards: []
    issues: [1211]
    verification:
      - {kind: integration-test, ref: "revoke the grant of one tenant: its seals, opens and signs answer UNAVAILABLE, a second tenant's still succeed"}
  - id: REQ-KEYS-072
    area: KEYS
    statement: "The pairwise data key of a tenant MUST NOT be rotated."
    rationale: "A new key would change every pairwise subject of the tenant (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [key]
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "the key plan check refuses a rotation of the pairwise purpose"}
  - id: REQ-KEYS-073
    area: KEYS
    statement: "Moving a tenant MUST re-wrap its pairwise key for the new boundary's wrapping key and not replace it."
    rationale: "A move must change no subject (ADR 0032)."
    level: MUST
    source: design-decision
    status: planned
    milestone: ciam-upstream
    runtimes: all
    actors: [key]
    standards: []
    issues: [1024]
    verification:
      - {kind: integration-test, ref: "the pairwise subjects of a person before and after a promotion are equal"}
  - id: REQ-KEYS-075
    area: KEYS
    statement: "key@ MUST wrap a data key only to the recipients in the signed list of the KeyPlan."
    rationale: "The KeyCertificate items in the store are not signed, so a recipient taken from them would let a compromised store@ receive every data key (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    tests: [actors/key/internal/keyd/recipients_test.go]
    verification:
      - {kind: integration-test, ref: "a KeyCertificate for a node key id that the KeyPlan does not list is written to the store; a new data key has no wrap for it"}
      - {kind: integration-test, ref: "a KeyCertificate whose thumbprint differs from the listed id is not used"}
  - id: REQ-KEYS-110
    area: KEYS
    statement: "key@ MUST verify the signature, the pinned publisher key and the sequence of the KeyPlan itself, keep the highest sequence in state of its own, and take no recipient, purpose or time to live from a KeyPlan it refuses."
    rationale: "A compromised store@ could otherwise serve a KeyPlan that lists its own key, and the list is signed so that it cannot; where key@ has no durable local state (a function on serverless) it has no mark, and a cold start takes the newest validly signed document (ADR 0005; the residual is in [Who may receive a wrap](/decisions/0006-keys-and-sealing/#who-may-receive-a-wrap))."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: [bare-metal, kubernetes]
    actors: [key]
    standards: []
    issues: [1208]
    tests: [actors/key/internal/keyd/plan_test.go, actors/key/internal/keyd/plan_vectors_test.go, kits/go/signedconfig/vectors_test.go, actors/store/tests/vectors.rs]
    verification:
      - {kind: test-vectors, ref: "the shared vectors of the signed document: the Go and the Rust verifier give the same verdict at every step"}
      - {kind: integration-test, ref: "a forged KeyPlan, one signed by the wrong key and one for another kind stop the start; a lower seq is refused while key@ runs and after a restart"}
  - id: REQ-KEYS-111
    area: KEYS
    statement: "key@ MUST verify the signature, the pinned publisher key, the kind and the sequence of the Boundary document itself, keep its highest sequence in state of its own, and apply the floor of the software key driver only to the environment of a Boundary it verified."
    rationale: "key@ read Boundary through store@ unsigned, so a compromised store@ could serve environment development and relax the floor in production (ADR 0006, Floors in code); where key@ has no durable local state it has no mark, as for the KeyPlan."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: [bare-metal, kubernetes]
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: test-vectors, ref: "the Boundary payload vectors: the Go and the Rust reader read the same environment from every case"}
      - {kind: integration-test, ref: "a forged Boundary, one for another kind and an unsigned item that says development leave the production floor in force; a lower seq is refused after a restart"}
  - id: REQ-KEYS-076
    area: KEYS
    statement: "A new token-signing key MUST be pre-published for 30 minutes before it signs: the sum of the key set's max-age, the edge cache time to live, 10 minutes for a verifier's throttled refetch and 5 minutes of clock skew (25 minutes), rounded up to leave a margin, except a replacement under REQ-KEYS-089."
    rationale: "Every cache between sluis and a relying party must hold the key before the first token carries it, and the lead time follows from the cache budget that sluis publishes (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a key joins the key set as pre-published, signs nothing for 30 minutes, and then becomes active"}
  - id: REQ-KEYS-077
    area: KEYS
    statement: "A node MUST move only the token-signing key that its own key@ holds through the states pre-published, active and retiring."
    rationale: "One node's rotation must not retire the key that another node is signing with; revoking another node's key is a tightening that REQ-KEYS-090 allows (ADR 0006, ADR 0041)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "the signer of one node does not change the state of, or remove, a key whose node is another"}
  - id: REQ-KEYS-078
    area: KEYS
    statement: "A token-signing key MUST stay in the published key set for 65 minutes after it stops signing."
    rationale: "A token signed just before the change must verify for its whole life (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a retiring key is in the key set at 64 minutes and absent after 65 minutes with a moved clock"}
  - id: REQ-KEYS-079
    area: KEYS
    statement: "A retiring or revoked token-signing key MUST NOT become active again or return to the published key set."
    rationale: "A key that has begun to leave the key set, or has been revoked, must not return to signing or to the set (ADR 0006, ADR 0041)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: partly-built
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "a retiring key stays retiring through every later rotation step"}
  - id: REQ-KEYS-080
    area: KEYS
    statement: "A node's first token-signing key MUST become active at once while no key in the key set is older than 15 minutes."
    rationale: "On a first deploy there is no cached key set to wait for (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [signer]
    standards: []
    issues: [774]
    verification:
      - {kind: integration-test, ref: "three nodes start together and each key is active at once; a node added a day later pre-publishes for 30 minutes"}
  - id: REQ-KEYS-081
    area: KEYS
    statement: "The checkpoint key of an audit log MUST be a P-256 key that signs SHA-256."
    rationale: "A generic witness or checkpoint verifier checks the standard C2SP signature of type 0x02 only (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [838]
    verification:
      - {kind: test-vectors, ref: "a checkpoint the writer made through key@ opens with golang.org/x/mod/sumdb/note and a type 0x02 verifier written from the C2SP signed-note text"}
      - {kind: integration-test, ref: "the key plan check refuses an audit-log purpose that is not ES256"}
  - id: REQ-KEYS-082
    area: KEYS
    statement: "The chain data key of a tenant MUST be sealable by session alone and openable by session and exchange alone."
    rationale: "Session-chain facts are read by exchange, which must not hold the cookie key or a tenant's data key, and they are a tenant's personal data, so they are sealed under the tenant's key and erased with it (ADR 0006)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    tests: [actors/key/internal/keyd/seal_test.go, actors/session/internal/sessiond/token_test.go, actors/exchange/internal/exchanged/directory_store_test.go]
    verification:
      - {kind: integration-test, ref: "session seals and opens and exchange opens, by rule with no grant; exchange's seal and every other actor's seal or open are refused with the reason rule; another tenant's chain does not open"}
  - id: REQ-KEYS-083
    area: KEYS
    statement: "key@ MUST delete a generation of the chain data key of a tenant only after the longest time to live of a session chain has passed since that tenant's key last sealed under it."
    rationale: "A chain must stay readable for its whole life, and nothing sealed under an older generation may outlive it (ADR 0006)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    runtimes: all
    actors: [key]
    standards: []
    issues: [1208]
    verification:
      - {kind: integration-test, ref: "a generation of a tenant's chain key is kept for 90 days after its last seal and deleted after that, with a moved clock; the generations of another tenant are not affected"}
  - id: REQ-KEYS-085
    area: KEYS
    statement: "signer MUST make a token-signing key active only after the lead time has passed since the key was seen in every published key set."
    rationale: "A static key set is published later than the store is written, so counting from the write could let a key sign before a verifier can have it (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    milestone: first-version
    gap: no-proving-test
    runtimes: all
    actors: [signer]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the published key set lags the store by an hour; the new key stays pre-published until 30 minutes after it is read back from the public URL, and the live key set counts from the write"}
  - id: REQ-KEYS-086
    area: KEYS
    statement: "`sluis node unlock` MUST deliver the PIN to a locked key@ only over an authenticated channel."
    rationale: "A PIN that crosses an unauthenticated channel lets anyone who can reach the board unlock it (ADR 0006)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    runtimes: ["bare-metal"]
    actors: [key]
    standards: []
    issues: [914]
    verification:
      - {kind: integration-test, ref: "a PIN offered on the admin socket by a uid other than root is refused before it is read; the channel of the record is checked when it is built"}
  - id: REQ-KEYS-087
    area: KEYS
    statement: "When an operator declares a token-signing key compromised or suspected, key@ MUST write a KeyRevocation item for it at once, with neither the pre-publication period nor the retention period."
    rationale: "A healthy key needs those periods to move without breaking a verifier, and a stolen key must not wait for them (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare a key: a KeyRevocation item exists at once and the 65 minutes of retention are not applied"}
  - id: REQ-KEYS-088
    area: KEYS
    statement: "sluis key revoke MUST report a revocation as not confirmed until it has fetched the published key set and found the kid absent."
    rationale: "A check that cannot run is reported as not run, and a stale edge copy must not look like a finished revocation (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the edge serves a stale key set after a revocation: the command prints not confirmed, and confirmed once the set lacks the kid"}
  - id: REQ-KEYS-089
    area: KEYS
    statement: "A replacement for a revoked token-signing key MUST sign at once when no other key of the issuer is active, with its key set published and purged at the edge before its first token."
    rationale: "Waiting for the lead time would stop every sign-in of a single-key installation, and a verifier that does not fetch the key set again on an unfamiliar kid is broken against the standard (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke the only key: a new key signs at once after its set is published and purged; a verifier that fetches on an unfamiliar kid accepts the token, and one that does not is reported"}
  - id: REQ-KEYS-090
    area: KEYS
    statement: "The signer of any node and the operator command MUST each be able to relay an operator's declaration to key@ so that it revokes the token-signing key of any node."
    rationale: "A compromised or stopped owner must not decide whether its own key leaves, and the relay needs no initiative of its own (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "node B relays a declaration for node A's key while A is down; the item exists and the key set lacks the key"}
  - id: REQ-KEYS-091
    area: KEYS
    actors: [store]
    statement: "store@ MUST refuse an update, a delete and an apply on KeyRevocation, for every caller, an apply even at an address that holds no item."
    rationale: "A revocation is terminal, and the direction rule alone would still allow a delete; Lease allows an update, so its rule is not the model (ADR 0041, ADR 0004)."
    level: MUST
    source: design-decision
    status: done
    milestone: first-version
    issues: [1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "an update, a delete and an apply on KeyRevocation are refused for every actor, key@ included, an apply on a free address too; a create is accepted"}
  - id: REQ-KEYS-092
    area: KEYS
    statement: "sluis MUST provide a command that revokes a key or a key purpose with a reason, as a KeyRevocation item that works while the actor of the compromised node is down."
    rationale: "One revocation path for every kind lets an operator act without a deploy (ADR 0041, principle 12)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a data key generation, a recipient and a purpose through the command with one node stopped; each takes effect"}
  - id: REQ-KEYS-093
    area: KEYS
    statement: "A peer MUST release a PIN only to a board that the KeyPlan lists and KeyRevocation does not revoke."
    rationale: "A stolen board that reconnects must not be given its PIN, and a board that is merely unlisted or revoked is the same case (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a board that is unlisted, and one that is revoked, ask for their PIN: both refused with an audit fact; a listed board is answered"}
  - id: REQ-KEYS-094
    area: KEYS
    statement: "key@ MUST make no wrap for a revoked recipient in any new data key."
    rationale: "A lost or stolen board must not receive access to any data key made after its revocation (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a board: a new data key has no wrap for it and the other boards still open it"}
  - id: REQ-KEYS-095
    area: KEYS
    statement: "key@ MUST refuse every Open under a compromised generation of the grant, cookie or chain data key."
    rationale: "These keys protect integrity: a forged value is the threat, so it must stop working at once, while a confidentiality key goes on opening because the thief already holds it (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "per purpose (grant, cookie, chain): declare, then an Open under the old generation is refused and the new generation opens"}
  - id: REQ-KEYS-096
    area: KEYS
    statement: "key@ MUST re-seal the values of a compromised generation of the data key under the new one as a paginated, asynchronous and idempotent job."
    rationale: "The three properties are one job: it runs over a store of any size in pages, in the background, and is run again after a failure without harm; pseudonym seals nothing and evidence is append-only, so neither has a job (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "stop the job half way and run it again: every value of a tenant's data key and of the boundary's data key opens under the new generation"}
  - id: REQ-KEYS-097
    area: KEYS
    statement: "The compromise of the cookie data key MUST end every browser session of the boundary at the next request."
    rationale: "A forged session cookie must stop working, and people sign in again (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare the cookie key: the next request with an old cookie is refused and a refresh-token chain still works"}
  - id: REQ-KEYS-098
    area: KEYS
    statement: "sluis MUST provide a command that changes a card PIN and delivers the new PIN to the key@ of the board over the unlock channel."
    rationale: "A suspected PIN has no remedy short of replacing the board without it (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "change the PIN on a virtual card, then the board unlocks with the new one and not the old"}
      - {kind: manual, ref: "rehearsal on a real card"}
  - id: REQ-KEYS-099
    area: KEYS
    statement: "key@ MUST disable a compromised AWS wrapping key only after every wrap has been rewrapped under its replacement."
    rationale: "Disabling first would lose the data, and automatic key rotation keeps the old key material (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1372]
    runtimes: [serverless, kubernetes]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "replace the wrapping key of a test boundary: the old key is disabled after the last rewrap and not before, and every value opens"}
  - id: REQ-KEYS-100
    area: KEYS
    statement: "On AWS key@ MUST also wrap every data key for the offline recovery recipient."
    rationale: "A disabled wrapping key must not make every old archive unreadable (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1372]
    runtimes: [serverless, kubernetes]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a data key made on AWS has a wrap for the recovery recipient that the ceremony tooling opens"}
  - id: REQ-KEYS-101
    area: KEYS
    statement: "On a declared compromise of the grant, cookie, chain, data or evidence data key, key@ MUST make a new generation that every later Seal uses."
    rationale: "New values must not be sealed under a key the thief holds; mac and pairwise are accepted risks, and pseudonym seals nothing (its new epoch is REQ-AUDIT-164) (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "per purpose (grant, cookie, chain, data, evidence): declare, then the next Seal uses the new generation; for mac and pairwise the declaration is refused as not supported"}
  - id: REQ-KEYS-102
    area: KEYS
    statement: "key@ MUST refuse every Seal under a compromised generation of the grant, cookie, chain, data or evidence data key."
    rationale: "A stale cache or a slow caller must not seal new values under it; mac and pairwise are accepted risks (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a Seal that names the old generation is refused for each of the five purposes; on Lambda, after the time to live of the cache"}
  - id: REQ-KEYS-103
    area: KEYS
    statement: "key@ MUST keep opening a compromised generation of a tenant's data key and of the boundary's data key until the re-seal job has rewritten every value sealed under it."
    rationale: "The thief already holds the key, so refusing opens protects nothing and only takes the data offline (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "declare the data key: a value sealed before the declaration opens until the job ends and under the new generation after"}
  - id: REQ-KEYS-104
    area: KEYS
    statement: "key@ MUST delete the wraps of a compromised generation of the data key when the re-seal job ends."
    rationale: "The old generation must not outlive the values it sealed (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1366]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "after the job the old wraps of the tenant's and the boundary's data key are gone and every value opens"}
  - id: REQ-KEYS-105
    area: KEYS
    statement: "key@ MUST delete the existing wraps of a revoked recipient."
    rationale: "A lost or stolen board must not keep access to the data keys it already received (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: v1-parity
    issues: [1365]
    runtimes: ["bare-metal"]
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a board: its existing wraps are deleted and the other boards still open"}
  - id: REQ-KEYS-106
    area: KEYS
    statement: "signer MUST NOT promote or sign with a kid that KeyRevocation lists."
    rationale: "A revoked key must not return to signing even if its own node writes the ring (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "the owner node of a revoked key tries to make it active and to sign: both refused"}
  - id: REQ-KEYS-107
    area: KEYS
    statement: "exporter@ and entry MUST omit every kid that KeyRevocation lists from every key set they publish."
    rationale: "The omission is a filter at publication, so it does not depend on signer or on the node that owns the key (ADR 0041)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a key: the next published key set, static and live, lacks its kid, and a token it signed fails against the set"}
  - id: REQ-KEYS-108
    area: KEYS
    statement: "key@ MUST write a KeyRevocation item only on a declaration that an operator made with fresh multi-factor authentication through its admin path."
    rationale: "Only a person declares; a signal or a signer acting on its own would let an attacker use the alarm to stop sign-in (ADR 0041, principle 7)."
    level: MUST
    source: design-decision
    status: planned
    milestone: first-version
    issues: [1361, 1362]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "a signer with no declaration, an alert and a declaration without fresh authentication ask key@ to revoke: all refused; a declaration with fresh authentication, relayed or not, is accepted"}
  - id: REQ-KEYS-109
    area: KEYS
    statement: "key@ MUST refuse a Sign with any key that KeyRevocation lists, whatever the signing purpose."
    rationale: "A revoked key signs nothing more, for every signing purpose and whichever actor asks; a purpose revocation refuses keys made at or before it, not a replacement made after it; a key of unknown age and an unreadable KeyRevocation are refused; the PIV driver reports the age of the keys it made (ADR 0041)."
    level: MUST
    source: design-decision
    status: partial
    gap: partly-built
    milestone: first-version
    issues: [1362, 1369]
    runtimes: all
    standards: []
    features: ["design"]
    verification:
      - {kind: integration-test, ref: "revoke a key of each signing purpose: a Sign with it is refused and audited; a key made after a purpose revocation signs; an unreadable KeyRevocation refuses the Sign"}
