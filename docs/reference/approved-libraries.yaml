# The approved cryptography and parser libraries of sluis, per language (REQ-SEC-008, REQ-SEC-018;
# issue #1039). docs/reference/approved-libraries.md renders the reasoning; this file is the data a
# CI check reads once there is code: a dependency that provides a cryptographic primitive or parses
# a protocol or a format must be listed here, under the language of the executable that links it.
#
# Fields of an entry:
#   name     the module path (Go), the crate (Rust) or the package or platform API (TypeScript)
#   for      what sluis uses it for
#   needed_by  the record that needs the capability (the list itself is approved by review of this file)
#   scope    optional: the actors or the use that the approval is limited to
#   evaluated  optional: the version the choice was made at and its release date, and a floor when a
#              security fix sets one ("floor" is the oldest version a lockfile may hold)
#
# A library not listed needs a pull request that adds it, with the reason. A version is not
# pinned here: the lockfiles pin versions, and Renovate moves them.
schema: 1

go:
  - { name: "crypto/... (standard library)", for: "ECDSA P-384, RSA-2048 PKCS#1 v1.5 for RS256 (the named exception for an audience, in key@ and the software key driver), AES-256-GCM, SHA-2, HKDF, HMAC, X.509, TLS and the operating system's random generator (crypto/rand)", needed_by: "ADR 0006" }
  - { name: "golang.org/x/crypto/ssh", for: "OpenSSH keys and certificates in Go components and the CLI", needed_by: "ADR 0023" }
  - { name: "github.com/go-piv/piv-go/v2", for: "YubiKey PIV in key@ and its card driver, and attestation verification in the CLI and the yubikey-attestation verifier", needed_by: "ADR 0012" }
  - { name: "github.com/ProtonMail/go-crypto", for: "OpenPGP packets: the subkey request, the back-signature, detached signatures", needed_by: "ADR 0024" }
  - { name: "github.com/santhosh-tekuri/jsonschema/v6", for: "Applying the generated JSON Schema to a configuration document before it is decoded", needed_by: "ADR 0004" }
  - { name: "buf.build/go/protovalidate", for: "The protovalidate rules of every Protobuf message, after decoding: the authority in code (protovalidate-go)", needed_by: "ADR 0004" }
  - { name: "connectrpc.com/connect", for: "The Connect protocol, client and server", needed_by: "ADR 0002" }
  - { name: "google.golang.org/protobuf", for: "Protobuf encoding and decoding", needed_by: "ADR 0002" }
  - { name: "github.com/go-jose/go-jose/v4", for: "JWS, JWK and JWT: verifying tokens and client assertions, verifying signed config documents (kits/go/signedconfig), reading and writing key sets; never JWE", needed_by: "ADR 0017", evaluated: "v4.1.7, 2026-10-30; floor v4.1.7 (five advisories against v4.1.6 and earlier, published 2026-10-30)" }
  - { name: "github.com/go-jose/go-jose/v4/cipher", for: "AES key wrap (RFC 3394) of a data key for the key-agreement key of a board's card; the key-wrap function only", scope: "key@ only; AES-KW only; no JWE", needed_by: "ADR 0006", evaluated: "v4.1.7, 2026-10-30; floor v4.1.7, as the module" }
  - { name: "github.com/zitadel/oidc/v3", for: "The OpenID Provider of session and exchange (pkg/op) and the relying party of the oidc upstream (pkg/client/rp)", needed_by: "ADR 0012", evaluated: "v3.51.16, 2026-10-15; floor v3.47.0 (advisory of 2026-08-24)" }
  - { name: "golang.org/x/oauth2", for: "The OAuth 2.0 client under the relying party of the oidc upstream", needed_by: "ADR 0017", evaluated: "v0.37.0, 2026-08-25" }
  - { name: "golang.org/x/mod/sumdb/note", for: "C2SP signed notes in writer and witness, and in the CLI that verifies a log; the signer goes through the keys port", needed_by: "ADR 0029", evaluated: "golang.org/x/mod v0.42.0, 2026-10-09" }
  - { name: "golang.org/x/mod/sumdb/tlog", for: "Hashes and tiles of a tiled log in writer and witness, and in the CLI that verifies a log", needed_by: "ADR 0029", evaluated: "golang.org/x/mod v0.42.0, 2026-10-09" }
  - { name: "filippo.io/torchwood", for: "C2SP checkpoints, cosignatures and tiles, and the tile client, in writer and witness, and the checkpoint and tile code of the CLI that verifies a log", needed_by: "ADR 0029", evaluated: "v0.10.0, 2026-09-24 (before 1.0)" }
  - { name: "github.com/transparency-dev/formats", for: "The reference verifier of C2SP signed-note type 0x02 and the reference checkpoint parser, as the independent oracle of the checkpoint tests of writer and the CLI", scope: "tests only; linked into no executable", needed_by: "ADR 0029", evaluated: "v0.1.1, 2026-06-02 (before 1.0); Apache-2.0" }
  - { name: "filippo.io/sunlight", for: "C2SP static-ct-api entries and checkpoints, in the issuance log of ca", needed_by: "ADR 0023", evaluated: "v0.10.2, 2026-10-26" }
  - { name: "github.com/gowebpki/jcs", for: "RFC 8785 canonical JSON of the audit records: the order of members, the escapes and the text of numbers; the sluis profile (integers within +-(2^53-1), no floats, nesting depth, valid UTF-8) is checked before it, in kits/go/audit", needed_by: "ADR 0030", evaluated: "v1.0.2, 2026-09-21; floor v1.0.2 (a conformance fix for surrogate pairs and invalid UTF-8 of 2026-09-20 is in it)" }
  - { name: "github.com/go-webauthn/webauthn", for: "The WebAuthn relying party of session: the options of a registration and of an assertion, the parsing of the responses, and the checks of the challenge, the origin allow-list, the relying-party ID hash, user presence and verification, the flags, the attestation statement's own signature and the assertion's signature; the single use of a challenge, the class of a credential and the counter rule are session's", scope: "session only (actors/session); the packages protocol and webauthn; not the metadata (MDS) packages, which the parity milestone decides", needed_by: "ADR 0017", evaluated: "v0.18.2, 2026-09-19 (before 1.0); floor v0.18.2 (the release that validates the session challenge when a ceremony finishes and requires authorization to initialize user verification); BSD-3-Clause; decided 2026-11-07 (owner)" }
  - { name: "go.yaml.in/yaml/v3", for: "Reading the bootstrap file and the YAML config documents behind the strict profile of docs/reference/bootstrap-file.md", needed_by: "ADR 0004", evaluated: "v3.0.6, 2026-10-13" }
  - { name: "github.com/goreleaser/nfpm/v2", for: "Writing the .deb and .rpm packages of a release: the control file, the rpm header and the archives, in tools/release/packages", scope: "build tooling only, in a Go module of its own (tools/release/packages/go.mod): linked into no executable of a release and into no tool of the job that publishes", needed_by: "ADR 0013", evaluated: "v2.48.0, 2026-10-12; MIT" }

rust:
  - { name: "aws-lc-rs", for: "AES-256-GCM with RandomizedNonceKey, ECDSA P-384 (and P-256 for the audit log key), the verification of an RSA-2048 PKCS#1 v1.5 signature (RS256, in signer, which only verifies what key@ signed), HKDF, SHA-2 and the library's random generator", needed_by: "ADR 0006" }
  - { name: "rustls", for: "TLS, with the aws-lc-rs provider and no FIPS pin", needed_by: "ADR 0012" }
  - { name: "cedar-policy", for: "Parsing, validating and evaluating Cedar policy in policy", needed_by: "ADR 0007" }
  - { name: "jsonschema", for: "Applying the generated JSON Schema to a configuration document before it is decoded", needed_by: "ADR 0004" }
  - { name: "buffa", for: "The Protobuf runtime of every Rust component, because connectrpc generates only buffa types; the kit's hand-written checks validate decoded messages until a protovalidate bridge exists", needed_by: "ADR 0012", evaluated: "0.9.2, pinned; decided 2026-11-04" }
  - { name: "buffa-types", for: "The well-known Protobuf types (Duration, Timestamp) for buffa messages", needed_by: "ADR 0012", evaluated: "0.9.2, pinned; decided 2026-11-04" }
  - { name: "connectrpc", for: "The Connect protocol over Unix sockets (spike S1 passed on 2026-11-01)", needed_by: "ADR 0012" }
  - { name: "zeroize", for: "Wiping secrets from memory when they are dropped", needed_by: "ADR 0012" }
  - { name: "jsonwebtoken (feature aws_lc_rs)", for: "Verifying JWS and JWT with an explicit algorithm list", needed_by: "ADR 0017", evaluated: "11.1.0, 2026-09-16" }
  - { name: "signed_note", for: "C2SP signed notes in indexer and reader; the P-256 verifier of the log key is a NoteVerifier on aws-lc-rs", needed_by: "ADR 0029", evaluated: "0.3.0 (tag v0.3.0, 2026-10-15), pinned to revision 662c80c05a5969a2c5eb4e75a48e3cf50dba5790 of github.com/cloudflare/azul; the 0.2.0 release on crates.io (2025-04-18) is older than a year and has no NoteVerifier; a git pin gets no RustSec advisory coverage and no automatic bump, so re-check it on each azul release" }
  - { name: "tlog_checkpoint", for: "C2SP tlog-checkpoint text in indexer and reader", needed_by: "ADR 0029", evaluated: "0.3.0, same revision as signed_note" }
  - { name: "tlog_core", for: "RFC 6962 hash rules of the indexer, and the tree-hash oracle of its tests", needed_by: "ADR 0029", evaluated: "0.3.0, same revision as signed_note" }
  - { name: "tlog_tiles", for: "C2SP checkpoints and tiles in indexer and reader", needed_by: "ADR 0029", evaluated: "0.2.0, 2025-04-18 (repository changed 2026-10-27; a pinned revision needs a pull request to this file)" }
  - { name: "pgp", for: "OpenPGP packets in signer: the detached release signature (version 4, type 0x00, ECDSA P-384, SHA-384), with the signing step handed to key@ through the SigningKey trait; default features off", needed_by: "ADR 0024", evaluated: "0.21.0, 2026-10-03, pinned; external signer measured 2026-11-06 (ECDSA P-384 and EdDSA, gpgv accepts); MIT OR Apache-2.0" }
  - { name: "saphyr-parser", for: "Reading the bootstrap file and the YAML config documents behind the strict profile of docs/reference/bootstrap-file.md", needed_by: "ADR 0004", evaluated: "0.3.3, 2026-10-27" }
  - { name: "hyper", for: "The HTTP/1.1 and HTTP/2 server of entry and of the Rust kit: it parses the request head and frames the body", needed_by: "ADR 0012", evaluated: "1.9.0, locked 2026-11-04" }
  - { name: "hyper-util", for: "The connection builder, the graceful shutdown and the Tokio glue of hyper's server", needed_by: "ADR 0012", evaluated: "0.1.20, locked 2026-11-04" }
  - { name: "serde_json", for: "Reading and writing JSON: the audit records of the emitter and the indexer, and the error bodies of entry", needed_by: "ADR 0030", evaluated: "1.0.154, locked 2026-11-04" }
  - { name: "serde_json_canonicalizer", for: "RFC 8785 canonical JSON of the audit records in kits/rust/sluis-audit: the order of members, the escapes and the text of numbers; the sluis profile is checked before it", needed_by: "ADR 0030", evaluated: "0.4.1, 2026-10-13" }
  - { name: "ssh-key", for: "OpenSSH keys and certificates in ssh-ca, with a signing key that signs through the keys port", needed_by: "ADR 0023", evaluated: "0.6.7, 2024-10-15 (last stable); 0.7.0-rc.11, 2026-06-29. Condition: a stable 0.7, or 0.6.7 with the certificate interop tests, or ssh-ca in Go (rule R11)" }
  - { name: "aws-sdk-* (the AWS SDK for Rust)", for: "Calls to AWS services from the AWS-backed drivers; its SigV4 and checksums are outside any FIPS module", needed_by: "ADR 0012" }

typescript:
  - { name: "ajv (draft 2020-12 build)", for: "Validating configuration against the generated JSON Schema", needed_by: "ADR 0004" }
  - { name: "WebCrypto (crypto.subtle) and WebAuthn (navigator.credentials)", for: "Cryptography and passkeys in the console's single-page application, from the browser", needed_by: "ADR 0017" }
  - { name: "@connectrpc/connect", for: "The Connect client of the audit reader's API (connect-es)", needed_by: "ADR 0028" }
  - { name: "jose", for: "Verifying tokens in the console's single-page application and in the verification demo", needed_by: "ADR 0017", evaluated: "6.2.14, 2026-10-29" }

# Modules that reach a build only as a dependency of an approved library, are never called by sluis, and may not be imported by
# sluis code. A test (tests/deps, TestNoGoFileImportsARefusedModule) fails when a Go file imports one. This is not an approval of
# the module for any use: where it also stands in `refused`, that entry holds.
transitive_exceptions:
  - { name: "github.com/golang-jwt/jwt/v5 (Go)", reached_through: "github.com/go-webauthn/webauthn", reason: "go-webauthn verifies Android SafetyNet attestation and decodes the FIDO metadata blob with it. session refuses every attestation format but none, packed, fido-u2f, tpm, apple and android-key before the library reads the statement, and imports no metadata package, so the code is linked and never called (a coverage run of the session tests shows no parser function executed). It is not our JOSE choice (go-jose is, and `refused` keeps it out of sluis code); a direct import fails CI", licence: "MIT", decided: "2026-11-07 (owner)" }

# Libraries that are not to be used, with the reason and the record that refuses them (needed_by: the record).
refused:
  - { name: "yubikey (Rust crate)", reason: "Its own notice says it is unaudited and experimental (R7)", needed_by: "ADR 0012" }
  - { name: "ykcs11 through cryptoki, for key@", reason: "It resets the card for every client when a second one appears and keeps a PIN copy that cannot be wiped", needed_by: "ADR 0012" }
  - { name: "gpg on a node", reason: "an approved library writes the OpenPGP packets and the card signs; the gpg tool is never used, and none runs on a board", needed_by: "ADR 0024" }
  - { name: "A Go plugin (.so) or WebAssembly module in an actor", reason: "Plugins run out of process, always", needed_by: "ADR 0003" }
  - { name: "lestrrat-go/jwx, golang-jwt/jwt (Go)", reason: "A second JOSE library beside go-jose, which the OpenID Connect provider already needs", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "josekit (Rust)", reason: "Built on OpenSSL, not aws-lc-rs, and not released since 2025-05-20", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "ory/fosite, dexidp/dex, coreos/go-oidc", reason: "fosite has its own OAuth 2.0 and no release since 2024-12-12; Dex is a server with its own storage; go-oidc is a relying party only", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "Tessera as the audit writer's engine", reason: "It sequences entries and publishes checkpoints itself, while the writer owns the batch, the seal entry and the write-once fence", needed_by: "ADR 0029" }
  - { name: "serde_yaml, serde_yml, serde-saphyr, goccy/go-yaml", reason: "Deprecated or unmaintained, or they read a different document than the other language or print the source in an error", needed_by: "docs/reference/approved-libraries.md" }
  - { name: "russh (for ssh-ca)", reason: "An SSH transport; ssh-ca issues certificates and speaks no SSH", needed_by: "docs/reference/approved-libraries.md" }
