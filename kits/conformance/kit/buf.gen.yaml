version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/truvity/sluis/v2/kits/conformance/kit/gen/go
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen/go
    opt: paths=source_relative
