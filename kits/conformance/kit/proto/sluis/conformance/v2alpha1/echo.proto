// The echo contract of the cross-language test of the kits (WP-04 and WP-05). It is test-only: no product binary
// links it. A Go client and a Rust server, and a Rust client and a Go server, call it over a Unix socket.
syntax = "proto3";

package sluis.conformance.v2alpha1;

// EchoService has one method of each shape the kits must agree on: unary, server stream and a refusal.
service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);          // unary: the message back, with what the server saw of the call
  rpc Count(CountRequest) returns (stream CountResponse); // server stream: n messages, numbered from 1, in order
  rpc Refuse(RefuseRequest) returns (RefuseResponse);    // always an error: the code and the Refusal detail asked for
}

// EchoRequest carries the message to send back.
message EchoRequest {
  string message = 1;  // any text
}

// EchoResponse is the message and what the server saw of the call.
message EchoResponse {
  string message = 1;         // the request's message
  string caller = 2;          // the registry name of the caller, from the transport
  string correlation_id = 3;  // the correlation id the call carried, or empty
  int64 timeout_ms = 4;       // the milliseconds left of the call's deadline, or 0 when none
}

// CountRequest asks for n messages.
message CountRequest {
  int32 n = 1;  // how many messages, 0 to 1000
}

// CountResponse is one numbered message.
message CountResponse {
  int32 seq = 1;  // 1, 2, 3 ... in order
}

// RefuseRequest names the refusal to make.
message RefuseRequest {
  string code = 1;        // a Connect code name, such as "failed_precondition"
  string reason = 2;      // the Refusal reason
  string field_path = 3;  // the Refusal field path
}

// RefuseResponse is never sent: Refuse always fails.
message RefuseResponse {}
