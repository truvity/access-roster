[package]
name = "sluis-proto"
description = "The generated Rust contracts: messages (buffa) and Connect services (connectrpc) of proto/."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The generated code carries examples from the proto comments; they are not tests of ours.
doctest = false

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
connectrpc-build = "=0.9.0"
