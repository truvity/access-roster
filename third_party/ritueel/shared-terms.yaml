# Shared terms of ritueel and sluis.
#
# This file is copied byte for byte into the other repository (truvity/ritueel and truvity/sluis hold the
# same file). Each repository checks its own copy against a pinned copy of the other's, offline. A word
# has one owner, the product whose object it names; only the owner changes the word, and the other
# product copies the file after the owner's change has merged. Nobody edits a word they do not own.
#
# Public file: example names only (acme, example.com).
#
# Fields of an entry:
#   term        the word as written in prose
#   definition  the meaning, one or two sentences
#   owner       ritueel or sluis: the product that decides the word
#   status      for a word of ritueel: decided when a rule of a ritueel decision record fixes it, otherwise proposed;
#               for a word of sluis: decided when a sluis decision record or an owner decision fixes it, otherwise proposed
#   not         optional: what the word does not mean, one line each (the words that clash across the two)
#   see         optional: where to read more, as absolute URLs of pages published on ritueel.id or sluis.id (a link
#               that redirects to the repository loses its anchor, so it is not given)
schema: 1

terms:
  # ---------------------------------------------------------------- owned by ritueel
  - term: root
    definition: "What outsiders trust without further proof, of one kind: an X.509 trust anchor, an OpenPGP identity or an SSH CA. A root is built from one or more root keys, labelled A, B, then the next letter."
    owner: ritueel
    status: decided
    not:
      - "a single key: one key of a root is a root key"
    see: ["https://ritueel.id/glossary/"]

  - term: root key
    definition: "One key of a root. Across bundles it is written with the bundle's name, such as `acme/A`; inside a bundle it is `A`."
    owner: ritueel
    status: decided
    not:
      - "a root, which is built from one or more root keys"
    see: ["https://ritueel.id/glossary/"]

  - term: delegated key
    definition: "A key that a root certifies, binds or lists for daily work: an X.509 intermediate, an OpenPGP subkey or an SSH CA key. The system that holds it is the requester."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/reference/hand-off-contract/", "https://ritueel.id/glossary/"]

  - term: delegation
    definition: "A name declared under a root for a delegated key, such as `acme-ca`, with the type of key it may hold. The holder declares it, in one wanted file for each."
    owner: ritueel
    status: decided
    not:
      - "a permission handed to a person, as in a delegated tenant admin of sluis"
    see: ["https://ritueel.id/reference/hand-off-contract/", "https://ritueel.id/glossary/"]

  - term: holder
    definition: "The person or small team who keeps a root: who runs its ceremonies and prepares its card, account, roles and PIN."
    owner: ritueel
    status: decided
    not:
      - "a program or a unit of sluis: sluis says credential holder for store@, exporter@, key@ and the audit pieces that hold a credential"
      - "an operator, the person who runs a sluis installation"
    see: ["https://ritueel.id/glossary/"]

  - term: requester
    definition: "The system that holds delegated keys and asks a root for a certificate or a binding. sluis is one."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/reference/hand-off-contract/", "https://ritueel.id/glossary/"]

  - term: certifier
    definition: "The system that answers a requester: it checks the request, and after a person confirms it, certifies, binds or lists the key. ritueel is the certifier."
    owner: ritueel
    status: proposed
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  - term: key store
    definition: "The kind of place where a key is born and kept, and never leaves: a key file, a PIV card, an OpenPGP card or a cloud key service. A key's place is its one slot, cloud key or file."
    owner: ritueel
    status: proposed
    not:
      - "store@, the data service of sluis, or the KV store"
      - "the placement of an actor in the sluis actor registry, which says where an actor runs"
    see: ["https://ritueel.id/glossary/"]

  - term: ceremony
    definition: "One act that uses a root key: `apply`. A person confirms it. Every ceremony ends in a ceremony record."
    owner: ritueel
    status: decided
    not:
      - "a WebAuthn, passkey, registration or sign-in flow: sluis says flow"
      - "a step of sluis, such as writing a request or installing an answer"
    see: ["https://ritueel.id/glossary/"]

  - term: wanted
    definition: "What a person writes about how the bundle should be: `ritueel.yaml` and a strict YAML file for each card, root, delegation and the user IDs, on the workstation only. A ceremony never writes one."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/glossary/"]

  - term: not applied yet
    definition: "What is wanted and not done, found each time from the wanted files, the history, the date and the requests, and never stored. An item is a change."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/glossary/"]

  - term: plan
    definition: "What an apply will do, made from what is not applied yet: what it applies, what it leaves out and why, and the wanted files it used, by digest. It holds public information only, needs no card and can be saved and carried to another machine."
    owner: ritueel
    status: decided
    not:
      - "the KeyPlan of sluis, the signed list of wrap recipients"

  - term: apply
    definition: "Do the changes not applied yet in one ceremony: `apply` finds them, writes the plan and, once a person confirms it, does them. `apply PLAN` runs a saved plan."
    owner: ritueel
    status: decided
    not:
      - "apply as a verb of the sluis store API, which writes one item of a kind"
    see: ["https://ritueel.id/glossary/"]

  - term: attempt
    definition: "The file ritueel writes before the first key of an apply is born, and before the first signature when no key is born. If the run stops, `status` shows the attempt as critical until a person closes it with `close`."
    owner: ritueel
    status: decided

  - term: bundle
    definition: "The directory with a fixed structure that holds everything ritueel knows about one organisation or one person, such as `acme`."
    owner: ritueel
    status: decided
    not:
      - "the CA bundle, which is a file"
      - "the SPIFFE trust bundle"
    see: ["https://ritueel.id/glossary/"]

  - term: history
    definition: "The write-once folder `history/` of a bundle, with one folder for each ceremony. Its end is the ceremony record that no other record names; two ends are a fork."
    owner: ritueel
    status: decided
    not:
      - "the audit log of sluis"
    see: ["https://ritueel.id/glossary/"]

  - term: ceremony record
    definition: "The JSON file that ends a ceremony, written last in its ceremony folder. It names the ceremony record before it by digest, so the records form a hash chain."
    owner: ritueel
    status: decided
    not:
      - "an audit record or a decision record"
    see: ["https://ritueel.id/glossary/"]

  - term: renew
    definition: "Extend the same key with a new certification. No new key is made."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/glossary/"]

  - term: replace
    definition: "Make a new key and end the old one, on an event: an advisory, a deprecated algorithm, a lost card, a suspected compromise or a change of key store. A key that can be copied is replaced at the latest after three years."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/glossary/"]

  - term: revoke
    definition: "End a key before its time, as an act of its own. A key is active, retired or revoked. What only that key had certified stays critical until a ceremony certifies it again."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/learn/revoke/"]

  - term: trust files
    definition: "The files outsiders read to decide whom to trust: the root list, the CA bundle, the CRLs, the SSH CA key list and the keyring. They are written as a numbered trust set, and the holder's pipeline publishes them."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/glossary/"]

  - term: trust set
    definition: "The numbered set of trust files written together for one change of a bundle."
    owner: ritueel
    status: decided

  - term: trust sequence
    definition: "One integer for each bundle that grows by one whenever any trust file changes. Every trust file carries it, and a host refuses a list with a lower one."
    owner: ritueel
    status: decided

  - term: CA bundle
    definition: "One PEM file with the certificates of the active X.509 root keys of a bundle. It is a trust file."
    owner: ritueel
    status: decided
    not:
      - "the bundle, which is a directory"
      - "the SPIFFE trust bundle"

  - term: root list
    definition: "The list of the active root keys of a bundle, each pinned by a digest of its public key, with the trust sequence, signed with an X.509 root key. It pins keys, never certificates. It expires 13 months after signing. ritueel builds it and the holder's pipeline publishes it."
    owner: ritueel
    status: decided

  - term: SSH CA key list
    definition: "The signed list of the public keys of the SSH CAs that hosts trust, each with its use, user or host. It is a trust file with the expiry and host rules of the root list."
    owner: ritueel
    status: decided

  - term: keyring
    definition: "The OpenPGP file of the complete public certificates of every active primary, with their subkey bindings and soft revocations. ritueel makes the file; the holder's release pipeline packages and publishes it. A reader only reads it."
    owner: ritueel
    status: decided
    not:
      - "the OS keyring, a backend of the software store that keeps a software key"

  - term: hand-off contract
    definition: "The versioned contract through which a requester and ritueel meet in standard formats and files. It has three request types, `x509-intermediate`, `openpgp-subkey` and `ssh-ca-key`. A request is answered by an answer, which always holds a result file."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  - term: request
    definition: "The files a requester sends ritueel for one key, which share a stem: a certificate request, a subkey, or an SSH CA key with its signature, and a proof file."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  - term: answer
    definition: "The files ritueel sends back for one request, with the same stem. An answer always holds a result file."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  - term: result file
    definition: "The file `<stem>.result.json` of an answer: whether ritueel issued or refused the request, the reason codes when it refused, the digests of the other files of the answer and the trust sequence."
    owner: ritueel
    status: decided
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  - term: proof file
    definition: "The file `<stem>.proof.json` of a request, in which the requester shows where its key lives and carries the evidence for it."
    owner: ritueel
    status: proposed
    not:
      - "a proof in sluis, what a machine presents to get a credential"
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  - term: recovery key
    definition: "An age identity in a passphrase-protected file, kept apart from the cards. Every card-opened key file has one, and each bundle has its own."
    owner: ritueel
    status: decided
    not:
      - "the backup recovery key of sluis, a cloud KMS key in the anchor account of a boundary"
      - "the unlock key, the age key whose private half a passkey on a root card unwraps"

  - term: recovery recipient
    definition: "One of the two recipients that a key file is encrypted to. The other is the public half of the unlock key."
    owner: ritueel
    status: decided
    not:
      - "the backup recovery key of sluis, a cloud KMS key in the anchor account of a boundary"

  - term: card
    definition: "A hardware token, such as a YubiKey. A card has one of four kinds and never changes it: root, day-to-day, server or rehearsal."
    owner: ritueel
    status: decided

  - term: floor
    definition: "The least a requester needs from a root: PKCS#10 in, X.509 out, in a stated profile that any certificate authority can issue. On the floor the requester's anchors are the CA certificates the operator installed, with no trust sequence and no rollback protection."
    owner: ritueel
    status: decided
    not:
      - "the firmware floor for a root card, which is a minimum firmware version"
    see: ["https://ritueel.id/reference/hand-off-contract/"]

  # ---------------------------------------------------------------- owned by sluis
  - term: credential holder
    definition: "A unit that holds a credential at rest. There are exactly four kinds: store@ and exporter@ (data), key@ (keys), and the audit pieces that hold a credential (writer, witness, indexer, reader). No work actor is one."
    owner: sluis
    status: decided
    not:
      - "a holder, the person or small team who keeps a ritueel root"
    see: ["https://sluis.id/decisions/0002-families-of-actors/#credential-holders"]

  - term: operator
    definition: "The person or team that runs a sluis installation and acts at run time through the console."
    owner: sluis
    status: decided
    not:
      - "a holder, the person or small team who keeps a ritueel root"
    see: ["https://sluis.id/decisions/0027-the-console/"]

  - term: trust domain
    definition: "The SPIFFE name of a boundary, such as `prod.example.com`. Each boundary has its own trust domain, trust bundle and CA intermediate."
    owner: sluis
    status: decided
    not:
      - "a ritueel bundle, which holds the roots of one organisation or person"
    see: ["https://sluis.id/decisions/0022-workload-identity-and-host-enrolment/#trust-domains"]

  - term: trust bundle
    definition: "The SPIFFE document of the certificates a host trusts for one trust domain. Each certificate chains through the boundary's intermediate to a root key that the root list pins. The word is SPIFFE's only."
    owner: sluis
    status: decided
    not:
      - "the CA bundle, ritueel's PEM file"
      - "a bundle, ritueel's directory"
    see: ["https://sluis.id/decisions/0022-workload-identity-and-host-enrolment/#the-trust-bundle"]

  - term: proof
    definition: "What a machine presents to get a credential: a cloud instance document, a Kubernetes token, a CI token, a hardware attestation, an enrolment token or a person's approval. exchange verifies it and policy decides what the machine may become."
    owner: sluis
    status: decided
    not:
      - "a proof file of the hand-off contract"
    see: ["https://sluis.id/decisions/0022-workload-identity-and-host-enrolment/#proofs-and-the-exchange"]

  - term: backup recovery key
    definition: "A cloud KMS key in the anchor account of a boundary, one for each environment, for which every data key and every backup archive key is also wrapped. It opens the backups when every card and wrapping key is lost. It is owned by sluis."
    owner: sluis
    status: decided
    not:
      - "a ritueel object: ritueel does not make, hold or replace it"
      - "the recovery key of a ritueel key file, an age identity kept apart from the cards, with its recovery recipient"
    see: ["https://sluis.id/decisions/0006-keys-and-sealing/#the-backup-recovery-key"]
