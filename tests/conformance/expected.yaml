# The results the OpenID Foundation conformance suite is expected to give for sluis, module by module (docs/standards/conformance.md,
# tests/conformance/README in run.sh). `runner run` fails on any difference, in either direction:
#   - a module that ends in another result than the one here (a pass that fails, a fail that passes, a skip that runs, a pass that
#     skips, a module that does not end in time);
#   - a failing module that fails on other conditions, or whose failure no longer carries the `detail` words, so that an expected
#     failure is never "ignored": it must fail for the stated reason;
#   - conditions that warn which did not before, or that stopped warning;
#   - a skip for another reason than the stated one;
#   - a module the suite has and this table has not, or the reverse (a new suite release shows up here first).
# A change that moves a result edits this file in the same pull request, with the reason. The first version of sluis runs the
# suite as a public client (client_auth_type=none), through the comprehensive plan `oidcc-test-plan`, because the Basic and
# Form Post certification plans fix a confidential client; so this is not the certification profile and the first version
# makes no claim of OIDF certification.
schema: 1
suite: { release: release-v5.3.4 }
plans:
  - name: config
    plan: oidcc-config-certification-test-plan
    alias: sluis-config
    modules:
      oidcc-discovery-endpoint-verification:
        result: FAILED
        failures: [OIDCCCheckDiscEndpointIdTokenSigningAlgValuesSupported]
        detail: "RS256 support is required"
        because: "OpenID Connect Discovery 1.0 section 3 requires RS256 among id_token_signing_alg_values_supported, and sluis lists ES384 only (ADR 0006); the per-audience RS256 exception of the ADR is not built. The 26 other conditions of the module succeed. No certification claim is made."
        cleared_by: "RS256 ID tokens: the owner decision of 2026-11-07 (the first version lists RS256 and signs with an RSA key)."
  - name: basic
    plan: oidcc-test-plan
    alias: sluis-basic
    variant: { client_auth_type: none, response_type: code, response_mode: default, client_registration: static_client }
    modules:
      oidcc-alternate-happy-flow:
        result: SKIPPED
        skip: "scopes_supported"
        cleared_by: "The upstream's claims allow-list (REQ-TOKEN-006), which lists profile and email in scopes_supported; address and phone stay skipped unless they are listed."
        because: "scopes_supported lists openid only, because name and email claims wait for the upstream's claims allow-list (REQ-TOKEN-006, v1 parity); the module skips when its scope is not listed, which is its intended outcome for a truthful discovery document."
