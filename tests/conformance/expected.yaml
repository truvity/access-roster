        because: "In the form_post plan the module's request object carries response_mode=form_post inside the object only, so the error request_not_supported that sluis answers (OpenID Connect Core 3.1.2.6) goes to the redirect_uri in the query, as for any request whose response mode is not in the URL; the module's callback checks for a form post come first and fail, before it reaches the skip it takes in the default plan. sluis does not read the request object it refuses, so it cannot know the mode. Read from the module source (AbstractOIDCCRequestObjectServerTest.onAuthorizationCallbackResponse, BuildRequestObjectByValue...): the suite's expectation is that an OP which refuses request objects still answers form_post."
