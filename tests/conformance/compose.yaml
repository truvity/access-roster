# The OpenID Foundation conformance suite, self-hosted (docs/standards/conformance.md; REQ-TEST-*): the Java application
# (release v5.3.4), the MongoDB it keeps its results in, and the nginx that ends TLS for the suite's own address. The
# suite is the released image, not a build of ours, and every image is pinned by digest. No account and no secret: the suite
# runs in its development mode, which has no sign-in of its own and takes API calls without a token, on the loopback only.
#
# The suite reaches the installation's issuer by its name, through the installation's forwarder, as a relying party would: a
# relay on both networks (tests/conformance/run.sh names the installation's in SLUIS_OIDF_NETWORK) carries the bytes. The Java application
# trusts the harness CA through a trust store that run.sh makes (SLUIS_OIDF_TRUSTSTORE); nothing else is added to it.
#
#   SLUIS_OIDF_NETWORK     the Compose network of the local installation, <project>_default
#   SLUIS_OIDF_TRUSTSTORE  a directory for cacerts: the JDK's roots and the harness CA (the service `truststore` makes it)
#   SLUIS_OIDF_SUITE_NETWORK  the suite's own network (run.sh makes it)
#   SLUIS_OIDF_CA          the harness CA, a PEM file
#   SLUIS_OIDF_PORT        the loopback port of the suite's address (default 8443)
services:
  mongodb:
    # mongo 6.0.13, the version of the suite's own compose file.
    image: mongo:6.0.13@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
    tmpfs: [/data/db]
    logging: { driver: json-file, options: { max-size: 500k, max-file: "3" } }
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx@sha256:9a7850826fcc8690cd43373528f50e9551ba33bf8e4a40b67b13267b0aca3675 # release-v5.3.4
    ports:
      - "127.0.0.1:${SLUIS_OIDF_PORT:-8443}:8443"
    networks:
      default:
        aliases:
          # The suite's own requests to its public name reach nginx, not the loopback of its container.
          - localhost.emobix.co.uk
    depends_on: [server]
    logging: { driver: json-file, options: { max-size: 500k, max-file: "3" } }
  # Run once by run.sh, before the suite starts: the JDK's trust store of the suite's own image, with the harness CA added.
  truststore:
    image: registry.gitlab.com/openid/conformance-suite@sha256:dcc4bd1fb7e9c00f048a67373fe2bec5ecf9feb45a6b5d55e237e5c30e5312c6 # release-v5.3.4
    profiles: [tools]
    user: "${SLUIS_OIDF_USER:-0:0}"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        cp "$$JAVA_HOME/lib/security/cacerts" /trust/cacerts
        chmod u+w /trust/cacerts
        keytool -importcert -noprompt -alias sluis-harness -file /ca.pem -keystore /trust/cacerts -storepass changeit
    volumes:
      - ${SLUIS_OIDF_TRUSTSTORE:?set SLUIS_OIDF_TRUSTSTORE (tests/conformance/run.sh does)}:/trust
      - ${SLUIS_OIDF_CA:?set SLUIS_OIDF_CA to the harness CA (.cache/local/ca/ca.pem)}:/ca.pem:ro
  # The installation's issuer is https://sluis.dev.local.test, with no port, and its forwarder serves port 8443 of its container.
  # The issuer's name is given to this relay on the suite's network, at 443, and it carries the bytes to the forwarder, so the TLS the suite sees is the forwarder's and nothing is ended or changed on the
  # way. This container alone is on both networks.
  relay:
    image: alpine/socat@sha256:466c8a0383e16463fabdb7df01008292fb78d07da60224a46cb5d3142ce122ed
    command: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:forwarder:8443"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks:
      default:
        aliases: [sluis.dev.local.test]
      installation: {}
    logging: { driver: json-file, options: { max-size: 200k, max-file: "2" } }
  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:dcc4bd1fb7e9c00f048a67373fe2bec5ecf9feb45a6b5d55e237e5c30e5312c6 # release-v5.3.4
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      # The development profile: no sign-in to the suite itself. The Google and GitLab client values are the suite's own
      # placeholders; the suite makes no call to either.
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
      JAVA_EXTRA_ARGS: -Djavax.net.ssl.trustStore=/trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit
    volumes:
      - ${SLUIS_OIDF_TRUSTSTORE:?set SLUIS_OIDF_TRUSTSTORE (tests/conformance/run.sh does)}:/trust:ro
    depends_on: [mongodb, relay]
    logging: { driver: json-file, options: { max-size: 2m, max-file: "5" } }
networks:
  # The suite's own network is made by run.sh, with a subnet that a host's firewall lets through where it must be chosen.
  default:
    name: ${SLUIS_OIDF_SUITE_NETWORK:?set SLUIS_OIDF_SUITE_NETWORK (tests/conformance/run.sh does)}
    external: true
  installation:
    name: ${SLUIS_OIDF_NETWORK:?set SLUIS_OIDF_NETWORK to the network of the local installation}
    external: true
