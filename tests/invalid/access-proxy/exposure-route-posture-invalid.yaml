# An exposure.routes entry's posture is groups or authenticated.
# error: at '/exposure/routes/0/posture': value must be one of
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  routes:
  - name: demo
    attachRouteName: surface-demo
    posture: open
  - name: app
    attachRouteName: surface-app
    allow:
    - surface:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
