# networkPolicy.gatewayNamespace is required when the NetworkPolicy is enabled (template `required`).
# error: networkPolicy.gatewayNamespace is required
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
networkPolicy:
  enabled: true
