# An exposure.routes entry's backend.port has a minimum of 1.
# error: at '/exposure/routes/0/backend/port': minimum
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  routes:
  - name: demo
    backend:
      name: demo
      port: 0
    posture: authenticated
  - name: app
    attachRouteName: surface-app
    allow:
    - surface:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
