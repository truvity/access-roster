# A key under session.valkey.passwordSecret does not know must fail the render, not be ignored.
# error: at '/session/valkey/passwordSecret': additional properties 'keyName' not allowed
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
    passwordSecret:
      keyName: x
  cookieSecret:
    name: console-cookie
