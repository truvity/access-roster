# client.secret.keys.clientSecret may not be empty.
# error: at '/client/secret/keys/clientSecret': minLength
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
    keys:
      clientSecret: ''
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
