# exposure.backend.port has a minimum of 1.
# error: at '/exposure/backend/port': minimum
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
    port: 0
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
