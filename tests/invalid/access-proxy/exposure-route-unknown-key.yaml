# A key in an exposure.routes entry does not know must fail the render, not be ignored.
# error: at '/exposure/routes/0': additional properties 'hostname' not allowed
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  routes:
  - name: demo
    attachRouteName: surface-demo
    posture: authenticated
    hostname: x
  - name: app
    attachRouteName: surface-app
    allow:
    - surface:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
