# A key under client.secret.keys does not know must fail the render, not be ignored.
# error: at '/client/secret/keys': additional properties 'id' not allowed
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
    keys:
      id: x
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
