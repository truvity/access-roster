# The groups posture with an empty allow-list admits nobody (template `fail`).
# error: route "app" uses the `groups` posture with an empty allow-list
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
