# client.secret.name is required (template `required`).
# error: client.secret.name is required
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret: {}
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
