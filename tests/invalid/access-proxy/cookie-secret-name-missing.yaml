# session.cookieSecret.name is required: the chart will not mint one (template `required`).
# error: session.cookieSecret.name is required
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret: {}
