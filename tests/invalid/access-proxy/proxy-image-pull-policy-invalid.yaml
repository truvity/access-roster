# proxy.image.pullPolicy is one of Always, IfNotPresent, Never.
# error: at '/proxy/image/pullPolicy': value must be one of
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
proxy:
  image:
    pullPolicy: Sometimes
