# An exposure.routes entry with no backend.name and no attachRouteName has nothing to route to (template `required`).
# error: route "demo" needs backend.name
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  routes:
  - name: demo
    posture: authenticated
    backend:
      port: 9000
  - name: app
    attachRouteName: surface-app
    allow:
    - surface:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
