# exposure.routes and exposure.backend describe the same route twice (template `fail`).
# error: exposure.routes is set alongside exposure.backend/attachRouteName
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  routes:
  - name: demo
    attachRouteName: surface-demo
    posture: authenticated
  - name: app
    attachRouteName: surface-app
    allow:
    - surface:operator
  backend:
    name: app
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
