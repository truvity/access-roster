# A key under proxy.image does not know must fail the render, not be ignored.
# error: at '/proxy/image': additional properties 'registry' not allowed
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
proxy:
  image:
    registry: x
