# A key in an exposure.parentRefs entry does not know must fail the render, not be ignored.
# error: at '/exposure/parentRefs/0': additional properties 'section' not allowed
exposure:
  hostname: console.example
  backend:
    name: console
  allow:
  - console:operator
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: console
    namespace: gateway-system
    section: x
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
