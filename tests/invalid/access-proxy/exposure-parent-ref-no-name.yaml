# An exposure.parentRefs entry needs a name.
# error: at '/exposure/parentRefs/0': missing property 'name'
exposure:
  hostname: console.example
  backend:
    name: console
  allow:
  - console:operator
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    namespace: gateway-system
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
