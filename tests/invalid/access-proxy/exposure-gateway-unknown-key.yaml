# A key under exposure.gateway does not know must fail the render, not be ignored.
# error: at '/exposure/gateway': additional properties 'listener' not allowed
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
    listener: x
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
