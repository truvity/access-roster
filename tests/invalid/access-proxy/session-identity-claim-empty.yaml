# session.identityClaim may not be empty.
# error: at '/session/identityClaim': minLength
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
  - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
  identityClaim: ''
