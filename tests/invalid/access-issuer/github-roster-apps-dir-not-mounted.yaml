# The Apps' Secret is mounted at one path.
# error: githubRoster.config.appsDir must be /var/run/github-roster/apps
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
githubRoster:
  enabled: true
  config:
    consoleURL: http://access-issuer.default.svc:8080/console
    appsDir: /etc/apps
