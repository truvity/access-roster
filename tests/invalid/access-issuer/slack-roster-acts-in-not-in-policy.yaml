# slackRoster.actsIn names a workspace the inline policy does not declare.
# error: slackRoster.actsIn names "old", which policy.slack.workspaces does not declare
issuerURL: https://issuer.example
slackRoster:
  enabled: true
  actsIn: [acme, old]
exchange:
  clusters:
    - name: example
      issuer: https://oidc.example
console:
  mount: /console
policy:
  slack:
    workspaces:
      acme: {}
