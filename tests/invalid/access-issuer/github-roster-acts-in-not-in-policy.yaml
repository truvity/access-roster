# githubRoster.actsIn names an organisation the inline policy does not bind.
# error: githubRoster.config.enabledOrgs names "old", which policy.github does not bind
config:
  issuerURL: https://issuer.example
githubRoster:
  enabled: true
  config:
    enabledOrgs:
    - acme
    - old
    consoleURL: http://access-issuer.default.svc:8080/console
exchange:
  clusters:
  - name: example
    issuer: https://oidc.example
console:
  mount: /console
policy:
  github:
    acme: {}
