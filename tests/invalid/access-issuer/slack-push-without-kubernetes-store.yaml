# Pushing a token the service keeps nowhere must fail the render rather than render a PushSecret over a Secret that does not exist.
# error: needs directory.store: kubernetes
issuerURL: https://issuer.example
directory:
  store: memory
slackApps:
  - id: sync
    workspace: acme
    botScopes: [channels:read]
    push:
      secretStore: {name: example-store}
      remoteKey: platform/slack-apps/sync
