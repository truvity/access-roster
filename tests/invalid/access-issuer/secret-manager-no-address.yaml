# A store with namespaces and nowhere to ask them.
# error: at '/secretManagers/0': missing property 'address'
# Accepting it would draw a page whose every namespace reports
# unreadable, which reads as an outage rather than as a value nobody
# set. The service's own loader refuses it too.
issuerURL: https://issuer.example
secretManagers:
  - name: kernel
    namespaces:
      - name: devel
