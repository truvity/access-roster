# A key the controller does not read is refused at render.
# error: at '/githubRoster/config': additional properties 'bogusKey' not allowed
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
githubRoster:
  enabled: true
  config:
    consoleURL: http://access-issuer.default.svc:8080/console
    bogusKey: 1
