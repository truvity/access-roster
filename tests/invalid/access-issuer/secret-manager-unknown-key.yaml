# A key by another name must fail the render rather than be ignored.
# error: at '/secretManagers/0': additional properties 'endpoint'
# `endpoint:` would otherwise leave the store with no address at all.
issuerURL: https://issuer.example
secretManagers:
  - name: kernel
    endpoint: https://openbao.example.private
    namespaces:
      - name: devel
