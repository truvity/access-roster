# One bundle path, two sources: one of them would be silently unused.
# error: name caCertSecret or caCertConfigMap, not both
issuerURL: https://issuer.example
secretManagers:
  - name: kernel
    address: https://openbao.example.private
    caCertSecret:
      name: openbao-ca
    caCertConfigMap:
      name: truvity-private-ca
    namespaces:
      - name: devel
