# The projected token is mounted at one path.
# error: slackRoster.config.tokenFile must be /var/run/secrets/slack-roster/token
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
slackRoster:
  enabled: true
  config:
    consoleURL: http://access-issuer.default.svc:8080/console
    tokenFile: /etc/token
