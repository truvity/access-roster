# A namespace IS an environment: the model is one level deep.
# error: at '/secretManagers/0/namespaces/0/name': 'devel/inner' does not match pattern
# A nested namespace is refused here rather than half-drawn later.
issuerURL: https://issuer.example
secretManagers:
  - name: kernel
    address: https://openbao.example.private
    namespaces:
      - name: devel/inner
