# The workspaces' Secret is mounted at one path.
# error: slackRoster.config.credentialsDir must be /var/run/slack-roster/credentials
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
slackRoster:
  enabled: true
  config:
    consoleURL: http://access-issuer.default.svc:8080/console
    credentialsDir: /etc/creds
