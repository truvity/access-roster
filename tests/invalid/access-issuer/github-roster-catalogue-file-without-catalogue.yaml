# A catalogueFile with no githubApps.catalogue names a file nothing mounts.
# error: githubRoster.config.catalogueFile is "/var/run/github-roster/github-apps-catalogue.yaml" and the chart renders nothing there
config:
  issuerURL: https://issuer.example
console:
  mount: /console
exchange:
  clusters:
  - issuer: https://oidc.example
    name: example
githubRoster:
  enabled: true
  config:
    consoleURL: http://access-issuer.default.svc:8080/console
    catalogueFile: /var/run/github-roster/github-apps-catalogue.yaml
