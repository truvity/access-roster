---
# Source: access-proxy/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-proxy
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-proxy
      app.kubernetes.io/instance: access-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
      ports:
        - protocol: TCP
          port: 4181

---
# Source: access-proxy/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-proxy
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  oauth2-proxy.cfg: |
    provider = "oidc"
    oidc_issuer_url = "https://issuer.example"
    redirect_url = "https://console.example/_auth/callback"
    proxy_prefix = "/_auth"

    http_address = "0.0.0.0:4181"
    reverse_proxy = true
    # static://200, not 202: Envoy's ext_authz treats ONLY a 200 from the
    # authorization service as "allow" and forwards the original request
    # to the real backend. Anything else is a deny, and the authorization
    # response body is what the browser gets.
    upstreams = ["static://200"]

    cookie_domains = ["console.example"]
    # The issuer's host is whitelisted so sign-out can CONTINUE to it.
    # Clearing this proxy's cookie ends the session with this application
    # and nothing else: the issuer still holds the person's sign-in, so
    # the next console -- or a reload of this one -- is admitted again
    # without a password, which everyone reads as "sign out is broken".
    # The second half is an RP-initiated logout at the issuer, and
    # oauth2-proxy refuses to redirect anywhere not named here.
    whitelist_domains = ["console.example", "issuer.example"]
    cookie_secure = true
    cookie_samesite = "lax"
    # The session outlives the access token because the token is renewed
    # underneath it. Without `refresh`, a session outliving its token
    # strands the caller on Envoy's raw "Jwt is expired" 401 until the
    # cookie dies -- so if you unset refresh, bring lifetime back under
    # the issuer's token lifetime.
    cookie_expire = "8h"
    cookie_refresh = "2m"

    # The identity claim. `sub` and not `email`, because this issuer's
    # subject IS the address for a person -- and for a recovery sign-in it
    # is a ServiceAccount, which has no address and must still be able to
    # sign in. Left at the default, oauth2-proxy refuses that with
    # "neither the id_token nor the profileURL set an email", which is the
    # bootstrap locked out of the console it exists to open.
    oidc_email_claim = "email"

    scope = "openid email groups offline_access"
    code_challenge_method = "S256"
    skip_provider_button = true

    # Who may pass is decided at the gateway (or by the application), not
    # here: this proxy accepts any identity the issuer vouches for.
    email_domains = ["*"]

    # Hand the token downstream. The backend verifies it against the
    # issuer's keys rather than trusting that only the gateway can reach
    # it -- "we are only reachable through the gateway" is a property of a
    # NetworkPolicy, one file away from being wrong.
    set_xauthrequest = true
    pass_access_token = true
    set_authorization_header = false

    session_store_type = "redis"
    redis_use_cluster = true
    redis_cluster_connection_urls = ["redis://valkey.example.svc:6379"]
    redis_username = "proxy"

---
# Source: access-proxy/templates/deployment.yaml
apiVersion: v1
kind: Service
metadata:
  name: access-proxy
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
  ports:
    - name: http
      port: 4181
      targetPort: http

---
# Source: access-proxy/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-proxy
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: access-proxy
      app.kubernetes.io/instance: access-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-proxy
        app.kubernetes.io/instance: access-proxy
      annotations:
        # Restart on a config change: the proxy reads its file once at
        # start, so without this a changed issuer or scope list sits in a
        # ConfigMap that nothing has re-read.
        checksum/config: eb517128304a5488e119244a9bef04c62d59e0939895f112614909fe7f58421a
        example.com/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: "registry.example/oauth2-proxy/oauth2-proxy:v7.15.4"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
          ports:
            - name: http
              containerPort: 4181
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: console-client
                  key: id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-client
                  key: secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-cookie
                  key: cookie
            - name: OAUTH2_PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-password
                  key: secret
          livenessProbe:
            httpGet: { path: /ping, port: http }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: access-proxy
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: edge
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: access-proxy
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway

