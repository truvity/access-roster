# Source: access-proxy/templates/httproute.yaml
# The proxy's own endpoints -- sign_in, start, callback, sign-out -- on the
# console's hostname. Always rendered: they are this chart's, whether or
# not it also routes the console itself.

---
# Source: access-proxy/templates/securitypolicy.yaml
# The gate. Envoy calls the proxy for every request on the route; an
# authenticated one is allowed and its token copied onto the request.
#
# Two postures, and the difference is who decides:
#   groups        — the gateway decides, from a claim in the token.
#   authenticated — any signed-in identity passes and the application
#                   decides. Right where the application resolves roles
#                   from a directory it owns; putting the same decision
#                   here too would be a second copy of it, and this one
#                   would be the stale copy.

---
# Source: access-proxy/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-proxy-prefix
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tenants
      namespace: envoy-gateway-system
      sectionName: tenants
  hostnames:
    - "surface.example"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/_gwauth"
      backendRefs:
        - group: ""
          kind: Service
          name: access-proxy
          port: 4180
          # Explicit, matching the API default: ArgoCD normalises core-API
          # defaults but NOT CRDs, so an unwritten one is a permanent
          # OutOfSync that gates every later wave.
          weight: 1

---
# Source: access-proxy/templates/securitypolicy.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: access-proxy-demo
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: surface-demo
  extAuth:
    # Envoy sends the check request to this proxy, and an HTTP ext_authz
    # service is sent ONLY Host, Method, Path, Content-Length and
    # Authorization unless the policy names more. The session cookie is
    # not in that set. Omit this block and the proxy answers every check
    # without ever seeing the cookie it just wrote: sign-in completes,
    # the callback returns a 302 with a Set-Cookie, and the very next
    # request logs "No valid authentication in request. Initiating
    # login." -- an endless loop through a login that works.
    #
    # `cookie` is therefore not a value. The rest carry the scheme and
    # host the proxy builds its redirect from, and the fields its access
    # log would otherwise record as empty.
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
      - accept
      - user-agent
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: access-proxy
          port: 4180
          # Same reason as the route's: written out, not defaulted.
          weight: 1
      headersToBackend:
        - x-auth-request-access-token
        - x-auth-request-email
        - x-auth-request-user
        - authorization

---
# Source: access-proxy/templates/securitypolicy.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: access-proxy-app
  labels:
    app.kubernetes.io/name: access-proxy
    app.kubernetes.io/instance: access-proxy
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: surface-app
  extAuth:
    # Envoy sends the check request to this proxy, and an HTTP ext_authz
    # service is sent ONLY Host, Method, Path, Content-Length and
    # Authorization unless the policy names more. The session cookie is
    # not in that set. Omit this block and the proxy answers every check
    # without ever seeing the cookie it just wrote: sign-in completes,
    # the callback returns a 302 with a Set-Cookie, and the very next
    # request logs "No valid authentication in request. Initiating
    # login." -- an endless loop through a login that works.
    #
    # `cookie` is therefore not a value. The rest carry the scheme and
    # host the proxy builds its redirect from, and the fields its access
    # log would otherwise record as empty.
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
      - accept
      - user-agent
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: access-proxy
          port: 4180
          # Same reason as the route's: written out, not defaulted.
          weight: 1
      headersToBackend:
        - x-auth-request-access-token
        - x-auth-request-email
        - x-auth-request-user
        - authorization
  jwt:
    providers:
      - name: issuer
        issuer: "https://issuer.example"
        remoteJWKS:
          uri: "https://issuer.example/keys"
          # Explicit, matching the CRD default: the API server injects it,
          # and an undeclared default is a permanent ArgoCD OutOfSync.
          cacheDuration: "300s"
        extractFrom:
          headers:
            - name: X-Auth-Request-Access-Token
  authorization:
    # Deny by default: a fresh identity with no grants gets a 403, not the
    # application.
    defaultAction: Deny
    rules:
      - name: groups-allow
        action: Allow
        principal:
          jwt:
            provider: issuer
            claims:
              - name: groups
                valueType: StringArray
                values:
                  - "surface:operator"
