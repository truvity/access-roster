# Source: access-roster/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  gatewayClassName: "internal"
  listeners:
    - name: issuer
      protocol: HTTPS
      port: 443
      hostname: "issuer.example"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: access-roster-tls

