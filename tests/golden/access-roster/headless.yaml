---
# Source: access-roster/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: access-roster
      app.kubernetes.io/instance: access-roster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-roster
        app.kubernetes.io/instance: access-roster
      annotations:
        # A configuration change is a rollout: the file is read at start.
        checksum/config: 0b787ee386aac17d9de1969e879e01e8b0fe5b7744e95b52b38fb28b2055466e
        # A policy change is a rollout: the file is read at start.
        checksum/policy: 8adfde727b4de0d925f6151976c7a79c88e9bb67621bac4c7b51429bf81edd25
    spec:
      serviceAccountName: access-roster
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: "ghcr.io/truvity/access-roster/access-roster:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          # The whole of the configuration is the file: `config`, rendered as it
          # stands. The environment carries only the secrets that file names.
          args:
            - serve
            - --config=/etc/access-roster/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/access-roster/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: access-roster-config
        - name: signing-key
          secret:
            secretName: delivered-signing-key
        - name: policy
          configMap:
            name: access-roster-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        

