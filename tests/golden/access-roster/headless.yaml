# Source: access-roster/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-roster/templates/configmap.yaml
# What `access-roster serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped. The binary validates it against
# schemas/config/serve.schema.json at start, and values.schema.json
# holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-roster-config
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    audit:
      tokenFile: /var/run/audit/token
    inCluster: false
    issuerURL: https://issuer.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policyDir: /var/run/access-issuer/policy
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: false
      serviceAccount: access-issuer-recovery
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: memory

---
# Source: access-roster/templates/policy-configmap.yaml
# The declared layer of the policy — the same file the hub reads, and the
# same schema. See docs/reference/policy.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-roster-policy
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    # The version belongs to the chart, not to the values: the loader
    # refuses a document whose version it does not know, so a policy
    # written without one is a service that will not start.
    version: 1

