# Source: access-roster/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: access-roster
      sectionName: issuer
  hostnames:
    - "issuer.example"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: access-roster
          port: 8080
          weight: 1
