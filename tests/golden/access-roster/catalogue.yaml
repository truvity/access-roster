# Source: access-roster/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-roster/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-roster/templates/configmap.yaml
# What `access-roster serve --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped. The binary validates it against
# schemas/config/serve.schema.json at start, and values.schema.json
# holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-roster-config
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: serve
data:
  config.yaml: |
    audit:
      tokenFile: /var/run/audit/token
    github:
      catalogueFile: /var/run/access-issuer/github-apps-catalogue.yaml
    inCluster: true
    issuerURL: https://access.example
    lifetimes:
      absolute: 24h
      hold: 4h
      refresh: 12h
      token: 1h
    listen:
      address: :8080
    policyDir: /var/run/access-issuer/policy
    probes:
      address: :7070
    recovery:
      audience: access-issuer-recovery
      enabled: true
      serviceAccount: access-issuer-recovery
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes

---
# Source: access-roster/templates/github-apps-catalogue-configmap.yaml
# The GitHub Apps this deployment declares, created and installed by an
# operator from the console. Nothing here is a secret: names, permissions
# and grants. The keys GitHub hands over are kept by the service, in the
# Secret <release>-github-catalogue-apps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-roster-github-apps-catalogue
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  catalogue.yaml: |
    apps:
    - description: Dependency updates
      events:
      - pull_request
      grants:
      - group: all:platform:engineer
        permissions:
          contents: read
        repositories:
        - '*'
      id: renovate
      installation: all
      name: example-org-renovate
      org: example-org
      permissions:
        contents: write
        pull_requests: write
      public: false
    - id: releases
      org: example-org
      permissions:
        contents: write

---
# Source: access-roster/templates/policy-configmap.yaml
# The declared layer of the policy — the same file the hub reads, and the
# same schema. See docs/reference/policy.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-roster-policy
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    # The version belongs to the chart, not to the values: the loader
    # refuses a document whose version it does not know, so a policy
    # written without one is a service that will not start.
    version: 1

---
# Source: access-roster/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: access-roster-default-tokenreview
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
# Source: access-roster/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: access-roster-default-tokenreview
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: access-roster-default-tokenreview
subjects:
  - kind: ServiceAccount
    name: access-roster
    namespace: default

---
# Source: access-roster/templates/serviceaccount.yaml
# The directory store is plain Kubernetes objects in THIS namespace:
# workspace records (ConfigMaps) and their credentials (Secrets), written
# by this service itself. A namespaced Role and never a ClusterRole —
# which is why this service gets a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Source: access-roster/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-roster
  labels:
    app.kubernetes.io/name: access-roster
    app.kubernetes.io/instance: access-roster
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
