---
# Source: access-issuer/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: access-issuer
      app.kubernetes.io/instance: access-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-issuer
        app.kubernetes.io/instance: access-issuer
      annotations:
        # A policy change is a rollout: the file is read at start.
        checksum/policy: f5c82283eed74b86b5e454b26352ac8643e60badea3b25b6ec910431fa4c1a0c
    spec:
      serviceAccountName: access-issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: access-issuer
          image: "ghcr.io/truvity/access-roster/access-issuer:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          env:
            - name: ISSUER_URL
              value: "https://access.example"
            - name: PORT
              value: "8080"
            - name: HEALTH_PORT
              value: "7070"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Names this replica on every audit record, as the instance
            # that emitted it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # What an operator connected — the workspaces and their
            # credentials, the memberships, the OAuth client it was
            # given, the session key — kept as ConfigMaps and Secrets in
            # this namespace. Anything else and a restart is a fresh
            # installation.
            - name: STORE
              value: "kubernetes"
            - name: REFRESH_INTERVAL
              value: "15m"
            - name: FRESHNESS_WINDOW
              value: "30m"
            - name: PROBE_INTERVAL
              value: "5m"
            - name: AUDIT_WRITER_URL
              value: ""
            - name: AUDIT_TOKEN_FILE
              value: ""
            - name: AUDIT_QUERY_URL
              value: ""
            - name: AUDIT_AUDIENCE
              value: "audit"
            - name: AUDIT_FORWARDED_FOR_TRUSTED_HOPS
              value: "0"
            - name: SESSION_LIFETIME
              value: "12h"
            - name: LOGIN_DIRECTORY
              value: "true"
            # Provisioned, never minted here — see values.yaml.
            - name: SIGNING_KEY_FILE
              value: /var/run/access-issuer/signing-key/tls.key
            - name: RELEASE_NAME
              value: access-issuer
            - name: POLICY_DIR
              value: /var/run/access-issuer/policy
            - name: TOKEN_LIFETIME
              value: "1h"
            - name: REFRESH_LIFETIME
              value: "12h"
            - name: ABSOLUTE_LIFETIME
              value: "24h"
            - name: HOLD_WINDOW
              value: "4h"
            - name: EXCHANGE_AUDIENCE
              value: "access-issuer"
            # Recovery is the one thing left that asks the API server, and
            # deliberately so: on the day everything else is broken it
            # should depend on nothing but the cluster.
            - name: IN_CLUSTER
              value: "true"
            - name: RECOVERY_ENABLED
              value: "true"
            - name: RECOVERY_SERVICE_ACCOUNT
              value: "access-issuer-recovery"
            - name: RECOVERY_AUDIENCE
              value: "access-issuer-recovery"
            - name: LOG_LEVEL
              value: "info"
            # The secret stores the console SHOWS. The reader's identity
            # is the projected token below -- this service's own
            # ServiceAccount, exchanged at its own issuer for the store's
            # audience, exactly as a CI job's is. No second credential.
            - name: SECRET_MANAGERS_FILE
              value: /var/run/access-issuer/secret-managers.yaml
            - name: SECRET_MANAGERS_TOKEN_FILE
              value: /var/run/access-issuer/secret-managers-token/token
            - name: SECRET_MANAGERS_ISSUER
              value: "https://access.example"
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
            - name: secret-managers
              mountPath: /var/run/access-issuer/secret-managers.yaml
              subPath: managers.yaml
              readOnly: true
            - name: secret-managers-token
              mountPath: /var/run/access-issuer/secret-managers-token
              readOnly: true
            - name: secret-managers-ca-partner
              mountPath: /var/run/access-issuer/secret-managers-ca/partner
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: signing-key
          secret:
            secretName: access-issuer-signing-key
        - name: policy
          configMap:
            name: access-issuer-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        
        - name: secret-managers
          configMap:
            name: access-issuer-secret-managers
        # The reader's proof: this service's OWN ServiceAccount token,
        # projected for the exchange audience rather than the API
        # server's. A token minted for another audience is a perfectly
        # valid token and no proof at all, which is the whole point of
        # the audience being the trust boundary. Rotated under the pod by
        # the kubelet, which is why the file is read per call.
        - name: secret-managers-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: access-issuer
                  expirationSeconds: 3600
        # A store behind a private root. The bundle is trusted IN
        # ADDITION to the system's, for connections to that store alone.
        # A Secret or a ConfigMap: a root is not a secret, and
        # trust-manager writes it as the second into every namespace.
        - name: secret-managers-ca-partner
          configMap:
            name: truvity-private-ca

---
# Source: access-issuer/templates/signing-key.yaml
# The signing key, issued by cert-manager.
#
# The certificate is a by-product: only the key is used. cert-manager is
# here because it generates the key in the cluster, keeps it out of every
# other system, and rotates it on a schedule the platform already
# understands — none of which is true of a key this service minted for
# itself, and the last of which is the reason it does not.
#
# `rotationPolicy: Always` makes a renewal a *new key*, which is the
# point: a renewed certificate over the same key would rotate nothing.
#
# The algorithm decides what the issuer signs with -- RSA signs RS256, and
# P-256, P-384 and P-521 sign ES256, ES384 and ES512 -- and that is what
# the discovery document advertises, so every relying party has to accept
# it. Changing it here rotates the key, so tokens signed with the previous
# one stop verifying once the old public key leaves the JWKS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: access-issuer-signing-key
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: access-issuer-signing-key
  commonName: access-issuer
  duration: "8760h"
  renewBefore: "720h"
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: "selfsigned"
    kind: "ClusterIssuer"
    group: cert-manager.io
