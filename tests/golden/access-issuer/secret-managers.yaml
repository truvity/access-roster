---
# Source: access-issuer/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-issuer/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-recovery
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-issuer/templates/policy-configmap.yaml
# The declared layer of the policy — the same file the hub reads, and the
# same schema. See docs/reference/policy.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-policy
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    # The version belongs to the chart, not to the values: the loader
    # refuses a document whose version it does not know, so a policy
    # written without one is a service that will not start.
    version: 1

---
# Source: access-issuer/templates/secret-managers-configmap.yaml
# The secret stores this console SHOWS. Nothing here is a secret: names,
# addresses, and which namespaces to draw. The credential the reader uses
# is minted per read from this service's own ServiceAccount token and is
# never stored.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-secret-managers
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  managers.yaml: |
    managers:
    - address: https://openbao.example.private
      name: kernel
      namespaces:
      - name: devel
      - name: stage
      - name: prod
    - address: https://bao.partner.example
      audience: partner-openbao
      caCertFile: /var/run/access-issuer/secret-managers-ca/partner/ca-certificates.crt
      mount: jwt-partner
      name: partner
      namespaces:
      - environment: devel
        name: sandbox
      role: reader

---
# Source: access-issuer/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: access-issuer-default-tokenreview
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
# Source: access-issuer/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: access-issuer-default-tokenreview
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: access-issuer-default-tokenreview
subjects:
  - kind: ServiceAccount
    name: access-issuer
    namespace: default

---
# Source: access-issuer/templates/serviceaccount.yaml
# The directory store is plain Kubernetes objects in THIS namespace:
# workspace records (ConfigMaps) and their credentials (Secrets), written
# by this service itself. A namespaced Role and never a ClusterRole —
# which is why this service gets a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Source: access-issuer/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-issuer
subjects:
  - kind: ServiceAccount
    name: access-issuer
    namespace: default

---
# Source: access-issuer/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
