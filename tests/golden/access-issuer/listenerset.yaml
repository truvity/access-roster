            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: access-issuer
          port: 8080
          weight: 1

---
# Source: access-issuer/templates/httproute.yaml
# The console's own route, and the reason it is a SEPARATE object rather
# than another rule above: a gateway policy attaches to an HTTPRoute, so
# anything put in front of the console would otherwise also sit in front
# of /token, /keys and discovery. Every relying party in the estate would
# be asked to sign in to fetch a key set.
#
# It renders whether or not anything attaches to it. An empty route costs
# a few lines of YAML; discovering at cutover that there is nothing to
# attach to costs an evening, and the alternative in that moment —
# attaching to the catch-all — is the outage described above.
#
# The path is NOT rewritten. The merged service strips the prefix
# itself, so a gateway that stripped it too would hand the console a path
# it never serves.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-issuer-console
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: issuer
      namespace: gateway-system
  hostnames:
    - "issuer.example"
  rules:
    - matches:
        - path:
            type: Exact
            value: "/console"
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: "/console/"
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: "/console/"
      backendRefs:
        - group: ""
          kind: Service
          name: access-issuer
          port: 8080
          weight: 1
