---
# Source: access-issuer/templates/networkpolicy.yaml
# Ingress only. Everything with a browser arrives through the gateway;
# these are the in-cluster callers — the proxies verifying tokens and the
# workloads exchanging them.
#
# No egress rules: this service has to reach the API server, the hub and
# whichever directory a person signs in with, and a chart that guessed at
# that list would be a chart that breaks a login the day a provider adds
# a hostname. The fleet's own egress policy is where that belongs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-issuer
      app.kubernetes.io/instance: access-issuer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: workloads
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxies
      ports:
        - port: 8443
    # The GitHub controller beside it, reading the console's API with its
    # own ServiceAccount token.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-issuer-github-roster
              app.kubernetes.io/instance: access-issuer
      ports:
        - port: 8443

---
# Source: access-issuer/templates/github-roster.yaml
# The controller's own account. It holds two permissions: updating its one
# report, and updating the one Secret people's linked GitHub accounts are
# kept in — each link's token pair rotates every time it is renewed, and
# the renewed pair has to be written back. The Secret with the Apps' keys
# is a mounted volume, so no other Secret is readable at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-github-roster
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: github-roster

---
# Source: access-issuer/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-issuer/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-issuer/templates/clusters-configmap.yaml
# The clusters whose workloads may exchange a ServiceAccount token for one
# of this issuer's, each verified against the key set that cluster
# publishes for itself.
#
# Nothing here is a secret: a name and two URLs per cluster. That is the
# whole point — the alternative is a kubeconfig per cluster held by the
# service whose design is to hold almost no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-clusters
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  clusters.yaml: |
    clusters:
      - name: "example-cluster"
        issuer: "https://oidc.eu-example-1.example/id/EXAMPLE"
        jwksUri: "https://oidc.eu-example-1.example/id/EXAMPLE/keys"
      - name: "example-edge"
        issuer: "https://edge.example"

---
# Source: access-issuer/templates/github-apps-catalogue-configmap.yaml
# The GitHub Apps this deployment declares, created and installed by an
# operator from the console. Nothing here is a secret: names, permissions
# and grants. The keys GitHub hands over are kept by the service, in the
# Secret <release>-github-catalogue-apps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-github-apps-catalogue
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  catalogue.yaml: |
    apps:
    - description: Dependency updates
      events:
      - pull_request
      grants:
      - group: all:platform:engineer
        permissions:
          contents: read
        repositories:
        - '*'
      id: dependency-bot
      installation: selected
      name: acme-dependency-bot
      org: acme
      permissions:
        contents: write
        pull_requests: write
      public: false

---
# Source: access-issuer/templates/overlay-configmap.yaml
# Declared workspaces (the overlay). This service reads the file at start
# and on change; the credential of each is the named Secret, mounted
# beside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-overlay
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  overlay.yaml: |
    workspaces:
      - id: "C0acme"
        backend: "google"
        admin: "admin@acme.example"
        keyFile: /var/run/access-issuer/directory/keys/acme-directory-key/service-account.json
        serve:
          - "acme.example"
        syncGroups:
          - "engineering@acme.example"
      - backend: "google"
        admin: "admin@globex.example"
        keyFile: /var/run/access-issuer/directory/keys/globex-directory-key/key.json

---
# Source: access-issuer/templates/policy-configmap.yaml
# The declared layer of the policy — the same file the hub reads, and the
# same schema. See docs/reference/policy.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-policy
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    # The version belongs to the chart, not to the values: the loader
    # refuses a document whose version it does not know, so a policy
    # written without one is a service that will not start.
    version: 1
    clients:
      access-console:
        kind: confidential
        redirects:
        - https://access.example/console/
        requires:
        - all:access-roster:operator
        secret: access-console-client
      accessctl:
        kind: public
        redirects:
        - http://127.0.0.1/callback
        requires:
        - all:platform:engineer
      reports:
        kind: confidential
        redirects:
        - https://reports.example/oauth2/callback
        requires:
        - all:platform:engineer
        secret: reports-client
        secretKey: oidc-secret
    groups:
      all:access-roster:operator:
        members:
        - platform@acme.example
      all:platform:engineer:
        members:
        - engineering@acme.example
        - engineering@globex.example

---
# Source: access-issuer/templates/serviceaccount.yaml
# The one cluster-scoped permission this service ever needs, and the one
# thing left that asks the API server anything: creating TokenReviews, so
# that recovery can check a token proving cluster access. It reads
# nothing.
#
# Workloads used to need it too. They do not any more: a
# ServiceAccount token is verified against the key set its own cluster
# publishes, so this service holds no access to any cluster including its
# own. Recovery keeps it because on the day everything else is broken it
# should depend on nothing but the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: access-issuer-identity-tokenreview
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]

---
# Source: access-issuer/templates/serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: access-issuer-identity-tokenreview
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: access-issuer-identity-tokenreview
subjects:
  - kind: ServiceAccount
    name: issuer
    namespace: identity

---
# Source: access-issuer/templates/github-roster.yaml
# Update, by name, the one ConfigMap it reports into. The service creates
# that object — `create` cannot be narrowed to a name — so this account
# cannot create any ConfigMap, and in particular none that would read to
# the service as a workspace record.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-issuer-github-roster
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: github-roster
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["access-issuer-github-status"]
    verbs: ["get", "update", "patch"]
  # Created by the service, like the report, so this can name it.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["access-issuer-github-links"]
    verbs: ["get", "update"]

---
# Source: access-issuer/templates/serviceaccount.yaml
