---
# Source: access-issuer/templates/networkpolicy.yaml
# Ingress only. Everything with a browser arrives through the gateway;
# these are the in-cluster callers — the proxies verifying tokens and the
# workloads exchanging them.
#
# No egress rules: this service has to reach the API server, the hub and
# whichever directory a person signs in with, and a chart that guessed at
# that list would be a chart that breaks a login the day a provider adds
# a hostname. The fleet's own egress policy is where that belongs: a
# Kubernetes NetworkPolicy cannot name a host, and the Slack controller
# (slackRoster) needs slack.com:443 to be allowed there, as the GitHub
# controller needs api.github.com:443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-issuer
      app.kubernetes.io/instance: access-issuer
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: workloads
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxies
      ports:
        - port: 8443
    # The GitHub controller beside it, reading the console's API with its
    # own ServiceAccount token.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-issuer-github-roster
              app.kubernetes.io/instance: access-issuer
      ports:
        - port: 8443
    # The Slack controller beside it, reading the console's API with its
    # own ServiceAccount token. Its own traffic to Slack (slack.com:443,
    # over TLS) leaves the pod, which this policy does not govern: see the
    # note on egress at the top.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-issuer-slack-roster
              app.kubernetes.io/instance: access-issuer
      ports:
        - port: 8443

---
# Source: access-issuer/templates/github-roster.yaml
# The controller's own account. It holds two permissions: updating its one
# report, and updating the one Secret people's linked GitHub accounts are
# kept in — each link's token pair rotates every time it is renewed, and
# the renewed pair has to be written back. The Secret with the Apps' keys
# and the ConfigMap with the console's records are mounted volumes, so no
# other Secret or ConfigMap is readable at all, and watching them for a
# change (an install, a Refresh) needs no permission either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-github-roster
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: github-roster

---
# Source: access-issuer/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-issuer/templates/serviceaccount.yaml
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: access-issuer/templates/slack-roster.yaml
# The controller's own account. It holds one permission: updating its one
# report. The Secret with the workspaces' bot tokens and the ConfigMap with
# the console's records are mounted volumes, so no Secret or other ConfigMap
# is readable at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-issuer-slack-roster
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: slack-roster

---
# Source: access-issuer/templates/aws-configmap.yaml
# The AWS accounts whose IAM roles may exchange their outbound identity
# federation token for one of this issuer's, each verified against the key
# set that account's issuer publishes.
#
# Nothing here is a secret: an account, a name and a URL per row.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-aws
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  aws.yaml: |
    audience: "https://access.example"
    maxAge: "3m"
    accounts:
      - account: "111122223333"
        name: "apps"
        issuer: "https://example-id.tokens.sts.global.api.aws"
        orgId: "o-example1234"
        algs:
          - "ES384"
      - account: "444455556666"
        name: "data"
        issuer: "https://other-id.tokens.sts.global.api.aws"
        jwksUri: "https://keys.example/jwks.json"

---
# Source: access-issuer/templates/clusters-configmap.yaml
# The clusters whose workloads may exchange a ServiceAccount token for one
# of this issuer's, each verified against the key set that cluster
# publishes for itself.
#
# Nothing here is a secret: a name and two URLs per cluster. That is the
# whole point — the alternative is a kubeconfig per cluster held by the
# service whose design is to hold almost no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-clusters
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  clusters.yaml: |
    clusters:
      - name: "example-cluster"
        issuer: "https://oidc.eu-example-1.example/id/EXAMPLE"
        jwksUri: "https://oidc.eu-example-1.example/id/EXAMPLE/keys"
      - name: "example-edge"
        issuer: "https://edge.example"

---
# Source: access-issuer/templates/configmap.yaml
# What `access-issuer --config` reads: `config`, as the values give it, with
# nothing added, renamed or dropped. The binary validates it against
# schemas/config/access-issuer.schema.json at start, and values.schema.json
# holds the values to the same schema before this renders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-config
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: access-issuer
data:
  config.yaml: |
    audit:
      audience: audit
      forwardedForTrustedHops: 1
      queryURL: http://audit-query.access-issuer.svc:8080
      tokenFile: /var/run/audit/token
      writer: http://audit.access-issuer.svc:8080
    clientSecretsDir: /var/run/access-issuer/clients
    cluster: example-cluster
    console:
      client: access-console
      origin: https://access.example
    exchange:
      audience: access-exchange
      awsFile: /var/run/access-issuer/aws.yaml
      clustersFile: /var/run/access-issuer/clusters.yaml
    freshness:
      freshnessWindow: 20m
      probeInterval: 2m
      refreshInterval: 10m
    github:
      catalogueFile: /var/run/access-issuer/github-apps-catalogue.yaml
      owners:
      - acme
      - globex
      runnerTiers:
      - preview
      - stable
    inCluster: true
    issuerURL: https://access.example
    lifetimes:
      absolute: 24h
      hold: 2h
      refresh: 6h
      session: 8h
      token: 30m
    listen:
      address: :8443
    log:
      level: debug
    login:
      directory: false
    oauthClient:
      idFile: /var/run/access-issuer/oauth-client/id
      idKey: id
      secretFile: /var/run/access-issuer/oauth-client/secret
      secretKey: secret
      secretName: sign-in-client
    overlayFile: /var/run/access-issuer/directory/overlay.yaml
    policyDir: /var/run/access-issuer/policy
    probes:
      address: :9090
    publicRootURL: https://access.example
    publicURL: https://access.example/console
    recovery:
      audience: break-glass-audience
      enabled: true
      serviceAccount: break-glass
    release: access-issuer
    secureCookies: true
    signingKey:
      activationDelay: 15m
      file: /var/run/access-issuer/signing-key/tls.key
      pollInterval: 30s
    store: kubernetes
    valkey:
      address: valkey.example.svc:6379
      cluster: true
      passwordEnv: VALKEY_PASSWORD
      tls: true

---
# Source: access-issuer/templates/github-apps-catalogue-configmap.yaml
# The GitHub Apps this deployment declares, created and installed by an
# operator from the console. Nothing here is a secret: names, permissions
# and grants. The keys GitHub hands over are kept by the service, in the
# Secret <release>-github-catalogue-apps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-github-apps-catalogue
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  catalogue.yaml: |
    apps:
    - description: Dependency updates
      events:
      - pull_request
      grants:
      - group: all:platform:engineer
        permissions:
          contents: read
        repositories:
        - '*'
      id: dependency-bot
      installation: selected
      name: acme-dependency-bot
      org: acme
      permissions:
        contents: write
        pull_requests: write
      public: false

---
# Source: access-issuer/templates/github-roster.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-github-roster-config
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: github-roster
data:
  # What `github-roster --config` reads: `githubRoster.config`, as the values give
  # it. The binary validates it against schemas/config/github-roster.schema.json.
  config.yaml: |
    appsDir: /var/run/github-roster/apps
    audit:
      tokenFile: /var/run/audit/token
      writer: http://audit.access-issuer.svc:8080
    catalogueFile: /var/run/github-roster/github-apps-catalogue.yaml
    consoleURL: http://access-issuer.identity.svc:8443/console
    enabledOrgs:
    - acme
    - globex
    interval: 5m
    policyDir: /var/run/github-roster/policy
    recordsDir: /var/run/github-roster/records
    tokenFile: /var/run/secrets/github-roster/token

---
# Source: access-issuer/templates/overlay-configmap.yaml
# Declared workspaces (the overlay). This service reads the file at start
# and on change; the credential of each is the named Secret, mounted
# beside it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-overlay
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  overlay.yaml: |
    workspaces:
      - id: "C0acme"
        backend: "google"
        admin: "admin@acme.example"
        keyFile: /var/run/access-issuer/directory/keys/acme-directory-key/service-account.json
        serve:
          - "acme.example"
        syncGroups:
          - "engineering@acme.example"
      - backend: "google"
        admin: "admin@globex.example"
        keyFile: /var/run/access-issuer/directory/keys/globex-directory-key/key.json

---
# Source: access-issuer/templates/policy-configmap.yaml
# The declared layer of the policy — the same file the hub reads, and the
# same schema. See docs/reference/policy.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-issuer-policy
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  policy.yaml: |
    # The version belongs to the chart, not to the values: the loader
    # refuses a document whose version it does not know, so a policy
    # written without one is a service that will not start.
    version: 1
    clients:
      access-console:
        kind: confidential
        redirects:
        - https://access.example/console/
        requires:
        - all:access-roster:operator
        secret: access-console-client
      accessctl:
        kind: public
        redirects:
        - http://127.0.0.1/callback
        requires:
        - all:platform:engineer
      reports:
        kind: confidential
        redirects:
        - https://reports.example/oauth2/callback
        requires:
        - all:platform:engineer
        secret: reports-client
        secretKey: oidc-secret
    github:
      acme: {}
      globex: {}
    groups:
      all:access-roster:operator:
        members:
        - platform@acme.example
      all:platform:engineer:
        members:
        - engineering@acme.example
        - engineering@globex.example
    slack:
      workspaces:
        acme: {}
        globex-eu: {}

---
# Source: access-issuer/templates/slack-roster.yaml
