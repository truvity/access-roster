---
# Source: access-issuer/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: access-issuer
      app.kubernetes.io/instance: access-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-issuer
        app.kubernetes.io/instance: access-issuer
      annotations:
        # A policy change is a rollout: the file is read at start.
        checksum/policy: 965badeda797e9dffee9caa0f389683d5697ef863a8500eb793c358efdecb3df
        # A federated cluster is read once at start. A row added without a
        # rollout is a cluster whose workloads go on being refused, with
        # nothing to see but an error naming the wrong cause.
        checksum/clusters: 8cae85f24bdedc9b3e5da732b7a1ff510b8a4df3098b3ed32f44d73b016bb903
        # A declared workspace is read once at start, so a workspace added
        # to the values without a rollout is one an operator can see in
        # git and nowhere in the running service.
        checksum/overlay: 1ce510b529806919a3f1d1ab8ba1b64e6f205eccccd8f07e45da32dcf9c39ff8
        # The catalogue is read once at start, so an App declared without a
        # rollout is one the console does not offer.
        checksum/github-apps-catalogue: 851f0fb3efd9deb4d3cbc1deb7ad162cf8131e1c98fc3ea0eddc3d60927c4acf
        example.com/scrape: "false"
    spec:
      serviceAccountName: issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: access-issuer
          image: "registry.example/access-roster/access-issuer:v1.2.3"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8443
            - name: health
              containerPort: 9090
          env:
            - name: ISSUER_URL
              value: "https://access.example"
            - name: PORT
              value: "8443"
            - name: HEALTH_PORT
              value: "9090"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Names this replica on every audit record, as the instance
            # that emitted it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # What an operator connected — the workspaces and their
            # credentials, the memberships, the OAuth client it was
            # given, the session key — kept as ConfigMaps and Secrets in
            # this namespace. Anything else and a restart is a fresh
            # installation.
            - name: STORE
              value: "kubernetes"
            - name: REFRESH_INTERVAL
              value: "10m"
            - name: FRESHNESS_WINDOW
              value: "20m"
            - name: PROBE_INTERVAL
              value: "2m"
            - name: AUDIT_WRITER_URL
              value: "http://audit.access-issuer.svc:8080"
            - name: AUDIT_TOKEN_FILE
              value: /var/run/audit/token
            - name: AUDIT_QUERY_URL
              value: "http://audit-query.access-issuer.svc:8080"
            - name: AUDIT_AUDIENCE
              value: "audit"
            - name: AUDIT_FORWARDED_FOR_TRUSTED_HOPS
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc:4318"
            - name: SESSION_LIFETIME
              value: "8h"
            - name: LOGIN_DIRECTORY
              value: "false"
            - name: OVERLAY_FILE
              value: /var/run/access-issuer/directory/overlay.yaml
            # Where a browser reaches the console, and where this origin's
            # root is. Everything that has to name itself to somebody else
            # is built from the first: the admin-consent redirect URI, and
            # the values the setup steps tell an operator to paste into a
            # cloud console.
            - name: PUBLIC_URL
              value: https://access.example/console
            # The admin-consent callback stays at the origin ROOT. It is
            # the one flow that runs before anybody can be signed in, and
            # its redirect URI is registered with every corporate tenant —
            # so moving it under the console's path would mean
            # re-registering it in each of them.
            - name: PUBLIC_ROOT_URL
              value: https://access.example
            # Provisioned, never minted here — see values.yaml.
            - name: SIGNING_KEY_FILE
              value: /var/run/access-issuer/signing-key/tls.key
            # Live rotation: how often this replica re-reads the file
            # above, and the schedule it keeps once it sees a new key —
            # see `signingKey.rotation` in values.yaml.
            - name: SIGNING_KEY_POLL_INTERVAL
              value: "30s"
            - name: SIGNING_KEY_ACTIVATION_DELAY
              value: "3m"
            - name: VALKEY_ADDRESS
              value: "valkey.example.svc:6379"
            - name: VALKEY_TLS
              value: "true"
            - name: VALKEY_CLUSTER
              value: "true"
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-password
                  key: secret
            - name: RELEASE_NAME
              value: access-issuer
            - name: GITHUB_RUNNER_TIERS
              value: "preview,stable"
            - name: GITHUB_APPS_CATALOGUE_FILE
              value: /var/run/access-issuer/github-apps-catalogue.yaml
            - name: POLICY_DIR
              value: /var/run/access-issuer/policy
            - name: TOKEN_LIFETIME
              value: "30m"
            - name: REFRESH_LIFETIME
              value: "6h"
            - name: ABSOLUTE_LIFETIME
              value: "24h"
            - name: HOLD_WINDOW
              value: "2h"
            - name: CLUSTER
              value: "example-cluster"
            - name: EXCHANGE_AUDIENCE
              value: "access-exchange"
            - name: CLUSTERS_FILE
              value: /var/run/access-issuer/clusters.yaml
            # Recovery is the one thing left that asks the API server, and
            # deliberately so: on the day everything else is broken it
            # should depend on nothing but the cluster.
            - name: IN_CLUSTER
              value: "true"
            - name: CLIENT_SECRETS_DIR
              value: /var/run/access-issuer/clients
            - name: CONSOLE_ORIGIN
              value: "https://access.example"
            - name: CONSOLE_CLIENT_ID
              value: "access-console"
            - name: GITHUB_OWNERS
              value: "acme,globex"
            - name: RECOVERY_ENABLED
              value: "true"
            - name: RECOVERY_SERVICE_ACCOUNT
              value: "break-glass"
            - name: RECOVERY_AUDIENCE
              value: "break-glass-audience"
            # ONE credential, read two ways, because the two halves want
            # different things of it. Signing a person in reads it from a
            # FILE, so this service holds no RBAC to read Secrets and a
            # compromise of it cannot become a read of every credential in
            # the namespace. Connecting a directory reads it through the
            # API, because that one the console can also WRITE: an
            # installation with no client yet is bootstrapped by pasting
            # one into Settings.
            - name: OAUTH_CLIENT_ID_FILE
              value: /var/run/access-issuer/oauth-client/id
            - name: OAUTH_CLIENT_SECRET_FILE
              value: /var/run/access-issuer/oauth-client/secret
            - name: OAUTH_CLIENT_SECRET_NAME
              value: "sign-in-client"
            - name: OAUTH_CLIENT_ID_KEY
              value: "id"
            - name: OAUTH_CLIENT_SECRET_KEY
              value: "secret"
            # Served over TLS, so its cookies say so. Stated rather
            # than left to the binary's default, which reads the same
            # scheme off the issuer url above: a chart that says it
            # out loud is a chart a reader can check against the route.
            - name: SECURE_COOKIES
              value: "true"
            - name: LOG_LEVEL
              value: "debug"
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: clusters
              mountPath: /var/run/access-issuer/clusters.yaml
              subPath: clusters.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
            - name: github-apps-catalogue
              mountPath: /var/run/access-issuer/github-apps-catalogue.yaml
              subPath: catalogue.yaml
              readOnly: true
            - name: overlay
              mountPath: /var/run/access-issuer/directory/overlay.yaml
              subPath: overlay.yaml
              readOnly: true
            - name: key-acme-directory-key
              mountPath: /var/run/access-issuer/directory/keys/acme-directory-key
              readOnly: true
            - name: key-globex-directory-key
              mountPath: /var/run/access-issuer/directory/keys/globex-directory-key
              readOnly: true
            - name: client-secrets
              mountPath: /var/run/access-issuer/clients
              readOnly: true
            - name: oauth-client
              mountPath: /var/run/access-issuer/oauth-client
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: signing-key
          secret:
            secretName: access-issuer-signing-key
        - name: policy
          configMap:
            name: access-issuer-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "audit"
                  expirationSeconds: 3600
                  path: token
        - name: clusters
          configMap:
            name: access-issuer-clusters
        - name: github-apps-catalogue
          configMap:
            name: access-issuer-github-apps-catalogue
        - name: overlay
          configMap:
            name: access-issuer-overlay
        - name: key-acme-directory-key
          secret:
            secretName: acme-directory-key
        - name: key-globex-directory-key
          secret:
            secretName: globex-directory-key
        # One file per confidential client, named after the client id, so
        # the service resolves a secret by reading a path and never by
        # holding RBAC to read Secrets -- the same reason the signing key
        # is a file.
        - name: client-secrets
          projected:
            sources:
              - secret:
                  name: access-console-client
                  items:
                    - key: client-secret
                      path: access-console
              - secret:
                  name: reports-client
                  items:
                    - key: oidc-secret
                      path: reports
        - name: oauth-client
          secret:
            secretName: sign-in-client
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: identity

---
# Source: access-issuer/templates/github-roster.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-issuer-github-roster
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: github-roster
spec:
  # One: two controllers would make every change twice, and GitHub's answer
  # to the second is an error that reads as a failure.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: access-issuer-github-roster
      app.kubernetes.io/instance: access-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-issuer-github-roster
        app.kubernetes.io/instance: access-issuer
      annotations:
        # The bindings are read at start, like the service's policy.
        checksum/policy: 965badeda797e9dffee9caa0f389683d5697ef863a8500eb793c358efdecb3df
    spec:
      serviceAccountName: access-issuer-github-roster
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-roster
          image: "registry.example/access-roster/github-roster:v1.2.3"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NAME
              value: access-issuer
            - name: POLICY_DIR
              value: /var/run/github-roster/policy
            - name: CONSOLE_URL
              value: "http://access-issuer.identity.svc:8443/console"
            - name: TOKEN_FILE
              value: /var/run/secrets/github-roster/token
            - name: APPS_DIR
              value: /var/run/github-roster/apps
            - name: INTERVAL
              value: "5m"
            - name: ENABLED_ORGS
              value: "acme,globex"
            - name: LOG_LEVEL
              value: "debug"
            # The controller records what it did to the audit installation
            # itself, as its own workload, which the writer stamps as the
            # records' observer.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AUDIT_WRITER_URL
              value: "http://audit.access-issuer.svc:8080"
            - name: AUDIT_TOKEN_FILE
              value: /var/run/audit/token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc:4318"
          volumeMounts:
            - name: policy
              mountPath: /var/run/github-roster/policy
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/github-roster
              readOnly: true
            - name: apps
              mountPath: /var/run/github-roster/apps
              readOnly: true
            
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: policy
          configMap:
            name: access-issuer-policy
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: access-exchange
                  expirationSeconds: 3600
                  path: token
        # One file per connected organisation. Optional: before anything is
        # connected there may be nothing, and the controller reports each
        # bound organisation as not connected rather than failing to start.
        - name: apps
          secret:
            secretName: access-issuer-github-apps
            optional: true
        
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "audit"
                  expirationSeconds: 3600
                  path: token
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: identity

