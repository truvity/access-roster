---
# Source: access-issuer/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-issuer
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: access-issuer
      app.kubernetes.io/instance: access-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-issuer
        app.kubernetes.io/instance: access-issuer
      annotations:
        # A policy change is a rollout: the file is read at start.
        checksum/policy: f5c82283eed74b86b5e454b26352ac8643e60badea3b25b6ec910431fa4c1a0c
    spec:
      serviceAccountName: access-issuer
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: access-issuer
          image: "ghcr.io/truvity/access-roster/access-issuer:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: 8080
            - name: health
              containerPort: 7070
          env:
            - name: ISSUER_URL
              value: "https://access.example"
            - name: PORT
              value: "8080"
            - name: HEALTH_PORT
              value: "7070"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Names this replica in the audit trail's object keys, so two
            # replicas never write the same key.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # What an operator connected — the workspaces and their
            # credentials, the memberships, the OAuth client it was
            # given, the session key — kept as ConfigMaps and Secrets in
            # this namespace. Anything else and a restart is a fresh
            # installation.
            - name: STORE
              value: "kubernetes"
            - name: REFRESH_INTERVAL
              value: "15m"
            - name: FRESHNESS_WINDOW
              value: "30m"
            - name: PROBE_INTERVAL
              value: "5m"
            - name: AUDIT_MAX_EVENTS
              value: "50000"
            - name: AUDIT_S3_BUCKET
              value: ""
            - name: AUDIT_S3_REGION
              value: ""
            - name: AUDIT_S3_PREFIX
              value: "events/"
            - name: AUDIT_S3_FLUSH_INTERVAL
              value: "10s"
            - name: AUDIT_FORWARDED_FOR_TRUSTED_HOPS
              value: "0"
            - name: SESSION_LIFETIME
              value: "12h"
            - name: LOGIN_DIRECTORY
              value: "true"
            # Provisioned, never minted here — see values.yaml.
            - name: SIGNING_KEY_FILE
              value: /var/run/access-issuer/signing-key/tls.key
            - name: RELEASE_NAME
              value: access-issuer
            - name: POLICY_DIR
              value: /var/run/access-issuer/policy
            - name: TOKEN_LIFETIME
              value: "1h"
            - name: REFRESH_LIFETIME
              value: "12h"
            - name: HOLD_WINDOW
              value: "4h"
            - name: EXCHANGE_AUDIENCE
              value: "access-issuer"
            # Recovery is the one thing left that asks the API server, and
            # deliberately so: on the day everything else is broken it
            # should depend on nothing but the cluster.
            - name: IN_CLUSTER
              value: "true"
            - name: RECOVERY_ENABLED
              value: "true"
            - name: RECOVERY_SERVICE_ACCOUNT
              value: "access-issuer-recovery"
            - name: RECOVERY_AUDIENCE
              value: "access-issuer-recovery"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: signing-key
          secret:
            secretName: access-issuer-signing-key
        - name: policy
          configMap:
            name: access-issuer-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}

---
# Source: access-issuer/templates/signing-key.yaml
# The signing key, issued by cert-manager.
#
# The certificate is a by-product: only the key is used. cert-manager is
# here because it generates the key in the cluster, keeps it out of every
# other system, and rotates it on a schedule the platform already
# understands — none of which is true of a key this service minted for
# itself, and the last of which is the reason it does not.
#
# `rotationPolicy: Always` makes a renewal a *new key*, which is the
# point: a renewed certificate over the same key would rotate nothing.
#
# The algorithm decides what the issuer signs with -- RSA signs RS256, and
# P-256, P-384 and P-521 sign ES256, ES384 and ES512 -- and that is what
# the discovery document advertises, so every relying party has to accept
# it. Changing it here rotates the key, so tokens signed with the previous
# one stop verifying once the old public key leaves the JWKS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: access-issuer-signing-key
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: access-issuer-signing-key
  commonName: access-issuer
  duration: "8760h"
  renewBefore: "720h"
  privateKey:
    algorithm: ECDSA
    size: 384
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: "selfsigned"
    kind: "ClusterIssuer"
    group: cert-manager.io

---
# Source: access-issuer/templates/state-push.yaml
# A recovery copy of the credential of every connected workspace, to ClusterSecretStore example-store
# at platform/access-issuer/workspace. Every key of the Secret lands there as one JSON
# object; restoring is an operator writing it back, deliberately.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: access-issuer-workspace-copy
  labels:
    app.kubernetes.io/name: access-issuer
    app.kubernetes.io/instance: access-issuer
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 1h
  # Declared rather than defaulted, as in github-apps-push.yaml: a field
  # the CRD fills in but the manifest omits reads as drift to anything
  # comparing desired against live, so an ArgoCD Application carrying this
  # chart would sit permanently OutOfSync on a PushSecret that is doing its
  # job -- and a permanent OutOfSync is a health signal nobody reads.
  updatePolicy: Replace
  # None, and not overridable to Delete by accident: the case this exists
  # for IS the Secret going away. A copy that leaves with its source is not
  # a backup. An installation that truly wants the copy removed can remove
  # it where it lives.
  deletionPolicy: None
  secretStoreRefs:
    - name: example-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: access-issuer-workspace-credentials
  dataTo:
    - conversionStrategy: None
      remoteKey: platform/access-issuer/workspace
      # REQUIRED PER ENTRY. The top-level secretStoreRefs above does NOT
      # satisfy it: external-secrets puts a CEL rule on every dataTo item,
      #
      #   has(self.storeRef) && (has(self.storeRef.name) ||
      #                          has(self.storeRef.labelSelector))
      #
      # and an API server refuses the object outright without it --
      # "spec.dataTo[0]: Invalid value: storeRef must specify either name
      # or labelSelector", which names storeRef while pointing at dataTo
      # and so reads as though the store block above were wrong.
      #
      # THE SAME STORE as secretStoreRefs, never a second value. A push
      # already names where it writes; letting the two diverge would put
      # the copy somewhere nobody looks for it.
      #
      # This shipped broken once. `helm template`, the values schema and
      # the golden renders all passed, because a CEL rule lives in the CRD
      # and none of them has one -- so chart-lint pins the shape instead.
      storeRef:
        name: example-store
        kind: ClusterSecretStore

---
