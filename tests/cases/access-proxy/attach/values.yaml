# ATTACH mode with the `authenticated` posture: the policy binds to a
# route the console's own chart owns, so this chart renders only the
# proxy's prefix route, and the policy carries no JWT group check. With
# refresh unset, no offline_access is asked for and no cookie_refresh is
# written.
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  posture: authenticated
  attachRouteName: console
issuer:
  url: https://issuer.example/
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
  refresh: ""
