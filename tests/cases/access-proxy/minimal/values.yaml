# The least a single exposure can say: the host, the Gateway listener,
# the console's Service, who may pass, and the four things the proxy
# cannot work without (issuer, client Secret, cookie Secret, Valkey).
exposure:
  hostname: console.example
  gateway:
    name: internal
    namespace: gateway-system
  backend:
    name: console
  allow:
    - console:operator
issuer:
  url: https://issuer.example
client:
  secret:
    name: console-client
session:
  valkey:
    address: valkey.example.svc:6379
  cookieSecret:
    name: console-cookie
