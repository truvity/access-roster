# Every value the chart reads, set. The single-route fields are used here
# (backend, not attachRouteName, so the chart renders the app route);
# `routes` is mutually exclusive with them and is the `multiroute` case,
# attachRouteName is the `attach` case, and parentRefs (which replaces
# `gateway`) is the `listenerset` case.
exposure:
  hostname: console.example
  backend:
    name: console
    port: 9000
  posture: groups
  allow:
    - console:operator
    - console:viewer
  gateway:
    name: internal
    namespace: gateway-system
    sectionName: https-console
  parentRefs: []
  paths:
    - /
    - /api
  proxyPrefix: /_auth
  attachRouteName: ""
  routes: []
  forward:
    authorizationHeader: false
    extraExtAuthHeaders:
      - x-request-id
issuer:
  url: https://issuer.example
  jwksUri: https://issuer.example/oauth/v2/keys
client:
  secret:
    name: console-client
    keys:
      clientId: id
      clientSecret: secret
session:
  valkey:
    address: valkey.example.svc:6379
    cluster: true
    username: proxy
    passwordSecret:
      name: valkey-password
      key: secret
  cookieSecret:
    name: console-cookie
    key: cookie
  lifetime: 8h
  refresh: 2m
  identityClaim: email
  scopes: openid email groups offline_access
proxy:
  image:
    repository: registry.example/oauth2-proxy/oauth2-proxy
    tag: v7.15.4
    pullPolicy: Always
  replicaCount: 3
  port: 4181
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: dedicated
      operator: Equal
      value: edge
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: access-proxy
  podAnnotations:
    example.com/scrape: "false"
networkPolicy:
  enabled: true
  gatewayNamespace: gateway-system
