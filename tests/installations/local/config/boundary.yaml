# The Boundary document of the local installation (ADR 0005, "The snapshot"): the boundary `dev`
# and the config kinds it declares. The harness signs this file as boundary.jws into the
# directory of the `file` driver; the payload is this file, byte for byte.
# One mapping from item id to item; a singleton kind has the one item `default` (decision D-17).
default:
  name: dev
  kind: environment
  level: L2
  environment: development
  issuer: https://sluis.dev.local.test
  uid_block: 0
  default_tenant: acme
  # The acr values this boundary enforces in `acr_values` and lists in discovery; any other value in a request is ignored and
  # counted (REQ-AUTHN-009). The one the local policy asks for in its step-up rule (`@step_up`) is listed, or that rule's
  # challenge would not be enforced; so is the one of the passkey sign-in (sign-in-methods.yaml), or no request could reach
  # its page. The set is refused when either is missing.
  acr_values_supported:
    - urn:example:acr:mfa
    - urn:sluis:acr:passkey
  declared_kinds:
    - KeyPlan
    - TokenLifetime
    - GrantVocabulary
    - Policy
    - AuditLog
    - AuditCatalogue
    - Upstream
    - InstallationClient
    - ExchangeTrust
    - FrontHost
    - SignInMethods
