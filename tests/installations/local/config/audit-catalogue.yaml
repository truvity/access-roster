# AuditCatalogue, minimal (decision D-15): the action names the writer accepts. The JSON Schema of
# each action's fields comes with the full catalogue generator.
default:
  release: "0.0.0"
  actions:
    - key.sign
    - store.start
    - store.refused
    - store.reload
    - store.reload.refused
    - policy.decide
    - policy.start
    - policy.reload
    - policy.reload.refused
    - signer.refused
    - signer.sign
    - signer.ring.add
    - signer.ring.change
    - signer.ring.drop
    # entry: one action per route, named entry.<route> (actors/entry/src/audit.rs); a request that
    # matched no route is entry.unrouted (actors/entry/src/handler.rs).
    - entry.connection
    - entry.authorize
    - entry.callback
    - entry.token
    - entry.discovery
    - entry.jwks
    - entry.unrouted
    # adapter-upstream-oidc (actors/adapter-upstream-oidc/internal/upstreamd/audit.go).
    - upstream.begin
    - upstream.complete
