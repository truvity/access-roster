# InstallationClient: the clients of the installation, one item for each client id.
#
# `requires` is what a client asks of a person: at least one of these grant names admits a sign-in or an exchange for
# the client (policy: the standard rule `token-requires`), and the pairs `<scope>:<thing>` among them narrow the
# `groups` of a token for the client (ADR 0020, "The claims of a token").
sluis-cli:
  kind: public
  redirects: ["http://127.0.0.1/callback"]
  profile: native
  # The command-line tool asks for a person's grants in two scopes, so its tokens carry both.
  requires: ["dev:example-app:user", "acme:example-app:user"]
# The audience of `sluis token --audience example-app`. A token for it names the grants of the scope `dev` only.
example-app:
  kind: confidential
  redirects: ["https://app.local.test/callback"]
  profile: web
  # Where the client's secret is in the secret source: the credential `client-example-app`, which `just local-up`
  # makes (ADR 0005, "Secret sources"). The document never holds the secret.
  secret: client-example-app
  requires: ["dev:example-app:user"]
# The OpenID Foundation conformance suite, as two relying parties (tests/conformance, docs/standards/conformance.md): the
# suite is a public client, because the first version serves no other kind (a secret is refused), and its second client is
# the one that a few modules use as someone else. The redirect of a client is the suite's address and the alias of the plan
# (the suite's callback is <base>/test/a/<alias>/callback; a plan whose error pages the suite's own browser reads has the alias with -pages); the address is fixed in tests/conformance/compose.yaml.
oidf-suite:
  kind: public
  redirects:
    - https://localhost.emobix.co.uk:8443/test/a/sluis-config/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-basic/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-formpost/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-basic-pages/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-formpost-pages/callback
  profile: web
  requires: ["dev:example-app:user"]
oidf-suite-2:
  kind: public
  redirects:
    - https://localhost.emobix.co.uk:8443/test/a/sluis-config/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-basic/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-formpost/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-basic-pages/callback
    - https://localhost.emobix.co.uk:8443/test/a/sluis-formpost-pages/callback
  profile: web
  requires: ["dev:example-app:user"]
