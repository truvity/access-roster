{{- if .Values.networkPolicy.enabled }}
# Ingress only. Everything with a browser arrives through the gateway;
# these are the in-cluster callers — the proxies verifying tokens and the
# workloads exchanging them.
#
# No egress rules: this service has to reach the API server, the hub and
# whichever directory a person signs in with, and a chart that guessed at
# that list would be a chart that breaks a login the day a provider adds
# a hostname. The fleet's own egress policy is where that belongs: a
# Kubernetes NetworkPolicy cannot name a host, and the Slack controller
# (controllerSlack) needs slack.com:443 to be allowed there, as the GitHub
# controller needs api.github.com:443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "access-roster.fullname" . }}
  labels:
    {{- include "access-roster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "access-roster.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        {{- end }}
        {{- range .Values.networkPolicy.clients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ include "access-roster.port" . }}
    {{- if .Values.controllerGithub.enabled }}
    # The GitHub controller beside it, reading the console's API with its
    # own ServiceAccount token.
    - from:
        - podSelector:
            matchLabels:
              {{- include "access-roster.controllerGithubSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ include "access-roster.port" . }}
    {{- end }}
    {{- if .Values.controllerSlack.enabled }}
    # The Slack controller beside it, reading the console's API with its
    # own ServiceAccount token. Its own traffic to Slack (slack.com:443,
    # over TLS) leaves the pod, which this policy does not govern: see the
    # note on egress at the top.
    - from:
        - podSelector:
            matchLabels:
              {{- include "access-roster.controllerSlackSelectorLabels" . | nindent 14 }}
      ports:
        - port: {{ include "access-roster.port" . }}
    {{- end }}
{{- end }}
