# access-issuer — the token service.
#
# What this chart renders: a Deployment, a Service, a ServiceAccount with
# the one cluster-scoped permission the exchange needs, a NetworkPolicy,
# the policy ConfigMap, the Gateway API route for its host, and the
# cert-manager Certificate that produces its signing key.
#
# What it expects to exist: a directory hub to ask about people, and an
# issuer for that Certificate. The signing key is deliberately not this
# service's to create — see `signingKey` below.

replicaCount: 2

image:
  repository: ghcr.io/truvity/access-roster/access-issuer
  # Empty uses the chart's appVersion, which the release stamps from the
  # git tag. Pin it here only to run something other than the chart's own
  # release.
  tag: ""
  pullPolicy: IfNotPresent

# The public issuer URL. **It is baked into every token this service signs
# and into every relying party's trust**, so it must be stable for the
# life of the installation: changing it invalidates every token and every
# configured client at once. The service refuses to start without it.
issuerURL: ""

listeners:
  # OIDC, the exchange, and this service's own three pages.
  port: 8080
  # liveness/readiness only.
  healthPort: 7070

# The corporate directories this service reads.
#
# It reads them ITSELF (INF-691). There is no second deployment to ask:
# the answer about a person is a function call, so a login makes no
# network call except to the corporate directory. What that buys is not
# only a hop — it is the end of a class of failure where two services
# disagreed about the same person.
directory:
  # Where what an operator connected is kept: the workspaces and their
  # credentials, the memberships, the OAuth client, the session key, as
  # ConfigMaps and Secrets in this namespace. `memory` makes a restart a
  # fresh installation, which is right for a laptop and nothing else.
  store: kubernetes

  freshness:
    # how often the background refresher takes a new snapshot per
    # workspace.
    refreshInterval: 15m
    # how old a snapshot may be before its domains stop being
    # authoritative.
    freshnessWindow: 30m
    # how often a workspace's credential is probed and its domains are
    # re-read.
    probeInterval: 5m

  # How long the console's own session lasts.
  sessionLifetime: 12h

  # Whether the console offers a sign-in of its own, under /console/login.
  # The issuer's page at the origin root is the one people use; this is
  # the door for an installation reached without it.
  login: true

  # Declared (overlay) workspaces: how an existing installation moves
  # without a Connect step. Each names a Secret in this namespace holding
  # a service-account key with domain-wide delegation and the admin to
  # impersonate. Domains are discovered from the backend like any other
  # workspace's. Declared workspaces are read-only in the console and win
  # on conflict.
  workspaces: []
  #  - backend: google
  #    admin: admin@example.com     # the account the key impersonates
  #    secretName: example-sa-key   # a Secret in this namespace
  #    # Which key of that Secret holds the JSON. Defaults to key.json.
  #    secretKey: key.json
  #    # id is optional: the credential opens exactly one tenant and that
  #    # tenant knows its own id, so it is discovered. Supply it and
  #    # adoption becomes a check — a credential that opens a different
  #    # tenant is refused rather than quietly reading another company's
  #    # directory.
  #    id: C0example
  #    # serve is optional: which of the tenant's domains this service
  #    # answers for. Omitted, it serves every domain the tenant owns.
  #    serve:
  #      - example.com

# The key this service signs tokens with.
#
# It is provisioned, never minted here: a service that creates its own
# credential is an exception to how every other credential in this estate
# is provisioned, and it would put the rotation of the most sensitive key
# we hold outside the machinery that rotates everything else. It also has
# to be the same key in every replica — two replicas with two keys hand
# out tokens half the fleet cannot verify.
#
# Either let cert-manager issue one (the default: it generates in the
# cluster, rotates on its own schedule, and the key never leaves), or
# point `existingSecret` at one external-secrets delivers.
signingKey:
  # Name a Secret that already holds the key, and no Certificate is
  # rendered. It must carry a PEM RSA private key under `key`.
  existingSecret: ""
  key: tls.key
  certificate:
    # cert-manager Issuer or ClusterIssuer that produces the key. A
    # self-signed issuer is the usual answer: the certificate is a
    # by-product and only the key is used.
    issuerName: selfsigned
    issuerKind: ClusterIssuer
    # RSA because this issuer signs RS256. An EC key is refused at start,
    # by name, rather than failing somewhere later.
    size: 2048
    # How long before expiry cert-manager replaces it. A new key is a new
    # key id, so tokens signed with the old one keep verifying only while
    # the old public key is still published — keep this comfortably longer
    # than `tokenLifetime`.
    renewBefore: 720h
    duration: 8760h

# The OAuth client people sign in with. The same client the hub uses,
# with this service's own redirect URI added to it — one project, one
# client — or a client of this service's own, if revoking sign-in and
# revoking directory access should be separate acts.
#
# Empty means nobody can sign in and this service issues tokens to
# machines only, which is a real posture and is said out loud at start.
oauthClient:
  # The same shape the hub uses, for the same credential: name a Secret
  # and say what its keys are called. Both halves come from that one
  # Secret so they travel together -- a client whose id and secret are
  # configured in two places is a client that can be half rotated.
  #
  # The id is not itself a secret; every browser sent to the provider
  # carries it. It lives here anyway because it belongs to the same
  # credential.
  #
  # Empty name means nobody can sign in and this service issues tokens to
  # machines only, which is a real posture and is said out loud at start.
  secret:
    name: ""
    keys:
      clientId: client-id
      clientSecret: client-secret
# What this cluster is called, which becomes part of a ServiceAccount's
# subject: `<cluster>:k8s:<namespace>:<name>`.
#
# A pod cannot discover the name of the cluster it runs in, and the same
# namespace and name exist on every cluster in an estate — so without this
# two different machines are one `sub`, and an audit log cannot tell them
# apart. Use the name the estate already uses for the cluster (`kernel`,
# `prod`), the same word that is the scope of a group name.
#
# Empty keeps the older unqualified subject, `k8s:<namespace>:<name>`,
# which is right for a single-cluster installation and is what every
# subject minted before this value looked like.
cluster: ""

exchange:
  # The audience a ServiceAccount token must be minted for. Without one,
  # every mounted token in every federated cluster would be an exchange
  # proof. Empty means the release name.
  audience: ""

  # The clusters whose workloads may exchange, each verified against the
  # key set that cluster publishes for its own ServiceAccount tokens
  # (INF-692).
  #
  # This is what makes ONE issuer serve MANY clusters. The other way to
  # check such a token is a TokenReview, which means asking the cluster —
  # and asking means holding a kubeconfig for every one of them, inside
  # the service whose whole point is to hold almost no credential. A key
  # set is public: EKS publishes one per cluster (it is what IRSA rests
  # on) and Talos serves the same keys at the API server's
  # `/openid/v1/jwks`. So there is no secret in any of these rows, and
  # this issuer needs no access to any cluster, including the one it runs
  # in — which is a row here like any other, because a special case is a
  # second code path only one installation exercises.
  #
  # What is given up is TokenReview's deletion check: a token stays valid
  # until it expires even if the ServiceAccount is deleted. Bound tokens
  # are short-lived, so the window is minutes. Recovery deliberately
  # keeps TokenReview — on the day everything else is broken it should
  # depend on nothing but the API server.
  clusters: []
  #  - name: kernel          # the estate's own word for it, and what a
  #                          # `workload` matcher names. Renaming a row
  #                          # changes every rule about that cluster.
  #    issuer: https://oidc.eks.eu-central-1.amazonaws.com/id/EXAMPLE
  #    # Where its public keys are. Omitted, it is discovered from the
  #    # issuer, which works wherever the cluster publishes a discovery
  #    # document at an address this service can reach.
  #    jwksUri: ""

# The way in when no directory can vouch for anybody.
#
# It exists because of a deadlock that is otherwise complete: a console
# behind this issuer asks it for a token, this issuer asks the hub who the
# caller is, the hub cannot say because no directory is connected yet, and
# the directory is connected FROM that console. Every installation starts
# there.
#
# The proof is a ServiceAccount token minted for the audience below and a
# few minutes, checked by the API server -- the same proof this issuer
# already takes from workloads. So the authority is the cluster's RBAC:
# who may mint a token for that account, which is revocable by removing a
# binding and lands in the audit log.
#
# It grants NOTHING by itself. A recovered sign-in completes as the
# ServiceAccount subject, and the policy's `service_account` matchers
# decide what that is in -- so an installation that turns this on and
# names no matcher has an account that can sign in and is admitted
# nowhere, which is the correct default.
recovery:
  enabled: true
  # Left empty, `<release>-recovery`, created by this chart. Nobody is
  # bound to it: granting `create` on `serviceaccounts/token` for this
  # account is how an installation says who may recover.
  serviceAccountName: ""
  # The audience the token must be minted for. Without one, every mounted
  # ServiceAccount token in the cluster would be a proof.
  audience: ""

# Lifetimes. The policy may ask for shorter; these are the caps.
lifetimes:
  token: 1h
  refresh: 12h
  # How long an identity keeps its last-known groups while the hub cannot
  # be reached. Zero means no hold, and an unreachable hub then refuses
  # every login.
  hold: 4h

# Where a login in progress lives: the authorization request a browser is
# part-way through, the code it comes back with, the tokens that follow,
# the device flow a CLI is polling.
#
# **More than one replica needs this.** A browser starts at /authorize on
# one replica, comes back from the provider at another, and the client
# redeems the code at a third; a CLI polls whichever answers. Kept in one
# process, each of those is a coin toss that looks like an intermittent
# failure. Empty keeps it in memory, which the service says at start.
valkey:
  address: ""
  passwordSecret:
    name: ""
    key: password
  tls: false
  # Cluster protocol. **Off by default, and the default is the answer
  # for a single-node Valkey.**
  #
  # In cluster mode the client runs CLUSTER SLOTS, learns the NODE
  # addresses, and talks to those from then on. The Kubernetes Service --
  # the one mechanism whose entire job is to survive a pod moving -- is
  # used once as a seed and then bypassed, so a Valkey that moves takes
  # the client with it and it never comes back. That happened on
  # 2026-09-10: two services dialled a dead pod address for half an hour
  # and a human had to restart them.
  #
  # Turn it on only for a Valkey with more than one shard, where the
  # protocol earns its keep. A mismatch is refused at start rather than
  # surfacing later as a puzzling command error.
  cluster: false

# The declared policy: groups, claims, lifetimes, clients. One file,
# shared with the hub. See docs/reference/policy.md.
#
# A confidential client names the Secret holding its secret:
#
#   policy:
#     clients:
#       my-console:
#         kind: confidential
#         secret: my-console-client   # a Secret in this namespace
#         secretKey: client-secret    # its key; this is the default
#         redirects: [https://console.example/oauth2/callback]
#         requires: [operators]
#
# Each one is projected to a file named after the client id, and the
# service resolves a secret by reading that path -- never by holding RBAC
# to read Secrets, which is the same reason the signing key is a file. A
# client declared confidential whose Secret is missing cannot
# authenticate, and says so in the log rather than at the token endpoint.
policy: {}

# The issuer's hostname on the gateway. Empty renders no route, which is
# right for a hub reached by port-forward while it is being tried.
route:
  host: ""
  # Where a bare GET of this host's root goes. The issuer serves nothing
  # at "/" -- every endpoint it answers is a named one -- so a person who
  # types the domain gets a 404. Where a console shares this host under a
  # path, point this at it ("/console/") and they land somewhere useful.
  # Empty keeps the 404, which is the honest answer for an issuer with no
  # console beside it.
  rootRedirect: ""
  gatewayClassName: internal
  certificate:
    issuerName: internal-ca
    issuerKind: ClusterIssuer
  # Namespaces, besides this issuer's own, allowed to attach an HTTPRoute
  # to this Gateway.
  #
  # This is the other half of the one-origin console (INF-687): the
  # directory console shares this issuer's HOSTNAME, so it also has to
  # share this issuer's GATEWAY -- two Gateways declaring a listener for
  # the same route.host collide (Envoy Gateway merges every Gateway of
  # one class into one deployment), they do not coexist as two
  # independent routes. The console's own HTTPRoutes live in the hub
  # chart's namespace, which is why this needs naming at all.
  #
  # Renders allowedRoutes.namespaces as a Selector matching this
  # namespace plus every one named here, rather than the default
  # `from: Same`.
  #
  # NOTE, because it is the thing everyone gets wrong once: this is a
  # GATEWAY-level admission, not a ReferenceGrant. A ReferenceGrant
  # governs a route's backendRefs reaching INTO another namespace; it has
  # nothing to do with a route's parentRefs reaching a Gateway. Whether a
  # Gateway accepts a route from another namespace at all is entirely
  # its own allowedRoutes -- which is what this value renders.
  #
  # Empty keeps `from: Same`, today's shape exactly.
  sharedWith: []

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the issuer. Everything with a browser
  # reaches it through the gateway, so this is for in-cluster callers:
  # the proxies verifying tokens and the workloads exchanging them.
  clients: []
  gatewayNamespace: ""

serviceAccount:
  name: ""

logLevel: info

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []

# GitHub Actions as a source of CI identity. A workflow trades its
# workflow identity token for one of this issuer's, and a `github:` matcher
# in the policy decides what that job may reach.
github:
  # Whose repositories this installation runs jobs for: the GitHub
  # organisations (or users) whose `repository_owner` is admitted.
  #
  # There is no default and there cannot be one. Anybody may run a
  # workflow in their own repository and get a perfectly valid token from
  # GitHub's issuer, so a signature and an expiry prove only that the job
  # ran somewhere -- this list is the whole of what makes one of them
  # ours. Empty means CI tokens are not verified at all, which is the
  # right posture for an installation with no CI rather than a gap.
  #
  # The audience a workflow must request is this issuer's URL, and it is
  # not configurable: one audience per relying party is what stops a token
  # minted for a cloud provider being replayed here.
  owners: []

# The console that shows this issuer's sessions.
console:
  # The ONE origin allowed to call SessionService from a browser — the
  # hub's console, which renders the sessions sections on a person's page
  # and a client's.
  #
  # The browser calls this issuer directly rather than the hub calling it
  # for them, so that the hub's code stays independent of this service:
  # the hub answers "is this account live" for consumers, and that has to
  # keep working when this issuer is down.
  #
  # Empty serves SessionService not at all, which is right for an
  # installation with no console: an endpoint nobody calls is surface with
  # no consumer. A wildcard is not offered — the alternative to one origin
  # is every page on the internet being able to list and end a signed-in
  # person's sessions through their own browser.
  #
  # Since the merge (INF-691) the console is served by this process on
  # this origin, so nothing cross-origin is involved and this can stay
  # empty. It remains for a console served from somewhere else.
  origin: ""

  # Where the console is mounted on this issuer's origin.
  #
  # It is a PATH and not a host because discovery must sit at the root of
  # the origin named in every token's `iss`: the issuer owns "/", and the
  # console takes a path beside it. Same origin is what lets the console's
  # session pages call this issuer with the browser's own cookie and no
  # bearer in JavaScript.
  #
  # This value is also what the console prefixes onto every link it hands
  # a browser, because "/login" resolves against the origin — where the
  # issuer's own page is, not the console's. Empty serves no console.
  mount: /console

