# access-issuer — the token service.
#
# What this chart renders: a Deployment, a Service, a ServiceAccount with
# the one cluster-scoped permission the exchange needs, a NetworkPolicy,
# the policy ConfigMap, the Gateway API route for its host, and the
# cert-manager Certificate that produces its signing key.
#
# What it expects to exist: a directory hub to ask about people, and an
# issuer for that Certificate. The signing key is deliberately not this
# service's to create — see `signingKey` below.

replicaCount: 2

image:
  repository: ghcr.io/truvity/access-roster/access-issuer
  # Empty uses the chart's appVersion, which the release stamps from the
  # git tag. Pin it here only to run something other than the chart's own
  # release.
  tag: ""
  pullPolicy: IfNotPresent

# The public issuer URL. **It is baked into every token this service signs
# and into every relying party's trust**, so it must be stable for the
# life of the installation: changing it invalidates every token and every
# configured client at once. The service refuses to start without it.
issuerURL: ""

listeners:
  # OIDC, the exchange, and this service's own three pages.
  port: 8080
  # liveness/readiness only.
  healthPort: 7070

# The corporate directories this service reads.
#
# It reads them ITSELF. There is no second deployment to ask:
# the answer about a person is a function call, so a login makes no
# network call except to the corporate directory. What that buys is not
# only a hop — it is the end of a class of failure where two services
# disagreed about the same person.
directory:
  # Where what an operator connected is kept: the workspaces and their
  # credentials, the memberships, the OAuth client, the session key, as
  # ConfigMaps and Secrets in this namespace. `memory` makes a restart a
  # fresh installation, which is right for a laptop and nothing else.
  store: kubernetes

  # THESE OBJECTS ARE A PROJECTION, NOT A LIVE SOURCE. Writing a new value
  # into one does not rotate anything on a running pod, and nothing here
  # watches them. Which ones need a restart differs, so the rule is per
  # object rather than general:
  #
  #   workspace-credentials  RESTART. The credential is read once, when a
  #                          replica first opens that workspace -- at
  #                          start, or at the console's connect ceremony.
  #                          After that the open reader is held in memory
  #                          and the Secret is never read again. The only
  #                          thing that drops a reader is DISCONNECTING
  #                          the workspace, which also revokes the
  #                          credential and deletes the snapshot: that is
  #                          removal, not rotation.
  #   session-key            RESTART. Read once while the stores are
  #                          wired. Deleting it is the documented "sign
  #                          everyone out" lever, and it takes effect on
  #                          the restart, not on the delete.
  #   github-links (App)     NO RESTART. The record and its credential are
  #                          read from the API on every use, so a rotated
  #                          value is picked up by the next request.
  #
  # The silence is the hazard: a rotation that has not taken effect looks
  # exactly like one that has, until a restart hours or weeks later picks
  # up the new value -- or, if the written value was wrong, takes the
  # directory down at a moment nobody connects to the change. Measured on
  # 2026-09-21: a deliberately corrupted credential went unnoticed for 14
  # minutes of normal operation, probes and a successful directory read
  # included, and would have gone unnoticed indefinitely.
  #
  # TO ROTATE a workspace credential or the session key: write the value,
  # then restart the Deployment, then confirm from the logs that the new
  # value was read ("opened a workspace this replica had not seen" for a
  # workspace). RESTORING FROM A BACKUP IS A ROTATION and needs the same
  # restart -- writing the good value back is not enough on its own.

  freshness:
    # how often the background refresher takes a new snapshot per
    # workspace.
    refreshInterval: 15m
    # how old a snapshot may be before its domains stop being
    # authoritative.
    freshnessWindow: 30m
    # how often a workspace's credential is probed and its domains are
    # re-read.
    probeInterval: 5m

  # How long the console's own session lasts.
  sessionLifetime: 12h

  # A SECOND COPY OF THE WORKSPACE CREDENTIAL, for recovery. Off unless
  # written out.
  #
  #   push:
  #     secretStore: {name: openbao, kind: ClusterSecretStore}
  #     remoteKey: infra/access-issuer-workspace
  #
  # WHY THIS EXISTS. With `store: kubernetes` the credential an operator
  # connected lives in exactly one place: a Secret this service writes
  # during the connect ceremony. Every other secret an installation runs on
  # arrives FROM somewhere and can be re-delivered; this one has no
  # upstream. Delete the Secret -- a drill, a rebuilt namespace, a
  # mistyped `kubectl delete` -- and the only way back is an operator
  # reconnecting the workspace in a browser.
  #
  # IT CANNOT BE AN ExternalSecret INSTEAD, and that is the whole reason
  # this is a push. The service is the writer. Pulling the credential from
  # a store would let the store overwrite a freshly connected workspace
  # with a stale copy: a backup that corrupts the thing it backs up.
  #
  # BE HONEST ABOUT WHAT IT PROTECTS. It protects the COPY, not the
  # credential. If Google revokes the key, what is in the store is equally
  # dead and an operator needs a new one from Google either way. This is
  # for losing the Secret while the credential is still good.
  #
  # And what it writes IS the credential -- a second durable copy of a key
  # that can read the directory, rotated as one, and the store that holds
  # it is in its blast radius. Name a store the installation already trusts
  # with material of that weight.
  #
  # The whole Secret goes, bundled under one remote key, because the key
  # name inside it is `<workspace-id>.json` and a reconnect mints a new id.
  # A per-key mapping would stop matching silently and the copy would go
  # stale while still reporting healthy.
  # (absent by default — the block above is the shape)

  # Whether the console offers a sign-in of its own, under /console/login.
  # The issuer's page at the origin root is the one people use; this is
  # the door for an installation reached without it.
  login: true

  # Declared (overlay) workspaces: how an existing installation moves
  # without a Connect step. Each names a Secret in this namespace holding
  # a service-account key with domain-wide delegation and the admin to
  # impersonate. Domains are discovered from the backend like any other
  # workspace's. Declared workspaces are read-only in the console and win
  # on conflict.
  workspaces: []
  #  - backend: google
  #    admin: admin@example.com     # the account the key impersonates
  #    secretName: example-sa-key   # a Secret in this namespace
  #    # Which key of that Secret holds the JSON. Defaults to key.json.
  #    secretKey: key.json
  #    # id is optional: the credential opens exactly one tenant and that
  #    # tenant knows its own id, so it is discovered. Supply it and
  #    # adoption becomes a check — a credential that opens a different
  #    # tenant is refused rather than quietly reading another company's
  #    # directory.
  #    id: C0example
  #    # serve is optional: which of the tenant's domains this service
  #    # answers for. Omitted, it serves every domain the tenant owns.
  #    serve:
  #      - example.com

# The key this service signs tokens with.
#
# It is provisioned, never minted here: a service that creates its own
# credential is an exception to how every other credential in this estate
# is provisioned, and it would put the rotation of the most sensitive key
# we hold outside the machinery that rotates everything else. It also has
# to be the same key in every replica — two replicas with two keys hand
# out tokens half the fleet cannot verify.
#
# Either let cert-manager issue one (the default: it generates in the
# cluster, rotates on its own schedule, and the key never leaves), or
# point `existingSecret` at one external-secrets delivers.
signingKey:
  # Name a Secret that already holds the key, and no Certificate is
  # rendered. It must carry a PEM private key under `key`: RSA, or ECDSA
  # on P-256, P-384 or P-521.
  existingSecret: ""
  key: tls.key
  certificate:
    # cert-manager Issuer or ClusterIssuer that produces the key. A
    # self-signed issuer is the usual answer: the certificate is a
    # by-product and only the key is used.
    issuerName: selfsigned
    issuerKind: ClusterIssuer
    # What the issuer signs with follows from the key and is not
    # configured beside it: RSA signs RS256, P-256 ES256, P-384 ES384,
    # P-521 ES512. It is what `id_token_signing_alg_values_supported`
    # advertises, so every relying party has to accept it -- RS256 is the
    # one every client understands, and is the answer for an installation
    # with a verifier it does not control.
    #
    # Sizes are per algorithm: ECDSA takes 256, 384 or 521; RSA takes
    # 2048, 3072 or 4096. The chart refuses a combination cert-manager
    # would not issue.
    algorithm: ECDSA
    size: 384
    # PKCS8 encodes either kind; PKCS1 encodes only RSA.
    encoding: PKCS8
    # How long before expiry cert-manager replaces it, which is a new key
    # every time (`rotationPolicy: Always` above). This only decides HOW
    # OFTEN a rotation happens; it does not by itself keep the old key
    # verifying afterwards — that is `rotation.overlap` below, which is
    # the setting that actually has to be kept longer than `lifetimes.token`.
    renewBefore: 720h
    duration: 8760h
  # Live rotation: how a REPLICA notices the key file changed underneath
  # it and moves to the new key with no restart.
  #
  # The mounted file is POLLED rather than watched for filesystem events.
  # Kubernetes updates a projected Secret by renaming a `..data` symlink
  # to a freshly written directory, which is atomic on the node's
  # filesystem — a reader following the stable path always sees either
  # the whole old key or the whole new one, never a half-written file.
  # That is what makes polling the content on an interval sufficient, and
  # an inotify watch unneeded complexity for a file that changes a
  # handful of times a year.
  rotation:
    # How often the mounted file is re-read.
    pollInterval: 30s
    # How long a newly seen key is published in the JWKS before this
    # replica will SIGN with it. It must be longer than the longest
    # JWKS cache among your verifiers — Envoy's default is 10 minutes —
    # plus the slowest a kubelet anywhere in the cluster takes to project
    # the same Secret update to every other replica — Kubernetes documents
    # that as roughly a minute — so a verifier can never fetch a JWKS
    # missing a `kid` some replica already signs with.
    activationDelay: 15m
    # How long a key that stopped signing stays in the JWKS after being
    # superseded. It has to cover the longest a token minted with it can
    # still be presented, which is `lifetimes.token` — a client's own
    # `ttl_cap` only ever shortens a token's life, never lengthens it, so
    # the deployment-wide lifetime is the true ceiling. It also includes
    # 5 minutes for clock skew between the issuer and verifiers, since
    # verifiers accept tokens with some leeway and clocks differ. Empty
    # uses `lifetimes.token` plus that 5-minute margin, which is the right
    # answer unless this installation mints longer-lived tokens some other
    # way `lifetimes.token` does not capture.
    overlap: ""

# The OAuth client people sign in with. The same client the hub uses,
# with this service's own redirect URI added to it — one project, one
# client — or a client of this service's own, if revoking sign-in and
# revoking directory access should be separate acts.
#
# Empty means nobody can sign in and this service issues tokens to
# machines only, which is a real posture and is said out loud at start.
oauthClient:
  # The same shape the hub uses, for the same credential: name a Secret
  # and say what its keys are called. Both halves come from that one
  # Secret so they travel together -- a client whose id and secret are
  # configured in two places is a client that can be half rotated.
  #
  # The id is not itself a secret; every browser sent to the provider
  # carries it. It lives here anyway because it belongs to the same
  # credential.
  #
  # Empty name means nobody can sign in and this service issues tokens to
  # machines only, which is a real posture and is said out loud at start.
  secret:
    name: ""
    keys:
      clientId: client-id
      clientSecret: client-secret
# What this cluster is called, which becomes part of a ServiceAccount's
# subject: `<cluster>:k8s:<namespace>:<name>`.
#
# A pod cannot discover the name of the cluster it runs in, and the same
# namespace and name exist on every cluster in an estate — so without this
# two different machines are one `sub`, and an audit log cannot tell them
# apart. Use the name the estate already uses for the cluster (`dev`,
# `prod`), the same word that is the scope of a group name.
#
# Empty keeps the older unqualified subject, `k8s:<namespace>:<name>`,
# which is right for a single-cluster installation and is what every
# subject minted before this value looked like.
cluster: ""

exchange:
  # The audience a ServiceAccount token must be minted for. Without one,
  # every mounted token in every federated cluster would be an exchange
  # proof. Empty means the release name.
  audience: ""

  # The clusters whose workloads may exchange, each verified against the
  # key set that cluster publishes for its own ServiceAccount tokens.
  #
  # This is what makes ONE issuer serve MANY clusters. The other way to
  # check such a token is a TokenReview, which means asking the cluster —
  # and asking means holding a kubeconfig for every one of them, inside
  # the service whose whole point is to hold almost no credential. A key
  # set is public: EKS publishes one per cluster (it is what IRSA rests
  # on) and Talos serves the same keys at the API server's
  # `/openid/v1/jwks`. So there is no secret in any of these rows, and
  # this issuer needs no access to any cluster, including the one it runs
  # in — which is a row here like any other, because a special case is a
  # second code path only one installation exercises.
  #
  # What is given up is TokenReview's deletion check: a token stays valid
  # until it expires even if the ServiceAccount is deleted. Bound tokens
  # are short-lived, so the window is minutes. Recovery deliberately
  # keeps TokenReview — on the day everything else is broken it should
  # depend on nothing but the API server.
  clusters: []
  #  - name: prod            # the estate's own word for it, and what a
  #                          # `workload` matcher names. Renaming a row
  #                          # changes every rule about that cluster.
  #    issuer: https://oidc.eks.eu-central-1.amazonaws.com/id/EXAMPLE
  #    # Where its public keys are. Omitted, it is discovered from the
  #    # issuer, which works wherever the cluster publishes a discovery
  #    # document at an address this service can reach.
  #    jwksUri: ""

# The way in when no directory can vouch for anybody.
#
# It exists because of a deadlock that is otherwise complete: a console
# behind this issuer asks it for a token, this issuer asks the hub who the
# caller is, the hub cannot say because no directory is connected yet, and
# the directory is connected FROM that console. Every installation starts
# there.
#
# The proof is a ServiceAccount token minted for the audience below and a
# few minutes, checked by the API server -- the same proof this issuer
# already takes from workloads. So the authority is the cluster's RBAC:
# who may mint a token for that account, which is revocable by removing a
# binding and lands in the audit log.
#
# It grants NOTHING by itself. A recovered sign-in completes as the
# ServiceAccount subject, and the policy's `service_account` matchers
# decide what that is in -- so an installation that turns this on and
# names no matcher has an account that can sign in and is admitted
# nowhere, which is the correct default.
recovery:
  enabled: true
  # Left empty, `<release>-recovery`, created by this chart. Nobody is
  # bound to it: granting `create` on `serviceaccounts/token` for this
  # account is how an installation says who may recover.
  serviceAccountName: ""
  # The audience the token must be minted for. Without one, every mounted
  # ServiceAccount token in the cluster would be a proof.
  audience: ""

# Lifetimes. The policy may ask for shorter; these are the caps.
lifetimes:
  token: 1h
  refresh: 12h
  # The global timeout: no per-client session, and no access or ID token,
  # outlives auth_time (when the person actually authenticated) by more
  # than this -- no matter how often it is refreshed. Without it a client
  # that refreshes forever stays signed in forever, because `refresh`
  # above only bounds the gap BETWEEN refreshes, not the sign-in itself.
  #
  # It may be shorter OR longer than `refresh`; a session's actual end is
  # always the EARLIER of the two. Set it shorter than `refresh` for a
  # hard daily sign-in regardless of activity; leave it generously longer
  # to make `refresh` the only limit that matters in practice.
  #
  # Refused at render and at start if it is zero, negative, or shorter
  # than `token`: a session cannot be limited to less time than its own
  # first access token needs to live.
  #
  # BEHAVIOUR CHANGE: before this existed, a session refreshed often
  # enough never ended on its own. Now every session ends 24 hours after
  # its person signed in, at the latest -- including one already open at
  # the time this rolls out, since it is measured from auth_time rather
  # than from when this setting took effect.
  absolute: 24h
  # How long an identity keeps its last-known groups while the hub cannot
  # be reached. Zero means no hold, and an unreachable hub then refuses
  # every login.
  hold: 4h

# Where a login in progress lives: the authorization request a browser is
# part-way through, the code it comes back with, the tokens that follow,
# the device flow a CLI is polling.
#
# **More than one replica needs this.** A browser starts at /authorize on
# one replica, comes back from the provider at another, and the client
# redeems the code at a third; a CLI polls whichever answers. Kept in one
# process, each of those is a coin toss that looks like an intermittent
# failure. Empty keeps it in memory, which the service says at start.
valkey:
  address: ""
  passwordSecret:
    name: ""
    key: password
  tls: false
  # Cluster protocol. **Off by default, and the default is the answer
  # for a single-node Valkey.**
  #
  # In cluster mode the client runs CLUSTER SLOTS, learns the NODE
  # addresses, and talks to those from then on. The Kubernetes Service --
  # the one mechanism whose entire job is to survive a pod moving -- is
  # used once as a seed and then bypassed, so a Valkey that moves takes
  # the client with it and it never comes back. That happened on
  # 2026-09-10: two services dialled a dead pod address for half an hour
  # and a human had to restart them.
  #
  # Turn it on only for a Valkey with more than one shard, where the
  # protocol earns its keep. A mismatch is refused at start rather than
  # surfacing later as a puzzling command error.
  cluster: false

# The declared policy: groups, claims, lifetimes, clients. One file,
# shared with the hub. See docs/reference/policy.md.
#
# A confidential client names the Secret holding its secret:
#
#   policy:
#     clients:
#       my-console:
#         kind: confidential
#         secret: my-console-client   # a Secret in this namespace
#         secretKey: client-secret    # its key; this is the default
#         redirects: [https://console.example/oauth2/callback]
#         requires: [operators]
#         # What the sign-in page calls it. Optional, and PUBLIC: anyone
#         # who starts a sign-in for this client reads both lines.
#         display_name: My console
#         description: Where operators look after the widgets.
#
# Each one is projected to a file named after the client id, and the
# service resolves a secret by reading that path -- never by holding RBAC
# to read Secrets, which is the same reason the signing key is a file. A
# client declared confidential whose Secret is missing cannot
# authenticate, and says so in the log rather than at the token endpoint.
policy: {}

# The issuer's hostname on the gateway. Empty renders no route, which is
# right for a hub reached by port-forward while it is being tried.
route:
  host: ""
  # Where a bare GET of this host's root goes. The issuer serves nothing
  # at "/" -- every endpoint it answers is a named one -- so a person who
  # types the domain gets a 404. Where a console shares this host under a
  # path, point this at it ("/console/") and they land somewhere useful.
  # Empty keeps the 404, which is the honest answer for an issuer with no
  # console beside it.
  rootRedirect: ""
  gatewayClassName: internal
  certificate:
    issuerName: internal-ca
    issuerKind: ClusterIssuer
    # The key this certificate is issued for. Empty leaves every field to
    # cert-manager's own defaults, which is an RSA 2048 key. Set it when
    # the issuer will only sign one kind of key: a PKI role pinned to an
    # algorithm refuses the request at issuance, long after the render
    # succeeded, and the listener stays dark with the reason on the
    # CertificateRequest.
    #   algorithm: ECDSA         # RSA | ECDSA
    #   size: 384                # ECDSA 256|384|521, RSA 2048|3072|4096
    #   encoding: PKCS8          # PKCS1 | PKCS8
    #   rotationPolicy: Always   # a renewal over the same key rotates nothing
    privateKey: {}
  # Namespaces, besides this issuer's own, allowed to attach an HTTPRoute
  # to this Gateway.
  #
  # This is the other half of the one-origin console: the
  # directory console shares this issuer's HOSTNAME, so it also has to
  # share this issuer's GATEWAY -- two Gateways declaring a listener for
  # the same route.host collide (Envoy Gateway merges every Gateway of
  # one class into one deployment), they do not coexist as two
  # independent routes. The console's own HTTPRoutes live in the hub
  # chart's namespace, which is why this needs naming at all.
  #
  # Renders allowedRoutes.namespaces as a Selector matching this
  # namespace plus every one named here, rather than the default
  # `from: Same`.
  #
  # NOTE, because it is the thing everyone gets wrong once: this is a
  # GATEWAY-level admission, not a ReferenceGrant. A ReferenceGrant
  # governs a route's backendRefs reaching INTO another namespace; it has
  # nothing to do with a route's parentRefs reaching a Gateway. Whether a
  # Gateway accepts a route from another namespace at all is entirely
  # its own allowedRoutes -- which is what this value renders.
  #
  # Empty keeps `from: Same`, today's shape exactly.
  sharedWith: []
  # Parents for the issuer's routes, written out in full. When set, the
  # chart renders no Gateway and no Certificate: the parent -- typically a
  # platform ListenerSet carrying route.host -- owns the listener and its
  # certificate, and gatewayClassName, certificate and sharedWith have no
  # effect. Write group and kind out; the API server fills them in and a
  # desired/live comparison reads their absence as drift.
  #   - group: gateway.networking.k8s.io
  #     kind: ListenerSet
  #     name: issuer
  #     namespace: gateway-system
  parentRefs: []

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the issuer. Everything with a browser
  # reaches it through the gateway, so this is for in-cluster callers:
  # the proxies verifying tokens and the workloads exchanging them.
  clients: []
  gatewayNamespace: ""

serviceAccount:
  name: ""
  # Annotations on the ServiceAccount. The reason this exists is cloud
  # identity: an admission webhook (EKS Pod Identity, GKE Workload
  # Identity, or the self-hosted amazon-eks-pod-identity-webhook) reads an
  # annotation here and injects the credentials into every pod that uses
  # the account. Nothing in this service needs a cloud identity today: the
  # audit trail is the installation's to write, not this service's.
  #
  #   annotations:
  #     eks.amazonaws.com/role-arn: <the role's ARN>
  annotations: {}

# The GitHub controller: makes each GitHub organisation's teams match the
# policy's `github` table, and reports on the console's GitHub page.
#
# A second process beside the service, from this chart, because it holds
# GitHub App keys and writes to GitHub — neither belongs in the login path.
# It has no listener. It reads the console's API with its own
# ServiceAccount token, which the service verifies against this cluster's
# key set: `exchange.clusters` must name this cluster, and the policy must
# put the controller's account in `all:access-roster:viewer` (to read who
# holds a group). It records what it did to the audit installation itself,
# with a token of its own (see `audit`).
githubRoster:
  enabled: false
  image:
    repository: ghcr.io/truvity/access-roster/github-roster
    # Empty uses the chart's appVersion, so the controller and the service
    # always come from one release.
    tag: ""
    pullPolicy: IfNotPresent
  # How long between passes.
  interval: 15m
  # The organisations it CHANGES. Every other organisation the policy
  # binds is derived every pass and shown on the GitHub page with what
  # would happen, and nothing is done to it: an organisation is born
  # disabled, and enabling one is a reviewed change to this list.
  actsIn: []
  resources: {}

# Runner Apps: the GitHub App a self-hosted runner scale set in one tier
# registers with, one per organisation per tier, created by an operator on
# the console's GitHub page (Apps). The service keeps every App in the
# Secret `<release>-github-runner-apps`, an installed App as three keys
# named as gha-runner-scale-set's githubConfigSecret names them —
# `<tier>.<org>.github_app_id`, `.github_app_installation_id`,
# `.github_app_private_key` — for the deployment to hand to its runners.
# Nothing here acts with them. Needs `directory.store: kubernetes`.
githubRunnerApps:
  # The tiers an operator may create an App for, e.g. [preview, stable].
  # Empty creates none.
  tiers: []

# A catalogue of GitHub Apps, declared as data and created by an operator
# on the console's GitHub page (Apps, then Catalogue) with two clicks each:
# create, then install. The service keeps every App in the Secret
# `<release>-github-catalogue-apps`, an installed App as
# `<id>.github_app_id`, `<id>.github_app_installation_id` and
# `<id>.github_app_private_key` beside `<id>.record.json`. Read once at
# start; a malformed entry stops the service. Needs
# `directory.store: kubernetes`. See docs/connect/github-apps-catalogue.md.
githubApps:
  # Each entry:
  #   - id: renovate               # [a-z0-9-], at most 32, unique; never changes
  #     org: example-org           # the organisation the App is created under
  #     name: example-org-renovate # optional; default <org>-<id>, at most 34
  #     description: Dependency updates
  #     public: false
  #     permissions: {contents: write, pull_requests: write}
  #     events: []                 # optional; the webhook stays inactive
  #     installation: selected     # all | selected (default)
  #     grants:                    # who may ask for tokens of it, and for how much
  #       - group: all:platform:engineer
  #         repositories: ["*"]
  #         permissions: {contents: read}
  #     push:                      # optional; off unless written out, see below
  #       secretStore: {name: example-store, kind: SecretStore}
  #       remoteKey: platform/github-apps/iac
  #
  # `push` is the one way a credential leaves this service. External
  # Secrets copies exactly the App's three property keys -- the id, the
  # installation id and the private key, never the whole Secret -- to the
  # store and path the entry names, for a consumer that cannot ask the
  # issuer at the moment it runs: an infrastructure-as-code apply,
  # typically. Off unless an entry carries it, and what it writes is a
  # REAL credential: a second durable copy of the App's key, to be rotated
  # as one. See docs/connect/infrastructure-as-code.md.
  #
  # A default set an estate can copy -- dependency updates split public
  # from private, a bot that approves and tags, and one App for the
  # program that manages the organisation -- is shipped beside this file
  # as examples/github-apps.yaml, with what each App is for and why they
  # are separate identities.
  catalogue: []

  # A SECOND COPY OF THE APPS THIS SERVICE ACTS AS -- the link App and one
  # per bound organisation, the Secret `<release>-github-apps`. Off unless
  # written out, same shape as `directory.push`:
  #
  #   push:
  #     secretStore: {name: openbao, kind: ClusterSecretStore}
  #     remoteKey: infra/access-issuer-github-apps
  #
  # Distinct from `catalogue[].push` above, which copies ONE catalogue
  # App's three keys to a consumer that must act as that App. This copies
  # the service's OWN identities, and only so they can be restored.
  #
  # Losing them is worse than it sounds: an App cannot be re-created with
  # its old id, so recovery is not "make another one" -- every grant that
  # names the App rebinds, and every installation is re-authorised by hand.
  #
  # Bundled under one remote key, like the workspace credential, because
  # the keys are `_link.json` and `<org>.json`: an organisation bound later
  # adds a key, and a per-key mapping written today would not carry it.
  # (absent by default — the block above is the shape)

# THE SECRET STORES THE CONSOLE SHOWS. Read-only, and not by omission.
#
# A store's desired state is written in your own repository and applied
# by whatever applies it; this console reads it and draws what it found
# beside what the deployment declares. Nothing here can write to a store,
# and the reader cannot read a secret's VALUE at all -- it is granted the
# declared state (policies, identity groups, their aliases, the auth
# mounts) and nothing else.
#
# Empty declares none, and the console then has no such page rather than
# an empty one. Each entry:
#
#   - name: kernel                       # [a-z0-9-], unique; names the page
#     address: https://openbao.internal  # the API, no path
#     mount: jwt-roster                  # optional; the JWT auth mount
#     role: roster                       # optional; the role on it
#     audience: openbao                  # optional; the exchange audience
#     caCertSecret:                      # optional; a private root
#       name: openbao-ca
#       key: ca.crt
#     caCertConfigMap:                   # the same, from a ConfigMap
#       name: truvity-private-ca         # (what trust-manager writes);
#       key: ca-certificates.crt         # name one of the two, never both
#     namespaces:                        # at least one
#       - name: devel
#         environment: devel             # optional; defaults to the name
#
# A NAMESPACE IS AN ENVIRONMENT. The model is one level deep, and
# `environment` exists only for a store that names its namespaces
# differently -- the page still has to say which environment it is
# looking at.
#
# HOW IT READS THEM. As this service's own ServiceAccount: a projected
# token, audienced at `exchange.audience`, exchanged at the issuer for
# the store's audience exactly as a CI job's is. There is no second
# credential and nothing is stored. That exchange has to be granted --
# the store's `requires` must admit the group this service's workload
# identity holds -- and a refusal is drawn on the page, naming the
# audience, rather than raised as an error.
secretManagers: []

# THE SESSION KEY IS DELIBERATELY NOT PUSHABLE, and this note is the
# feature.
#
# It is the obvious next candidate -- the service writes it, it is a
# Secret, the machinery is right here -- and copying it would make the
# installation worse. Losing it signs everyone out and the service mints a
# fresh one: correct behaviour, not a failure, and nothing an operator
# must recover. A durable copy buys none of that back and widens what a
# compromise of the store is worth, from reading secrets to forging
# sessions.
#
# So there is no `session.push`. If a later installation asks for one, the
# answer is this paragraph rather than a knob.

# The audit trail: sign-ins, refusals, exchanges, revokes, connects, and
# what the GitHub controller did. It is kept by an audit installation
# (github.com/truvity/audit) of this service's own, rendered beside it in
# the same namespace: the receiver takes the records and registers the
# catalogue, the writer locks and indexes them and its digest job signs each
# hour, and the query service serves the Audit page as the person signed in. This service holds no bucket and no keys — that is what
# having the installation next to it rather than inside it is for.
#
# With nothing set, nothing is kept: every record is still validated
# against the catalogue and written as a log line (`audit=true`), and the
# console has no Audit page. Every record is a log line either way.
audit:
  # The installation's receiver: one address, which takes the records and
  # answers RegisterCatalogue on the same port. Empty keeps no trail beyond
  # the log line every record also is.
  #
  # The service account's projected token (below) is how the installation
  # knows this workload: its `workloadIdentity.workloads` must map
  # system:serviceaccount:<namespace>:<this release's service account> — and
  # the controller's, when it runs — to the source `roster`.
  writer: ""    # e.g. http://audit.access-issuer.svc:8080
  # The installation's query service, for the console's Audit page. Empty
  # shows no page. The page's tokens are minted by this issuer for the
  # client named `audience`, which the policy must declare with the groups
  # that may read the trail (`<scope>:audit:<role>`), and which the query
  # service's grants trust.
  query: ""     # e.g. http://audit-query.access-issuer.svc:8080 -- the same namespace as the writer
  audience: audit
  # The projected token presented to the receiver.
  token:
    audience: audit
    expirationSeconds: 3600
  # How many of the deployment's own proxies sit in front of the service,
  # counted the way the audit emitter counts them: X-Forwarded-For read
  # left to right with the connection's peer as the last entry, so THE PEER
  # COUNTS AS ONE. A gateway alone in front of the service is 1; an edge
  # that appends the client and a gateway that appends the edge's connector
  # is 2. The client is the entry just left of those; the left end is
  # whatever a caller sent and is never taken on its own. 0 records the peer.
  forwardedForTrustedHops: 0

# Metrics, pushed over OTLP by the service and the GitHub controller.
# Empty publishes nothing: no listener is opened for them either way.
telemetry:
  # the collector's OTLP/HTTP endpoint, e.g. http://otel-collector.observability.svc:4318
  otlpEndpoint: ""

logLevel: info

resources: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []

# GitHub Actions as a source of CI identity. A workflow trades its
# workflow identity token for one of this issuer's, and a `github:` matcher
# in the policy decides what that job may reach.
github:
  # Whose repositories this installation runs jobs for: the GitHub
  # organisations (or users) whose `repository_owner` is admitted.
  #
  # There is no default and there cannot be one. Anybody may run a
  # workflow in their own repository and get a perfectly valid token from
  # GitHub's issuer, so a signature and an expiry prove only that the job
  # ran somewhere -- this list is the whole of what makes one of them
  # ours. Empty means CI tokens are not verified at all, which is the
  # right posture for an installation with no CI rather than a gap.
  #
  # The audience a workflow must request is this issuer's URL, and it is
  # not configurable: one audience per relying party is what stops a token
  # minted for a cloud provider being replayed here.
  owners: []

# The console that shows this issuer's sessions.
console:
  # The ONE origin allowed to call SessionService from a browser — the
  # hub's console, which renders the sessions sections on a person's page
  # and a client's.
  #
  # The browser calls this issuer directly rather than the hub calling it
  # for them, so that the hub's code stays independent of this service:
  # the hub answers "is this account live" for consumers, and that has to
  # keep working when this issuer is down.
  #
  # Empty serves SessionService not at all, which is right for an
  # installation with no console: an endpoint nobody calls is surface with
  # no consumer. A wildcard is not offered — the alternative to one origin
  # is every page on the internet being able to list and end a signed-in
  # person's sessions through their own browser.
  #
  # Since the merge the console is served by this process on
  # this origin, so nothing cross-origin is involved and this can stay
  # empty. It remains for a console served from somewhere else.
  origin: ""

  # Where the console is mounted on this issuer's origin.
  #
  # It is a PATH and not a host because discovery must sit at the root of
  # the origin named in every token's `iss`: the issuer owns "/", and the
  # console takes a path beside it. Same origin is what lets the console's
  # session pages call this issuer with the browser's own cookie and no
  # bearer in JavaScript.
  #
  # This value is also what the console prefixes onto every link it hands
  # a browser, because "/login" resolves against the origin — where the
  # issuer's own page is, not the console's. Empty serves no console.
  mount: /console

  # The client id the console signs people in as.
  #
  # The console is a client of this issuer like any other application:
  # somebody with no session is sent to /authorize, signs in once, and
  # comes back with the issuer's session set — which the console then
  # reads. One door, and nothing special held by the console.
  #
  # It must name a declared client in the policy whose `redirects`
  # include this origin plus the mount with a trailing slash, and whose
  # `requires` admits whoever should reach the console.
  #
  # Empty keeps the console's own sign-in page, which is the shape for a
  # deployment with no issuer beside it — and, in one with an issuer, a
  # second door.
  client: ""

