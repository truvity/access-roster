{{- if .Values.secretManagers }}
{{- /*
`caCertSecret` and `caCertConfigMap` are dropped from every entry: both
are chart-side instructions — mount this — and what the service is told
is the PATH the bundle lands at. The loader refuses a key it does not
know rather than ignoring it, so passing either reference through would
stop the service at start.

Two sources for one thing because estates distribute a private root two
ways: as a Secret, and as the ConfigMap cert-manager's trust-manager
writes into every namespace. Whichever is named, the file arrives at the
same path and the service is told that one path.
*/ -}}
{{- $managers := list }}
{{- range .Values.secretManagers }}
{{- $entry := omit . "caCertSecret" "caCertConfigMap" }}
{{- if and .caCertSecret .caCertConfigMap }}
{{- fail (printf "secretManagers[%s]: name caCertSecret or caCertConfigMap, not both: two bundles at one path is one of them silently unused" .name) }}
{{- end }}
{{- with .caCertSecret }}
{{- $entry = set $entry "caCertFile" (printf "/var/run/access-issuer/secret-managers-ca/%s/%s" $entry.name (.key | default "ca.crt")) }}
{{- end }}
{{- with .caCertConfigMap }}
{{- $entry = set $entry "caCertFile" (printf "/var/run/access-issuer/secret-managers-ca/%s/%s" $entry.name (.key | default "ca.crt")) }}
{{- end }}
{{- $managers = append $managers $entry }}
{{- end }}
# The secret stores this console SHOWS. Nothing here is a secret: names,
# addresses, and which namespaces to draw. The credential the reader uses
# is minted per read from this service's own ServiceAccount token and is
# never stored.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "access-issuer.fullname" . }}-secret-managers
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
data:
  managers.yaml: |
    {{- toYaml (dict "managers" $managers) | nindent 4 }}
{{- end }}
