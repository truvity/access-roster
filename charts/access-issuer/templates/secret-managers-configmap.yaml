{{- if .Values.secretManagers }}
{{- /*
`caCertSecret` is dropped from every entry: it is a chart-side
instruction — mount this Secret — and what the service is told is the
PATH the bundle lands at. The loader refuses a key it does not know
rather than ignoring it, so passing the Secret reference through would
stop the service at start.
*/ -}}
{{- $managers := list }}
{{- range .Values.secretManagers }}
{{- $entry := omit . "caCertSecret" }}
{{- if .caCertSecret }}
{{- $entry = set $entry "caCertFile" (printf "/var/run/access-issuer/secret-managers-ca/%s/%s" .name (.caCertSecret.key | default "ca.crt")) }}
{{- end }}
{{- $managers = append $managers $entry }}
{{- end }}
# The secret stores this console SHOWS. Nothing here is a secret: names,
# addresses, and which namespaces to draw. The credential the reader uses
# is minted per read from this service's own ServiceAccount token and is
# never stored.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "access-issuer.fullname" . }}-secret-managers
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
data:
  managers.yaml: |
    {{- toYaml (dict "managers" $managers) | nindent 4 }}
{{- end }}
