{{- if not .Values.signingKey.existingSecret }}
{{- include "access-issuer.privateKey" (dict "spec" .Values.signingKey.certificate "path" "signingKey.certificate") }}
# The signing key, issued by cert-manager.
#
# The certificate is a by-product: only the key is used. cert-manager is
# here because it generates the key in the cluster, keeps it out of every
# other system, and rotates it on a schedule the platform already
# understands — none of which is true of a key this service minted for
# itself, and the last of which is the reason it does not.
#
# `rotationPolicy: Always` makes a renewal a *new key*, which is the
# point: a renewed certificate over the same key would rotate nothing.
#
# The algorithm decides what the issuer signs with -- RSA signs RS256, and
# P-256, P-384 and P-521 sign ES256, ES384 and ES512 -- and that is what
# the discovery document advertises, so every relying party has to accept
# it. Changing it here rotates the key, so tokens signed with the previous
# one stop verifying once the old public key leaves the JWKS -- which the
# issuer itself now schedules, with no restart of this Deployment needed
# either to notice the new key or to retire the old one; see
# `signingKey.rotation` for the delays that govern it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "access-issuer.fullname" . }}-signing-key
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
spec:
  secretName: {{ include "access-issuer.signingKeySecret" . }}
  commonName: {{ include "access-issuer.fullname" . }}
  duration: {{ .Values.signingKey.certificate.duration | quote }}
  renewBefore: {{ .Values.signingKey.certificate.renewBefore | quote }}
  privateKey:
    algorithm: {{ .Values.signingKey.certificate.algorithm }}
    size: {{ .Values.signingKey.certificate.size }}
    encoding: {{ .Values.signingKey.certificate.encoding }}
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.signingKey.certificate.issuerName | quote }}
    kind: {{ .Values.signingKey.certificate.issuerKind | quote }}
    group: cert-manager.io
{{- end }}
{{- $seen := dict }}
{{- if not .Values.signingKey.existingSecret }}
{{- $_ := set $seen (include "access-issuer.signingAlgorithmOf" .Values.signingKey.certificate) true }}
{{- end }}
{{- range $i, $extra := .Values.signingKey.additional }}
{{- include "access-issuer.privateKey" (dict "spec" $extra "path" (printf "signingKey.additional[%d]" $i)) }}
{{- $alg := include "access-issuer.signingAlgorithmOf" $extra }}
{{- if hasKey $seen $alg }}
{{- fail (printf "signingKey.additional[%d]: another key already signs with %s; each algorithm this installation configures needs exactly one key" $i $alg) }}
{{- end }}
{{- $_ := set $seen $alg true }}
{{- $name := include "access-issuer.additionalSigningKeyName" $extra }}
---
# An ADDITIONAL signing key, on its own rotation track in the issuer (one
# [issuer.KeyRing] per algorithm) so that renewing it never disturbs the
# default key's schedule above. Otherwise exactly the default key's own
# story: cert-manager issues it, only the key is used, and
# `rotationPolicy: Always` is what makes a renewal a NEW key.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "access-issuer.fullname" $ }}-{{ $name }}
  labels:
    {{- include "access-issuer.labels" $ | nindent 4 }}
spec:
  secretName: {{ include "access-issuer.fullname" $ }}-{{ $name }}
  commonName: {{ include "access-issuer.fullname" $ }}
  duration: {{ $extra.duration | default "8760h" | quote }}
  renewBefore: {{ $extra.renewBefore | default "720h" | quote }}
  privateKey:
    algorithm: {{ $extra.algorithm }}
    size: {{ $extra.size }}
    encoding: {{ $extra.encoding | default "PKCS8" }}
    rotationPolicy: Always
  issuerRef:
    name: {{ $extra.issuerName | default "selfsigned" | quote }}
    kind: {{ $extra.issuerKind | default "ClusterIssuer" | quote }}
    group: cert-manager.io
{{- end }}
