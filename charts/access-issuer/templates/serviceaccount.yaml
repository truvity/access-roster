apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "access-issuer.serviceAccountName" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
{{- if .Values.exchange.workloadTokens }}
---
# The one cluster-scoped permission this service ever needs: creating
# TokenReviews, to ask the API server whether a workload's token is
# genuine and for which audience. It reads nothing.
#
# It is the same mechanism the hub's API listener uses, and the same
# reasoning: this installation asks the cluster who is calling rather
# than holding a secret that says so.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "access-issuer.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "access-issuer.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "access-issuer.fullname" . }}-{{ .Release.Namespace }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "access-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.recovery.enabled }}
---
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "access-issuer.recoveryServiceAccountName" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
{{- end }}
