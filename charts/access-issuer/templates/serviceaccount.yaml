apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "access-issuer.serviceAccountName" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
{{- if eq .Values.directory.store "kubernetes" }}
---
# The directory store is plain Kubernetes objects in THIS namespace:
# workspace records (ConfigMaps) and their credentials (Secrets), written
# by this service itself. A namespaced Role and never a ClusterRole —
# which is why this service gets a namespace of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "access-issuer.fullname" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "access-issuer.fullname" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "access-issuer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "access-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if or .Values.exchange.workloadTokens .Values.recovery.enabled }}
---
# The one cluster-scoped permission this service ever needs: creating
# TokenReviews, to ask the API server whether a workload's token is
# genuine and for which audience. It reads nothing.
#
# Recovery uses it too, and for the same reason: the way in on the day
# the directory is broken is a token proving cluster access, not a
# password this service would have to store.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "access-issuer.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "access-issuer.fullname" . }}-{{ .Release.Namespace }}-tokenreview
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "access-issuer.fullname" . }}-{{ .Release.Namespace }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "access-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.recovery.enabled }}
---
# The account a recovery token is minted for. Deliberately bound to
# NOTHING: it needs no permissions, because the token is a proof of
# identity and not a way to act. Granting `create` on
# `serviceaccounts/token` for this account is how an installation says who
# may recover, and that grant is the whole of the access control.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "access-issuer.recoveryServiceAccountName" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
{{- end }}
