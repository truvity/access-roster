apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "access-issuer.fullname" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "access-issuer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "access-issuer.selectorLabels" . | nindent 8 }}
      annotations:
        # A policy change is a rollout: the file is read at start.
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
        {{- if .Values.exchange.clusters }}
        # A federated cluster is read once at start. A row added without a
        # rollout is a cluster whose workloads go on being refused, with
        # nothing to see but an error naming the wrong cause.
        checksum/clusters: {{ include (print $.Template.BasePath "/clusters-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.directory.workspaces }}
        # A declared workspace is read once at start, so a workspace added
        # to the values without a rollout is one an operator can see in
        # git and nowhere in the running service.
        checksum/overlay: {{ include (print $.Template.BasePath "/overlay-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "access-issuer.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: access-issuer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: issuer
              containerPort: {{ .Values.listeners.port }}
            - name: health
              containerPort: {{ .Values.listeners.healthPort }}
          env:
            - name: ISSUER_URL
              value: {{ required "issuerURL is required: it is baked into every token and every relying party's trust" .Values.issuerURL | quote }}
            - name: PORT
              value: {{ .Values.listeners.port | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.listeners.healthPort | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # What an operator connected — the workspaces and their
            # credentials, the memberships, the OAuth client it was
            # given, the session key — kept as ConfigMaps and Secrets in
            # this namespace. Anything else and a restart is a fresh
            # installation.
            - name: STORE
              value: {{ .Values.directory.store | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.directory.freshness.refreshInterval | quote }}
            - name: FRESHNESS_WINDOW
              value: {{ .Values.directory.freshness.freshnessWindow | quote }}
            - name: PROBE_INTERVAL
              value: {{ .Values.directory.freshness.probeInterval | quote }}
            - name: SESSION_LIFETIME
              value: {{ .Values.directory.sessionLifetime | quote }}
            - name: LOGIN_DIRECTORY
              value: {{ .Values.directory.login | quote }}
            {{- if .Values.directory.workspaces }}
            - name: OVERLAY_FILE
              value: /var/run/access-issuer/directory/overlay.yaml
            {{- end }}
            {{- if and .Values.route.host .Values.console.mount }}
            # Where a browser reaches the console, and where this origin's
            # root is. Everything that has to name itself to somebody else
            # is built from the first: the admin-consent redirect URI, and
            # the values the setup steps tell an operator to paste into a
            # cloud console.
            - name: PUBLIC_URL
              value: https://{{ .Values.route.host }}{{ .Values.console.mount }}
            # The admin-consent callback stays at the origin ROOT. It is
            # the one flow that runs before anybody can be signed in, and
            # its redirect URI is registered with every corporate tenant —
            # so moving it under the console's path would mean
            # re-registering it in each of them.
            - name: PUBLIC_ROOT_URL
              value: https://{{ .Values.route.host }}
            {{- end }}
            # Provisioned, never minted here — see values.yaml.
            - name: SIGNING_KEY_FILE
              value: /var/run/access-issuer/signing-key/{{ .Values.signingKey.key }}
            {{- if .Values.valkey.address }}
            - name: VALKEY_ADDRESS
              value: {{ .Values.valkey.address | quote }}
            - name: VALKEY_TLS
              value: {{ .Values.valkey.tls | quote }}
            - name: VALKEY_CLUSTER
              value: {{ .Values.valkey.cluster | quote }}
            {{- if .Values.valkey.passwordSecret.name }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.passwordSecret.name }}
                  key: {{ .Values.valkey.passwordSecret.key }}
            {{- end }}
            {{- end }}
            - name: RELEASE_NAME
              value: {{ include "access-issuer.fullname" . }}
            - name: POLICY_DIR
              value: /var/run/access-issuer/policy
            - name: TOKEN_LIFETIME
              value: {{ .Values.lifetimes.token | quote }}
            - name: REFRESH_LIFETIME
              value: {{ .Values.lifetimes.refresh | quote }}
            - name: HOLD_WINDOW
              value: {{ .Values.lifetimes.hold | quote }}
            {{- with .Values.cluster }}
            - name: CLUSTER
              value: {{ . | quote }}
            {{- end }}
            - name: EXCHANGE_AUDIENCE
              value: {{ include "access-issuer.exchangeAudience" . | quote }}
            {{- if .Values.exchange.clusters }}
            - name: CLUSTERS_FILE
              value: /var/run/access-issuer/clusters.yaml
            {{- end }}
            {{- if .Values.recovery.enabled }}
            # Recovery is the one thing left that asks the API server, and
            # deliberately so: on the day everything else is broken it
            # should depend on nothing but the cluster.
            - name: IN_CLUSTER
              value: "true"
            {{- end }}
            {{- if include "access-issuer.confidentialClients" . }}
            - name: CLIENT_SECRETS_DIR
              value: /var/run/access-issuer/clients
            {{- end }}
            {{- with .Values.console.origin }}
            - name: CONSOLE_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.github.owners }}
            - name: GITHUB_OWNERS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: RECOVERY_ENABLED
              value: {{ .Values.recovery.enabled | quote }}
            {{- if .Values.recovery.enabled }}
            - name: RECOVERY_SERVICE_ACCOUNT
              value: {{ include "access-issuer.recoveryServiceAccountName" . | quote }}
            - name: RECOVERY_AUDIENCE
              value: {{ include "access-issuer.recoveryAudience" . | quote }}
            {{- end }}
            {{- with .Values.oauthClient.secret }}
            {{- if .name }}
            # ONE credential, read two ways, because the two halves want
            # different things of it. Signing a person in reads it from a
            # FILE, so this service holds no RBAC to read Secrets and a
            # compromise of it cannot become a read of every credential in
            # the namespace. Connecting a directory reads it through the
            # API, because that one the console can also WRITE: an
            # installation with no client yet is bootstrapped by pasting
            # one into Settings.
            - name: OAUTH_CLIENT_ID_FILE
              value: /var/run/access-issuer/oauth-client/{{ .keys.clientId }}
            - name: OAUTH_CLIENT_SECRET_FILE
              value: /var/run/access-issuer/oauth-client/{{ .keys.clientSecret }}
            - name: OAUTH_CLIENT_SECRET_NAME
              value: {{ .name | quote }}
            - name: OAUTH_CLIENT_ID_KEY
              value: {{ .keys.clientId | quote }}
            - name: OAUTH_CLIENT_SECRET_KEY
              value: {{ .keys.clientSecret | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.route.host }}
            # Served over TLS, so its cookies say so.
            - name: SECURE_COOKIES
              value: "true"
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/access-issuer/signing-key
              readOnly: true
            - name: policy
              mountPath: /var/run/access-issuer/policy
              readOnly: true
            {{- if .Values.exchange.clusters }}
            - name: clusters
              mountPath: /var/run/access-issuer/clusters.yaml
              subPath: clusters.yaml
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.directory.workspaces }}
            - name: overlay
              mountPath: /var/run/access-issuer/directory/overlay.yaml
              subPath: overlay.yaml
              readOnly: true
            {{- range .Values.directory.workspaces }}
            - name: key-{{ .secretName }}
              mountPath: /var/run/access-issuer/directory/keys/{{ .secretName }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if include "access-issuer.confidentialClients" . }}
            - name: client-secrets
              mountPath: /var/run/access-issuer/clients
              readOnly: true
            {{- end }}
            {{- if .Values.oauthClient.secret.name }}
            - name: oauth-client
              mountPath: /var/run/access-issuer/oauth-client
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: signing-key
          secret:
            secretName: {{ include "access-issuer.signingKeySecret" . }}
        - name: policy
          configMap:
            name: {{ include "access-issuer.fullname" . }}-policy
        # The root filesystem is read-only, and the directory backends
        # want somewhere to write.
        - name: tmp
          emptyDir: {}
        {{- if .Values.exchange.clusters }}
        - name: clusters
          configMap:
            name: {{ include "access-issuer.fullname" . }}-clusters
        {{- end }}
        {{- if .Values.directory.workspaces }}
        - name: overlay
          configMap:
            name: {{ include "access-issuer.fullname" . }}-overlay
        {{- range .Values.directory.workspaces }}
        - name: key-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- end }}
        {{- if include "access-issuer.confidentialClients" . }}
        # One file per confidential client, named after the client id, so
        # the service resolves a secret by reading a path and never by
        # holding RBAC to read Secrets -- the same reason the signing key
        # is a file.
        - name: client-secrets
          projected:
            sources:
              {{- range $id, $client := .Values.policy.clients }}
              {{- if $client.secret }}
              - secret:
                  name: {{ $client.secret }}
                  items:
                    - key: {{ $client.secretKey | default "client-secret" }}
                      path: {{ $id }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- if .Values.oauthClient.secret.name }}
        - name: oauth-client
          secret:
            secretName: {{ .Values.oauthClient.secret.name }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
