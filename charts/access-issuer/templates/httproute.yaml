{{- if .Values.route.host }}
{{- /*
  The issuer's hostname. Everything is on it — discovery, the keys, the
  token endpoint, this service's three pages — because a relying party
  anchors its trust on one URL and a person meeting two hostnames during
  one login has met two services.

  No authenticating proxy in front: this IS the thing that authenticates,
  and a proxy would have nowhere to send anyone.
*/}}
{{- if .Values.route.certificate.issuerName }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "access-issuer.fullname" . }}-tls
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
spec:
  secretName: {{ include "access-issuer.fullname" . }}-tls
  dnsNames:
    - {{ .Values.route.host | quote }}
  issuerRef:
    name: {{ .Values.route.certificate.issuerName | quote }}
    kind: {{ .Values.route.certificate.issuerKind | quote }}
    group: cert-manager.io
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "access-issuer.fullname" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.route.gatewayClassName | quote }}
  listeners:
    - name: issuer
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.route.host | quote }}
      allowedRoutes:
        namespaces:
            {{- /* Gateway-level admission, not a ReferenceGrant: a
                   ReferenceGrant governs a route's backendRefs reaching
                   INTO another namespace, and has nothing to do with a
                   route's parentRefs reaching a Gateway. Whether a
                   Gateway accepts a route from another namespace at all
                   is decided entirely here.

                   route.sharedWith (INF-687) is how the directory
                   console attaches its own HTTPRoutes to THIS Gateway
                   instead of rendering its own for the same route.host
                   -- two Gateways declaring a listener for one hostname
                   collide, they do not coexist as two independent
                   routes. Its routes live in the hub chart's own
                   namespace, hence naming it here. Empty keeps
                   `from: Same`, today's shape exactly. */}}
          {{- if .Values.route.sharedWith }}
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                    {{- range (list .Release.Namespace | concat .Values.route.sharedWith | uniq) }}
                  - {{ . | quote }}
                    {{- end }}
          {{- else }}
          from: Same
          {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
            {{- /* `group: ""` is the API server's default, and writing it
                   out is the same lesson as the path match below: a field
                   the cluster adds and the manifest omits is permanent
                   OutOfSync for whatever compares the two. */}}
          - group: ""
            kind: Secret
            name: {{ include "access-issuer.fullname" . }}-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "access-issuer.fullname" . }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "access-issuer.fullname" . }}
      sectionName: issuer
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
      {{- with .Values.route.rootRedirect }}
      {{- /* The issuer owns this host's ROOT, and has nothing to serve
             there: everything it answers is a named endpoint, so "/" is
             a 404 for anyone who simply types the domain. Where a console
             shares the host under a path (INF-687), sending them there
             is kinder than that 404 and costs nothing -- an Exact match
             outranks the catch-all below, so it takes only "/" itself
             and no endpoint moves. Empty serves the 404, which is the
             honest answer for an issuer deployed alone. */}}
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ . | quote }}
            statusCode: 302
      {{- end }}
      {{- /* Written out although it is also the API server's default: a
             rule without one comes back WITH one, and a GitOps controller
             then sees a field it never sent and reports OutOfSync
             forever. */}}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "access-issuer.fullname" . }}
          port: {{ .Values.listeners.port }}
          weight: 1
{{- end }}
