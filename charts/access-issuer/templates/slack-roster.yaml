{{- if .Values.slackRoster.enabled }}
{{- if not .Values.exchange.clusters }}
{{- fail "slackRoster.enabled needs exchange.clusters to name this cluster: the service verifies the controller's ServiceAccount token against that key set, and with no row it verifies nothing" }}
{{- end }}
{{- if not (include "access-issuer.consoleMount" .) }}
{{- fail "slackRoster.enabled needs console.mount: the controller reads the console's API, and with no mount there is none" }}
{{- end }}
{{- $name := printf "%s-slack-roster" (include "access-issuer.fullname" .) }}
---
# The controller's own account. It holds one permission: updating its one
# report. The Secret with the workspaces' bot tokens and the ConfigMap with
# the console's records are mounted volumes, so no Secret or other ConfigMap
# is readable at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-roster
---
# Update, by name, the one ConfigMap it reports into. The service creates
# that object — `create` cannot be narrowed to a name — so this account
# cannot create any ConfigMap, and in particular none that would read to
# the service as a workspace record.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-roster
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-slack-status" (include "access-issuer.fullname" .) | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-roster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "access-issuer.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-roster
spec:
  # One: two controllers would make every change twice, and Slack's answer
  # to the second is an error that reads as a failure.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "access-issuer.slackRosterSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "access-issuer.slackRosterSelectorLabels" . | nindent 8 }}
      annotations:
        # The bindings are read at start, like the service's policy.
        checksum/policy: {{ include (print $.Template.BasePath "/policy-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slack-roster
          image: "{{ .Values.slackRoster.image.repository }}:{{ .Values.slackRoster.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.slackRoster.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELEASE_NAME
              value: {{ include "access-issuer.fullname" . }}
            - name: POLICY_DIR
              value: /var/run/slack-roster/policy
            - name: CONSOLE_URL
              value: {{ printf "http://%s.%s.svc:%v%s" (include "access-issuer.fullname" .) .Release.Namespace .Values.listeners.port (include "access-issuer.consoleMount" .) | quote }}
            - name: TOKEN_FILE
              value: /var/run/secrets/slack-roster/token
            - name: CREDENTIALS_DIR
              value: /var/run/slack-roster/credentials
            - name: RECORDS_DIR
              value: /var/run/slack-roster/workspaces
            - name: INTERVAL
              value: {{ .Values.slackRoster.interval | quote }}
            - name: ENABLED_WORKSPACES
              value: {{ join "," .Values.slackRoster.actsIn | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # The controller records what it did to the audit installation
            # itself, as its own workload, which the writer stamps as the
            # records' observer.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "access-issuer.auditEnv" . | nindent 12 }}
{{- with .Values.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
{{- end }}
          volumeMounts:
            - name: policy
              mountPath: /var/run/slack-roster/policy
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/slack-roster
              readOnly: true
            - name: credentials
              mountPath: /var/run/slack-roster/credentials
              readOnly: true
            - name: workspaces
              mountPath: /var/run/slack-roster/workspaces
              readOnly: true
            {{- include "access-issuer.auditMounts" . | nindent 12 }}
          {{- with .Values.slackRoster.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ include "access-issuer.fullname" . }}-policy
        # The token the console verifies, for the audience it accepts a
        # workload's token for. Rotated by the kubelet; the controller reads
        # the file on every call.
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ include "access-issuer.exchangeAudience" . }}
                  expirationSeconds: 3600
                  path: token
        # One file per connected workspace: the app's credentials and its bot
        # token. Optional: before anything is connected there may be nothing,
        # and the controller reports each declared workspace as not connected
        # rather than failing to start.
        - name: credentials
          secret:
            secretName: {{ include "access-issuer.fullname" . }}-slack-credentials
            optional: true
        # The console's records beside them: each workspace's record, the
        # shared channels' definitions and the operators' confirmations.
        # Optional for the same reason.
        - name: workspaces
          configMap:
            name: {{ include "access-issuer.fullname" . }}-slack-workspaces
            optional: true
        {{- include "access-issuer.auditVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
