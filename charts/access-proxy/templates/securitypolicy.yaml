{{- $e := .Values.exposure -}}
# The gate. Envoy calls the proxy for every request on the route; an
# authenticated one is allowed and its token copied onto the request.
#
# Two postures, and the difference is who decides:
#   groups        — the gateway decides, from a claim in the token.
#   authenticated — any signed-in identity passes and the application
#                   decides. Right where the application resolves roles
#                   from a directory it owns; putting the same decision
#                   here too would be a second copy of it, and this one
#                   would be the stale copy.
{{- range $route := (include "access-proxy.routes" $ | fromYamlArray) }}
{{- $posture := $route.posture | default "groups" }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "access-proxy.policyName" (dict "root" $ "route" $route) }}
  labels:
    {{- include "access-proxy.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $route.attachRouteName | default (include "access-proxy.routeName" (dict "root" $ "route" $route)) }}
  extAuth:
    # Envoy sends the check request to this proxy, and an HTTP ext_authz
    # service is sent ONLY Host, Method, Path, Content-Length and
    # Authorization unless the policy names more. The session cookie is
    # not in that set. Omit this block and the proxy answers every check
    # without ever seeing the cookie it just wrote: sign-in completes,
    # the callback returns a 302 with a Set-Cookie, and the very next
    # request logs "No valid authentication in request. Initiating
    # login." -- an endless loop through a login that works.
    #
    # `cookie` is therefore not a value. The rest carry the scheme and
    # host the proxy builds its redirect from, and the fields its access
    # log would otherwise record as empty.
    headersToExtAuth:
      - cookie
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
      - accept
      - user-agent
      {{- range $.Values.exposure.forward.extraExtAuthHeaders }}
      - {{ . | quote }}
      {{- end }}
    http:
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "access-proxy.fullname" $ }}
          port: {{ $.Values.proxy.port }}
      headersToBackend:
        - x-auth-request-access-token
        - x-auth-request-email
        - x-auth-request-user
        - authorization
{{- if eq $posture "groups" }}
{{- /*
  An empty allow-list renders `values: []` under defaultAction Deny --
  which the CRD accepts and which admits NOBODY. `required` does not catch
  it: it fails on nil and on an empty string, and an empty list is
  neither. So the render refuses here instead of shipping a policy that
  locks everyone out of a console that looks correctly configured.
*/ -}}
{{- if not $route.allow }}
{{- fail (printf "route %q uses the `groups` posture with an empty allow-list: that denies everyone (use posture `authenticated` if the application authorizes itself)" $route.name) }}
{{- end }}
  jwt:
    providers:
      - name: issuer
        issuer: {{ trimSuffix "/" $.Values.issuer.url | quote }}
        remoteJWKS:
          uri: {{ include "access-proxy.jwksUri" $ | quote }}
          # Explicit, matching the CRD default: the API server injects it,
          # and an undeclared default is a permanent ArgoCD OutOfSync.
          cacheDuration: "300s"
        extractFrom:
          headers:
            - name: X-Auth-Request-Access-Token
  authorization:
    # Deny by default: a fresh identity with no grants gets a 403, not the
    # application.
    defaultAction: Deny
    rules:
      - name: groups-allow
        action: Allow
        principal:
          jwt:
            provider: issuer
            claims:
              - name: groups
                valueType: StringArray
                values:
                  {{- range $route.allow }}
                  - {{ . | quote }}
                  {{- end }}
{{- else if ne $posture "authenticated" }}
{{- fail (printf "route %q: posture must be `groups` or `authenticated`, not %q" $route.name $posture) }}
{{- end }}
{{- end }}
