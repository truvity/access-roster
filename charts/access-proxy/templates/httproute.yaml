{{- $e := .Values.exposure -}}
{{- $gw := $e.gateway -}}
# The proxy's own endpoints -- sign_in, start, callback, sign-out -- on the
# console's hostname. Always rendered: they are this chart's, whether or
# not it also routes the console itself.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "access-proxy.fullname" . }}-prefix
  labels:
    {{- include "access-proxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "exposure.gateway.name is required" $gw.name }}
      namespace: {{ required "exposure.gateway.namespace is required" $gw.namespace }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ required "exposure.hostname is required" $e.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $e.proxyPrefix | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "access-proxy.fullname" . }}
          port: {{ .Values.proxy.port }}
{{- range $route := (include "access-proxy.routes" $ | fromYamlArray) }}
{{- if not $route.attachRouteName }}
---
# This route's own HTTPRoute. Rendered only when nothing else owns one: a
# console whose chart already routes itself names that route instead, and
# two charts never both claim the hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "access-proxy.routeName" (dict "root" $ "route" $route) }}
  labels:
    {{- include "access-proxy.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ $e.hostname | quote }}
  rules:
    {{- range ($route.paths | default (list "/")) }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ required (printf "route %q needs backend.name, or attachRouteName to bind to a route that already exists" $route.name) $route.backend.name }}
          port: {{ $route.backend.port | default 8080 }}
    {{- end }}
{{- end }}
{{- end }}
