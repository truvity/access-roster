# directory-roster chart values.
#
# What the chart INCLUDES: everything that is a standard Kubernetes API —
# the Deployment, the two Services (API and console), the ServiceAccount
# and its namespaced Role, the NetworkPolicy, and (with the console slice)
# the Gateway API HTTPRoute for the console host.
#
# What the chart EXPECTS to exist: a Valkey to point at (snapshots and
# locks — never a credential) and the gateway authentication in front of
# the console host. Recommendations for both are in
# docs/reference/configuration.md.

replicaCount: 2

image:
  repository: ghcr.io/truvity/access-roster/directory-roster
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Two listeners, so a consumer can never reach an operator call.
listeners:
  # DirectoryService — consumers over the cluster network.
  api:
    port: 8080
  # WorkspaceService, SettingsService and the SPA — operators through the
  # gateway.
  console:
    port: 8081
  # liveness/readiness only.
  health:
    port: 7070

# The snapshot cache. External to this chart: point at an existing Valkey.
# Empty address = the in-memory backend, for development and a single
# replica only.
valkey:
  address: ""
  # Optional: a Secret holding the password.
  passwordSecret:
    name: ""
    key: password
  tls: false

# Freshness knobs. Operational configuration belongs to the deployment;
# the console shows these read-only.
freshness:
  # how often the background refresher takes a new snapshot per workspace.
  refreshInterval: 15m
  # how old a snapshot may be before its domains stop being authoritative.
  freshnessWindow: 30m
  # how often a workspace's credential is probed and its domains re-read.
  probeInterval: 5m

# The OAuth client for the admin-consent flow. Either name a Secret that
# already holds it (keys: client-id, client-secret) — then the console
# shows it read-only — or leave empty and paste it into Settings once.
oauthClient:
  existingSecret: ""

# Declared (overlay) workspaces: how an existing installation moves without
# a Connect step. Each names a Secret in this namespace holding a
# service-account key with domain-wide delegation (key `key.json`) and the
# admin to impersonate. Domains are discovered from the backend like any
# other workspace's. Declared workspaces are read-only in the console and
# win on conflict.
workspaces: []
#  - backend: google
#    admin: admin@example.com     # the account the key impersonates
#    secretName: example-sa-key   # holds key.json in this namespace
#    # id is optional: the credential opens exactly one tenant and that
#    # tenant knows its own id, so the hub discovers it. Supply it and
#    # adoption becomes a check — a credential that opens a different
#    # tenant is refused rather than quietly reading another company's
#    # directory.
#    id: C0example

# The console's hostname on the gateway, and only the console's. The API
# listener never gets a route: consumers reach it by Service DNS, and a
# consumer that could arrive over the gateway could reach an operator
# call. Empty renders nothing, which is right for a hub reached by
# port-forward.
route:
  host: ""
  gatewayClassName: internal
  certificate:
    # Empty issuerName renders no Certificate, for a gateway that brings
    # its own.
    issuerName: internal-ca
    issuerKind: ClusterIssuer

# Who may call the API listener: ServiceAccounts, verified by TokenReview
# (the one cluster-scoped permission the chart creates, and it reads
# nothing). Consumers mount a projected token with audience `directory-roster`.
# Empty = the API listener accepts no caller (NetworkPolicy is the second
# layer, never the only one).
consumers: []
#  - namespace: identity-system
#    serviceAccount: authorization-webhook

# Access to the console and the operator API.
access:
  # The break-glass account: password generated on first start into the
  # Secret `hub-admin`, shown nowhere else. It is for recovery — nobody in
  # the operators group, the group renamed, directory sign-in broken.
  #
  # Unset, it turns itself on only when this deployment has no other way
  # in: it stays off when the values declare both a workspace and a
  # non-empty `hub-operators`, because that installation can be signed
  # into through the directory from its first boot, and a password nobody
  # needs is a standing credential. Set it explicitly to override.
  admin:
    enabled: null
  login:
    # "Sign in with <directory>" using a connected workspace's OAuth client
    # with openid scopes only. Works as soon as one workspace is connected.
    directory: true
    # An external OIDC issuer for the hub's own login page (optional).
    oidc:
      issuer: ""
      # Secret with keys client-id and client-secret.
      clientSecretName: ""
    # Trust a bearer forwarded by an authenticating gateway in front of the
    # console (oauth2-proxy and the like); the hub verifies it against this
    # issuer. Optional.
    forwardedBearer:
      issuer: ""
  # The hold window: how long a signed-in identity keeps its last granted
  # role while the directory cannot vouch for its membership. Zero means
  # no hold, and an uncertain directory then grants nothing.
  holdWindow: 4h

# The declared layer of the policy (docs/reference/policy.md). The hub
# reads `groups`, `claims`, `lifetimes` and `memberships`; the issuer
# reads `clients` too. Leave it empty and the hub declares only the two
# groups it is a relying party of, with nobody in them — which is where a
# fresh installation starts, and the console attaches the first
# membership.
policy: {}
#  version: 1
#  groups:
#    hub-operators: { members: [directory-admins@example.com] }
#    hub-viewers:   { members: [all@example.com] }
#  claims:
#    hub-operators: { groups: [hub:operator] }
#  lifetimes:
#    default: 12h
#    hub-operators: 4h

# Ingress to the API port is allow-listed by namespace; the console port
# admits only the gateway's namespace. Off by default so a plain
# `helm install` works on a cluster without a CNI that enforces policy.
networkPolicy:
  enabled: false
  # namespaces whose pods may call the API listener.
  apiClients: []
  # the namespace the gateway's proxy runs in.
  gatewayNamespace: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
