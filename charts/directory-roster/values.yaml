# directory-roster chart values.
#
# What the chart INCLUDES: everything that is a standard Kubernetes API —
# the Deployment, the two Services (API and console), the ServiceAccount
# and its namespaced Role, the NetworkPolicy, and (with the console slice)
# the Gateway API HTTPRoute for the console host.
#
# What the chart EXPECTS to exist: a Valkey to point at (snapshots and
# locks — never a credential) and the gateway authentication in front of
# the console host. Recommendations for both are in
# docs/reference/configuration.md.

replicaCount: 2

image:
  repository: ghcr.io/truvity/access-roster/directory-roster
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Two listeners, so a consumer can never reach an operator call.
listeners:
  # DirectoryService — consumers over the cluster network.
  api:
    port: 8080
    # The audience a consumer's projected token must carry. Empty means
    # the release name, so two hubs in one cluster cannot accept each
    # other's callers.
    audience: ""
  # WorkspaceService, SettingsService and the SPA — operators through the
  # gateway.
  console:
    port: 8081
  # liveness/readiness only.
  health:
    port: 7070

# The snapshot cache. External to this chart: point at an existing Valkey.
# Empty address = the in-memory backend, for development and a single
# replica only.
valkey:
  address: ""
  # Optional: a Secret holding the password.
  passwordSecret:
    name: ""
    key: password
  tls: false
  # The fleet's Valkeys are ValkeyClusters even at one shard, so the
  # cluster protocol is the usual answer. A plain single server needs
  # this off; a mismatch is refused at start rather than surfacing later
  # as a puzzling command error.
  cluster: true

# Freshness knobs. Operational configuration belongs to the deployment;
# the console shows these read-only.
freshness:
  # how often the background refresher takes a new snapshot per workspace.
  refreshInterval: 15m
  # how old a snapshot may be before its domains stop being authoritative.
  freshnessWindow: 30m
  # how often a workspace's credential is probed and its domains re-read.
  probeInterval: 5m

# The OAuth client for the admin-consent flow. Either name a Secret that
# already holds it (keys: client-id, client-secret) — then the console
# shows it read-only — or leave empty and paste it into Settings once.
oauthClient:
  existingSecret: ""

# Declared (overlay) workspaces: how an existing installation moves without
# a Connect step. Each names a Secret in this namespace holding a
# service-account key with domain-wide delegation (key `key.json`) and the
# admin to impersonate. Domains are discovered from the backend like any
# other workspace's. Declared workspaces are read-only in the console and
# win on conflict.
workspaces: []
#  - backend: google
#    admin: admin@example.com     # the account the key impersonates
#    secretName: example-sa-key   # a Secret in this namespace
#    # Which key of that Secret holds the JSON. Defaults to key.json;
#    # name it when the Secret already exists and calls it something
#    # else, which is the usual case when an installation is moving an
#    # existing credential rather than minting one.
#    secretKey: key.json
#    # id is optional: the credential opens exactly one tenant and that
#    # tenant knows its own id, so the hub discovers it. Supply it and
#    # adoption becomes a check — a credential that opens a different
#    # tenant is refused rather than quietly reading another company's
#    # directory.
#    id: C0example
#    # serve is optional: which of the tenant's domains this hub answers
#    # for. Omitted, it serves every domain the tenant owns, which is the
#    # ordinary case. Naming a subset is how an installation reads one
#    # domain of a company whose other domains are none of its business:
#    # the rest are discovered and shown, but not routed and not cached.
#    # A domain named here that the tenant does not own routes nothing and
#    # is reported as no longer owned — which is what makes declaring a
#    # domain that is about to move between tenants safe.
#    serve:
#      - example.com

# The console's hostname on the gateway, and only the console's. The API
# listener never gets a route: consumers reach it by Service DNS, and a
# consumer that could arrive over the gateway could reach an operator
# call. Empty renders nothing, which is right for a hub reached by
# port-forward.
route:
  host: ""
  gatewayClassName: internal
  certificate:
    # Empty issuerName renders no Certificate, for a gateway that brings
    # its own.
    issuerName: internal-ca
    issuerKind: ClusterIssuer

# Who may call the API listener: ServiceAccounts, verified by TokenReview
# (the one cluster-scoped permission the chart creates, and it reads
# nothing). Consumers mount a projected token with audience `directory-roster`.
# Empty = the API listener accepts no caller (NetworkPolicy is the second
# layer, never the only one).
consumers: []
#  - namespace: identity-system
#    serviceAccount: authorization-webhook

# Access to the console and the operator API.
access:
  # The way in for the day the ordinary one is broken — nobody in the
  # operators group, the group renamed, directory sign-in itself down.
  #
  # In a cluster it stores nothing. Recovery is proving access to the
  # API server: mint a short-lived token for the ServiceAccount below,
  # with this audience, and present it on the sign-in page. So the
  # authority is the cluster's own RBAC — who may create a token for that
  # account — which is revocable by removing a binding, lands in the
  # cluster's audit log, and names who recovered rather than "admin".
  #
  # It is on by default because it no longer costs a standing credential.
  # Turn it off for an installation whose console must be reachable only
  # through the directory.
  recovery:
    enabled: true
    # Left empty, `<release>-recovery`, created by this chart. Nobody is
    # bound to it: granting `create` on `serviceaccounts/token` for this
    # account is how an installation says who may recover.
    serviceAccountName: ""
    # The audience the token must be minted for. Without one, every
    # mounted ServiceAccount token in the cluster would be a recovery
    # token; empty means `<release>-recovery`.
    audience: ""
  login:
    # "Continue with <directory>" on the hub's own sign-in page, using
    # this installation's OAuth client and asking for openid, email and
    # profile — nothing else. Works as soon as a client is registered.
    #
    # Turn it off for a console reached only through a gateway that has
    # already run the login: one door is easier to reason about than two,
    # and the second one is then answering nobody.
    directory: true
    # Trust an identity forwarded by an authenticating gateway in front of
    # the console (oauth2-proxy and the like). The gateway has already run
    # the login; the hub reads the address out of a header and resolves it
    # through the directory like any other. This is the normal posture for
    # a console behind the fleet's gateway-auth.
    #
    # Only enable it where a gateway really does strip and set the header
    # on every request: a header the hub trusts is an identity anyone who
    # can reach the pod can claim, which is what the NetworkPolicy on the
    # console listener is for.
    forwardedBearer:
      # The header carrying the address. oauth2-proxy's own name for it,
      # which is what the fleet's gateway-auth sets. Empty turns the whole
      # path off.
      emailHeader: ""
      # Recorded on the session so an operator can see where an identity
      # came from. Optional.
      issuer: ""
  # How long a console session lasts before it has to sign in again.
  sessionLifetime: 12h
  # The hold window: how long a signed-in identity keeps its last granted
  # role while the directory cannot vouch for its membership. Zero means
  # no hold, and an uncertain directory then grants nothing.
  holdWindow: 4h

# The declared layer of the policy (docs/reference/policy.md). The hub
# reads `groups`, `claims`, `lifetimes` and `memberships`; the issuer
# reads `clients` too. Leave it empty and the hub declares only the two
# groups it is a relying party of, with nobody in them — which is where a
# fresh installation starts, and the console attaches the first
# membership.
policy: {}
#  version: 1
#  groups:
#    hub-operators: { members: [directory-admins@example.com] }
#    hub-viewers:   { members: [all@example.com] }
#  claims:
#    hub-operators: { groups: [hub:operator] }
#  lifetimes:
#    default: 12h
#    hub-operators: 4h

# Ingress to the API port is allow-listed by namespace; the console port
# admits only the gateway's namespace. Off by default so a plain
# `helm install` works on a cluster without a CNI that enforces policy.
networkPolicy:
  enabled: false
  # namespaces whose pods may call the API listener.
  apiClients: []
  # the namespace the gateway's proxy runs in.
  gatewayNamespace: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []

# debug | info | warn | error.
logLevel: info
