apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "directory-roster.fullname" . }}
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "directory-roster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "directory-roster.selectorLabels" . | nindent 8 }}
      annotations:
        # A policy change is a ROLLOUT, not a reload. The declared layer is
        # read once at start (policy.LoadDeclared), so without this the
        # ConfigMap changes, kubelet updates the file a minute later, and
        # every replica goes on answering from the policy it booted with --
        # a grant an operator can see in git, in the ConfigMap and in
        # ArgoCD's "Synced", and nowhere in the running service. The issuer
        # has carried this since its first release; the hub reads the same
        # file the same way and did not.
        checksum/policy: {{ include (print $.Template.BasePath "/access-configmap.yaml") . | sha256sum }}
        {{- if .Values.consumers }}
        # Who may call, and what they may ask, is read once at start. A
        # narrowed grant that does not restart the pods is one an
        # operator has applied and not applied at the same time.
        checksum/consumers: {{ include (print $.Template.BasePath "/consumers.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "directory-roster.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: directory-roster
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: api
              containerPort: {{ .Values.listeners.api.port }}
            - name: console
              containerPort: {{ .Values.listeners.console.port }}
            - name: health
              containerPort: {{ .Values.listeners.health.port }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The hub keeps what a console changed — connected workspaces
            # and their credentials, the memberships, the OAuth client it
            # was given, the session key — as ConfigMaps and Secrets in
            # this namespace. Anything else and a restart is a fresh
            # installation.
            - name: STORE
              value: kubernetes
            - name: RELEASE_NAME
              value: {{ include "directory-roster.fullname" . }}
            - name: API_PORT
              value: {{ .Values.listeners.api.port | quote }}
            - name: CONSOLE_PORT
              value: {{ .Values.listeners.console.port | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.listeners.health.port | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.freshness.refreshInterval | quote }}
            - name: FRESHNESS_WINDOW
              value: {{ .Values.freshness.freshnessWindow | quote }}
            - name: PROBE_INTERVAL
              value: {{ .Values.freshness.probeInterval | quote }}
            {{- if .Values.valkey.address }}
            - name: VALKEY_ADDRESS
              value: {{ .Values.valkey.address | quote }}
            - name: VALKEY_TLS
              value: {{ .Values.valkey.tls | quote }}
            - name: VALKEY_CLUSTER
              value: {{ .Values.valkey.cluster | quote }}
            {{- if .Values.valkey.passwordSecret.name }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.passwordSecret.name }}
                  key: {{ .Values.valkey.passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.oauthClient.secret }}
            {{- if .name }}
            - name: OAUTH_CLIENT_SECRET_NAME
              value: {{ .name | quote }}
            - name: OAUTH_CLIENT_ID_KEY
              value: {{ .keys.clientId | quote }}
            - name: OAUTH_CLIENT_SECRET_KEY
              value: {{ .keys.clientSecret | quote }}
            {{- end }}
            {{- end }}
            - name: RECOVERY_ENABLED
              value: {{ .Values.access.recovery.enabled | quote }}
            {{- if .Values.access.recovery.enabled }}
            - name: RECOVERY_SERVICE_ACCOUNT
              value: {{ include "directory-roster.recoveryServiceAccountName" . | quote }}
            - name: RECOVERY_AUDIENCE
              value: {{ include "directory-roster.recoveryAudience" . | quote }}
            {{- end }}
            # Where a browser reaches this console. Everything that has
            # to name itself to somebody else is built from it: both
            # OAuth redirect URIs, and the values the setup steps tell an
            # operator to paste into a cloud console. Unset, it falls
            # back to localhost — which is right for a workstation and
            # silently wrong everywhere else, because the redirect would
            # be registered against a hostname no browser will reach.
            {{- if .Values.route.host }}
            # route.pathPrefix (INF-687) carries through: the console
            # shares its issuer's hostname under a path, the gateway
            # rewrites the prefix away before this hub sees the request,
            # and PUBLIC_URL has to carry it anyway because it is what
            # a browser types, not what the hub receives.
            - name: PUBLIC_URL
              value: https://{{ .Values.route.host }}{{ .Values.route.pathPrefix }}
            {{- if .Values.route.pathPrefix }}
            # The bootstrap surface (route.bootstrapPaths: /login,
            # /connect) is deliberately never moved under pathPrefix --
            # its registered OAuth redirect URIs are at the domain root,
            # on their own HTTPRoute. PUBLIC_ROOT_URL is that root, for
            # the admin-consent callback and this hub's own /login, so
            # the setup steps print a URI a provider actually redirects
            # to. Only emitted once a prefix makes it differ from
            # PUBLIC_URL; the console falls back to PUBLIC_URL otherwise.
            - name: PUBLIC_ROOT_URL
              value: https://{{ .Values.route.host }}
            {{- end }}
            # Served over TLS, so its cookies say so. Stated rather
            # than left to the binary's default, which reads the same
            # scheme off the public root url above: a chart that says it
            # out loud is a chart a reader can check against the route.
            - name: SECURE_COOKIES
              value: "true"
            {{- end }}
            - name: LOGIN_DIRECTORY
              value: {{ .Values.access.login.directory | quote }}
            {{- with include "directory-roster.signOutURL" . }}
            - name: SIGN_OUT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.access.login.forwardedBearer }}
            {{- if .issuer }}
            - name: FORWARDED_ISSUER
              value: {{ .issuer | quote }}
            {{- /* An issuer without an audience accepts every token that
                   issuer mints -- for every other service it serves. The
                   render refuses rather than the pod: a console reachable
                   with a token meant for something else is not a thing to
                   discover from its logs. */}}
            - name: FORWARDED_AUDIENCE
              value: {{ required "access.login.forwardedBearer.audience is required when issuer is set: without it any token this issuer mints, for any service, is accepted here" .audience | quote }}
            {{- end }}
            {{- if .emailHeader }}
            - name: FORWARDED_EMAIL_HEADER
              value: {{ .emailHeader | quote }}
            {{- end }}
            {{- end }}
            - name: SESSION_LIFETIME
              value: {{ .Values.access.sessionLifetime | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Who may call the API listener. Empty admits nobody: a hub
            # that answered everyone by default would be one forgotten
            # value away from serving a company's directory to the
            # cluster. The NetworkPolicy is the second layer, never the
            # only one.
            - name: API_AUDIENCE
              value: {{ include "directory-roster.apiAudience" . }}
            {{- if .Values.consumers }}
            # The mounted file, not API_CONSUMERS: only a file can carry
            # a per-consumer grant (INF-679), and two sources for who may
            # call would be one place to add a consumer and another place
            # to forget to. API_CONSUMERS is still read when no file is
            # mounted, for a hub configured by environment alone.
            - name: CONSUMERS_FILE
              value: /var/run/directory-roster/consumers.yaml
            {{- end }}
            - name: POLICY_DIR
              value: /var/run/directory-roster/policy
            - name: HOLD_WINDOW
              value: {{ .Values.access.holdWindow | quote }}
            {{- if .Values.workspaces }}
            - name: OVERLAY_FILE
              value: /var/run/directory-roster/overlay.yaml
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            # Readiness follows the shared store; liveness deliberately
            # does not. A replica that cannot reach it leaves the
            # rotation, and the gateway answers fast instead of hanging;
            # nothing is restarted, so one blip cannot restart the fleet.
            #
            # timeoutSeconds exceeds the service's own 2s check so the
            # answer is the reason ("the session store does not answer:
            # i/o timeout") rather than the kubelet's timeout. Three
            # failures at ten seconds is thirty seconds of trouble before
            # a replica leaves, which a reconnect comfortably beats.
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: policy
              mountPath: /var/run/directory-roster/policy
              readOnly: true
            {{- if .Values.consumers }}
            - name: consumers
              mountPath: /var/run/directory-roster/consumers.yaml
              subPath: consumers.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.workspaces }}
            - name: overlay
              mountPath: /var/run/directory-roster/overlay.yaml
              subPath: overlay.yaml
              readOnly: true
            {{- range .Values.workspaces }}
            - name: key-{{ .secretName }}
              mountPath: /var/run/directory-roster/keys/{{ .secretName }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy
          configMap:
            name: {{ include "directory-roster.fullname" . }}-policy
            items:
              - key: policy.yaml
                path: policy.yaml
        {{- if .Values.consumers }}
        - name: consumers
          configMap:
            name: {{ include "directory-roster.fullname" . }}-consumers
        {{- end }}
        {{- if .Values.workspaces }}
        - name: overlay
          configMap:
            name: {{ include "directory-roster.fullname" . }}-overlay
        {{- range .Values.workspaces }}
        - name: key-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
