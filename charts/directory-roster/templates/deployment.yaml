apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "directory-roster.fullname" . }}
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "directory-roster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "directory-roster.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "directory-roster.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: directory-roster
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: api
              containerPort: {{ .Values.listeners.api.port }}
            - name: console
              containerPort: {{ .Values.listeners.console.port }}
            - name: health
              containerPort: {{ .Values.listeners.health.port }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The hub keeps what a console changed — connected workspaces
            # and their credentials, the memberships, the OAuth client it
            # was given, the session key — as ConfigMaps and Secrets in
            # this namespace. Anything else and a restart is a fresh
            # installation.
            - name: STORE
              value: kubernetes
            - name: RELEASE_NAME
              value: {{ include "directory-roster.fullname" . }}
            - name: API_PORT
              value: {{ .Values.listeners.api.port | quote }}
            - name: CONSOLE_PORT
              value: {{ .Values.listeners.console.port | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.listeners.health.port | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.freshness.refreshInterval | quote }}
            - name: FRESHNESS_WINDOW
              value: {{ .Values.freshness.freshnessWindow | quote }}
            - name: PROBE_INTERVAL
              value: {{ .Values.freshness.probeInterval | quote }}
            {{- if .Values.valkey.address }}
            - name: VALKEY_ADDRESS
              value: {{ .Values.valkey.address | quote }}
            - name: VALKEY_TLS
              value: {{ .Values.valkey.tls | quote }}
            - name: VALKEY_CLUSTER
              value: {{ .Values.valkey.cluster | quote }}
            {{- if .Values.valkey.passwordSecret.name }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.valkey.passwordSecret.name }}
                  key: {{ .Values.valkey.passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- if .Values.oauthClient.existingSecret }}
            - name: OAUTH_CLIENT_SECRET_NAME
              value: {{ .Values.oauthClient.existingSecret | quote }}
            {{- end }}
            - name: RECOVERY_ENABLED
              value: {{ .Values.access.recovery.enabled | quote }}
            {{- if .Values.access.recovery.enabled }}
            - name: RECOVERY_SERVICE_ACCOUNT
              value: {{ include "directory-roster.recoveryServiceAccountName" . | quote }}
            - name: RECOVERY_AUDIENCE
              value: {{ include "directory-roster.recoveryAudience" . | quote }}
            {{- end }}
            # Where a browser reaches this console. Everything that has
            # to name itself to somebody else is built from it: both
            # OAuth redirect URIs, and the values the setup steps tell an
            # operator to paste into a cloud console. Unset, it falls
            # back to localhost — which is right for a workstation and
            # silently wrong everywhere else, because the redirect would
            # be registered against a hostname no browser will reach.
            {{- if .Values.route.host }}
            - name: PUBLIC_URL
              value: https://{{ .Values.route.host }}
            # The console is served over TLS, so its cookies say so.
            - name: SECURE_COOKIES
              value: "true"
            {{- end }}
            {{- if .Values.access.login.forwardedBearer.emailHeader }}
            - name: FORWARDED_EMAIL_HEADER
              value: {{ .Values.access.login.forwardedBearer.emailHeader | quote }}
            - name: FORWARDED_ISSUER
              value: {{ .Values.access.login.forwardedBearer.issuer | quote }}
            {{- end }}
            - name: SESSION_LIFETIME
              value: {{ .Values.access.sessionLifetime | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Who may call the API listener. Empty admits nobody: a hub
            # that answered everyone by default would be one forgotten
            # value away from serving a company's directory to the
            # cluster. The NetworkPolicy is the second layer, never the
            # only one.
            - name: API_AUDIENCE
              value: {{ include "directory-roster.apiAudience" . }}
            {{- if .Values.consumers }}
            - name: API_CONSUMERS
              value: {{ include "directory-roster.apiConsumers" . | quote }}
            {{- end }}
            - name: POLICY_DIR
              value: /var/run/directory-roster/policy
            - name: HOLD_WINDOW
              value: {{ .Values.access.holdWindow | quote }}
            {{- if .Values.workspaces }}
            - name: OVERLAY_FILE
              value: /var/run/directory-roster/overlay.yaml
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: policy
              mountPath: /var/run/directory-roster/policy
              readOnly: true
            {{- if .Values.workspaces }}
            - name: overlay
              mountPath: /var/run/directory-roster/overlay.yaml
              subPath: overlay.yaml
              readOnly: true
            {{- range .Values.workspaces }}
            - name: key-{{ .secretName }}
              mountPath: /var/run/directory-roster/keys/{{ .secretName }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy
          configMap:
            name: {{ include "directory-roster.fullname" . }}-policy
            items:
              - key: policy.yaml
                path: policy.yaml
        {{- if .Values.workspaces }}
        - name: overlay
          configMap:
            name: {{ include "directory-roster.fullname" . }}-overlay
        {{- range .Values.workspaces }}
        - name: key-{{ .secretName }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
