# The declared layer of the policy plus the console's own settings. Read
# by the hub at start and on change; the console layer lives in the
# hub-written ConfigMap `hub-memberships` and never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "directory-roster.fullname" . }}-policy
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- if .Values.policy }}
    {{- toYaml .Values.policy | nindent 4 }}
    {{- else }}
    version: 1
    groups:
      hub-operators: {}
      hub-viewers: {}
    claims:
      hub-operators: { groups: [hub:operator] }
      hub-viewers: { groups: [hub:viewer] }
    lifetimes:
      default: 12h
    {{- end }}
  access.yaml: |
    admin:
      enabled: {{ include "directory-roster.adminEnabled" . }}
    holdWindow: {{ .Values.access.holdWindow | quote }}
    login:
      directory: {{ .Values.access.login.directory }}
      {{- if .Values.access.login.oidc.issuer }}
      oidc:
        issuer: {{ .Values.access.login.oidc.issuer | quote }}
        clientSecretName: {{ .Values.access.login.oidc.clientSecretName | quote }}
      {{- end }}
      {{- if .Values.access.login.forwardedBearer.issuer }}
      forwardedBearer:
        issuer: {{ .Values.access.login.forwardedBearer.issuer | quote }}
      {{- end }}
    consumers:
    {{- range .Values.consumers }}
      - namespace: {{ .namespace | quote }}
        serviceAccount: {{ .serviceAccount | quote }}
    {{- end }}
