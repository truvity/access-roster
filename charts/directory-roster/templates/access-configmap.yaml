# The declared layer of the policy plus the console's own settings. Read
# by the hub at start and on change; the console layer lives in the
# hub-written ConfigMap `<release>-memberships` and never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "directory-roster.fullname" . }}-policy
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- if .Values.policy }}
    {{- toYaml .Values.policy | nindent 4 }}
    {{- else }}
    version: 1
    groups:
      hub-operators: {}
      hub-viewers: {}
    claims:
      hub-operators: { groups: [hub:operator] }
      hub-viewers: { groups: [hub:viewer] }
    lifetimes:
      default: 12h
    {{- end }}
