# The declared layer of the policy plus the console's own settings. Read
# by the hub at start and on change; the console layer lives in the
# hub-written ConfigMap `<release>-memberships` and never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "directory-roster.fullname" . }}-policy
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
data:
  policy.yaml: |
    # The version belongs to the chart, not to the values. The loader
    # refuses a document whose version it does not know, so a policy
    # written without one is a hub that will not start — which is exactly
    # what happened the first time this chart was installed anywhere.
    version: 1
    {{- if .Values.policy }}
    {{- toYaml (omit .Values.policy "version") | nindent 4 }}
    {{- else }}
    groups:
      hub-operators: {}
      hub-viewers: {}
    claims:
      hub-operators: { groups: [hub:operator] }
      hub-viewers: { groups: [hub:viewer] }
    lifetimes:
      default: 12h
    {{- end }}
