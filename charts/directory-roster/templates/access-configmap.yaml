# The declared layer of the policy plus allowed consumers. Read by the hub
# at start and on change; the console layer lives in the hub-written
# ConfigMap `hub-memberships` and never here. The `rules:` key below is the
# pre-policy shape and is replaced by the five policy tables in the
# prototype's next step (docs/reference/policy.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "directory-roster.fullname" . }}-access
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
data:
  access.yaml: |
    admin:
      enabled: {{ .Values.access.admin.enabled }}
    login:
      directory: {{ .Values.access.login.directory }}
      {{- if .Values.access.login.oidc.issuer }}
      oidc:
        issuer: {{ .Values.access.login.oidc.issuer | quote }}
        clientSecretName: {{ .Values.access.login.oidc.clientSecretName | quote }}
      {{- end }}
      {{- if .Values.access.login.forwardedBearer.issuer }}
      forwardedBearer:
        issuer: {{ .Values.access.login.forwardedBearer.issuer | quote }}
      {{- end }}
    consumers:
    {{- range .Values.consumers }}
      - namespace: {{ .namespace | quote }}
        serviceAccount: {{ .serviceAccount | quote }}
    {{- end }}
    rules:
    {{- range .Values.access.rules }}
      - {{ toJson . }}
    {{- end }}
