{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "directory-roster.serviceAccountName" . }}
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.access.recovery.enabled }}
---
# The account recovery proves access as. It runs nothing and is bound to
# nothing: its only purpose is to be an identity the API server will mint
# a short-lived token for, so that "who may recover this hub" is an RBAC
# question with an answer in the cluster's audit log.
#
# Nobody may use it until somebody is granted `create` on
# `serviceaccounts/token` for this name — cluster administrators have it
# already, which is the intended default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "directory-roster.recoveryServiceAccountName" . }}
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
