{{- /*
The declared consumers of the API listener, with their grants (INF-679).

A list of subjects fits in an environment variable; a grant does not, and
squeezing one in would produce a syntax nobody can read in a Deployment.
So a hub that scopes its consumers mounts a file, exactly as it already
mounts the policy and the workspace overlay.

Rendered whenever any consumer is declared, not only when one is scoped:
the file REPLACES the environment list rather than adding to it, and two
sources for who may call would be one place to add a consumer and another
place to forget to.
*/ -}}
{{- if .Values.consumers }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "directory-roster.fullname" . }}-consumers
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
data:
  consumers.yaml: |
    consumers:
    {{- range .Values.consumers }}
      - namespace: {{ .namespace }}
        serviceAccount: {{ .serviceAccount }}
      {{- with .workspaces }}
        workspaces:
        {{- range . }}
          - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .domains }}
        domains:
        {{- range . }}
          - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .groups }}
        groups:
        {{- range . }}
          - {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- with .reads }}
        reads:
        {{- range . }}
          - {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
