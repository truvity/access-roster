{{- if .Values.route.host }}
{{- /*
  The console's hostname, and only the console's. The API listener never
  gets a route: consumers reach it by Service DNS inside the cluster, and
  a consumer that could arrive over the gateway could reach an operator
  call, which is the one thing the two listeners exist to prevent.

  Rendered only when a host is set. A hub reached by port-forward needs no
  route, and a hostname that resolves nowhere is worse than none at all.
*/}}
{{- if .Values.route.certificate.issuerName }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "directory-roster.fullname" . }}-tls
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
spec:
  secretName: {{ include "directory-roster.fullname" . }}-tls
  dnsNames:
    - {{ .Values.route.host | quote }}
  issuerRef:
    name: {{ .Values.route.certificate.issuerName | quote }}
    kind: {{ .Values.route.certificate.issuerKind | quote }}
    group: cert-manager.io
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "directory-roster.fullname" . }}
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.route.gatewayClassName | quote }}
  listeners:
    - name: console
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.route.host | quote }}
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
            {{- /* `group: ""` is the API server's default, and writing it
                   out is the same lesson as the path match below: a field
                   the cluster adds and the manifest omits is permanent
                   OutOfSync for whatever compares the two. */}}
          - group: ""
            kind: Secret
            name: {{ include "directory-roster.fullname" . }}-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "directory-roster.fullname" . }}
  labels:
    {{- include "directory-roster.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "directory-roster.fullname" . }}
      sectionName: console
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
      {{- /* The path match is written out although it is also the API
             server's default. A rule without one comes back from the
             cluster WITH one, and a GitOps controller comparing desired
             to live then sees a field it never sent: permanently
             OutOfSync, on an object that is in fact correct -- and, in an
             app-of-apps, one that never goes healthy and gates every wave
             behind it. */}}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "directory-roster.fullname" . }}-console
          port: {{ .Values.listeners.console.port }}
          weight: 1
{{- with .Values.route.bootstrapPaths }}
---
# The bootstrap surface, on its own HTTPRoute so that a gateway policy
# attached to the route above does not cover it.
#
# Without this a console behind an authenticating gateway cannot be
# bootstrapped from a browser at all. The operator who connects the FIRST
# directory is, by definition, one no directory can vouch for yet -- so
# the gateway sends them away to prove themselves against the thing that
# does not exist. And the consent they start comes back to a callback the
# gateway swallows, which reads as a second login prompt rather than as a
# refusal.
#
# The corollary, which cost a live 403: a request on THIS route carries no
# gateway identity, by design. The consent callback therefore takes its
# operator from the signed state instead -- established at the start of
# the flow, on a request the gateway did authenticate.
#
# Longer path prefixes win in the Gateway API, so these take precedence
# over the `/` the main route matches.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "directory-roster.fullname" $ }}-bootstrap
  labels:
    {{- include "directory-roster.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "directory-roster.fullname" $ }}
      sectionName: console
  hostnames:
    - {{ $.Values.route.host | quote }}
  rules:
    - matches:
        {{- range . }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "directory-roster.fullname" $ }}-console
          port: {{ $.Values.listeners.console.port }}
          weight: 1
{{- end }}
{{- end }}
