# Release: two images (access-roster and the resource-proxy sidecar) and
# their binaries, from one tag.
#
# The tag is the sole version authority. The chart's own version field is
# a placeholder the release workflow stamps, and this file stamps the
# same tag into the binaries, so a console, an image label and a chart
# never disagree about which build is running.
project_name: access-roster

version: 2

# The console is BUILT here, not committed. `frontend/dist` is embedded
# by the Go binary, and goreleaser runs `go build` directly rather than
# through the Justfile, so without this the release would compile
# against whatever happened to be on disk -- or fail outright on a clean
# checkout with `pattern all:dist: no matching files found`, which is
# the honest failure and still not one to discover at release time.
before:
  hooks:
    # `just console`, NOT the npm commands written out again. The console
    # imports @truvity/access-roster as file:../ts and resolves it
    # through ts/dist, so ts has to be built first -- an ordering the
    # Justfile already declares. Restating it here got it wrong on the
    # first release after the bundles left git: the hook built the
    # console against a package that was not there yet, and goreleaser
    # failed on `Cannot find module '@truvity/access-roster'`.
    #
    # One definition of the order, in the place that already had it.
    - just console

builds:
  # One binary, three jobs: `serve` is the service (issuer, console and hub),
  # `controller github` and `controller slack` are the two controllers, and
  # `migrate` is reserved for 0031. One image, one archive entry, one
  # version: a service and a controller from two releases cannot run
  # together by accident.
  - id: access-roster
    main: ./cmd/access-roster
    binary: access-roster
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/access-roster/internal/version.Version={{.Version}}

  # The resource-server sidecar: verifies an access-roster token in front
  # of a service that knows nothing about access-roster, and gives that
  # service an identity of its own for what it calls. Its own image,
  # because it runs beside somebody else's container and not in a pod
  # of ours.
  - id: resource-proxy
    main: ./cmd/resource-proxy
    binary: resource-proxy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/access-roster/internal/version.Version={{.Version}}

  # Not an image either, and for a stronger reason than the one below:
  # this opens a browser and writes into somebody's own kubeconfig and
  # AWS configuration. A container would have neither.
  #
  # Windows is built because a laptop is a laptop. The credential
  # helpers are what the AWS SDKs and kubectl run, and both exist there.
  - id: accessctl
    main: ./cmd/accessctl
    binary: accessctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/access-roster/internal/version.Version={{.Version}}

  # Not an image: it is run by a person against a cluster they chose, and
  # a container that needs a kubeconfig and a namespace argument is a
  # worse way to hand somebody a command than a binary is.
  - id: acceptance
    main: ./cmd/acceptance
    binary: access-roster-acceptance
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/truvity/access-roster/internal/version.Version={{.Version}}

  # The Lambda extension layer: a runtime-agnostic binary that Lambda runs
  # from /opt/extensions, so the ARCHIVE must hold it at exactly
  # extensions/access-roster-otlp (the file name is the extension's name).
  # Linux only, both Lambda architectures. Not an image and not in the
  # `binaries` archive: it is the zip a layer version is published from.
  - id: access-roster-lambda
    main: ./cmd/access-roster-lambda
    binary: extensions/access-roster-otlp
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/truvity/access-roster/internal/version.Version={{.Version}}

archives:
  # TWO archives, because accessctl is the only thing built for Windows.
  # In one archive that makes the Windows download hold a single binary
  # where every other holds four, and goreleaser refuses the mix rather
  # than publishing a set that is different depending on the platform.
  # It is also the download somebody actually wants on their own laptop,
  # so it is better on its own with a name that says what it is.
  - id: accessctl
    ids: [accessctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "accessctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The service and the acceptance runner: what an operator pulls to run
  # a build outside a container.
  - id: binaries
    ids: [access-roster, resource-proxy, acceptance]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # The Lambda layer, one zip per architecture (a layer version lists its
  # compatible architectures, and the binary is arch-specific). The zip root
  # is the layer root: extensions/access-roster-otlp. amd64 is Lambda's
  # x86_64.
  - id: lambda-layer
    ids: [access-roster-lambda]
    formats: [zip]
    wrap_in_directory: false
    # Nothing but the extension: the zip root IS /opt in the function, and a
    # README or LICENSE there is clutter in somebody else's layer.
    files: ["none*"]
    name_template: "access-roster-lambda-layer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

kos:
  # base_import_paths appends the cmd directory's basename, so with the
  # caller's ko-docker-repo ghcr.io/truvity/access-roster the published
  # slug nests as access-roster/access-roster.
  #
  # One image for the whole product: the service and both controllers are
  # subcommands of the one binary, and the chart runs each with its own
  # arguments. (access-issuer, github-roster and slack-roster were three
  # images until 0032; they are no longer published.)
  - id: access-roster
    build: access-roster
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: access-roster
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/access-roster

  # The resource-server sidecar's image. No chart of ours renders it: a
  # consumer's chart names it beside the stock container it fronts, pinned
  # by digest.
  - id: resource-proxy
    build: resource-proxy
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: resource-proxy
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/access-roster

release:
  github:
    owner: truvity
    name: access-roster
  header: |
    ## access-roster {{ .Tag }}

    | | |
    |---|---|
    | Image | `ghcr.io/truvity/access-roster/access-roster:{{ .Version }}` |
    | Sidecar image | `ghcr.io/truvity/access-roster/resource-proxy:{{ .Version }}` |
    | Chart | `oci://ghcr.io/truvity/charts/access-roster:{{ .Version }}` |
    | TypeScript | `@truvity/access-roster@{{ .Version }}` on GitHub Packages |
    | Go | `go get github.com/truvity/access-roster@{{ .Tag }}` |

    The TypeScript package is published to GitHub Packages at this
    version; installing it needs a token that can read packages
    (`docs/reference/typescript.md`). The Go module at
    this tag is the policy engine, `identity` and `tokens`; `authz` and
    `directory` are not built yet, and `docs/reference/go-module.md` says
    so.

    DEPRECATED: the Lambda extension layer `access-roster-lambda-layer_{{ .Version }}_linux_{{ "{amd64,arm64}" }}.zip`
    is built for one more release and then dropped; the extension now
    lives in truvity/observability and ships there as
    `otlp-lambda-layer_<version>_linux_<arch>.zip`
    (`docs/integrations/aws-lambda.md`).

    `accessctl` is its own archive, because it is the one thing here that
    runs on somebody's own laptop.

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
