version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/truvity/sluis/v2/gen/go
plugins:
  # protoc-gen-go comes from devbox.
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  # protoc-gen-connect-go runs as a Go tool, so its version is the one go.mod pins.
  - local: [go, tool, protoc-gen-connect-go]
    out: gen/go
    opt: paths=source_relative
