# The release (ADR 0013): a tag v2.*.* published by the maintainer. The tag is the maintainer's; this workflow never makes
# one. It PROMOTES a release candidate (candidate.yaml): it builds nothing, and it publishes the bytes that the candidate's run built
# and installed as packages on three systems and both architectures, only after the gate has found the tagged commit on main with a
# green CI run on main (REQ-SUPPLY-032) and a green candidate run for it (REQ-SUPPLY-048). What it publishes: archives with
# checksums and SPDX SBOMs, the .deb and .rpm packages with their sums, the evidence of the install, the images on
# ghcr.io/truvity/sluis, and release-images.txt, as a GitHub pre-release that stays a draft until every check of the recipe has
# passed. Nothing is signed (owner decision, 2026-11-07: signing waits for the GPG part); the tag is signed by the maintainer by hand.
# A pull request never runs this workflow (it has no pull_request trigger, and no job here has an id-token permission); checks.yaml
# rehearses the candidate (candidate.yaml) and the publishing half (`just release-rehearsal`) on every pull request that can affect them.
#
# Two jobs. `gate` refuses a tag that is not a release tag, a commit that is not on main, one whose CI run on main is not green, and
# one without a green candidate, and finds the run of that candidate. `release` has the write permissions and runs this repository's own
# steps and tools/release, whose only third-party Go module is go.yaml.in/yaml/v3 (a test holds that), plus system tools (setup-devbox and its Nix packages, docker and BuildKit, gh,
# jq, syft): it never builds and it generates nothing. No step here runs dependency build code (build scripts and macros; the candidate's build did, in the
# candidate's run, with no write permission and no token), so the artifacts it downloads are trusted for nothing but their hashes:
# tools/release check-dist holds the archives to the configuration, check-candidate holds every file to publish to the digests of the
# candidate's evidence, and check-packages holds the packages to the plan of the tagged tree. The write token is in the steps of the
# job `release` and in no other job. No checkout in any job persists a credential (a test holds that too).
#
# The audit catalogue (audit-catalogue.yaml, REQ-AUDIT-147) is made in the candidate's build, because making it runs the generator's
# modules, and `release` does not trust the file: tools/release check-catalogue requires it to name the version, to list exactly the
# actions of the action table of the tagged tree and to hold, as JSON, exactly the committed schemas of the tagged tree. The
# committed schemas are what the job `code` of the gate's green run holds equal to the generator's output (just audit-check). That
# binds the file to the tree with no dependency build code in the privileged job.
#
# The gate is in this file, and GitHub runs the file of the tagged commit, so it cannot stop a tag on a branch whose copy of the
# workflow has no gate. What stops that is a tag ruleset on `v2.*` that only the owner can create and nobody can update or delete
# (a prerequisite of the first tag; there is no `environment: release`).
#
# docs/distribution/packages.md, "Releasing", says what to do before and after a tag.
name: Release

on:
  push:
    tags: ['v2.*.*']

# No permission at workflow level (REQ-SUPPLY-033): each job asks for its own (REQ-SUPPLY-041).
permissions: {}

# One release at a time, and a release is never cancelled by another.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Refuses what is not a release tag and what is not on a green main (REQ-SUPPLY-032).
  gate:
    name: gate (a release tag, on main, green)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_run: ${{ steps.candidate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the tag names, whatever the ref is when the run starts, and the history of main to know it is an ancestor.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$REF_TYPE" = tag ] || { echo "gate: refused: the ref is a $REF_TYPE, not a tag" >&2; exit 1; }
          [[ "$TAG" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.(0|[1-9][0-9]*))?$ ]] ||
            { echo "gate: refused: $TAG is not a release tag (v2.<minor>.<patch>, or v2.0.0-alpha.<n>)" >&2; exit 1; }
      - name: The gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/gate.sh "$GITHUB_SHA"
      # The run of candidate.yaml, from a push to main, that built and installed this commit: green, and still holding its artifacts.
      # What they hold is checked by the job `release`, by hash; this only finds the run.
      - name: The candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(tools/release/candidate-run.sh "$GITHUB_SHA")
          echo "run=$run" >>"$GITHUB_OUTPUT"

  # The one job that can change what users install: it holds the only write permissions of this workflow. It builds nothing.
  # It publishes in two stages with the record of the pushes between them (see the steps), so that running a failed job again can
  # keep the tags this run pushed and refuse any other (REQ-SUPPLY-037).
  release:
    name: release (publish, check, make public)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      # Reads the artifacts of this run: the digests that its earlier attempts recorded (a re-run keeps a tag only if they name it).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The files of the candidate, from the run that the gate found: nothing is built here. They are held to the evidence of that run
      # by the recipe (check-candidate), before anything is pushed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/release
          run-id: ${{ needs.gate.outputs.candidate_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/packages
          run-id: ${{ needs.gate.outputs.candidate_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: dist/candidate
          run-id: ${{ needs.gate.outputs.candidate_run }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      # The tree is a trust anchor of the release: check-catalogue reads the action table and the committed schemas from it. Nothing
      # that the download did may have changed a tracked file (dist/ is ignored by git).
      - name: The tree is as the tag has it
        run: git diff --quiet HEAD
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Two stages of `just release-publish`, with the record of the pushes between them. `push` appends the digest of every image to
      # dist/pushed.txt as soon as it is pushed. The record is uploaded whether the stage passed or not, so that running a failed job
      # again can tell the tags this run pushed from the tags that someone else did: that is a shell conditional and not an `if` of
      # the workflow, which a test forbids on any step, and the step after the upload stops the job if the push failed.
      - name: Push the images
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if devbox run -- just release-publish push; then echo "result=pushed" >> "$GITHUB_OUTPUT"; else echo "result=failed" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per attempt of the run: an artifact name is unique within a run.
          name: pushed-digests-${{ github.run_attempt }}
          # An artifact of that name that already exists (a step of this run that holds the runtime token could have made one; no step of the tag run runs dependency build code) fails the
          # upload and the job; the push stage also refuses it before it pushes anything.
          overwrite: false
          if-no-files-found: ignore
          retention-days: 7
          path: dist/pushed.txt
      - name: Stop if the push failed
        env:
          RESULT: ${{ steps.push.outputs.result }}
        run: '[ "$RESULT" = pushed ] || { echo "release: the push stage failed; its record is uploaded, and running the job again continues from it" >&2; exit 1; }'
      - name: Finish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: devbox run -- just release-publish finish
