# Tag-triggered release: binaries, the service image (ko) and the helm
# chart, all to GHCR — the shared implementation.
#
# The hand-rolled copy this replaces was one of NINE identical ones
# across the public estate, and the shared workflow it now calls had sat
# in ci-workflows with zero callers. That gap is not theoretical: one
# repository's release workflows drifted out of sync with the tool they
# invoked and nobody noticed until a tag was cut months later, because release
# machinery is exercised only by a tag.
#
# The caller must grant the permissions below — a reusable workflow can
# narrow them but never widen them, which is also why the private (ECR)
# half is a separate workflow rather than a flag on this one: its
# callers grant id-token, not packages.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@a8309f9a4de4cb58306ec4384d31ec6985007f7b # v3.1.2
    with:
      # Charts are published by this workflow, NOT by goreleaser, so this
      # list is a second place the set of shipped artifacts is written
      # down -- and it kept `directory-roster` after the chart was
      # deleted, which failed the release on `copy chart: lstat
      # charts/directory-roster: no such file or directory`.
      charts: '["access-issuer"]'
      # Nest the images under the repo namespace:
      # ko names each artifact after its cmd dir, so the published slug
      # is ghcr.io/truvity/access-roster/access-issuer.
      ko-docker-repo: ghcr.io/truvity/access-roster
      # accessctl as a Nix flake: the release carries
      # accessctl_<version>_nix-flake.tar.gz, which another repository's
      # devbox installs by URL, instead of a hand-downloaded binary.
      nix-flakes: '["accessctl"]'

  # The TypeScript package, to GitHub Packages, at the tag's version.
  #
  # Built here rather than on install. A git dependency builds itself
  # through `prepare`, and a package manager is free to pack it without
  # running that: yarn 4 did, and a consumer received a package with no ts/dist
  # at all. A registry holds exactly what was built and tested, once.
  #
  # After the binaries, image and charts: a release whose artifacts
  # failed should not leave a package claiming its version.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # A pinned Node, not whatever the
          # runner image carries today.
          node-version: 24.21.0
          registry-url: https://npm.pkg.github.com
          scope: "@truvity"
      - name: Build, test and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd ts && npm ci && npx tsc --noEmit && npx vitest run && npx tsc -p tsconfig.build.json)
          # The repository's version is the tag; package.json carries none.
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm publish
