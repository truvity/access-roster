# Judges pull requests to the sluis.id website: description lint, a strict build,
# a link check, the workflows themselves, the v1 build under /v1/, and the
# repository rules (`just check-rules`). It never publishes (site.yaml does), and
# it is not path-filtered, so it can be made a required check on `main`.
name: Checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request run cancels the run it supersedes. A push to main never cancels, and never shares a group with the
# commit before it: a group keeps one running and one pending run and drops an older pending one even without
# cancel-in-progress, so the group of a push is its own commit. A release gate needs a finished, green run on the
# commit it publishes (REQ-SUPPLY-031).
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: site (lint, strict build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      # PUBLIC_CONTENT_DENYLIST is a repository secret: the private names that must never appear
      # here. The requirements lint checks the catalogue against it; a pull request from a fork
      # gets no secrets, and the lint then skips that part and says so.
      - run: devbox run -- just site-check
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}

  v1:
    name: v1 under /v1/
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      # The tag the Site workflow publishes under /v1/ (site/scripts/latest-v1-tag.sh).
      - name: Find the newest stable v1 tag
        id: v1
        run: |
          set -euo pipefail
          read -r tag commit < <(site/scripts/latest-v1-tag.sh "https://github.com/$GITHUB_REPOSITORY")
          echo "v1 documentation: $tag ($commit)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v1.outputs.tag }}
          path: v1-src
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- just site-build
      - run: devbox run -- site/scripts/build-v1.sh v1-src site/dist
      - run: devbox run -- site/scripts/check-built.sh site/dist

  # The Cloudflare Workers build (ADR 0014): what the deploy job of site.yaml builds, minus
  # the deploy. The strict build for the Worker, v1 under /v1/, the headers and redirects
  # checks, and `wrangler deploy --dry-run` with a fake KV id. No Cloudflare credential.
  workers:
    name: workers (build, headers, dry-run deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Find the newest stable v1 tag
        id: v1
        run: |
          set -euo pipefail
          read -r tag commit < <(site/scripts/latest-v1-tag.sh "https://github.com/$GITHUB_REPOSITORY")
          echo "v1 documentation: $tag ($commit)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v1.outputs.tag }}
          path: v1-src
          lfs: true
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- just site-workers

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- actionlint

  # The repository rules (tools/checks/, `just check-rules`), and the same public-content scan
  # over the commit messages and the pull request's title and body (`just check-messages`).
  # PUBLIC_CONTENT_DENYLIST is a repository secret: the private names that must never appear
  # here. A pull request from a fork gets no secrets, and the checks then skip that part and say
  # so. Once the repository variable DENYLIST_REQUIRED is `true`, an empty list fails on this
  # repository's own branches and in the merge queue.
  rules:
    name: rules (decisions, requirements, public content, file names, agent links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}
      REQUIRE_DENYLIST: ${{ vars.DENYLIST_REQUIRED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit range origin/main..HEAD needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - run: devbox run -- just check-rules
      - name: Commit messages and the pull request text
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: devbox run -- just check-messages

  # The code gate: the Go module and the Cargo workspace (`just check-code`: contracts and
  # registry drift when those recipes exist, lint, tests). Not path-filtered, like the rest.
  code:
    name: 'code (Go and Rust: proto, registry, lint, test)'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: code-${{ runner.os }}-${{ hashFiles('go.sum', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            code-${{ runner.os }}-
      - run: devbox run -- just check-code

  # The boards' build: every executable cross-compiled for arm64 (Go with CGO off, Rust through zig to static
  # musl, aws-lc-sys included), each checked to be a static aarch64 ELF; the deploy scripts through shellcheck;
  # and the deploy staged as a dry run, with no host. The units' golden test is part of `code` (go-test).
  arm64:
    name: 'arm64 (cross-build for the boards, deploy scripts)'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            target/
          key: arm64-${{ runner.os }}-${{ hashFiles('go.sum', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            arm64-${{ runner.os }}-
      - run: devbox run -- just build-arm64
      - run: devbox run -- shellcheck deploy/boards/*.sh
      - name: The recipients, the check and the one-board-at-a-time rule, against a stand-in for ssh
        run: devbox run -- deploy/boards/recipients-test.sh
      - name: The operating-system checks of the board script, against fakes of the package manager
        run: devbox run -- deploy/boards/prereq-test.sh
      - name: The workstation side of the scripts (rqlite pins, unlock, ssh options, profile), against a fake ssh
        run: devbox run -- deploy/boards/boards-test.sh
      - name: Deploy, staged only
        env:
          SLUIS_BOARDS: board.example.test
          SLUIS_BOARD_SSH_USER: nobody
          SLUIS_BOARDS_DRY_RUN: '1'
        run: devbox run -- just boards-deploy
      # The card variant of the deploy (SLUIS_BOARDS_KEY_DRIVER=yubikey-piv) takes the card driver in place of the software
      # one and stages the drop-ins. The real card driver is built natively (the job native-arm64); here a copy of another
      # executable stands in for its binary, because only the staging is checked.
      - name: Deploy the card variant, staged only
        env:
          SLUIS_BOARDS: board.example.test
          SLUIS_BOARD_SSH_USER: nobody
          SLUIS_BOARDS_DRY_RUN: '1'
          SLUIS_BOARDS_KEY_DRIVER: yubikey-piv
          SLUIS_BOARD_CARD_SERIALS: board.example.test=1234567
        run: |
          set -euo pipefail
          cp dist/arm64/drivers/key/software dist/arm64/drivers/key/yubikey-piv
          devbox run -- just boards-deploy | tee staged.txt
          grep -q 'sluis-drv-key-yubikey-piv@dev.service' staged.txt
          if grep -q 'sluis-drv-key-software@dev.service' staged.txt; then echo 'the software key driver is staged beside the card driver'; exit 1; fi
          grep -q 'files/card/pcscd-socket.dropin' staged.txt
          grep -q 'files/card/pcsc-polkit.rules' staged.txt
          grep -q 'files/sysusers/sluis-pcsc-dev.conf' staged.txt
          # key@ of the card variant requires the card driver, not the software one.
          grep -q '^key@ unit requires: Requires=sluis-drv-key-yubikey-piv@%i.service *$' staged.txt

  # The executables that link a C library (deploy/boards/native.list: the card driver) are built natively, on a hosted
  # arm64 runner, inside the Ubuntu 22.04 userland (ADR 0013), whose glibc is older than any supported system's and whose
  # symbols native-build.sh holds to GLIBC_2.34, so they run on every supported glibc. The job vets and tests the package with cgo and the card build in (a fake card; the hardware is
  # exercised on a board), builds it, and checks what it links. Its output is uploaded for the boards deploy.
  native-arm64:
    name: 'native-arm64 (card driver in Ubuntu 22.04, cgo)'
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/boards/native-build.sh
      # The Go toolchain that native-build.sh installed runs the test that holds the glibc symbols to the floor.
      - name: Hold the glibc symbols of the executables to the floor
        env:
          SLUIS_NATIVE_DIST: dist/native/arm64
        run: |
          export PATH=/usr/local/go/bin:$PATH GOFLAGS=-buildvcs=false GOTOOLCHAIN=local CGO_ENABLED=1
          go test -count=1 -v -run '^TestNativeExecutablesStayWithinTheGlibcFloor$' ./tools/gen/units
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64
          path: dist/native/arm64
          if-no-files-found: error
          retention-days: 14

  # The deploy scripts of the boards against a real operating system, in a systemd container of each: Ubuntu 26.04 and Rocky 10
  # (docs/runtimes/bare-metal.md, "Supported operating systems"). The run is the Go test that names the requirements; it starts
  # deploy/boards/os-container-test.sh, which drives the real boards.sh through a stand-in for ssh. No board and no card.
  os-containers:
    name: 'os-containers (${{ matrix.name }})'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned by the digest of the multi-architecture index (checked 2026-11-04); a bump changes the tag and the digest together.
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
          - name: rocky-10
            image: rockylinux/rockylinux:10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: os-containers-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            os-containers-${{ runner.os }}-
      - name: Deploy to a systemd container and check the card service
        env:
          SLUIS_OS_IMAGE: ${{ matrix.image }}
        run: devbox run -- go test -count=1 -v -run '^TestBoardsDeployOnASystemdContainer$' ./tools/gen/units

  # The deny matrix (ADR 0002, "Enforcement is tested"; REQ-DATA-066, REQ-KEYS-044, REQ-ISO-090): the local installation
  # under Compose, as `just local-deny` runs it, and a probe as each caller's uid, with its unit's groups, at each socket.
  # A pair that the registry denies and the installation lets through fails the job. The adapter's health check needs an
  # upstream that answers discovery, so a Keycloak container serves an empty realm (tests/deny/upstream-realm.json) on the
  # runner; nobody signs in, and its secrets are random values made for the run.
  deny:
    name: 'deny (the deny matrix on the local installation)'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The project's network is fixed so that the adapter's forwarder reaches the upstream at the network's gateway.
      SLUIS_DENY_SUBNET: 10.99.201.0/24
      SLUIS_UPSTREAM_TARGET: 10.99.201.1:8180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/zig
            target/
            .cache/rqlite
          key: deny-${{ runner.os }}-${{ hashFiles('go.sum', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            deny-${{ runner.os }}-
      - name: The upstream, Keycloak 26.8 with an empty realm
        run: |
          set -euo pipefail
          admin=$(openssl rand -hex 16)
          echo "::add-mask::$admin"
          docker run -d --name idp -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$admin" \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            -v "$PWD/tests/deny/upstream-realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332 \
            start-dev --import-realm >/dev/null
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8180/realms/sluis-test/.well-known/openid-configuration; then exit 0; fi
            sleep 2
          done
          docker logs idp 2>&1 | tail -40
          exit 1
      - name: The secrets file of the run (random, never printed)
        run: |
          set -euo pipefail
          umask 077
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          printf 'SLUIS_LOCAL_CLIENT_SECRET=%s\n' "$secret" >"$RUNNER_TEMP/upstream.env"
          echo "SLUIS_KEYCLOAK_SECRETS=$RUNNER_TEMP/upstream.env" >>"$GITHUB_ENV"
      - run: devbox run -- just rqlite-fetch local-deny

  # The advisory gate (REQ-SUPPLY-030): govulncheck over every Go module (twice: the default build, and the card driver
  # with the tag sluis_card), cargo audit over every Cargo.lock and osv-scanner over the lock files, failing on a known
  # advisory that affects us unless tools/advisories/ignore.yaml lists it, with a reason and an expiry date. A new advisory
  # can turn this job red on a commit that did not touch a dependency; that is the point, and the fix is a bump (or a
  # dated entry), not a re-run. The card build is cgo and needs pkg-config and libpcsclite-dev, as native-arm64 installs
  # them; the tagged scan fails, and so does this job, when they are missing.
  advisories:
    name: 'advisories (govulncheck, cargo audit, osv-scanner)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The card driver's C dependencies (govulncheck with the tag sluis_card)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libpcsclite-dev
      - uses: truvity/ci-actions/setup-devbox@eae9926515d96296eeed99aa358d2957a89647e8 # v3.3.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: advisories-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            advisories-go-${{ runner.os }}-
      # cargo audit keeps the RustSec database as a git checkout in ~/.cargo/advisory-db and fetches only the difference,
      # so a copy up to a week old is brought up to date before it is read: a stale cache never hides an advisory. The key
      # is the ISO week. govulncheck and osv-scanner ask their services (vuln.go.dev, api.osv.dev) for what they need,
      # which is small; they have no database to keep.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            advisory-db-${{ runner.os }}-
      # The card build is cgo. devbox sets CC to a compiler that does not search /usr/include, where libpcsclite-dev puts
      # winscard.h, so the gate is told the host's compiler and pkg-config for that one scan (tools/advisories).
      - run: devbox run -- just check-advisories
        env:
          SLUIS_ADVISORIES_CC: /usr/bin/gcc
          SLUIS_ADVISORIES_PKG_CONFIG: /usr/bin/pkg-config

  # One name to require. A job that was skipped or cancelled is not a pass.
  checks:
    needs: [site, v1, workers, workflows, rules, code, arm64, native-arm64, os-containers, deny, advisories]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check succeeded
        env:
          RESULTS: ${{ needs.site.result }} ${{ needs.v1.result }} ${{ needs.workers.result }} ${{ needs.workflows.result }} ${{ needs.rules.result }} ${{ needs.code.result }} ${{ needs.arm64.result }} ${{ needs.native-arm64.result }} ${{ needs.os-containers.result }} ${{ needs.deny.result }} ${{ needs.advisories.result }}
        run: |
          echo "site v1 workers workflows rules code arm64 native-arm64 os-containers deny advisories: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a check did not succeed"; exit 1; }
          done
