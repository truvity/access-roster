# The boards deploy against Rocky Linux 10 with SELinux enforcing, in a virtual machine under KVM (deploy/boards/os-vm-test.sh).
# A container cannot show the labels or an AVC denial, so this runs nightly and on demand, not on every pull request.
# It judges nothing for a merge: a failure is a mail to whoever last touched the schedule, and the logs are kept.
name: Nightly SELinux

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-selinux
  cancel-in-progress: false

jobs:
  rocky-enforcing:
    name: 'Rocky 10, SELinux enforcing'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hosted runners have /dev/kvm, owned by root; let this job's user use it.
      - name: Make KVM usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install qemu and the tools of the test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage jq
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sluis-os-vm
          key: sluis-os-vm-rocky-10.2-20260525
      - name: Deploy to the machine and check the labels, the domains and the AVC log
        env:
          SLUIS_VM_LOGS: ${{ runner.temp }}/vm-logs
        run: deploy/boards/os-vm-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: vm-logs
          path: ${{ runner.temp }}/vm-logs
          if-no-files-found: ignore
          retention-days: 7
