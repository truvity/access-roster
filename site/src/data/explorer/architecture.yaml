# Data for the identity explorer (docs/architecture/identity-explorer.mdx).
#
# The facts live here and the component only renders them. Today the file is
# written by hand from the design; 
# actors, drivers, edges, uids and sockets below are generated from it and the
# prose fields stay.
#
# Which actors exist is the actor registry's, docs/architecture/actors.yaml. Every role below is an
# actor of the registry, every core, Quota and audit actor of the registry is a role here, and the
# registry reads `binary`, `uses` and `calls` from this file instead of repeating them
# (`just check-actors`).
#
# Status: `status` is decided | proposed. A proposed item carries `issue: <n>`,
# its open tracking issue in truvity/sluis, and the chip links to it; a decided
# item carries no issue. The build fails otherwise (assertStatuses in
# src/lib/explorer-layout.ts). Text fields are plain text, not Markdown.
#
# Vocabulary: an actor is a process with one responsibility; a runtime is the
# runtime kind (bare-metal, serverless, kubernetes); an installation is one
# concrete deployment. Four are tested: local, boards, lambda and kubernetes;
# this file draws all four. The keys below keep the names the code
# reads: `shapes` lists the tested installations, `roles` the actors,
# `environment` names the runtime kind, and `runtimes` are the runtime
# templates.

default_shape: boards

statuses:
  decided: Decided
  proposed: Proposed

# ---------------------------------------------------------------------------
# Tested installations (the key stays `shapes`). `environment` is the runtime
# kind of the installation. `ports` names the driver behind each port in it.
# ---------------------------------------------------------------------------
shapes:
  - id: local
    name: Local (development)
    environment: bare-metal
    hardware: Docker on a workstation, one node
    runtime: docker
    nodes: 1
    node_agent: false
    edge: cloudflared
    ports: { keys: software, state: rqlite-one, blob: fs, transport: spool, index: sqlite }
    keys: software keys; a dedicated development card is opt-in
    keys_note: "A dedicated development card is opt-in. Only the key@ container reaches it, through the host's smart-card service, and key@ has the card to itself."
    state: rqlite, one node
    use: Development, CI and the integration tests.
    notes:
      - text: "Keys are software keys by default. The software keys driver refuses to start in production and warns in staging (ADR 0006); a dedicated development card is opt-in (ADR 0011)."
        status: decided
      - text: "The log store is the fs blob, a local directory with no lock mode, so tamper evidence comes from verification and, where there is one, a witness. The witness is optional, and sluis config check warns when there is none."
        status: decided
  - id: boards
    name: Boards (three-board cluster)
    environment: bare-metal
    hardware: Three single-board computers (arm64, 2 GB RAM, eMMC), a YubiKey in each
    runtime: systemd
    nodes: 3
    node_agent: true
    edge: cloudflared
    ports: { keys: yubikey-piv, state: rqlite, blob: r2, transport: spool, index: rqlite_index }
    keys: One YubiKey per node
    state: rqlite (Raft) across three nodes
    use: Integration tests and tutorials. A Cloudflare tunnel serves sluis.example.com.
    notes:
      - text: "The audit pieces run on the same nodes as sluis. Each node runs its own writer, with its own spool and log key, so each node keeps its own audit log, and the other two nodes are its peer witnesses (2-of-3). Readers merge the logs of a project by time."
        status: decided
      - text: "The blob is Cloudflare R2, through the one s3-compatible driver, with R2 temporary credentials scoped to the bucket and a prefix. An account administrator can remove R2's lock (lock mode removable), so the peer witnesses protect against a rewritten history."
        status: decided
      - text: "The index is rqlite, a replicated SQLite, so the reader can run on any node (ADR 0028). If its full-text index does not hold up on the boards, they fall back to sqlite on the indexer's node."
        status: decided
      - text: "A board image older than the systemd floor (252) is a declared exception until board images for the supported distributions exist (#881)."
        status: decided
  - id: lambda
    name: AWS Lambda
    environment: serverless
    hardware: One Lambda function per actor
    runtime: lambda
    nodes: 0
    node_agent: false
    edge: lwa
    ports: { keys: aws, state: aws, blob: s3, transport: sqs, index: postgres }
    keys: AWS KMS
    state: DynamoDB
    use: Integration tests and tutorials.
    notes:
      - text: "The default index here is postgres on Aurora (ADR 0028), reached through RDS Proxy with IAM authentication and one database role per actor kind; the indexer and the reader run in the VPC. A small install can also run sluis audit search from the CLI, which builds a local sqlite index from the log."
        status: decided
      - text: "The transport is an SQS queue here. Direct mode is not available on serverless, because its fallback is a local spool and a function has no disk."
        status: decided
      - text: "The log key is one KMS key per writer instance, whose key policy names the writer function's role only. A project has one log here, so there is no peer witness; a witness is optional."
        status: decided
  - id: kubernetes
    name: Kubernetes (EKS)
    environment: kubernetes
    hardware: A pod per actor and per holder on Amazon EKS, from one Helm chart
    runtime: kubernetes
    nodes: N
    node_agent: false
    edge: relay
    ports: { keys: aws, state: aws, blob: s3, transport: nats, index: postgres }
    keys: AWS KMS
    state: DynamoDB
    use: The customer-identity installation, and the reference installation of the nats-jetstream driver.
    notes:
      - text: "Each actor and each holder is a pod with its own service account. A driver is a native sidecar container in its holder's pod, with its socket on an emptyDir, and the cloud token is mounted only into the driver container, so a work pod has no cloud identity (ADR 0003, ADR 0005)."
        status: decided
      - text: "A call between pods is gRPC with a projected service-account token whose audience the callee checks, behind a NetworkPolicy per callee that admits only the pods of its allowed callers (ADR 0003)."
        status: decided
      - text: "Mutual TLS between callers is later work."
        status: proposed
        issue: 1224
      - text: "A cell is one replica of each actor, co-scheduled by pod affinity and spread across nodes and zones; a Service with trafficDistribution PreferClose keeps a call inside its cell, and a PodDisruptionBudget keeps the cell's replicas up during a drain (ADR 0003)."
        status: decided
      - text: "The audit transport is NATS JetStream, with NATS accounts and permission templates, the index is postgres in the cnpg mode in the same cluster, and the blob is an S3 bucket (ADR 0028)."
        status: decided

# What each runtime turns a process id into. {id} is the process id, {driver}
# the driver id, {role} the actor the driver belongs to.
runtimes:
  docker:
    label: Docker Compose
    process: compose service
    role:
      unit: "sluis-{id} (compose service)"
      identity: "container user sluis-{id}"
      id_short: "user sluis-{id}"
      listen: "/run/sluis/{id}/api.sock"
      sock_short: "sock {id}"
    shared_driver:
      unit: "sluis-driver-{driver} (compose service)"
      identity: "container user sluis-drv-{driver}"
      id_short: "user sluis-drv-{driver}"
      listen: "/run/sluis/driver-{driver}/api.sock"
      sock_short: "sock driver-{driver}"
    role_driver:
      unit: "sluis-driver-{driver}-{role} (compose service)"
      identity: "the role's own user, sluis-{role}"
      id_short: "user sluis-{role}"
      listen: "/run/sluis/{role}/{driver}.sock"
      sock_short: "{driver}.sock"
    role_call: Unix socket
    driver_call: Unix socket on a shared volume
  systemd:
    label: systemd
    process: systemd unit
    role:
      unit: "sluis-{id}.service (+ .socket)"
      identity: "uid sluis-{id}"
      id_short: "uid sluis-{id}"
      listen: "/run/sluis/{id}/api.sock"
      sock_short: "sock {id}"
    shared_driver:
      unit: "sluis-driver-{driver}.service (+ .socket)"
      identity: "uid sluis-drv-{driver}"
      id_short: "uid sluis-drv-{driver}"
      listen: "/run/sluis/driver-{driver}/api.sock"
      sock_short: "sock driver-{driver}"
    role_driver:
      unit: "sluis-driver-{driver}@{role}.service (+ .socket)"
      identity: "the role's own uid, sluis-{role}"
      id_short: "uid sluis-{role}"
      listen: "/run/sluis/{role}/{driver}.sock"
      sock_short: "{driver}.sock"
    role_call: Unix socket
    driver_call: Unix socket
  lambda:
    label: AWS Lambda
    process: Lambda function
    role:
      unit: "Lambda function sluis-{id}"
      identity: "execution role sluis-{id}"
      id_short: "role sluis-{id}"
      listen: "no socket: called by Lambda invoke"
      sock_short: "invoke"
    shared_driver:
      unit: "Lambda extension sluis-driver-{driver} (layer)"
      identity: "the function's execution role"
      id_short: "execution role"
      listen: "/tmp/sluis/{driver}.sock"
      sock_short: "sock {driver}"
    role_driver:
      unit: "Lambda extension sluis-driver-{driver} (layer of sluis-{role})"
      identity: "the function's execution role, sluis-{role}"
      id_short: "role sluis-{role}"
      listen: "/tmp/sluis/{driver}.sock"
      sock_short: "{driver}.sock"
    role_call: Lambda invoke
    driver_call: Unix socket (extension)
  kubernetes:
    label: Kubernetes pods
    process: pod
    per_actor_line: sidecar of each actor's pod
    role:
      unit: "Pod {id}"
      identity: "ServiceAccount {id}"
      id_short: "SA {id}"
      listen: "the pod address: gRPC, admitted by a NetworkPolicy from the callers only"
      sock_short: "gRPC"
    shared_driver:
      unit: "Native sidecar container sluis-driver-{driver} in the holder's pod"
      identity: "the holder's pod; only this container holds the cloud token"
      id_short: "sidecar"
      listen: "/run/sluis/driver-{driver}/api.sock on an emptyDir"
      sock_short: "sock driver-{driver}"
    role_driver:
      unit: "Native sidecar container sluis-driver-{driver} in the pod of {role}"
      identity: "the driver container of ServiceAccount {role}"
      id_short: "sidecar of {role}"
      listen: "/run/sluis/{role}/{driver}.sock on an emptyDir"
      sock_short: "{driver}.sock"
    role_call: In-cluster gRPC
    driver_call: Unix socket on an emptyDir

# The edge connector, per kind.
edges_kinds:
  cloudflared:
    title: edge connector
    sub: cloudflared tunnel
    line2: "cloudflared"
    line3: "unix socket"
    does: "The Cloudflare tunnel client. Its ingress service is entry's public Unix socket, as a unix: origin (unix:/run/sluis/entry/<boundary>-public.sock), so it makes outbound connections only and no inbound port is opened on the node. It holds no key and can open no other actor's socket. In the local installation a Compose service (this connector's image or a forwarder) mounts entry's socket and publishes a port (ADR 0011)."
    listen: Outbound tunnel only. It forwards to entry's public Unix socket.
    transport: Unix socket (the tunnel's unix service)
    status: decided
  lwa:
    title: edge connector
    sub: Lambda Web Adapter
    line2: "Lambda Web Adapter"
    line3: "loopback TCP"
    does: The Lambda Web Adapter, pinned and vendored into sluis's own layer, behind API Gateway. It forwards the invocation to entry over a loopback TCP port inside the sandbox, which holds only sluis processes.
    listen: Loopback TCP inside the sandbox (127.0.0.1:8080 is an example).
    transport: Loopback TCP (127.0.0.1)
    status: decided
  relay:
    title: edge relay
    sub: key-less edge relay container
    line2: "edge relay"
    line3: "unix socket"
    does: "A key-less container in entry's pod. It listens on the pod address, so the cluster's gateway can route to it, and forwards to entry's Unix socket in a shared volume. entry itself stays socket-only. A cloudflared sidecar is a supported mode."
    listen: The pod address, reached by the gateway or the ingress controller.
    transport: Unix socket (a volume shared in the pod)
    status: decided

# ---------------------------------------------------------------------------
# Drivers. A driver is the technology behind a port; it is a service that
# speaks ConnectRPC over a Unix socket, started by the platform.
# ---------------------------------------------------------------------------
drivers:
  software:
    port: keys
    title: software
    instance: shared
    shared_name: key@
    binary: drivers/software
    does: "Software keys, held by key@ under its own uid, with the same socket per caller as on a card. A development and test driver: it refuses to start in production and warns in staging (ADR 0006)."
    holds: The software key files
    backing: software key files
    status: decided
  yubikey-piv:
    port: keys
    title: yubikey-piv
    instance: shared
    shared_name: key@
    binary: drivers/yubikey-piv
    does: "Serves the key store of key@ from the node's YubiKey (PIV). key@ has the card to itself: its driver runs as a dedicated user, and no other card software runs on the node. One device and one PIN, so one shared instance with three checks: one Unix socket per caller, in a directory only that caller can open; the caller's peer uid on every connection; and content-aware signing per purpose (a TBSCertificate for ca, an OpenSSH certificate body for ssh-ca, a JWS signing input for token purposes). The rules of the actor registry say who may use which key purpose. Written in Go with piv-go."
    holds: "The PIN, in key@'s locked memory, released by an unlocked peer through the store or delivered by sluis node unlock. A locked board signs its PinReleaseRequest with the pin-release key (slot 87, PIN never, touch never), and the peer checks the signature and the slot's attestation before it seals the PIN to the request's one-time key. No symmetric key on the card: a data key is wrapped for the card's key-agreement key (slot 9d), by ECDH, HKDF-SHA384 and AES key wrap."
    backing: YubiKey PIV
    slots: "one slot per enabled purpose, from the default card map"
    status: decided
  rqlite-one:
    port: state
    title: rqlite (one node)
    instance: shared
    shared_name: null
    binary: drivers/rqlite
    does: Serves the durable and temp ports of store@ from one rqlite node, with no Raft peers, so the one node serves both engine ports. The driver reaches rqlite's client API on the loopback address and is its only client (ADR 0005). The one writer of each kind is checked by store@ against the kind registry, not by the engine.
    holds: Nothing. The engine login is platform-provided.
    backing: rqlite, one node
    status: decided
  rqlite:
    port: state
    title: rqlite
    instance: shared
    shared_name: null
    binary: drivers/rqlite
    does: Serves the durable and temp ports of store@ on rqlite, one cluster of 1, 3 or 5 nodes for the engine, and store@ is the engine's only user. rqlite has no Unix-socket listener, so its client API stays on the loopback address and the driver is its only client, with a client certificate. Raft peer traffic is the cluster's own TCP port, the only port a board opens to another board, over mutual TLS with a certificate per cluster (ADR 0005, ADR 0003).
    holds: The Raft peer TLS credential
    backing: rqlited (Raft, three nodes)
    status: decided
    peer_port: true
  aws:
    port: any
    title: aws
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: One binary for KMS (the key store of key@), DynamoDB (the durable and temp ports of store@), S3 or an S3-compatible store (the audit blob) and SQS (the audit transport). Each holder runs its own instance, as that holder's uid or as an extension of its own function, so the cloud's own IAM or key policy is the enforcer.
    holds: Nothing. Credentials come from the platform identity, or from a workload JWT exchanged for cloud credentials.
    backing: AWS KMS, DynamoDB, S3 or SQS
    status: decided
  spool:
    port: transport
    mode: queue
    title: spool
    instance: shared
    shared_name: null
    binary: drivers/spool
    does: The transport port in queue mode on a local, fsync'd spool. A producer's request returns once its record is durable here. One shared instance that checks every caller's peer credentials.
    holds: The spool segment files
    backing: local spool on disk
    status: decided
  fs:
    port: blob
    title: fs
    instance: file
    shared_name: null
    binary: drivers/fs
    does: The blob port on a local directory, for one node. A put is create-if-absent (link or renameat2), and there is no lock (lock mode none), so tamper evidence comes from verification and witnesses. The blob driver of the local installation.
    holds: The blob directory
    backing: local directory
    status: decided
  s3:
    port: blob
    title: s3-compatible (S3)
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: The blob port on AWS S3, served by the one s3-compatible driver, with credentials from the platform identity and IAM prefix conditions. A put is create-if-absent, so no object is ever replaced. Only the writer, the witness, the indexer and the reader use it.
    holds: Nothing
    backing: object store
    status: decided
  r2:
    port: blob
    title: s3-compatible (R2)
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: The blob port on a Cloudflare R2 bucket, served by the one s3-compatible driver with R2 temporary credentials scoped to the bucket and a prefix. A put is create-if-absent. An account administrator can remove the bucket lock (lock mode removable), so tamper evidence leans on the witnesses. Only the writer, the witness, the indexer and the reader use it.
    holds: Nothing
    backing: R2 bucket (S3 API)
    status: decided
  sqs:
    port: transport
    mode: queue
    title: aws (SQS)
    instance: per-actor
    shared_name: null
    binary: drivers/aws
    does: The transport port in queue mode on SQS. Each producer sends under its own IAM role, and the queue policy names the sender roles, so the transport itself says who sent a record.
    holds: Nothing
    backing: SQS queue
    status: decided
  nats:
    port: transport
    mode: queue
    title: nats-jetstream
    instance: per-actor
    shared_name: null
    binary: drivers/nats-jetstream
    does: The transport port in queue mode on a NATS JetStream stream. Each producer connects with its own NATS credential, under NATS accounts and permission templates, so an emitter publishes only to its own project's subjects (ADR 0028).
    holds: Its own NATS credential, one per producer
    backing: NATS JetStream
    status: decided
  sqlite:
    port: index
    title: sqlite
    instance: file
    shared_name: null
    binary: drivers/sqlite
    does: The index port on a SQLite file with FTS5, one per node. A projection of the log, never the evidence.
    holds: The index file
    backing: SQLite file
    status: decided
  rqlite_index:
    port: index
    title: rqlite
    instance: shared
    shared_name: null
    binary: drivers/rqlite
    does: "The index port on rqlite, a replicated SQLite, so the reader can run on any node. A projection of the log, never the evidence. It is the index of the boards (ADR 0028)."
    holds: The replicated index tables
    backing: rqlite (replicated SQLite)
    status: decided
  remote:
    port: index
    title: none here
    instance: file
    shared_name: null
    binary: null
    does: "An index in another installation: a separate Search installation that reads the same bucket. The search index is a rebuildable cache; the log in the blob is the record."
    holds: Nothing
    backing: an index in a separate audit install
    status: decided
  postgres:
    port: index
    title: postgres
    instance: per-actor
    shared_name: null
    binary: drivers/postgres
    does: "The index port on Postgres, one driver with a provisioning mode: rds or aurora on AWS (the lambda default is aurora, reached through RDS Proxy with IAM authentication), cnpg on Kubernetes (its default), or external, a connection string only. Exposing CNPG through a load balancer is not a driver of its own; it is external."
    holds: Nothing
    backing: Postgres
    status: decided

# The four drivers shown on the map are the ports; the backing stores are
# described per port and driver.
ports:
  keys:
    node: drv-keys
    title: keys
    store_node: store-keys
    store_title: key store
    users: [key]
  state:
    node: drv-state
    title: state
    store_node: store-state
    store_title: engine
    users: [store]
  blob:
    node: drv-blob
    title: blob
    store_node: store-blob
    store_title: blob
    users: [writer, witness, indexer, reader]
  transport:
    node: drv-transport
    title: transport
    store_node: store-transport
    store_title: transport
    users: [entry, session, exchange, console, policy, signer, ca, ssh-ca, quota, writer, witness, indexer, reader]
  index:
    node: null
    store_node: store-index
    store_title: index

# ---------------------------------------------------------------------------
# Actors (the key stays `roles`). Each is its own OS user and unit, its own
# Lambda function, or its own container. `resources` is an illustrative slice
# of the rules of the kind registry and the actor registry.
# ---------------------------------------------------------------------------
roles:
  entry:
    status: decided
    name: entry
    kind: actor
    binary: actors/entry
    does: "Parses each request, validates it against closed parameter lists generated from the contracts, and routes it to the actor that owns it: session for sign-in and sessions, exchange for token exchange and enrolment, console for the operator API, ssh-ca for SSH certificates. It sits behind the edge connector and is the only actor whose API faces the edge. It is written in a memory-safe language, fuzzed, loads no plugin and runs on a read-only file system (ADR 0002)."
    holds: "Nothing: no key, no secret, no state and no outbound network"
    uses: [transport]
    workload_jwt: false
    resources:
      - "calls: session, exchange, console, ssh-ca, quota (on serverless it invokes them); an adapter only to route a push notification"
      - "data: its own kind RateWindow; keys: mac and pseudonym through key@; no credential"
      - "network: none (PrivateNetwork=yes, AF_UNIX only, seccomp and Landlock on bare-metal)"
      - "transport: put"
    listen_by_runtime:
      docker: "/run/sluis/entry/<boundary>-public.sock on a shared volume; the container has no network"
      systemd: "/run/sluis/entry/<boundary>-public.sock, a Unix socket; PrivateNetwork=yes, so no TCP listener"
      lambda: "TCP 127.0.0.1:8080 (an example port) inside the sandbox, through the Lambda Web Adapter"
      kubernetes: "/run/sluis/entry/<boundary>-public.sock on a volume shared in the pod; the edge relay container beside it listens on the pod address and forwards here, so entry has no TCP listener"
    map_line_by_runtime:
      docker: "unix socket"
      systemd: "unix socket"
      lambda: "tcp 127.0.0.1"
      kubernetes: "unix socket"
    listener_note: "entry's public API is the only listener that faces the edge. On bare-metal it is a Unix socket that cloudflared forwards to as a unix: origin, and entry has no network at all. On serverless it is a loopback TCP port inside the function's sandbox, because the Lambda Web Adapter needs one. On Kubernetes a key-less edge relay container in the pod forwards to entry's socket (ADR 0011). Every other actor listens on Unix sockets only."
  session:
    status: decided
    name: session
    kind: actor
    binary: actors/session
    does: "Sign-in and sessions: the authorization flows with the upstream integrations, session chains, the HttpOnly session cookie (sealed and opened at key@ under the boundary's cookie data key), and the freshness of each person's authentication per boundary (RFC 9470 step-up). It verifies break-glass recovery assertions. It asks policy before it issues anything and has no listener toward the edge."
    holds: "No credential at rest. The cookie is sealed at key@; sessions and refresh tokens are kinds that store@ holds"
    uses: [keys, state, transport]
    resources:
      - "data: Person, UpstreamLink, SessionChain, AuthCode and the other kinds it writes (one writer per kind)"
      - "keys: seal and open the session cookie under the cookie data key"
      - "calls: policy, signer, the Upstream integrations"
      - "called by: entry (sign-in, cookie), console (session check)"
      - "transport: put"
  exchange:
    status: decided
    name: exchange
    kind: actor
    binary: actors/exchange
    does: "Token exchange (RFC 8693), enrolment of hosts and workloads, and the proof verifiers (aws-iid, k8s-sa-token, github-oidc, yubikey-attestation, enrol-token, manual approval). Verifier drivers hold public material only. An enrolment request is HPKE-encrypted end to end, and exchange opens it through key@; the enrolment key stays in key@'s key store (the card or KMS). A downstream mint goes from here to the minter with a grant that policy sealed."
    holds: "No authority key and no credential at rest. Its enrolment, client and host kinds are held by store@"
    uses: [keys, state, transport]
    resources:
      - "data: PendingEnrolment, EnrolmentToken, TenantClient and the other kinds it writes (one writer per kind)"
      - "keys: open an enrolment request sealed to the enrolment key"
      - "calls: policy, quota, signer, ca, the WorkloadVerifier, CredentialMinter and Notifier integrations"
      - "called by: entry, console (operator writes to its kinds)"
      - "transport: put"
  console:
    status: decided
    name: console
    kind: actor
    binary: actors/console
    does: "The operator API, as the browser's backend. It has session check the cookie, checks the operator's delegation (per company, and per environment for machine-plane records), and routes each operator write to the actor that owns the kind, which validates and writes it. It reads through the actors it calls. The browser holds no token; the single-page application is a separate static artifact."
    holds: "No key and no write access to other actors' records; delegation checks only"
    uses: [transport]
    resources:
      - "data: it writes only Switch and LogLevelOverride itself; every other write goes to the owning actor"
      - "calls: session (session check), the owning actors of the kinds an operator changes (exchange for enrolments and hosts, an integration for its console-managed kinds), quota (the push of an allowance correction), reader (the audit page)"
      - "keys: none"
      - "transport: put (every operator change, under the operator's name)"
  policy:
    status: decided
    name: policy
    kind: actor
    binary: actors/policy
    does: "The decision point. A reviewed, file-based Cedar policy maps facts to grants. It is written in Rust with the cedar-policy crate. It keeps no state and opens no network connection. It has key@ seal each grant under the boundary's grant data key."
    holds: Seal of grants at key@ and open of a tenant's sealed links; no key of its own
    uses: [keys, transport]
    resources:
      - "keys: seal grants under the boundary's grant data key; open a tenant's sealed PolicyLink"
      - "data: reads the effective policy set through store@ and keeps no state of its own; network: none"
      - "transport: put"
  signer:
    status: decided
    name: signer
    kind: actor
    binary: actors/signer
    does: "Signs tokens under a signing policy, directly with the token-signing key: there are no derived or short-lived online keys. It is not a pure oracle: it checks the issuer, the audience, the lifetime and the algorithm, and accepts a request only from session and exchange."
    holds: Use of the token-signing key, which stays at key@
    uses: [keys, state, transport]
    resources:
      - "keys: sign a JWS signing input with the token-signing key"
      - "data: SigningRing, the key set it publishes (each entry with its x5c chain)"
      - "transport: put"
  ca:
    status: decided
    name: ca
    kind: actor
    binary: actors/ca
    does: "The X.509 certificate authority: host and workload SVIDs at enrolment, and database client certificates. The subject comes from the requester's authenticated identity, never from the request. Every certificate is audited and goes in the issuance log. The SSH CA is a separate actor, ssh-ca (ADR 0023)."
    holds: Use of the trust domain's X.509 intermediate key, which stays at key@
    uses: [keys, state, transport]
    resources:
      - "keys: sign a TBSCertificate within its profile's constraints (key@ parses it before signing)"
      - "data: IssuedCertificate, Revocation (its own kinds); the entries of the issuance log"
      - "called by: exchange"
      - "transport: put"
  ssh-ca:
    status: decided
    name: ssh-ca
    kind: actor
    binary: actors/ssh-ca
    does: "The SSH certificate authority, for user and host certificates. A certificate carries identity only (u:<person-key> for people, w:<workload> for machines); what an identity may log in as comes from the bundle that sluis-host writes on each host. Policy decides each signature (ssh.certify). It is its own actor because it is a different authority from ca (ADR 0023)."
    holds: Use of the SSH user and host CA keys, which stay at key@
    uses: [keys, state, transport]
    resources:
      - "keys: sign an OpenSSH certificate body only (key@ parses it before signing)"
      - "data: IssuedSshCertificate, SshRevocation (its own kinds)"
      - "calls: policy"
      - "called by: entry (the SSH certificate endpoint)"
      - "transport: put"
  quota:
    status: decided
    name: quota
    kind: actor
    binary: actors/quota
    does: "Keeps the allowance of each tenant, counts it down with a conditional update, refuses at zero and records every admit, refusal and push as an audit fact. It is a work actor of the quota module, not an audit piece, and it runs beside sluis, sharing its store, or in an installation of its own (ADR 0039)."
    holds: No credential and no key. The allowance and the admit records are kinds that store@ holds
    uses: [state, transport]
    resources:
      - "data: Allowance (a conditional update, no change-log row), AdmitRecord, SpentPush"
      - "calls: policy; called by: entry, exchange, console"
      - "transport: put (each admit, refusal and push)"
  writer:
    status: decided
    name: writer
    kind: actor
    binary: actors/writer
    does: "Seals the records of its project into its audit log and usage log in the blob, a C2SP tiled log. It reads the transport, validates, dedupes, rolls a batch, writes the entry bundles and tiles, asks key@ to sign the checkpoint with the log key, writes the checkpoint, and registers the batch in one conditional write of its own state in the project's bucket. key@ lets only the writer use the log key, so the writer never holds the key itself. It asks each witness to cosign the new checkpoint."
    holds: Write access to its log in the blob; no key (key@ signs for it)
    uses: [keys, transport, blob]
    resources:
      - "transport: receive and ack"
      - "keys: sign the checkpoint with the log key (through key@; on AWS the key policy names the writer's role)"
      - "blob: create-if-absent on its own log's prefix; its state (the sealed batches, the dedupe ids and its transport cursor) in one conditional write"
      - "calls: the witnesses (cosign)"
  witness:
    status: decided
    name: witness
    kind: actor
    binary: actors/witness
    does: "Cosigns each new checkpoint the writer sends it (tlog-witness), once it has checked that the checkpoint is consistent with the last one it cosigned, so that the writer alone cannot choose which history an auditor sees. Optional everywhere (drivers none, peer and external); sluis config check warns when an installation has none. On the boards the other nodes are a node's peer witnesses (peer driver). It holds nothing the writer holds."
    holds: Read and write access to its cosignatures in the blob; its key is at key@
    uses: [keys, blob, transport]
    resources:
      - "keys: sign a cosignature with its own key"
      - "blob: the last checkpoint it cosigned, per log"
      - "called by: writer (cosign)"
      - "transport: put"
  indexer:
    status: decided
    name: indexer
    kind: actor
    binary: actors/indexer
    does: "Search, the indexer. Follows each log of its boundary by signed checkpoint, with one cursor per log: it checks each new checkpoint's signature and consistency, then fetches the entry bundles it covers from the blob and applies them to the search index. One indexer runs per boundary and takes no lease: indexing is idempotent and each cursor only moves forward, by a conditional write in the index. It opens each record at key@ under the tenant's evidence key. Where it runs follows the index driver (ADR 0003)."
    holds: Read on the blob; write on the search index; its cursors
    uses: [keys, blob, transport]
    resources:
      - "blob: read checkpoints and entry bundles"
      - "index: apply, and its cursor per log (a conditional write)"
      - "keys: open a record under the evidence key, for a grant policy sealed"
      - "transport: put (each purge it applies is audited)"
  reader:
    status: decided
    name: reader
    kind: actor
    binary: actors/reader
    does: "Search, the reader. Answers audit queries from the search index and records each read. Where it runs follows the index driver (ADR 0003): with a sqlite index on a cluster it runs on the indexer's node; with an rqlite or postgres index it can run on any node."
    holds: Read only; the blob and the search index
    uses: [keys, blob, transport]
    resources:
      - "blob: read an entry and its inclusion proof"
      - "index: query"
      - "transport: put (each read is audited)"

# ---------------------------------------------------------------------------
# Integrations: five contracts, served by adapters (adapter-<vendor>, each its own process), and
# the workload verifier, a verifier driver of exchange. The names are examples.
# ---------------------------------------------------------------------------
integrations:
  int-upstream:
    kind: Upstream
    example: int-google
    does: Federates sign-in from an upstream identity provider (Authorize, Callback). Returns facts; it never decides.
    holds: Nothing at rest. The client secret of the installation's app is read from the secret source through store@
    egress: the provider's own hosts only
  int-workload:
    kind: WorkloadVerifier
    example: int-workload
    does: A verifier driver of exchange. Verifies workload tokens (Kubernetes and CI OIDC subject tokens) against the issuers' published keys. Holds no secret.
    holds: No secret
    egress: the configured issuers' key hosts only
  int-facts:
    kind: FactsSource
    example: int-github
    does: Returns directory facts (workspace directories, GitHub teams, chat workspaces) and writes them as temp kinds of its own, each with a time to live. A product's push notification reaches it through entry; it then pulls the full state. It also owns the kinds of its own objects (a chat integration's managed channels), written on an operator's request through console.
    holds: Nothing at rest. It opens the sealed credential of the tenant's connection at key@ for each call
    egress: the source's API host only
  int-minter:
    kind: CredentialMinter
    example: int-cloudflare
    does: Mints a short-lived downstream credential (cloud API token, GitHub installation token, AWS credentials). It receives a mint grant sealed by policy and carries it out; it never decides.
    holds: Nothing at rest. It opens the sealed credential of the tenant's connection at key@ for each call
    egress: the vendor's API host only
  int-provisioner:
    kind: Provisioner
    example: int-gitops
    does: Pulls a digest-addressed desired state and carries it out. Core calls it; it never calls core.
    holds: Nothing at rest. It opens the sealed credential of the target's connection at key@ for each call
    egress: the desired-state source and the target only
  int-notifier:
    kind: Notifier
    example: int-slack
    does: Sends notifications.
    holds: Nothing at rest. It opens the sealed webhook or token of the tenant's connection at key@ for each call
    egress: the service's host only

# ---------------------------------------------------------------------------
# Node services
# ---------------------------------------------------------------------------
node_agent:
  status: decided
  title: sluis-node
  binary: node/sluis-node
  does: "Issues a short-lived workload JWT per actor. Each actor's process identity comes from its uid, by peer credentials. key@ signs the JWT with the node's workload-issuer key, which never leaves the card, once an hour per actor."
  holds: No key. The workload-issuer key is a key purpose at key@ (card slot 86)
  resources:
    - "keys: sign workload JWTs with the workload-issuer key, through key@"
    - "callers: every sluis uid listed in the uid-to-actor map generated from the actor registry"
  listener_note: "On bare-metal every actor, entry included, and every driver listens on Unix sockets only. sluis-node publishes no network listener; the issuer's discovery document and JWKS (public keys only) are static files served from the distribution bucket."

# ---------------------------------------------------------------------------
# External and backing nodes (drawn, not run by sluis)
# ---------------------------------------------------------------------------
externals:
  client:
    title: client
    sub: browser, CLI, CI job
    does: A person, a robot or a workload calling sluis.
  upstream:
    title: upstream
    sub: IdPs, token issuers
    does: Upstream identity providers and the issuers of workload tokens.
  vendor:
    title: external systems
    sub: directories, vendors
    does: The systems that integrations read facts from, mint credentials in, or notify.
  downstream:
    title: cloud IAM
    sub: STS, GCP WIF, Entra
    does: The cloud's token service. A holder's cloud driver exchanges a workload JWT for that cloud's credentials there.

# What a port's backing node says, per port and driver.
backing_lines:
  blob.r2: ["R2 bucket", "S3 API, lock removable"]
  index.rqlite_index: ["rqlite index", "replicated SQLite"]
  keys.software: ["software keys", "files under key@"]
  keys.yubikey-piv: ["YubiKey PIV", "one per node"]
  keys.aws: ["AWS KMS", "key per purpose"]
  state.rqlite-one: ["rqlited", "one node"]
  state.rqlite: ["rqlited", "Raft, 3 nodes"]
  state.aws: ["DynamoDB", "a table per engine"]
  blob.s3: ["S3 bucket", "S3 API, Object Lock"]
  transport.spool: ["local spool", "fsync'd segments"]
  transport.sqs: ["SQS queue", "dead-letter queue"]
  transport.nats: ["NATS JetStream", "subject per project"]
  index.sqlite: ["SQLite + FTS5", "one file per node"]
  index.postgres: ["Postgres", "rds, cnpg or external"]
  index.remote: ["no index here", "separate Search install"]

# ---------------------------------------------------------------------------
# The call graph. `from > to`. `when` limits an edge to installations or drivers;
# an edge to a node an installation does not have is dropped.
# ---------------------------------------------------------------------------
calls:
  - { f: client, t: edge, m: HTTPS, d: "Sign-in, token exchange, mint and the console reach sluis through the edge connector." }
  - { f: edge, t: entry, m: connect, d: "The edge connector reaches entry's public socket; this is the only public path in." }
  - { f: entry, t: session, m: "Route: sign-in", d: "Sign-in, the session cookie and step-up go to session." }
  - { f: entry, t: exchange, m: "Route: exchange", d: "Token exchange, enrolment and downstream mint go to exchange." }
  - { f: entry, t: console, m: "Route: console", d: "The operator API goes to console." }
  - { f: entry, t: ssh-ca, m: "Route: SSH cert", d: "An SSH certificate request goes to ssh-ca." }
  - { f: entry, t: quota, m: "Route: quota", d: "A product's allowance push or admit call, authenticated at entry, goes to quota." }
  - { f: entry, t: int-facts, m: "Route: push", d: "A product's push notification goes to the integration that owns the object; the integration then pulls the full state." }
  - { f: session, t: int-upstream, m: "Authorize / Callback", d: Human sign-in upstream. }
  - { f: session, t: policy, m: Decide, d: "Maps the upstream facts to grants, and says whether fresh MFA is needed." }
  - { f: session, t: signer, m: SignToken, d: "ID and access tokens for a signed-in session." }
  - { f: session, t: drv-keys, m: "Seal(cookie)", d: "Seals and opens the session cookie under the boundary's cookie data key." }
  - { f: session, t: drv-state, m: "SessionChain", d: "Session chains, codes and the person's links: the kinds session writes." }
  - { f: console, t: session, m: "Check session", d: "session checks the HttpOnly cookie and its freshness for the boundary." }
  - { f: console, t: exchange, m: "Operator write", d: "Approve a pending enrolment, create an enrolment token; exchange validates and writes its own records." }
  - { f: console, t: int-facts, m: "Operator write", d: "A kind an integration owns, such as a chat integration's managed channels." }
  - { f: console, t: quota, m: "Push", d: "Routes an operator's correction of an allowance to quota (ADR 0039)." }
  - { f: console, t: reader, m: Search, d: The console audit page. }
  - { f: exchange, t: int-workload, m: Verify, d: Check a workload subject token. }
  - { f: exchange, t: policy, m: Decide, d: "host.enrol, token exchange and mint decisions." }
  - { f: exchange, t: quota, m: Admit, d: Rate and count limits. }
  - { f: exchange, t: signer, m: SignToken, d: Issue a token. }
  - { f: exchange, t: ca, m: Issue, d: "A host or workload SVID, bound to the requester's identity." }
  - { f: exchange, t: drv-keys, m: "Open(enrolment)", d: "Opens an HPKE-sealed enrolment request; the enrolment key never leaves key@." }
  - { f: exchange, t: drv-state, m: "PendingEnrolment", d: "Enrolments, enrolment tokens, hosts and clients: the kinds exchange writes." }
  - { f: exchange, t: int-minter, m: Mint(grant), d: "Downstream mint, with a grant sealed by policy." }
  - { f: exchange, t: int-notifier, m: Notify, d: "Notifications, such as an enrolment waiting for approval." }
  - { f: console, t: int-provisioner, m: Reconcile, d: "Asks the provisioner to reconcile to a published, digest-addressed desired state (illustrative)." }
  - { f: ssh-ca, t: policy, m: Decide, d: "ssh.certify: may this identity get this certificate now." }
  - { f: int-upstream, t: upstream, m: OIDC, d: The user authenticates at the upstream provider. }
  - { f: int-workload, t: upstream, m: JWKS, d: Fetches the issuer's published keys. }
  - { f: int-facts, t: vendor, m: Read, d: Reads directory facts. }
  - { f: int-minter, t: vendor, m: Mint, d: Mints the credential at the vendor. }
  - { f: int-provisioner, t: vendor, m: Pull, d: Pulls the desired state and applies it. }
  - { f: int-notifier, t: vendor, m: Send, d: Sends the notification. }
  - { f: policy, t: drv-keys, m: "Wrap(grant)", d: "Has key@ seal each mint grant under the boundary's grant data key." }
  - { f: signer, t: drv-keys, m: "Sign(token)", d: Token signatures. }
  - { f: ca, t: drv-keys, m: "Sign(cert)", d: "A TBSCertificate within its profile's constraints." }
  - { f: ssh-ca, t: drv-keys, m: "Sign(ssh cert)", d: "An OpenSSH certificate body only." }
  - { f: writer, t: drv-keys, m: "Sign(checkpoint)", d: "Asks key@ to sign the checkpoint with the log key; only the writer may use it." }
  - { f: writer, t: witness, m: Cosign, d: "Asks the witness to cosign the new checkpoint (tlog-witness)." }
  - { f: witness, t: drv-keys, m: "Sign(cosign)", d: Cosigns a checkpoint with its own key. }
  - { f: signer, t: drv-state, m: "SigningRing", d: The key set it publishes. }
  - { f: quota, t: drv-state, m: "Allowance", d: "A conditional update on the allowance." }
  - { f: ca, t: drv-state, m: "IssuedCertificate", d: Its issued certificates. }
  - { f: ssh-ca, t: drv-state, m: "IssuedSshCertificate", d: Its issued SSH certificates. }
  - { f: witness, t: drv-blob, m: "Last checkpoint", d: The last checkpoint it cosigned, per log, in the blob. }
  - { f: writer, t: drv-blob, m: "Put tiles, checkpoint, state", d: "Writes entry bundles, tiles and the checkpoint, each created only if absent, and registers each sealed batch, its dedupe ids and its cursor in one conditional write of its own state." }
  - { f: indexer, t: drv-blob, m: "Get checkpoint, bundles", d: Reads new checkpoints and the entry bundles they cover. }
  - { f: reader, t: drv-blob, m: "Get entry", d: Fetches a record's entry and its inclusion proof when one record is opened. }
  - { f: indexer, t: store-index, m: "Apply", d: "Applies batches to the search index and moves its cursor per log by a conditional write." }
  - { f: reader, t: store-index, m: "Query", d: Answers queries. }
  - { f: entry, t: drv-transport, m: Put, d: "Records each request it routes or refuses." }
  - { f: session, t: drv-transport, m: Put, d: "Records each sign-in and step-up." }
  - { f: exchange, t: drv-transport, m: Put, d: "Records each exchange, enrolment and mint." }
  - { f: console, t: drv-transport, m: Put, d: "Records each operator change, under the operator's name." }
  - { f: ssh-ca, t: drv-transport, m: Put, d: Records each SSH certificate. }
  - { f: policy, t: drv-transport, m: Put, d: Records each decision. }
  - { f: signer, t: drv-transport, m: Put, d: Records each signature. }
  - { f: ca, t: drv-transport, m: Put, d: Records each certificate. }
  - { f: quota, t: drv-transport, m: Put, d: Records each limit decision. }
  - { f: witness, t: drv-transport, m: Put, d: Records each cosignature. }
  - { f: indexer, t: drv-transport, m: Put, d: Records each purge it applies. }
  - { f: reader, t: drv-transport, m: Put, d: Records each read of the trail. }
  - { f: writer, t: drv-transport, m: "Receive / Ack", d: "Takes records; its cursor moves when the batch is registered." }
  - { f: drv-keys, t: store-keys, m: "", d: "" }
  - { f: drv-state, t: store-state, m: "", d: "" }
  - { f: drv-blob, t: store-blob, m: "", d: "" }
  - { f: drv-transport, t: store-transport, m: "", d: "" }
  - { f: sluis-node, t: drv-keys, m: "Sign(JWT)", d: "Has key@ sign the workload JWT with the node's workload-issuer key.", when: { node_agent: true } }
  - { f: drv-keys, t: sluis-node, m: "Workload JWT", d: "key@'s cloud key driver asks sluis-node for the JWT of its holder (uid from peer credentials).", when: { node_agent: true, ports: { keys: aws } } }
  - { f: drv-state, t: sluis-node, m: "Workload JWT", d: "store@'s cloud engine driver asks sluis-node for the JWT of its holder.", when: { node_agent: true, ports: { state: aws } } }
  - { f: drv-blob, t: sluis-node, m: "Workload JWT", d: "An audit piece's blob driver asks sluis-node for the JWT of its holder (uid from peer credentials).", when: { node_agent: true } }
  - { f: drv-keys, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the workload JWT for the cloud's credentials.", when: { node_agent: true, ports: { keys: aws } } }
  - { f: drv-state, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the workload JWT for the cloud's credentials.", when: { node_agent: true, ports: { state: aws } } }
  - { f: drv-blob, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the workload JWT for the cloud's credentials.", when: { node_agent: true } }
  - { f: drv-keys, t: downstream, m: "Platform identity", d: "The Lambda execution role is the identity; no workload JWT.", when: { runtime: lambda, node_agent: false, ports: { keys: aws } } }
  - { f: drv-keys, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the projected service-account token, mounted only into this driver container, for the holder's cloud role; no workload JWT of sluis.", when: { runtime: kubernetes, ports: { keys: aws } } }
  - { f: drv-state, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the projected service-account token, mounted only into this driver container, for the holder's cloud role.", when: { runtime: kubernetes, ports: { state: aws } } }
  - { f: drv-blob, t: downstream, m: "AssumeRoleWithWebIdentity", d: "Exchanges the projected service-account token, mounted only into this driver container, for the holder's cloud role.", when: { runtime: kubernetes } }

# ---------------------------------------------------------------------------
# Flows. Nodes and edges name map nodes; ids that an installation lacks are skipped.
# `variants` add installation-specific sentences (the key stays `shapes`).
# ---------------------------------------------------------------------------
flows:
  - id: signin
    title: Human sign-in
    why: A person signs in with an upstream identity provider and gets a session.
    steps:
      - title: The browser reaches the edge
        nodes: [client, edge]
        edges: ["client>edge"]
        text: The browser opens the console and HTTPS arrives at the edge connector. Nothing on the node listens on a public TCP port, and entry listens on a Unix socket with no network of its own.
      - title: The edge connector forwards to entry
        nodes: [edge, entry]
        edges: ["edge>entry"]
        text: The edge connector forwards the request to entry's public Unix socket, the tunnel's unix service.
        variants:
          - { shapes: [lambda], text: "API Gateway invokes the function, and the Lambda Web Adapter forwards the request to entry over loopback TCP inside the sandbox, the one place entry has a TCP port." }
          - { shapes: [kubernetes], text: "The gateway reaches the key-less edge relay container in entry's pod, which forwards to entry's Unix socket on a volume shared in the pod; entry has no TCP listener." }
      - title: entry routes to session
        nodes: [entry, session]
        edges: ["entry>session"]
        text: entry checks the request against the closed parameter list of the endpoint and routes it to session, which owns sign-in. entry holds nothing and decides nothing.
      - title: session asks the upstream integration
        nodes: [session, int-upstream, upstream]
        edges: ["session>int-upstream", "int-upstream>upstream"]
        text: session calls the upstream integration (Authorize) for the redirect, and later (Callback) with the code. The user authenticates at the upstream provider, and the integration returns subject, email and groups as facts. It does not decide.
      - title: policy decides
        nodes: [session, policy]
        edges: ["session>policy"]
        text: session asks policy to map the facts to grants, and whether this boundary wants fresh MFA. The policy is a reviewed file; policy keeps no state and opens no network connection.
      - title: The session is stored and sealed
        nodes: [session, drv-state, store-state, drv-keys, store-keys]
        edges: ["session>drv-state", "drv-state>store-state", "session>drv-keys", "drv-keys>store-keys"]
        text: session writes the session chain through store@, which lets no other actor write that kind, and has key@ seal the HttpOnly cookie under the boundary's cookie data key. The browser holds no token.
        variants:
          - { shapes: [boards], text: "The session chain goes through store@ to the installation's rqlite cluster, which keeps the three boards in step." }
      - title: The sign-in is audited
        nodes: [entry, session, drv-transport, store-transport]
        edges: ["entry>drv-transport", "session>drv-transport", "drv-transport>store-transport"]
        text: entry and session each put a record on the transport. The request returns once the records are durable there, never waiting for the audit writer.
  - id: exchange
    title: Token exchange
    why: A workload trades its CI or Kubernetes token for a sluis token (RFC 8693).
    steps:
      - title: The workload posts its token
        nodes: [client, edge, entry]
        edges: ["client>edge", "edge>entry"]
        text: A CI job or workload posts its subject token to the token endpoint, through the edge connector. Whatever happens next, success or refusal, leaves a record.
      - title: entry routes to exchange
        nodes: [entry, exchange]
        edges: ["entry>exchange"]
        text: entry validates the parameters against the closed list for the token endpoint and routes the request to exchange.
      - title: The subject token is verified
        nodes: [exchange, int-workload, upstream]
        edges: ["exchange>int-workload", "int-workload>upstream"]
        text: exchange asks the workload verifier to check the token. The verifier fetches the issuer's published keys and returns facts.
      - title: policy decides
        nodes: [exchange, policy]
        edges: ["exchange>policy"]
        text: policy maps the facts to a grant, or refuses. A refusal stops here with a reason and is audited the same way.
      - title: The limit is adjusted
        nodes: [exchange, quota, drv-state]
        edges: ["exchange>quota", "quota>drv-state"]
        text: quota admits the request and counts the tenant's allowance down with a conditional update; it refuses at zero. Caps and rate limits live in core.
      - title: signer signs the token
        nodes: [exchange, signer, drv-keys, store-keys]
        edges: ["exchange>signer", "signer>drv-keys", "drv-keys>store-keys"]
        text: signer signs the token under its signing policy, through key@. The token is sender-constrained (DPoP or mutual TLS) and carries exactly one audience.
        variants:
          - { shapes: [lambda, kubernetes], text: "The token is signed directly with the non-extractable KMS token-signing key; each signature is a billed KMS request." }
          - { shapes: [boards], text: "The node's YubiKey signs each token itself with the token-signing key, through signer's own socket at key@, far faster than the load needs." }
          - { shapes: [local], text: "A software key signs it through key@, or the opt-in development card; the software driver refuses to start in production." }
      - title: The exchange is audited
        nodes: [exchange, drv-transport, store-transport]
        edges: ["exchange>drv-transport", "policy>drv-transport", "signer>drv-transport", "drv-transport>store-transport"]
        text: exchange, policy and signer each put a record on the transport. The token goes back to the client once exchange's record is durable.
  - id: enrol
    title: Host enrolment
    why: A host or workload proves what it is and gets a short-lived certificate (SVID) from ca.
    steps:
      - title: The host posts a sealed request
        nodes: [client, edge, entry, exchange]
        edges: ["client>edge", "edge>entry", "entry>exchange"]
        text: The host sends its proof and a CSR, HPKE-encrypted to the boundary's enrolment key, whose certificate it has from the trust bundle. entry routes it to exchange and cannot read it.
      - title: exchange opens and verifies it
        nodes: [exchange, drv-keys, store-keys]
        edges: ["exchange>drv-keys", "drv-keys>store-keys"]
        text: "exchange opens the request through key@; the enrolment key stays in key@'s key store, the card or KMS. A verifier driver checks the proof: an instance identity document (once per instance), a ServiceAccount token, a CI token, a YubiKey attestation, an enrolment token (its ID and an HMAC, never the token itself) or a manual approval."
      - title: policy decides
        nodes: [exchange, policy]
        edges: ["exchange>policy"]
        text: policy decides host.enrol from attested and declared attributes. Reported attributes never grant.
      - title: ca issues the certificate
        nodes: [exchange, ca, drv-keys, store-keys]
        edges: ["exchange>ca", "ca>drv-keys", "drv-keys>store-keys"]
        text: ca issues the host's X.509-SVID. Its subject comes from the authenticated requester, never from the request, and key@ signs only a TBSCertificate within the profile's constraints.
      - title: The enrolment is recorded and audited
        nodes: [exchange, drv-state, store-state, drv-transport, store-transport]
        edges: ["exchange>drv-state", "drv-state>store-state", "exchange>drv-transport", "ca>drv-transport", "drv-transport>store-transport"]
        text: exchange writes the enrolment and the host record through store@; exchange and ca each put a record on the transport.
  - id: operator
    title: Operator write
    why: An operator changes a record on the console, and the owning actor writes it.
    steps:
      - title: The browser reaches console through entry
        nodes: [client, edge, entry, console]
        edges: ["client>edge", "edge>entry", "entry>console"]
        text: The console's single-page application calls the operator API. entry routes it to console, the browser's backend.
      - title: session checks the cookie
        nodes: [console, session]
        edges: ["console>session"]
        text: console has session check the HttpOnly cookie and its freshness for this boundary. A stale session gets a step-up challenge.
      - title: console checks the delegation and routes the write
        nodes: [console, exchange]
        edges: ["console>exchange"]
        text: console checks that the operator is delegated for this company and environment, then routes the write, here the approval of a pending host, to exchange, the actor that owns the kind. console itself has no write access to it.
      - title: The owning actor validates and writes
        nodes: [exchange, drv-state, store-state]
        edges: ["exchange>drv-state", "drv-state>store-state"]
        text: exchange validates the write with its own logic and writes its own kind. store@ refuses any other writer, by the rules of the kind registry.
      - title: The change is audited under the operator's name
        nodes: [console, exchange, drv-transport, store-transport]
        edges: ["console>drv-transport", "exchange>drv-transport", "drv-transport>store-transport"]
        text: console and exchange each put a record on the transport, naming the operator.
  - id: sshcert
    title: SSH certificate
    why: A person or a workload gets a short-lived SSH certificate that carries its identity only.
    steps:
      - title: The request reaches ssh-ca
        nodes: [client, edge, entry, ssh-ca]
        edges: ["client>edge", "edge>entry", "entry>ssh-ca"]
        text: The CLI posts its public key with its sender-constrained token. entry routes the request to ssh-ca.
      - title: policy decides
        nodes: [ssh-ca, policy]
        edges: ["ssh-ca>policy"]
        text: ssh-ca asks policy for ssh.certify. Which accounts the identity may use on which hosts is not in the certificate; it comes from the bundle that sluis-host writes on each host (ssh.login).
      - title: The certificate is signed
        nodes: [ssh-ca, drv-keys, store-keys]
        edges: ["ssh-ca>drv-keys", "drv-keys>store-keys"]
        text: "The certificate carries u:<person-key> for a person or w:<workload> for a machine. key@ signs only an OpenSSH certificate body with the SSH user CA key."
        variants:
          - { shapes: [lambda], text: "The SSH CA key is a KMS key whose key policy names only ssh-ca's role." }
          - { shapes: [kubernetes], text: "The SSH CA key is a KMS key whose key policy names key@'s role alone." }
      - title: The certificate is recorded and audited
        nodes: [ssh-ca, drv-state, drv-transport, store-transport]
        edges: ["ssh-ca>drv-state", "ssh-ca>drv-transport", "drv-transport>store-transport"]
        text: ssh-ca records the certificate (requester, profile, serial, validity, key hash) through store@ and puts a record on the transport.
  - id: mint
    title: Downstream mint
    why: A caller asks for a short-lived downstream credential, such as a cloud API token.
    steps:
      - title: The caller names the connection
        nodes: [client, edge, entry, exchange]
        edges: ["client>edge", "edge>entry", "entry>exchange"]
        text: The caller posts to the mint endpoint, naming the connection and the target. entry routes it to exchange.
      - title: policy decides
        nodes: [exchange, policy]
        edges: ["exchange>policy"]
        text: policy decides whether this caller may mint this credential.
      - title: policy seals a mint grant
        nodes: [policy, drv-keys, store-keys]
        edges: ["policy>drv-keys", "drv-keys>store-keys"]
        text: policy has key@ seal the mint grant (connection, target, ttl, nonce, expiry) under the boundary's grant data key, with authenticated encryption that binds the grant to its address. A grant is sealed, never signed.
      - title: exchange calls the minter with the grant
        nodes: [exchange, int-minter]
        edges: ["exchange>int-minter"]
        text: exchange passes the grant to the minter. The minter opens the grant at key@ and checks the nonce. It does not decide; caps and rate limits already live in core.
      - title: The minter mints at the vendor
        nodes: [int-minter, vendor]
        edges: ["int-minter>vendor"]
        text: The minter opens the sealed credential of the tenant's connection at key@, holds nothing at rest, mints the short-lived credential and returns it. What a minter returns is never recorded.
      - title: The mint is audited
        nodes: [exchange, drv-transport, store-transport]
        edges: ["exchange>drv-transport", "drv-transport>store-transport"]
        text: exchange appends the record and returns the credential to the caller.
  - id: workload
    title: Workload credentials
    why: An actor's cloud driver gets the cloud credentials it needs, on a node that runs sluis-node.
    steps:
      - title: The driver asks sluis-node
        nodes: [drv-keys, drv-state, drv-blob, sluis-node]
        edges: ["drv-keys>sluis-node", "drv-state>sluis-node", "drv-blob>sluis-node"]
        text: The cloud driver of a holder asks sluis-node for the workload JWT of its holder. sluis-node reads the caller's uid from the socket (SO_PEERCRED) and maps the uid to the actor. On a node, key@'s key driver, store@'s engine driver and an audit piece's blob driver, where they are cloud drivers, each ask for the JWT of their own holder.
        variants:
          - { shapes: [local], text: "The local installation has no sluis-node and no cloud federation." }
          - { shapes: [lambda], text: "The lambda installation has no sluis-node: the Lambda execution role of each function is the identity, so there is no workload JWT. Platform-native identity is used where it exists." }
          - { shapes: [kubernetes], text: "The kubernetes installation has no sluis-node: a projected service-account token, mounted only into the driver container, is the workload token, and the driver exchanges it for a cloud role by web identity (ADR 0011)." }
      - title: The node key signs the JWT
        nodes: [sluis-node, drv-keys, store-keys]
        edges: ["sluis-node>drv-keys", "drv-keys>store-keys"]
        text: key@ signs the JWT with the node's workload-issuer key, which never leaves the card, once an hour per actor. AWS accepts ES384. GCP needs ES256 and Entra needs RS256, the written-down exceptions to ES384 as the default.
        variants:
          - { shapes: [boards], text: "On boards the node's own YubiKey signs the JWT, the same card whose other key signs that node's audit log." }
      - title: The driver exchanges the JWT
        nodes: [drv-keys, drv-state, drv-blob, downstream]
        edges: ["drv-keys>downstream", "drv-state>downstream", "drv-blob>downstream"]
        text: "The driver trades the JWT for the cloud's credentials: AssumeRoleWithWebIdentity against an IAM OIDC provider on AWS, Workload Identity Federation on GCP, a federated credential on Azure. The credentials last an hour and the driver refreshes them before they expire."
      - title: The issuer is trusted per node
        nodes: [downstream]
        edges: []
        text: "The boundary's issuer publishes a static discovery document and JWKS (public keys only) with one key per node card. Per-node issuers at https://<issuer>/nodes/<node>/ are optional, for fleets whose nodes run different actors; there a cloud role trusts only the issuers of the nodes that run that actor. AWS allows at most 100 EC keys in a JWKS and 100 OIDC providers per account."
  - id: audit
    title: Audit write
    why: A request becomes evidence, and a record reaches the index.
    steps:
      - title: An actor appends a record
        nodes: [entry, session, exchange, policy, signer, drv-transport, store-transport]
        edges: ["entry>drv-transport", "session>drv-transport", "exchange>drv-transport", "policy>drv-transport", "signer>drv-transport", "drv-transport>store-transport"]
        text: Every actor that acted puts what it did on the transport. The request returns once the record is durable there. Every success and every refusal is audited.
        variants:
          - { shapes: [local, boards], text: "Durable means an fsync to the node's local spool." }
          - { shapes: [lambda], text: "Durable means the queue accepted the message." }
          - { shapes: [kubernetes], text: "Durable means the JetStream stream accepted the message." }
      - title: The writer takes the records
        nodes: [writer, drv-transport]
        edges: ["writer>drv-transport"]
        text: The writer receives records, validates them against the schemas generated from the action table, drops duplicates by record id and rolls them into a batch, sealed at 256 records or 5 seconds after the first.
        variants:
          - { shapes: [boards], text: "Each node's writer drains its own spool into that node's log." }
      - title: The batch is written to the log
        nodes: [writer, drv-blob, store-blob]
        edges: ["writer>drv-blob", "drv-blob>store-blob"]
        text: The writer writes the batch's entry bundles and tiles to its log in the blob. Every object is created only if absent, so nothing is ever replaced. Its blob driver may write its own project's prefix and nothing else.
      - title: The writer has the checkpoint signed
        nodes: [writer, drv-keys, store-keys]
        edges: ["writer>drv-keys", "drv-keys>store-keys"]
        text: The writer asks key@ to sign the new checkpoint with the log key, and writes it. key@'s rules (or the key policy on AWS) let only the writer use the log key, so the writer never holds the key itself.
        variants:
          - { shapes: [local], text: "A software key signs, through key@. The local blob has no lock, so tamper evidence depends on a witness, which is optional." }
          - { shapes: [boards], text: "The node's own YubiKey signs for that node's log." }
          - { shapes: [lambda], text: "One KMS key per writer instance, whose key policy names the writer function's role only. A project has one log and no peer witness here; the function's role is the isolation." }
          - { shapes: [kubernetes], text: "One KMS key per writer instance, whose key policy names key@'s role alone; key@ lets only the writer use it." }
      - title: The batch is registered
        nodes: [writer, drv-blob, store-blob]
        edges: ["writer>drv-blob", "drv-blob>store-blob"]
        text: In one conditional write of its own state in the project's bucket the writer registers the sealed batch, records the duplicate ids it dropped and moves its transport cursor. A crash leaves all of it or none. Verification never trusts the state.
      - title: A witness cosigns the checkpoint
        nodes: [writer, witness, drv-blob, drv-keys, store-keys]
        edges: ["writer>witness", "witness>drv-blob", "witness>drv-keys", "drv-keys>store-keys"]
        text: Where the installation has a witness, the writer asks it to cosign the new checkpoint. The witness checks that it is consistent with the last one it cosigned and has key@ sign with its own key. A witness is optional everywhere, and sluis config check warns when there is none. Without one, a compromised writer can get a rewritten checkpoint signed, and a lock does not prevent a split view.
        variants:
          - { shapes: [boards], text: "The other two nodes are this node's peer witnesses (2-of-3), and this node witnesses theirs." }
          - { shapes: [local, lambda, kubernetes], text: "No witness unless the installation adds one: a peer or an external witness is possible." }
      - title: The index follows the log
        nodes: [indexer, reader, drv-blob, store-index]
        edges: ["indexer>drv-blob", "indexer>store-index", "reader>store-index"]
        text: The indexer follows each log's signed checkpoints from its cursor, fetches the entry bundles they cover and applies them to the index; the reader answers queries from it. Verification never trusts the index. The audit explorer shows the lag and the integrity chain.
        variants:
          - { shapes: [boards], text: "The index is rqlite (ADR 0028), so the reader can run on any node. Readers merge the three logs by time." }
          - { shapes: [lambda], text: "The index here is postgres on Aurora, reached through RDS Proxy." }
          - { shapes: [kubernetes], text: "The index here is postgres in the cnpg mode, a CloudNativePG cluster in the same Kubernetes cluster." }

# What runs where on a cluster of boards (bare-metal with N nodes).
cluster:
  - { process: edge connector, where: every node, status: decided }
  - { process: quota, where: "a work actor of the quota module, beside sluis and sharing its store, or in an installation of its own; it counts each tenant's allowance down and refuses at zero (ADR 0039)", status: decided }
  - { process: "Search (indexer, search index, reader)", where: "follows the index driver: with an rqlite or postgres index the reader runs on any node; with a sqlite index it runs on the indexer's node", status: decided }
  - { process: entry, where: "every node, on a Unix socket behind that node's edge connector, with no network", status: decided }
  - { process: "session, console, exchange", where: "every node, beside entry. Their kinds are held by store@ in the installation's rqlite cluster; console writes only Switch and LogLevelOverride", status: decided }
  - { process: "signer, policy, ca, ssh-ca", where: "every node, each asking key@ to use that node's own card", status: decided }
  - { process: writer, where: "every node: exactly one writer per log, and one log per node, each writer draining its own spool and signing with its own node's log key", status: decided }
  - { process: witness, where: "every node, as a peer: each node's log is cosigned by the other two (2-of-3)", status: decided }
  - { process: "store@'s engine driver and its store", where: "every node; one rqlite cluster for the installation's engine, a Raft quorum of three over its own TCP port with mutual TLS. rqlite's client API stays on the loopback address, and the driver is its only client (ADR 0005)", status: decided }
  - { process: key@'s key driver, where: "each node's own YubiKey, behind key@, with one socket per caller", status: decided }
  - { process: sluis-node, where: every node, status: decided }
  - { process: integrations, where: "next to the actors that call them on each node, over Unix sockets; no actor is called across nodes, and the Raft port is the only TCP port between nodes", status: decided }
