[package]
name = "sluis-driver-writer-spool"
description = "The spool driver of the audit writer: the audit transport over a local, fsync'd, bounded queue (ADR 0028, Transport)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-writer-spool"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
buffa = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
futures = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../../kits/rust/sluis-proto" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
sluis-audit = { path = "../../../kits/rust/sluis-audit" }
sluis-registry = { path = "../../../kits/rust/sluis-registry" }
serde_json = "1"
