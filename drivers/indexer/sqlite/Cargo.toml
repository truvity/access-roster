[package]
name = "sluis-driver-indexer-sqlite"
description = "The sqlite index driver of the indexer: the index port (write) and index-ro (read) over one SQLite file with FTS5 (ADR 0028, Search and the index)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "driver-indexer-sqlite"
path = "src/main.rs"

[dependencies]
anyhow = "1"
buffa = { version = "=0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive", "string"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "server"] }
# SQLite is built in (the `bundled` feature), with FTS5; the database engine is not a cryptographic library or a parser of a protocol.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
sluis-kit = { path = "../../../kits/rust/sluis-kit" }
sluis-proto = { path = "../../../kits/rust/sluis-proto" }
rustix = { version = "1", features = ["process"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# Lets a test choose which uid is which actor; only a dev edge turns it on.
sluis-kit = { path = "../../../kits/rust/sluis-kit", features = ["test-identities"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
